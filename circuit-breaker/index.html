  ArrowRight:'right', KeyD:'right', KeyZ:'a', KeyK:'a', KeyX:'b', KeyJ:'b',
  ShiftLeft:'select', ShiftRight:'select', Enter:'start', NumpadEnter:'start', KeyP:'start'

  {name:'BLUE',  col:'#3d7dff', speed:2.9, hp:1, fire:0.70, chase:0.65, cool:1.2, bspd:130, blast:false},

    const t = farTile(8); G.bats.push(mkMover(t.x, t.y, 'bat', 4.2)); G.batT = 3;
  }
  if (G.spiders.length < 1 && (G.spiderT -= dt) <= 0) {

  }
  for (const c of G.bats.concat(G.spiders)) {

/* ---------------- player ---------------- */
/* B is "hold aim": while it's held your facing is locked, so you can back
   away down a corridor still pointing the gun at what's chasing you. */
function playerChoose(e) {
  if (DEMO) return demoChoose(e);
  const w = e.want;
  if (w >= 0 && canGo(e, w)) { e.buf = -1; return w; }
  // a turn pressed a moment early is remembered until the next junction
  if (e.buf >= 0 && e.bufT > 0 && canGo(e, e.buf)) { const d = e.buf; e.buf = -1; return d; }
  if (w >= 0 && e.dir >= 0 && canGo(e, e.dir)) return e.dir;   // keep going while holding a blocked turn
  if (e.buf >= 0 && e.bufT > 0 && e.dir >= 0 && canGo(e, e.dir)) return e.dir;
  return -1;
}
function updatePlayer(dt) {
  const p = G.p;
  if (p.inv > 0) p.inv -= dt;
  if (p.stunImm > 0) p.stunImm -= dt;
  if (p.bufT > 0) p.bufT -= dt;
  p.fireCd -= dt;
  for (const b in DIR_OF) if (pressed[b]) { p.buf = DIR_OF[b]; p.bufT = 0.35; }
  if (p.stun > 0) { p.stun -= dt; return; }
  const want = DEMO ? -1 : wantedDir();
  const aim = !DEMO && held.b;
  // reversing is allowed mid-tile, so you can always back out
  if (want >= 0 && p.dir >= 0 && want === (p.dir + 2) % 4) {
    p.x += DX[p.dir]; p.y += DY[p.dir]; p.dir = want; p.prog = 1 - p.prog;
  }
  if (want >= 0 && !aim && p.dir < 0) p.face = want;   // pressing into a wall still turns you
  p.want = want;
  stepMover(p, dt, playerChoose);
  if (p.dir >= 0) { p.anim += dt; if (!aim) p.face = p.dir; }
  if (DEMO) demoAim();
  if ((pressed.a || (DEMO && p.demoFire)) && p.fireCd <= 0) { playerFire(); p.demoFire = false; }
}
function playerFire() {
  const p = G.p;
  p.fireCd = 0.12;
  if (G.ammo <= 0) { SFX.empty(); return; }
  G.ammo--;
  const t = tileOf(p); let x = px(p), y = py(p);
  if (p.face % 2) y = t.y*T + T/2; else x = t.x*T + T/2;
  G.pb.push({x, y, d: p.face, spd: 250});

}
function stunPlayer() {

  p.stun = 2; p.stunImm = 3.2; p.dir = -1; p.prog = 0; p.buf = -1;

}

  const p = G.p;

  p.dying = 2; G.rb = []; SFX.die();

}

  const p = G.p;
  Object.assign(p, mkMover(BUNKER_HOME.x, BUNKER_HOME.y, 'player', 5), {
    stun: 0, stunImm: 0, inv: 2.5, dying: 0, buf: -1, bufT: 0, fireCd: 0, want: -1});
  p.face = 0;

/* ---------------- demo auto-pilot ---------------- */
function demoChoose(e) {
  const all = [0,1,2,3].filter(d => canGo(e, d));
  if (!all.length) return -1;
  const back = e.dir >= 0 ? (e.dir + 2) % 4 : -1;
  let opts = all.filter(d => d !== back); if (!opts.length) opts = all;
  if (!G.ammo && G.gun.active && Math.random() < 0.85) {
    const f = bfs(G.gun.x, G.gun.y, 'player');
    return pickBy(e, all, d => fieldAt(f, e.x + DX[d], e.y + DY[d]));
  }
  if (e.dir >= 0 && opts.includes(e.dir) && Math.random() < 0.6) return e.dir;
  return opts[(Math.random()*opts.length) | 0];
}
function demoAim() {
  const p = G.p, pt = tileOf(p);
  const targets = G.bats.concat(G.spiders); if (G.robot && G.robot.spawnT <= 0) targets.unshift(G.robot);
  for (const t of targets) {
    const tt = tileOf(t); let d = -1;
    if (tt.y === pt.y && Math.abs(tt.x - pt.x) < 9) d = tt.x > pt.x ? 1 : 3;
    else if (tt.x === pt.x && Math.abs(tt.y - pt.y) < 9) d = tt.y > pt.y ? 2 : 0;
    if (d < 0) continue;
    let x = pt.x, y = pt.y, clear = true;
    while (x !== tt.x || y !== tt.y) { x += DX[d]; y += DY[d]; if (isWall(tileAt(x, y))) { clear = false; break; } }
    if (clear) { p.face = d; if (G.ammo > 0 && Math.random() < 0.08) p.demoFire = true; return; }
  }
}

/* ---------------- bullets ---------------- */
function updateBullets(dt) {
  for (const list of [G.pb, G.rb]) {
    for (let i = list.length - 1; i >= 0; i--) {
      const b = list[i];
      b.x += DX[b.d]*b.spd*dt; b.y += DY[b.d]*b.spd*dt;
      const c = tileAt(Math.floor(b.x/T), Math.floor(b.y/T));
      const mine = list === G.pb;
      if (isWall(c) || (!mine && c === 'D' && !G.breached)) {
        // back the spark up to the wall face so it doesn't sit inside the wall
        const sx = b.x - DX[b.d]*4, sy = b.y - DY[b.d]*4;
        burst(sx, sy, mine ? '#9ff' : '#f84', 3);
        if (!mine && c === 'D' && b.blast) damageBunker();
        else SFX.wall(mine, nearXY(b.x, b.y, 12));
        list.splice(i, 1); continue;
      }
      if (mine) {
        let hit = false;
        const r = G.robot;
        if (r && r.spawnT <= 0 && Math.hypot(px(r) - b.x, py(r) - b.y) < 8) { hitRobot(); hit = true; }
        for (const arr of [G.bats, G.spiders]) {
          if (hit) break;
          for (let j = arr.length - 1; j >= 0; j--) {
            const c2 = arr[j];
            if (Math.hypot(px(c2) - b.x, py(c2) - b.y) < 7) {
              const bat = c2.kind === 'bat';
              addScore(bat ? 100 : 50, px(c2), py(c2));
              burst(px(c2), py(c2), bat ? '#a070ff' : '#c08040', 10); SFX.hit();
              arr.splice(j, 1);
              if (bat) G.batT = 3; else G.spiderT = 4;
              hit = true; break;
            }
          }
        }
        if (hit) list.splice(i, 1);
      } else if (G.p.dying <= 0 && Math.hypot(px(G.p) - b.x, py(G.p) - b.y) < 6) {
        list.splice(i, 1); killPlayer();

}
function damageBunker() {
  if (G.breached) return;

  if (G.bunkerHP <= 0) {
    G.breached = true; toast('BUNKER BREACHED'); SFX.breach();
    for (const f of DOOR_FRONT) explode(f.x*T + 8 + DX[f.d]*T, f.y*T + 8 + DY[f.d]*T, '#3dff8a', false, true);
  }
}

/* ---------------- effects ---------------- */
function burst(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random()*6.28, s = 20 + Math.random()*60;
    G.parts.push({x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.3 + Math.random()*0.3, col});
  }
}
function explode(x, y, col, big, silent) {

  G.lights.push({x, y, r: big ? 70 : 50, t: 0.5, max: 0.5});

}

  G.score += n;
  G.parts.push({x, y: y - 6, vx: 0, vy: -18, life: 0.9, col: '#fff', txt: '+' + n});
  if (G.score >= G.nextLife) { G.nextLife += 5000; G.lives++; toast('EXTRA LIFE'); SFX.life(); }

let toastMsg = '', toastT = 0, footMsg = '', footT = 0;

/* ---------------- game state ---------------- */
let state = 'title', paused = false, G = null, overT = 0, titleT = 0;
let hi = 0;
try { hi = +localStorage.getItem('circuitBreaker.hi') || 0; } catch (e) {}
function newGame() {
  G = {score: 0, lives: 3, nextLife: 5000, gen: START_GEN - 1, robot: null, robotT: DEMO ? 1 : 3,
    bats: [], spiders: [], batT: 4, spiderT: 6, pb: [], rb: [], parts: [], lights: [],
    gun: {x: 0, y: 0, active: false, timer: 1.5}, ammo: 0, breached: false, bunkerHP: 8,
    doorFlash: 0, flare: 0, time: 0, p: {}};
  respawn(); G.p.inv = 0;
  fieldKey = '';
  state = 'play'; paused = false;
}
function update(dt) {
  if (footT > 0) footT -= dt;
  titleT += dt;
  if (pressed.select) { setSound(!soundOn); footNote(soundOn ? 'SOUND ON' : 'SOUND OFF'); }
  if (state === 'title') { if (pressed.start || pressed.a) { ensureAudio(); newGame(); } return; }
  if (state === 'over') {
    overT += dt;
    if (overT > 1.2 && pressed.start) newGame();
    return;
  }
  if (pressed.start) { paused = !paused; SFX.pause(paused); }
  if (paused) return;
  if (toastT > 0) toastT -= dt;
  G.time += dt;
  G.flare -= dt; G.doorFlash -= dt;
  const p = G.p;
  if (p.dying > 0) {
    p.dying -= dt;
    if (p.dying <= 0) {
      G.lives--;
      if (G.lives <= 0) {
        state = 'over'; overT = 0; p.dying = 0.0001;
        if (G.score > hi) { hi = G.score; try { localStorage.setItem('circuitBreaker.hi', hi); } catch (e) {} }
      } else respawn();
    }
  } else updatePlayer(dt);
  // gun
  const g = G.gun;
  if (!g.active && G.ammo === 0 && (g.timer -= dt) <= 0) {
    const t = farTile(7); g.x = t.x; g.y = t.y; g.active = true;
  }
  if (g.active && p.dying <= 0) {
    const t = tileOf(p);
    if (t.x === g.x && t.y === g.y) { g.active = false; G.ammo = 6; SFX.pickup(); toast('GUN: 6 SHOTS'); }
  }
  if (p.dying <= 0) {
    if (!G.robot && (G.robotT -= dt) <= 0) spawnRobot();
    if (G.robot) updateRobot(dt);
  }
  updateCritters(dt);
  updateBullets(dt);
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const q = G.parts[i]; q.x += q.vx*dt; q.y += q.vy*dt; q.vx *= 0.94; q.vy *= q.txt ? 1 : 0.94;
    if ((q.life -= dt) <= 0) G.parts.splice(i, 1);
  }
  for (let i = G.lights.length - 1; i >= 0; i--) if ((G.lights[i].t -= dt) <= 0) G.lights.splice(i, 1);
  if (G.score > hi) hi = G.score;
}

/* ---------------- map art (drawn once) ---------------- */
/* Walls are circuit boards: dim traces run along the inside of each wall and
   the edges facing the corridors are lit electric blue. Under the darkness
   they read as a faint glow, enough to navigate by. */
const mapC = document.createElement('canvas'); mapC.width = W; mapC.height = PH;
(function drawMap() {
  const m = mapC.getContext('2d');
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = MAP[y][x], X = x*T, Y = y*T;
    if (!isWall(c)) {
      m.fillStyle = c === 'B' || c === 'D' ? '#0b1a12' : '#06090d'; m.fillRect(X, Y, T, T);
      m.fillStyle = '#0f171f'; m.fillRect(X + 7, Y + 7, 2, 2);
      continue;
    }
    const bunker = c === 'c';
    m.fillStyle = bunker ? '#0e2418' : '#08131d'; m.fillRect(X, Y, T, T);
    // traces toward neighbouring wall tiles
    m.fillStyle = bunker ? '#1d6b3c' : '#0f4a36';
    let links = 0;
    for (let d = 0; d < 4; d++) {
      if (!isWall(tileAt(x + DX[d], y + DY[d]))) continue;
      links++;
      if (d === 0) m.fillRect(X + 7, Y, 2, 8); if (d === 2) m.fillRect(X + 7, Y + 8, 2, 8);
      if (d === 1) m.fillRect(X + 8, Y + 7, 8, 2); if (d === 3) m.fillRect(X, Y + 7, 8, 2);
    }
    if (links !== 2 || (x*7 + y*3) % 5 === 0) {      // solder pads at junctions and ends
      m.fillStyle = bunker ? '#3dff8a' : '#1bd08a'; m.fillRect(X + 6, Y + 6, 4, 4);
      m.fillStyle = '#04080c'; m.fillRect(X + 7, Y + 7, 2, 2);
    }
    // lit edges facing open floor
    m.fillStyle = bunker ? '#3dff8a' : '#1f9cff';
    if (!isWall(tileAt(x, y - 1))) m.fillRect(X, Y, T, 1);
    if (!isWall(tileAt(x, y + 1))) m.fillRect(X, Y + T - 1, T, 1);
    if (!isWall(tileAt(x - 1, y))) m.fillRect(X, Y, 1, T);
    if (!isWall(tileAt(x + 1, y))) m.fillRect(X + T - 1, Y, 1, T);
  }
  // the web, strung from the top-left corner
  m.strokeStyle = '#59606e'; m.lineWidth = 1;
  const cx = 16, cy = 16;
  for (let a = 0; a <= 6; a++) {
    const ang = a/6 * Math.PI/2;
    m.beginPath(); m.moveTo(cx, cy); m.lineTo(cx + Math.cos(ang)*48, cy + Math.sin(ang)*32); m.stroke();
  }
  for (let r = 8; r <= 40; r += 8) {
    m.beginPath();
    for (let a = 0; a <= 6; a++) {
      const ang = a/6 * Math.PI/2, rr = r * (a % 2 ? 0.9 : 1);
      const X = cx + Math.cos(ang)*rr, Y = cy + Math.sin(ang)*rr*0.7;
      a ? m.lineTo(X, Y) : m.moveTo(X, Y);
    }
    m.stroke();
  }
})();

/* ---------------- sprites ---------------- */
function R(x, y, w, h) { ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function drawPlayer(p) {
  const cx = Math.round(px(p)), cy = Math.round(py(p)), x = cx - 4, y = cy - 7;
  const step = ((p.anim*8) | 0) % 2;
  const stunned = p.stun > 0;
  ctx.fillStyle = '#e8c89a'; R(x + 2, y, 4, 4);
  ctx.fillStyle = '#123'; if (p.face === 1) R(x + 5, y + 1, 1, 1); else if (p.face === 3) R(x + 2, y + 1, 1, 1); else if (p.face === 2) { R(x + 3, y + 1, 1, 1); R(x + 5, y + 1, 1, 1); }
  ctx.fillStyle = stunned ? (((G.time*16) | 0) % 2 ? '#ff0' : '#40ff90') : '#40ff90';
  R(x + 1, y + 4, 6, 5); R(x, y + 5, 1, 3); R(x + 7, y + 5, 1, 3);
  ctx.fillStyle = '#2a6fd0';
  if (step) { R(x + 2, y + 9, 2, 4); R(x + 5, y + 9, 2, 3); } else { R(x + 1, y + 9, 2, 3); R(x + 4, y + 9, 2, 4); }
  // the gun (or an empty hand) points where you're facing
  ctx.fillStyle = G.ammo > 0 ? '#d8dde6' : '#e8c89a';
  for (let i = 4; i < (G.ammo > 0 ? 9 : 6); i++) R(cx + DX[p.face]*i - (DX[p.face] ? 0 : 1), cy + 1 + DY[p.face]*i, DX[p.face] ? 1 : 2, DX[p.face] ? 2 : 1);
  if (stunned) { ctx.fillStyle = '#ff0'; for (let i = 0; i < 3; i++) { const a = G.time*6 + i*2.1; R(cx + Math.cos(a)*6, y - 2 + Math.sin(a)*2, 1, 1); } }
}
function drawRobot(r, x0, y0, gen) {
  const st = r ? r.st : robotStats(gen);
  const cx = Math.round(r ? px(r) : x0), cy = Math.round(r ? py(r) : y0), x = cx - 6, y = cy - 7;
  const col = r && r.flash > 0 ? '#fff' : st.col;
  const step = r ? ((r.anim*6) | 0) % 2 : 0;
  ctx.fillStyle = '#444'; R(x + 6, y - 1, 1, 2);
  ctx.fillStyle = col;
  R(x + 2, y + 1, 9, 5); R(x + 1, y + 6, 11, 5); R(x - 1, y + 6, 2, 4); R(x + 12, y + 6, 2, 4);
  ctx.fillStyle = '#111'; R(x + 3, y + 3, 7, 1); R(x + 3, y + 8, 7, 1);
  ctx.fillStyle = shade(st.col); R(x + 3 - step, y + 11, 3, 3); R(x + 8 + step, y + 11, 3, 3);
  if (r && r.hp < st.hp) { ctx.fillStyle = '#ff0'; R(x + 4, y + 7, 1, 1); R(x + 9, y + 9, 1, 1); }  // damaged sparks
}

function drawBat(b, x0, y0) {
  const cx = Math.round(b ? px(b) : x0), cy = Math.round(b ? py(b) : y0);
  const up = b ? ((b.anim*10) | 0) % 2 : 0;

function drawSpider(s, x0, y0) {
  const cx = Math.round(s ? px(s) : x0), cy = Math.round(s ? py(s) : y0);
  const k = s ? ((s.anim*8) | 0) % 2 : 0;

}

/* ---------------- darkness ---------------- */
/* The dark is a near-opaque layer with holes punched in it. Three stepped

/* ---------------- drawing ---------------- */
function drawDoors(glow) {

    if (MAP[y][x] !== 'D') continue;
    const X = x*T, Y = y*T, vert = MAP[y][x - 1] === '.' || MAP[y][x + 1] === '.';
    if (G && G.breached) {

      continue;

    const on = Math.random() > hurt*0.5;
    ctx.globalAlpha = glow ? 0.35 : 0.9;
    ctx.fillStyle = G && G.doorFlash > 0 ? '#fff' : (hurt > 0.5 ? '#ffb030' : '#3dff8a');
    if (on) for (let i = 2; i < T; i += 4) { if (vert) R(X + i, Y + 1, 1, T - 2); else R(X + 1, Y + i, T - 2, 1); }

    else drawRobot(r);

  const lights = [];
  const flick = Math.random() < 0.03 ? -6 : 0;     // the fuse is not entirely happy
  if (flick) au.flick = true;                       // ...and you hear it crackle
  let rad = 54 + flick + (G.flare > 0 ? 18 : 0);
  if (p.dying > 0) rad = Math.max(0, 54 * (p.dying - 1));
  if (state === 'over') rad = 0;
  if (rad > 0) lights.push({x: px(p), y: py(p), r: rad});
  for (const b of G.pb) lights.push({x: b.x, y: b.y, r: 18});
  for (const b of G.rb) lights.push({x: b.x, y: b.y, r: 12});
  for (const l of G.lights) lights.push({x: l.x, y: l.y, r: l.r * (l.t / l.max)});
  darkness(lights);

  // what shows through the dark: eyes, door fields, tracer fire, sparks
  drawDoors(true);
  if (r) {
    const x = Math.round(px(r)) - 6, y = Math.round(py(r)) - 7;
    if (r.spawnT > 0) { ctx.fillStyle = r.st.col; for (let i = 0; i < 4; i++) R(x + Math.random()*14, y + Math.random()*14, 1, 1); }
    else {
      const blinkOff = (G.time % 3.1) < 0.12;
      if (!blinkOff) { ctx.fillStyle = r.blasting ? '#ff0' : '#ff2a2a'; R(x + 4, y + 3, 2, 1); R(x + 8, y + 3, 2, 1); }
      if (((G.time*2) | 0) % 2) { ctx.fillStyle = '#f40'; R(x + 6, y - 2, 1, 1); }  // antenna beacon
    }
  }
  for (const b of G.bats) if (((b.anim*3) | 0) % 3) { ctx.fillStyle = 'rgba(255,240,0,0.55)'; R(px(b) - 1, py(b) - 1, 1, 1); R(px(b) + 1, py(b) - 1, 1, 1); }
  if (G.gun.active && (G.time % 1.6) < 0.18) { ctx.fillStyle = '#fff'; R(G.gun.x*T + 4, G.gun.y*T + 6, 2, 1); R(G.gun.x*T + 5, G.gun.y*T + 5, 1, 3); }
  ctx.fillStyle = '#bff'; for (const b of G.pb) R(b.x - (b.d % 2 ? 2 : 0), b.y - (b.d % 2 ? 0 : 2), b.d % 2 ? 4 : 1, b.d % 2 ? 1 : 4);
  for (const b of G.rb) { ctx.fillStyle = b.blast ? '#ff0' : '#f63'; R(b.x - 1, b.y - 1, 3, 3); }
  for (const q of G.parts) {
    if (q.txt) text(q.txt, q.x, q.y, 1, '#fff', 'center');
    else { ctx.fillStyle = q.col; R(q.x, q.y, 1, 1); }
  }
  ctx.restore();
}
function drawHUD() {
  ctx.fillStyle = '#03060a'; ctx.fillRect(0, 0, W, HUD);
  ctx.fillStyle = '#0c3a5a'; ctx.fillRect(0, HUD - 1, W, 1);
  const lab = '#2f8fc0';
  text('SCORE', 4, 2, 1, lab); text(String(G.score).padStart(6, '0'), 4, 9, 2, '#e0f4ff');
  text('HI', 66, 2, 1, lab); text(String(hi).padStart(6, '0'), 66, 9, 2, '#7fa8c0');
  text('LIVES', 128, 2, 1, lab);
  for (let i = 0; i < Math.min(G.lives, 6); i++) {
    ctx.fillStyle = '#e8c89a'; R(129 + i*7, 9, 3, 3); ctx.fillStyle = '#40ff90'; R(128 + i*7, 12, 5, 4); ctx.fillStyle = '#2a6fd0'; R(129 + i*7, 16, 3, 3);
  }
  const st = robotStats(Math.max(1, G.gen));
  text('ROBOT', 184, 2, 1, lab);
  text(String(Math.max(1, G.gen)), 184, 9, 2, '#e0f4ff');
  ctx.fillStyle = st.col; R(202, 10, 8, 8); text(st.name, 213, 12, 1, st.col);
  text('BUNKER', 262, 2, 1, lab);
  if (G.breached) text('BREACHED', 262, 12, 1, ((G.time*3) | 0) % 2 ? '#ff4a3a' : '#802018');
  else for (let i = 0; i < 8; i++) { ctx.fillStyle = i < G.bunkerHP ? (G.bunkerHP > 4 ? '#3dff8a' : '#ffb030') : '#1a2a20'; R(262 + i*5, 11, 4, 6); }
  text('AMMO', 336, 2, 1, lab);
  if (G.ammo > 0) for (let i = 0; i < 6; i++) { ctx.fillStyle = i < G.ammo ? '#ffd860' : '#2a2a20'; R(336 + i*9, 9, 4, 9); ctx.fillStyle = i < G.ammo ? '#c08020' : '#1a1a14'; R(336 + i*9, 15, 4, 3); }
  else text('NO GUN', 336, 12, 1, ((G.time*2) | 0) % 2 ? '#ff6a4a' : '#7a3020');
}
function drawFooter() {
  const y = HUD + PH + 4;
  ctx.fillStyle = '#020407'; ctx.fillRect(0, HUD + PH, W, FOOT);
  if (footT > 0) text(footMsg, 4, y, 1, '#5fd0ff');
  else if (soundOn && !audioLive()) text('PRESS ANY KEY OR CLICK FOR SOUND', 4, y, 1, ((titleT*2) | 0) % 2 ? '#5fd0ff' : '#2f6f90');
  else text('A FIRE   B HOLD AIM   SELECT SOUND   START PAUSE', 4, y, 1, '#24506a');
  const tail = ' ' + VERSION + (DEMO ? ' DEMO' : '');
  text(tail, W - 4, y, 1, '#24506a', 'right');
  text(soundOn ? 'SND' : 'MUTE', W - 4 - tail.length*4, y, 1, soundOn ? '#24506a' : '#ff6a4a', 'right');
}
function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(0,4,10,0.82)'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#1f9cff'; ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1);
}
function drawTitle() {
  ctx.save(); ctx.translate(0, HUD);
  ctx.drawImage(mapC, 0, 0); drawDoors(false);
  const t = titleT;
  darkness([{x: 200 + Math.cos(t*0.5)*170, y: 120 + Math.sin(t*0.83)*100, r: 50}]);
  drawDoors(true);
  ctx.restore();
  ctx.fillStyle = '#03060a'; ctx.fillRect(0, 0, W, HUD); ctx.fillRect(0, HUD + PH, W, FOOT);
  text('HI ' + String(hi).padStart(6, '0'), W/2, 6, 1, '#7fa8c0', 'center');
  panel(40, 34, 320, 218);
  text('CIRCUIT', W/2 + 2, 46, 5, '#0a4a30', 'center'); text('CIRCUIT', W/2, 44, 5, '#3cf', 'center');
  text('BREAKER', W/2 + 2, 76, 5, '#0a4a30', 'center'); text('BREAKER', W/2, 74, 5, '#3cf', 'center');
  text('LIGHTS OUT. ROBOTS IN THE MAZE. SIX BULLETS.', W/2, 106, 1, '#40ff90', 'center');
  const L = 96, rows = [
    [() => drawGun(L, 128), 'GUN - WALK OVER IT. SIX SHOTS, THEN IT MOVES'],
    [() => drawBat(null, L, 144), 'BAT - TOUCH STUNS YOU'],
    [() => drawSpider(null, L, 160), 'SPIDER - TOUCH STUNS YOU. LIVES IN THE WEB'],
    [() => drawRobot(null, L, 177, 1), 'ROBOT - ITS SHOT KILLS. EACH ONE IS TOUGHER'],
    [() => { ctx.fillStyle = '#3dff8a'; for (let i = 0; i < 12; i += 3) R(L - 6 + i, 188, 1, 10); }, 'BUNKER - ROBOTS CANT GET IN... AT FIRST'],
  ];
  rows.forEach(([draw, s], i) => { draw(); text(s, L + 14, 126 + i*16, 1, '#a8c0d0'); });
  if (((t*2) | 0) % 2) text('PRESS START', W/2, 214, 2, '#fff', 'center');
  text('MOVE: DPAD / ARROWS / WASD   FIRE: A / Z / K', W/2, 234, 1, '#5f88a0', 'center');
  text('HOLD AIM: B / X / J   START: ENTER   SOUND: SELECT / SHIFT', W/2, 242, 1, '#5f88a0', 'center');
  drawFooter();
}
function render() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (state === 'title') { drawTitle(); return; }
  drawWorld(); drawHUD(); drawFooter();
  if (toastT > 0 && !paused && state === 'play') {
    const w = toastMsg.length*8 + 12; panel(W/2 - w/2, HUD + 6, w, 16); text(toastMsg, W/2, HUD + 9, 2, '#e0f4ff', 'center');
  }
  if (paused) { panel(120, 110, 160, 50); text('PAUSED', W/2, 120, 3, '#3cf', 'center'); text('PRESS START TO RESUME', W/2, 145, 1, '#a8c0d0', 'center'); }
  if (state === 'over') {
    panel(100, 100, 200, 74);
    text('GAME OVER', W/2, 110, 3, '#ff4a3a', 'center');
    text('SCORE ' + G.score + '   ROBOTS ' + Math.max(0, G.gen - (G.robot ? 1 : 0) - START_GEN + 1), W/2, 136, 1, '#e0f4ff', 'center');
    if (overT > 1.2 && ((overT*2) | 0) % 2) text('PRESS START', W/2, 154, 2, '#fff', 'center');
  }
}

/* ---------------- loop ---------------- */
/* Fixed 60 Hz simulation, decoupled from the display's refresh rate, so a
   144 Hz monitor doesn't make the robots faster. Button presses are latched
   until a simulation step has seen them. */
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.25, Math.max(0, (now - last) / 1000)); last = now;
  pollInput();
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 8) {
    update(STEP); acc -= STEP; n++;
    for (const b of BTN) pressed[b] = false;
  }
  if (n >= 8) acc = 0;
  render();
  audioFrame(dt);
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'play') paused = true;
  audioVisibility();
});
if (DEMO) {
  ensureAudio();   // only actually plays if the browser allows autoplay
  newGame();
  /* ?demo&warp=N runs N simulation steps up front -- headless browsers barely
     tick requestAnimationFrame, and this lets a screenshot show real play. */
  const warp = Math.min(60*600, parseInt(Q.get('warp')) || 0);
  for (let i = 0; i < warp; i++) update(STEP);
}
requestAnimationFrame(frame);
</script>
