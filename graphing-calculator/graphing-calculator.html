<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graphing Calculator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0f172a; color: #e2e8f0; font-family: Georgia, serif;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 10px;
}
.calc {
  width: 100%; max-width: 380px; background: #111c2e;
  border: 1px solid #263449; border-radius: 16px; overflow: hidden;
  box-shadow: 0 18px 50px -18px rgba(0,0,0,.75);
  display: flex; flex-direction: column;
}

/* The face. A mode that changes the answer belongs on it, not two menus down:
   sin(30) is 0.5 or -0.988 and the only way to know which is to be told. */
.top {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px; border-bottom: 1px solid #263449; background: #0d1626;
}
.top .name { font-size: 13px; color: #64748b; letter-spacing: .04em; flex: 1; }
.angle { display: flex; border: 1px solid #334155; border-radius: 8px; overflow: hidden; }
.angle button {
  background: #1e293b; border: 0; color: #64748b; cursor: pointer;
  font: 12px Georgia, serif; padding: 5px 11px; letter-spacing: .05em;
}
.angle button.on { background: rgba(96,165,250,.18); color: #93c5fd; }

/* Screen. */
.screen {
  background: #0a1120; border-bottom: 1px solid #263449;
  min-height: 168px; display: flex; flex-direction: column;
}
.tabs { display: flex; border-bottom: 1px solid #1c2942; }
.tabs button {
  flex: 1; background: transparent; border: 0; border-bottom: 2px solid transparent;
  color: #475569; cursor: pointer; font: 13px Georgia, serif; padding: 8px 0;
}
.tabs button.on { color: #93c5fd; border-bottom-color: #60a5fa; }
.pane { display: none; flex: 1; flex-direction: column; padding: 12px 14px; gap: 9px; }
.pane.on { display: flex; }

.entry {
  display: flex; align-items: center; gap: 7px;
  background: #16233a; border: 1px solid #263449; border-radius: 9px; padding: 8px 10px;
}
.entry label { color: #64748b; font-size: 14px; flex: 0 0 auto; }
.entry input {
  flex: 1; min-width: 0; background: transparent; border: 0; color: #e2e8f0;
  font: 16px ui-monospace, "SF Mono", Menlo, monospace;
}
.entry input:focus { outline: none; }
.entry input::placeholder { color: #3f4c63; }

.result { text-align: right; font: 26px ui-monospace, Menlo, monospace; color: #e2e8f0;
  word-break: break-all; min-height: 34px; }
.result.err { font-size: 14px; font-family: Georgia, serif; color: #fca5a5; text-align: left;
  line-height: 1.45; }
.hint { color: #475569; font-size: 12px; }

canvas { width: 100%; height: 190px; display: block; border-radius: 9px;
  background: #0a1120; touch-action: none; cursor: crosshair; }
.wrow { display: flex; gap: 6px; align-items: center; }
.wrow button {
  background: #1e293b; border: 1px solid #334155; border-radius: 7px; color: #64748b;
  cursor: pointer; font: 12px Georgia, serif; padding: 4px 10px;
}
.wrow button:hover { background: #273449; color: #cbd5e1; }
.wrow .sp { flex: 1; }
.wrow .rng { color: #475569; font: 11px ui-monospace, Menlo, monospace; }

.tbl { flex: 1; overflow: auto; max-height: 150px; border: 1px solid #263449; border-radius: 9px; }
.tbl table { width: 100%; border-collapse: collapse; font: 13px ui-monospace, Menlo, monospace; }
.tbl th, .tbl td { padding: 5px 10px; text-align: right; border-bottom: 1px solid #1c2942; }
.tbl th { color: #64748b; font-weight: normal; position: sticky; top: 0; background: #101c30; }
.tbl td { color: #cbd5e1; }
.tbl tr:last-child td { border-bottom: 0; }
/* min-width:0 or the flex children refuse to shrink below their content and
   the row runs off the side of the calculator. */
.two { display: flex; gap: 7px; }
.two .entry { flex: 1; min-width: 0; padding: 8px; }
.two .entry label { font-size: 12px; }
.two .entry input { font-size: 14px; }

/* Keypad. Bigger keys and fewer of them than the calculator this borrows its
   shape from: there is a real keyboard here, so nothing has to be reached
   through a modifier key. */
.pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: #263449; padding: 1px; }
.pad button {
  background: #16233a; border: 0; color: #cbd5e1; cursor: pointer;
  font: 16px Georgia, serif; padding: 13px 0; transition: background .1s;
}
.pad button:hover { background: #1e2d47; }
.pad button:active { background: #26374f; }
.pad .fn  { color: #93c5fd; font-size: 14px; }
.pad .op  { color: #fcd34d; }
.pad .act { color: #6ee7b7; }
.pad .del { color: #fca5a5; }
@media (max-width: 400px) { .pad button { padding: 15px 0; font-size: 17px; } }
</style>
</head>
<body>

<div class="calc">
  <div class="top">
    <a class="name" href="pedagogical-notes.html" style="text-decoration:none;color:inherit" title="Pedagogical notes">graphing calculator</a>
    <div class="angle" id="angle">
      <button data-deg="0" class="on">RAD</button><button data-deg="1">DEG</button>
    </div>
  </div>

  <div class="screen">
    <div class="tabs" id="tabs">
      <button data-pane="calc" class="on">Calculate</button>
      <button data-pane="graph">Graph</button>
      <button data-pane="table">Table</button>
    </div>

    <div class="pane on" id="p-calc">
      <div class="entry"><input id="calc-in" placeholder="0.2 - 0.2^3/3!" autocomplete="off" spellcheck="false"></div>
      <div class="result" id="calc-out">&nbsp;</div>
    </div>

    <div class="pane" id="p-graph">
      <div class="entry"><label>y =</label><input id="graph-in" placeholder="sin(x)" autocomplete="off" spellcheck="false"></div>
      <canvas id="cv"></canvas>
      <div class="wrow">
        <button data-zoom="0.5">zoom in</button>
        <button data-zoom="2">zoom out</button>
        <button data-zoom="reset">reset</button>
        <span class="sp"></span>
        <span class="rng" id="rng"></span>
      </div>
    </div>

    <div class="pane" id="p-table">
      <div class="entry"><label>f(x) =</label><input id="tbl-in" placeholder="sin(x) - x" autocomplete="off" spellcheck="false"></div>
      <div class="two">
        <div class="entry"><label>from</label><input id="tbl-from" value="0" autocomplete="off"></div>
        <div class="entry"><label>step</label><input id="tbl-step" value="0.1" autocomplete="off"></div>
      </div>
      <div class="tbl" id="tbl"></div>
    </div>
  </div>

  <div class="pad" id="pad">
    <button class="fn" data-k="sin(">sin</button><button class="fn" data-k="cos(">cos</button>
    <button class="fn" data-k="tan(">tan</button><button class="fn" data-k="√(">√</button>
    <button class="del" data-act="del">⌫</button>

    <button class="fn" data-k="π">π</button><button class="fn" data-k="x">x</button>
    <button class="fn" data-k="^">^</button><button class="fn" data-k="!">!</button>
    <button class="del" data-act="clear">C</button>

    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="op" data-k="(">(</button><button class="op" data-k=")">)</button>

    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="op" data-k="×">×</button><button class="op" data-k="÷">÷</button>

    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="op" data-k="+">+</button><button class="op" data-k="−">−</button>

    <button data-k="0">0</button><button data-k=".">.</button>
    <button class="fn" data-k="ln(">ln</button><button class="fn" data-k="log(">log</button>
    <button class="act" data-act="go">=</button>
  </div>
</div>

<script>
/* ===== calculator engine =====================================================
   Hand-rolled on purpose. It is small enough that a dependency would cost more
   than it saves, it has no licence to carry, and two things here are decisions
   rather than defaults -- degrees, and implicit multiplication -- which is
   exactly the kind of thing a general-purpose library gets to choose for you.

   Lift this block whole. It touches no DOM and returns plain numbers.
   ========================================================================== */
const Calc = (() => {

  const CONSTANTS = { pi: Math.PI, "π": Math.PI, e: Math.E, tau: 2 * Math.PI };

  /* Angle-aware trig. On a calculator the mode is part of the answer, not a
     preference: sin(30) is 0.5 or -0.988 depending on it, and both are right.
     Activity 1 turns on students noticing that sin θ ≈ θ holds in radians and
     not in degrees, so the mode is passed in explicitly rather than read from
     somewhere far away. */
  const FUNCS = {
    sin:  (x, d) => Math.sin(d ? x * Math.PI / 180 : x),
    cos:  (x, d) => Math.cos(d ? x * Math.PI / 180 : x),
    tan:  (x, d) => Math.tan(d ? x * Math.PI / 180 : x),
    asin: (x, d) => { const r = Math.asin(x); return d ? r * 180 / Math.PI : r; },
    acos: (x, d) => { const r = Math.acos(x); return d ? r * 180 / Math.PI : r; },
    atan: (x, d) => { const r = Math.atan(x); return d ? r * 180 / Math.PI : r; },
    sqrt: x => Math.sqrt(x),  "√": x => Math.sqrt(x),
    abs: Math.abs, ln: Math.log, log: Math.log10, exp: Math.exp,
    floor: Math.floor, ceil: Math.ceil, round: Math.round,
  };
  const ARITY2 = { min: Math.min, max: Math.max, mod: (a, b) => a % b };

  const isDigit = c => c >= "0" && c <= "9";
  const isName  = c => /[A-Za-zπ√_]/.test(c);

  function tokenize(src){
    const out = [];
    let i = 0;
    while(i < src.length){
      const c = src[i];
      if(c === " " || c === "\t"){ i++; continue; }
      if(isDigit(c) || (c === "." && isDigit(src[i+1]))){
        let j = i;
        while(j < src.length && (isDigit(src[j]) || src[j] === ".")) j++;
        const text = src.slice(i, j);
        if((text.match(/\./g) || []).length > 1) throw new Error(`"${text}" has two decimal points`);
        out.push({ t: "num", v: parseFloat(text) });
        i = j; continue;
      }
      if(isName(c)){
        let j = i;
        while(j < src.length && (isName(src[j]) || isDigit(src[j]))) j++;
        out.push({ t: "name", v: src.slice(i, j) });
        i = j; continue;
      }
      if("+-*/^%(),!".includes(c)){ out.push({ t: c }); i++; continue; }
      if(c === "×"){ out.push({ t: "*" }); i++; continue; }
      if(c === "÷"){ out.push({ t: "/" }); i++; continue; }
      if(c === "−"){ out.push({ t: "-" }); i++; continue; }
      throw new Error(`I do not know what to do with "${c}"`);
    }
    return out;
  }

  /* Precedence climbing. Two things worth stating out loud:

     -2^2 is -4, because the minus is applied to the power and not the other way
     round, which is what every textbook means by it.

     2^3^2 is 512, not 64: powers group to the right.

     Implicit multiplication -- 2x, 3(x+1), 2sin(x) -- binds exactly as loosely
     as a written × does. So 1/2x reads as (1/2)·x. That is a real fork in the
     road and calculators disagree about it; this one follows the plain
     left-to-right reading, which is the one that matches how the expression
     was typed. */
  function parse(tokens){
    let p = 0;
    const peek = () => tokens[p];
    const eat  = t => { if(!tokens[p] || tokens[p].t !== t) throw new Error(`expected ${t}`); return tokens[p++]; };

    function primary(){
      const tk = peek();
      if(!tk) throw new Error("the expression stops early");
      if(tk.t === "num"){ p++; return { k: "num", v: tk.v }; }
      if(tk.t === "-"){ p++; return { k: "neg", a: unary() }; }
      if(tk.t === "+"){ p++; return unary(); }
      if(tk.t === "("){
        p++; const inner = expr(0); eat(")");
        return inner;
      }
      if(tk.t === "name"){
        p++;
        const name = tk.v;
        if(peek() && peek().t === "("){
          p++;
          const args = [expr(0)];
          while(peek() && peek().t === ","){ p++; args.push(expr(0)); }
          eat(")");
          return { k: "call", name, args };
        }
        // sqrt9 and sin x are written often enough to be worth accepting
        if(FUNCS[name] && peek() && (peek().t === "num" || peek().t === "name")){
          return { k: "call", name, args: [unary()] };
        }
        return { k: "var", name };
      }
      throw new Error("I could not read that");
    }

    function postfix(){
      let node = primary();
      while(peek() && peek().t === "!"){ p++; node = { k: "fact", a: node }; }
      return node;
    }

    function unary(){
      // a power binds tighter than the minus in front of it: -2^2 is -4
      let node = postfix();
      if(peek() && peek().t === "^"){ p++; node = { k: "pow", a: node, b: unary() }; }
      return node;
    }

    const BIN = { "+": 1, "-": 1, "*": 2, "/": 2, "%": 2 };

    function expr(min){
      let left = unary();
      for(;;){
        const tk = peek();
        if(!tk) break;
        // implicit multiplication: a value or ( straight after a value
        if(tk.t === "num" || tk.t === "name" || tk.t === "("){
          if(2 < min) break;
          const right = unary();
          left = { k: "bin", op: "*", a: left, b: right };
          continue;
        }
        const prec = BIN[tk.t];
        if(prec == null || prec < min) break;
        p++;
        const right = expr(prec + 1);
        left = { k: "bin", op: tk.t, a: left, b: right };
      }
      return left;
    }

    const tree = expr(0);
    if(p < tokens.length) throw new Error("there is something left over at the end");
    return tree;
  }

  function factorial(n){
    if(n < 0 || Math.floor(n) !== n) throw new Error("! needs a whole number that is not negative");
    if(n > 170) return Infinity;
    let r = 1;
    for(let i = 2; i <= n; i++) r *= i;
    return r;
  }

  function evaluate(node, scope, deg){
    switch(node.k){
      case "num":  return node.v;
      case "neg":  return -evaluate(node.a, scope, deg);
      case "fact": return factorial(evaluate(node.a, scope, deg));
      case "pow":  return Math.pow(evaluate(node.a, scope, deg), evaluate(node.b, scope, deg));
      case "bin": {
        const a = evaluate(node.a, scope, deg), b = evaluate(node.b, scope, deg);
        switch(node.op){
          case "+": return a + b;
          case "-": return a - b;
          case "*": return a * b;
          case "/": return a / b;
          case "%": return a % b;
        }
        break;
      }
      case "var": {
        const n = node.name;
        if(scope && n in scope) return scope[n];
        if(n in CONSTANTS) return CONSTANTS[n];
        throw new Error(`I do not know what "${n}" is`);
      }
      case "call": {
        const n = node.name;
        const args = node.args.map(a => evaluate(a, scope, deg));
        if(FUNCS[n]){
          if(args.length !== 1) throw new Error(`${n} takes one number`);
          return FUNCS[n](args[0], deg);
        }
        if(ARITY2[n]){
          if(args.length !== 2) throw new Error(`${n} takes two numbers`);
          return ARITY2[n](args[0], args[1]);
        }
        throw new Error(`I do not know a function called "${n}"`);
      }
    }
    throw new Error("I could not work that out");
  }

  const compile = src => parse(tokenize(src));

  return {
    compile,
    /* One number, or a thrown error with something a student can act on. */
    eval(src, scope, deg){ return evaluate(compile(src), scope || {}, !!deg); },
    /* A compiled expression evaluated many times, for plotting and tables.
       Returns NaN where the function has nothing to say, rather than throwing,
       so one bad sample cannot take the whole curve down. */
    fn(src, deg){
      const tree = compile(src);
      return x => { try { const v = evaluate(tree, { x, X: x }, deg); return typeof v === "number" ? v : NaN; }
                    catch(e){ return NaN; } };
    },
    names: () => Object.keys(FUNCS).concat(Object.keys(ARITY2)),
  };
})();

/* ===== the applet ========================================================= */
const $ = s => document.querySelector(s);
let deg = false;

/* Anything a student works out is worth knowing about, so every use is
   announced rather than just shown. Standalone there is nothing listening;
   dropped into a page that records a session, this is the seam. */
function announce(kind, detail){
  const ev = Object.assign({ tool: "calc", kind, deg, ts: new Date().toISOString() }, detail);
  document.dispatchEvent(new CustomEvent("calc-use", { detail: ev }));
  if(window.onCalcUse) window.onCalcUse(ev);
}

/* Enough figures to be useful, without pretending to more than a double has.
   Trailing zeros go, so 0.5 is 0.5 and not 0.5000000000. */
function show(n){
  if(!isFinite(n)) return n > 0 ? "∞" : (n < 0 ? "−∞" : "undefined");
  if(Number.isInteger(n) && Math.abs(n) < 1e15) return String(n);
  const a = Math.abs(n);
  if(a !== 0 && (a < 1e-6 || a >= 1e12)) return n.toExponential(6).replace(/e([+-])/, "e$1");
  return parseFloat(n.toPrecision(12)).toString();
}

/* ---- angle mode ---- */
$("#angle").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  deg = b.dataset.deg === "1";
  [...$("#angle").children].forEach(x => x.classList.toggle("on", x === b));
  announce("angle-mode", {});
  runCalc(); drawGraph(); buildTable();
};

/* ---- tabs ---- */
$("#tabs").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  [...$("#tabs").children].forEach(x => x.classList.toggle("on", x === b));
  for(const p of document.querySelectorAll(".pane")) p.classList.remove("on");
  $("#p-" + b.dataset.pane).classList.add("on");
  focusFor(b.dataset.pane);
  if(b.dataset.pane === "graph") drawGraph();
};

const PANE_INPUT = { calc: "#calc-in", graph: "#graph-in", table: "#tbl-in" };
const activePane = () => $("#tabs .on").dataset.pane;
let target = $("#calc-in");
const focusFor = p => { target = $(PANE_INPUT[p]); target.focus(); };
for(const sel of Object.values(PANE_INPUT)) $(sel).addEventListener("focus", e => target = e.target);
document.querySelectorAll(".entry input").forEach(i => i.addEventListener("focus", e => target = e.target));

/* ---- keypad ---- */
$("#pad").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  const t = target && target.isConnected ? target : $(PANE_INPUT[activePane()]);
  if(b.dataset.act === "clear"){ t.value = ""; }
  else if(b.dataset.act === "del"){
    const p = t.selectionStart;
    if(p > 0){ t.value = t.value.slice(0, p - 1) + t.value.slice(t.selectionEnd); t.setSelectionRange(p - 1, p - 1); }
  }
  else if(b.dataset.act === "go"){ recompute(true); t.focus(); return; }
  else {
    const s = t.selectionStart, e2 = t.selectionEnd, k = b.dataset.k;
    t.value = t.value.slice(0, s) + k + t.value.slice(e2);
    t.setSelectionRange(s + k.length, s + k.length);
  }
  t.focus();
  recompute(false);
};

/* ---- calculate ---- */
function runCalc(announceIt){
  const src = $("#calc-in").value.trim();
  const out = $("#calc-out");
  out.classList.remove("err");
  if(!src){ out.innerHTML = "&nbsp;"; return; }
  try {
    const v = Calc.eval(src, {}, deg);
    out.textContent = show(v);
    if(announceIt) announce("evaluate", { expr: src, result: v });
  } catch(err){
    out.classList.add("err");
    out.textContent = err.message;
  }
}

/* ---- graph ---- */
const cv = $("#cv"), ctx = cv.getContext("2d");
let win = { x0: -6.5, x1: 6.5, y0: -3, y1: 3 };
const RESET = Object.assign({}, win);

function fit(){
  const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(r.width * d));
  cv.height = Math.max(1, Math.round(r.height * d));
  ctx.setTransform(d, 0, 0, d, 0, 0);
  return { w: r.width, h: r.height };
}

/* Ticks a person would choose: 1, 2, 5 and their powers of ten. */
function step(span, target){
  const raw = span / target, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
  return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p;
}

function drawGraph(){
  const { w, h } = fit();
  const X = x => (x - win.x0) / (win.x1 - win.x0) * w;
  const Y = y => h - (y - win.y0) / (win.y1 - win.y0) * h;
  ctx.clearRect(0, 0, w, h);

  const sx = step(win.x1 - win.x0, 8), sy = step(win.y1 - win.y0, 5);
  ctx.lineWidth = 1;
  ctx.strokeStyle = "#18243a";
  ctx.beginPath();
  for(let x = Math.ceil(win.x0 / sx) * sx; x <= win.x1; x += sx){ ctx.moveTo(X(x), 0); ctx.lineTo(X(x), h); }
  for(let y = Math.ceil(win.y0 / sy) * sy; y <= win.y1; y += sy){ ctx.moveTo(0, Y(y)); ctx.lineTo(w, Y(y)); }
  ctx.stroke();

  ctx.strokeStyle = "#3d4d68";
  ctx.beginPath();
  if(win.y0 < 0 && win.y1 > 0){ ctx.moveTo(0, Y(0)); ctx.lineTo(w, Y(0)); }
  if(win.x0 < 0 && win.x1 > 0){ ctx.moveTo(X(0), 0); ctx.lineTo(X(0), h); }
  ctx.stroke();

  $("#rng").textContent = `x [${show(win.x0)}, ${show(win.x1)}]  y [${show(win.y0)}, ${show(win.y1)}]`;

  const src = $("#graph-in").value.trim();
  if(!src) return;
  let f;
  try { f = Calc.fn(src, deg); } catch(e){ return; }

  /* One sample per pixel, and the line is broken wherever the function has
     nothing to say or leaps the height of the window -- otherwise tan(x) draws
     a vertical stroke through its asymptote that looks like part of the curve. */
  ctx.strokeStyle = "#60a5fa";
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  let pen = false, prev = null;
  const jump = (win.y1 - win.y0) * 1.5;
  for(let px = 0; px <= w; px++){
    const x = win.x0 + px / w * (win.x1 - win.x0);
    const y = f(x);
    if(!isFinite(y) || (prev !== null && Math.abs(y - prev) > jump)){ pen = false; prev = isFinite(y) ? y : null; continue; }
    const py = Y(y);
    if(!pen){ ctx.moveTo(px, py); pen = true; } else ctx.lineTo(px, py);
    prev = y;
  }
  ctx.stroke();
}

$(".wrow").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  const z = b.dataset.zoom;
  if(z === "reset") win = Object.assign({}, RESET);
  else {
    const k = parseFloat(z), cx = (win.x0 + win.x1) / 2, cy = (win.y0 + win.y1) / 2;
    const hw = (win.x1 - win.x0) / 2 * k, hh = (win.y1 - win.y0) / 2 * k;
    win = { x0: cx - hw, x1: cx + hw, y0: cy - hh, y1: cy + hh };
  }
  drawGraph();
};

/* Drag to pan, wheel to zoom: the two things anyone tries first. */
let drag = null;
cv.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, w: Object.assign({}, win) }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => {
  if(!drag) return;
  const r = cv.getBoundingClientRect();
  const dx = (e.clientX - drag.x) / r.width * (drag.w.x1 - drag.w.x0);
  const dy = (e.clientY - drag.y) / r.height * (drag.w.y1 - drag.w.y0);
  win = { x0: drag.w.x0 - dx, x1: drag.w.x1 - dx, y0: drag.w.y0 + dy, y1: drag.w.y1 + dy };
  drawGraph();
});
cv.addEventListener("pointerup", () => drag = null);
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const k = e.deltaY > 0 ? 1.12 : 1 / 1.12;
  const cx = (win.x0 + win.x1) / 2, cy = (win.y0 + win.y1) / 2;
  const hw = (win.x1 - win.x0) / 2 * k, hh = (win.y1 - win.y0) / 2 * k;
  win = { x0: cx - hw, x1: cx + hw, y0: cy - hh, y1: cy + hh };
  drawGraph();
}, { passive: false });

/* ---- table ----
   Here because Activity 1 asks students to find how small an angle has to be by
   trying values. A column of them is the tool for that; a curve is not. */
function buildTable(){
  const src = $("#tbl-in").value.trim(), host = $("#tbl");
  if(!src){ host.innerHTML = ""; return; }
  const from = parseFloat($("#tbl-from").value), by = parseFloat($("#tbl-step").value);
  if(!isFinite(from) || !isFinite(by) || by === 0){ host.innerHTML = ""; return; }
  let f;
  try { f = Calc.fn(src, deg); }
  catch(e){ host.innerHTML = `<table><tr><td style="text-align:left;color:#fca5a5">${e.message}</td></tr></table>`; return; }
  let rows = "";
  for(let i = 0; i < 24; i++){
    const x = from + i * by, y = f(x);
    rows += `<tr><td>${show(x)}</td><td>${isFinite(y) ? show(y) : "—"}</td></tr>`;
  }
  host.innerHTML = `<table><thead><tr><th>x</th><th>f(x)</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ---- wiring ---- */
function recompute(announceIt){
  const p = activePane();
  if(p === "calc")  runCalc(announceIt);
  if(p === "graph"){ drawGraph(); if(announceIt && $("#graph-in").value.trim()) announce("graph", { expr: $("#graph-in").value.trim(), window: Object.assign({}, win) }); }
  if(p === "table"){ buildTable(); if(announceIt && $("#tbl-in").value.trim()) announce("table", { expr: $("#tbl-in").value.trim(), from: parseFloat($("#tbl-from").value), step: parseFloat($("#tbl-step").value) }); }
}
for(const sel of ["#calc-in", "#graph-in", "#tbl-in", "#tbl-from", "#tbl-step"]){
  $(sel).addEventListener("input", () => recompute(false));
  $(sel).addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); recompute(true); } });
}
addEventListener("resize", () => { if(activePane() === "graph") drawGraph(); });

$("#graph-in").value = "sin(x)";
$("#tbl-in").value   = "sin(x) - x";
drawGraph(); buildTable();
$("#calc-in").focus();
</script>
