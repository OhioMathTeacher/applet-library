    if (g.fright) {

      stats.ghostsEaten++;
      hitstop = 0.35;
      sfx.eaten();

      // any ghost catches him. Yours running him down is a GOTCHA; one of
      // the slow autopilot ghosts closing the trap is a TRAPPED, worth more
      // because it means you herded him into it
      const trap = g.id !== active;
      const v = trap ? Math.round(catchValue() * TRAP_BONUS) : catchValue();
      score += v; catches++;
      lastCatch = trap ? 'TRAPPED' : 'GOTCHA';
      popup(gp, '+' + v, trap ? '#40ff80' : '#ffff00');
      stats.catches++; if (trap) stats.traps++;
      log('catch', {level, dotsLeft, score, by: lastCatch});

function popup(p, text, color) { popups.push({x: p.x, y: p.y, text, color, t: 1.2}); }

}
function log(ev, data) { if (DEMO) console.log('HAUNT ' + ev + ' ' + JSON.stringify(Object.assign({}, data, stats))); }

// in demo mode, shout if anything sits still too long during play; a stuck

    if (a.moved === last.m) { last.t += dt; if (last.t > 2 && last.t - dt <= 2) console.log('HAUNT STUCK ' + (a === pac ? 'pac' : 'ghost' + a.id) + ' at ' + a.tx + ',' + a.ty); }

// ---------------------------------------------------------------- switching
function setActive(i, quiet) {
  const prev = ghosts[active];
  if (prev && prev.dir >= 0) prev.wantDir = prev.dir;
  active = ((i % numGhosts) + numGhosts) % numGhosts;
  const g = ghosts[active];
  // a direction already held carries over, so you can switch mid-swerve
  const h = heldDir();
  g.wantDir = h >= 0 ? h : (g.dir >= 0 ? g.dir : g.wantDir);
  if (!quiet && numGhosts > 1) sfx.switchTo(active);
}
function selectNearest(quiet) {
  const f = pacField();
  let best = active, bv = 1e9;
  for (const g of ghosts) {
    if (g.state !== 'out') continue;
    const t = tileOf(g), v = f[idx(t.x, t.y)];
    if (v >= 0 && v < bv) { bv = v; best = g.id; }
  }
  setActive(best, quiet);
}

// ---------------------------------------------------------------- input
// keyboard and gamepad are folded into the same eight NES buttons, and
// presses are found by comparing this frame with the last (the Gamepad API
// has no press events, so everything is polled the same way)
const BTN = ['up', 'down', 'left', 'right', 'a', 'b', 'select', 'start'];
const KEYMAP = {
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  KeyZ: 'a', KeyK: 'a', KeyX: 'b', KeyJ: 'b',
  ShiftLeft: 'select', ShiftRight: 'select',
  Enter: 'start', NumpadEnter: 'start', KeyP: 'pause',
};
const keyHeld = {}, keyTapped = {};
let prevBtn = {}, curBtn = {};
const extraPress = [];   // 1-4 and P, which have no NES button

addEventListener('keydown', e => {
  unlockAudio();
  const b = KEYMAP[e.code];
  if (b || /^Digit[1-4]$/.test(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (b === 'pause') { extraPress.push('pause'); return; }
  if (b) { keyHeld[b] = true; keyTapped[b] = true; }
  const m = /^Digit([1-4])$/.exec(e.code);
  if (m) extraPress.push('ghost' + (m[1] - 1));
});
addEventListener('keyup', e => { const b = KEYMAP[e.code]; if (b) keyHeld[b] = false; });
addEventListener('pointerdown', unlockAudio);
addEventListener('blur', () => { for (const k in keyHeld) keyHeld[k] = false; if (state === 'play') setState('paused'); });
addEventListener('gamepadconnected', e => { padNote = 3; padName = e.gamepad.id; });

function pollPad() {

  for (const p of pads) {
    if (!p || !p.connected) continue;
    const pr = i => p.buttons[i] && p.buttons[i].pressed;
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
    // cheap USB pads often report the D-pad as the first stick, so count both
    out.up    = out.up    || pr(12) || ay < -0.5;
    out.down  = out.down  || pr(13) || ay >  0.5;
    out.left  = out.left  || pr(14) || ax < -0.5;
    out.right = out.right || pr(15) || ax >  0.5;
    out.a      = out.a      || pr(0);
    out.b      = out.b      || pr(1);
    out.select = out.select || pr(8);

}
const DIR_BTN = ['up', 'left', 'down', 'right'];   // same order as DX/DY
function heldDir() {
  for (let d = 0; d < 4; d++) if (curBtn[DIR_BTN[d]] && !prevBtn[DIR_BTN[d]]) return d;

  return -1;
}

  const pad = pollPad();
  prevBtn = curBtn; curBtn = {};
  for (const b of BTN) curBtn[b] = !!(keyHeld[b] || pad[b]);
  const pressed = b => (curBtn[b] && !prevBtn[b]) || keyTapped[b];
  const presses = {};
  for (const b of BTN) presses[b] = pressed(b);
  for (const k in keyTapped) keyTapped[k] = false;
  if (BTN.some(b => presses[b])) unlockAudio();

  if (presses.start || extraPress.includes('pause') && (state === 'play' || state === 'paused')) {
    if (state === 'title' || state === 'gameover') { newGame(); sfx.start(); }
    else if (state === 'play') { setState('paused'); sfx.pause(); }
    else if (state === 'paused') { setState('play'); sfx.pause(); }
  }
  const live = state === 'play' || state === 'ready';
  if (live && !DEMO) {
    if (presses.a) setActive(active + 1);
    if (presses.b) setActive(active - 1);
    if (presses.select) selectNearest();
    for (const e of extraPress) { const m = /^ghost(\d)$/.exec(e); if (m && +m[1] < numGhosts) setActive(+m[1]); }

    let d = -1;
    for (let i = 0; i < 4; i++) if (presses[DIR_BTN[i]]) d = i;
    if (d < 0) d = heldDir();
    if (d >= 0) {
      const g = ghosts[active];
      g.wantDir = d;
      // reversing is always allowed at once, mid-corridor, as in the arcade
      if (g.state === 'out' && g.dir >= 0 && d === opp(g.dir)) reverse(g);
    }

}

// ---------------------------------------------------------------- sound
// tiny square-wave blips. The context is created on the first key or click,
// because browsers refuse to start audio before a user gesture.
let actx = null;

const sfx = {

  switchTo: i  => tone([523, 659, 784, 392][i], [523, 659, 784, 392][i] * 1.5, 0.07, 'square', 0.05),
  power:    () => { for (let i = 0; i < 4; i++) tone(200, 600, 0.08, 'sawtooth', 0.04, i * 0.08); },
  eaten:    () => tone(900, 120, 0.35, 'square', 0.05),
  caught:   () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.12, 'square', 0.06, i * 0.1)),
  lose:     () => [392, 330, 262, 196].forEach((f, i) => tone(f, f * 0.97, 0.18, 'triangle', 0.07, i * 0.18)),
  start:    () => [262, 392, 523].forEach((f, i) => tone(f, f, 0.1, 'square', 0.05, i * 0.08)),
  pause:    () => tone(440, 440, 0.06, 'square', 0.04),

// ---------------------------------------------------------------- pixel font
// a 3x5 bitmap font, one string of 15 bits per glyph, read row by row
const FONT = {

  E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',
  I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',
  M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',
  Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',
  U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',
  Y:'101101010010010',Z:'111001010100111',
  0:'111101101101111',1:'010110010010111',2:'110001010100111',3:'110001010001110',
  4:'101101111001001',5:'111100110001110',6:'011100111101111',7:'111001010010010',
  8:'111101111101111',9:'111101111001110',
  ' ':'000000000000000','!':'010010010000010','.':'000000000000010',':':'000010000010000',
  '-':'000000111000000','/':'001001010100100','?':'110001010000010',',':'000000000010100',
  "'":'010010000000000','(':'010100100100010',')':'010001001001010','+':'000010111010000',

  else if (align === 'right') x -= textW(s, sc);
  x = Math.round(x); y = Math.round(y);
  ctx.fillStyle = color;
  for (let i = 0; i < s.length; i++) {
    const g = FONT[s[i]] || FONT['?'];
    for (let b = 0; b < 15; b++) if (g[b] === '1') ctx.fillRect(x + i * 4 * sc + (b % 3) * sc, y + ((b / 3) | 0) * sc, sc, sc);

// ---------------------------------------------------------------- sprites
const GHOST_BODY = [
  '     ####     ',
  '   ########   ',
  '  ##########  ',
  ' ############ ',
  ' ############ ',
  ' ############ ',
  '##############',
  '##############',
  '##############',
  '##############',
  '##############',
  '##############',
];
const SKIRT = [
  ['##############', '## ###  ### ##', '#   ##  ##   #'],
  ['##############', '#### #### ####', ' ##   ##   ## '],
];
function ghostMask(frame) { return GHOST_BODY.concat(SKIRT[frame]); }
const MASKS = [ghostMask(0), ghostMask(1)];

function drawMask(mask, cx, cy, ps, color) {
  ctx.fillStyle = color;
  const ox = Math.round(cx - mask[0].length * ps / 2), oy = Math.round(cy - mask.length * ps / 2);
  for (let y = 0; y < mask.length; y++) {
    const row = mask[y];
    let run = -1;
    for (let x = 0; x <= row.length; x++) {
      const on = row[x] === '#';
      if (on && run < 0) run = x;
      if (!on && run >= 0) { ctx.fillRect(ox + run * ps, oy + y * ps, (x - run) * ps, ps); run = -1; }
    }
  }
}
function drawEyes(cx, cy, dir, ps) {
  const ox = Math.round(cx - 7 * ps), oy = Math.round(cy - 7 * ps);
  const px = dir >= 0 ? DX[dir] : 0, py = dir >= 0 ? DY[dir] : 0;
  for (const ex of [2, 8]) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(ox + (ex + px) * ps, oy + (4 + py) * ps, 4 * ps, 5 * ps);
    ctx.fillRect(ox + (ex + px - 0) * ps, oy + (5 + py) * ps, 4 * ps, 3 * ps);
    ctx.fillStyle = '#2121de';
    ctx.fillRect(ox + (ex + 1 + px * 2) * ps, oy + (6 + py * 2) * ps, 2 * ps, 2 * ps);
  }
}
function screenPos(p) { return {x: MAZE_X + (p.x + 0.5) * TILE, y: MAZE_Y + (p.y + 0.5) * TILE}; }

let animT = 0;
function drawGhost(g, sp, isActive, ps = 2) {
  const frame = ((animT * 8) | 0) % 2;
  const mask = MASKS[frame];
  if (g.state === 'eyes') { drawEyes(sp.x, sp.y, g.dir, ps); return; }
  let color = GHOST_COLORS[g.id];
  let frightened = g.fright;
  if (frightened) color = (frightT < 2 && ((animT * 6) | 0) % 2) ? '#ffffff' : '#2121de';
  if (isActive) {
    // the halo: a pulsing outline plus a soft glow, so you can find
    // yourself at a glance even in a crowd
    const pulse = 0.6 + 0.4 * Math.sin(animT * 10);
    ctx.save();
    ctx.shadowColor = GHOST_COLORS[g.id];
    ctx.shadowBlur = 14 + 6 * pulse;
    ctx.globalAlpha = pulse;
    for (const [dx, dy] of [[-2, 0], [2, 0], [0, -2], [0, 2], [-2, -2], [2, 2], [-2, 2], [2, -2]]) drawMask(mask, sp.x + dx, sp.y + dy, ps, '#ffffff');
    ctx.restore();
  }
  drawMask(mask, sp.x, sp.y, ps, color);
  if (frightened) {
    const ox = Math.round(sp.x - 7 * ps), oy = Math.round(sp.y - 7 * ps);
    const fc = color === '#ffffff' ? '#ff2020' : '#ffb8ae';
    ctx.fillStyle = fc;
    ctx.fillRect(ox + 4 * ps, oy + 5 * ps, 2 * ps, 2 * ps);
    ctx.fillRect(ox + 8 * ps, oy + 5 * ps, 2 * ps, 2 * ps);
    for (let i = 0; i < 6; i++) ctx.fillRect(ox + (2 + i * 2) * ps, oy + (9 + (i % 2)) * ps, 2 * ps, ps);
  } else drawEyes(sp.x, sp.y, g.dir >= 0 ? g.dir : g.wantDir, ps);
  if (isActive) {
    // a bobbing arrow overhead as a second, louder "this one"
    const by = sp.y - 24 + Math.sin(animT * 8) * 2;
    ctx.fillStyle = '#fff';
    for (let r = 0; r < 4; r++) ctx.fillRect(Math.round(sp.x - (4 - r) * 2), Math.round(by + r * 2), (4 - r) * 4, 2);
    ctx.fillStyle = GHOST_COLORS[g.id];
    for (let r = 0; r < 3; r++) ctx.fillRect(Math.round(sp.x - (3 - r) * 2 + 0), Math.round(by + r * 2), (3 - r) * 4, 2);
  }
}

function drawPac(sp, dir, open) {
  // drawn pixel by pixel from the circle equation rather than with arc(), so
  // he matches the blocky ghosts
  const ps = 2, R = 6.5;
  const ang = open * 0.8;

  ctx.fillStyle = '#ffff00';
  for (let y = 0; y < 13; y++) for (let x = 0; x < 13; x++) {
    const dx = x - 6, dy = y - 6;
    if (dx * dx + dy * dy > R * R) continue;

      let a = Math.atan2(dy, dx) - facing;
      a = Math.atan2(Math.sin(a), Math.cos(a));
      if (Math.abs(a) < ang) continue;
    }
    ctx.fillRect(Math.round(sp.x - 13 + x * ps), Math.round(sp.y - 13 + y * ps), ps, ps);
  }
}

// ---------------------------------------------------------------- maze art
// walls are drawn once into an offscreen canvas. Each wall tile is shrunk on
// the sides that face a corridor, giving thick corridors and the double-line
// outline of the arcade from nothing but rectangles.
const INSET = 6;
const mazeArt = document.createElement('canvas');
mazeArt.width = COLS * TILE; mazeArt.height = ROWS * TILE;
(function paintMaze() {
  const m = mazeArt.getContext('2d');

  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (!wall(x, y)) continue;
    const X = x * TILE, Y = y * TILE;
    const l = !wall(x - 1, y), r = !wall(x + 1, y), u = !wall(x, y - 1), d = !wall(x, y + 1);
    const rect = (ins, col) => {
      m.fillStyle = col;

    rect(INSET + 2, '#0b0b3a');
    for (const [cx, cy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      if (wall(x + cx, y) && wall(x, y + cy) && !wall(x + cx, y + cy)) {
        const sx = cx < 0 ? X : X + TILE, sy = cy < 0 ? Y : Y + TILE;
        const s1 = INSET + 2, s0 = INSET;
        m.fillStyle = '#3a3aff';
        m.fillRect(cx < 0 ? sx : sx - s1, cy < 0 ? sy : sy - s1, s1, s1);
        m.fillStyle = '#000';
        m.fillRect(cx < 0 ? sx : sx - s0, cy < 0 ? sy : sy - s0, s0, s0);
      }
    }
  }
  // the door
  m.fillStyle = '#ffb8ff';
  for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++)
    if (tileAt(x, y) === '-') m.fillRect(x * TILE, y * TILE + TILE - 6, TILE, 3);
})();

// ---------------------------------------------------------------- draw
function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  if (state === 'title') { drawTitle(); return; }

  ctx.drawImage(mazeArt, MAZE_X, MAZE_Y);
  // dots
  const blink = ((animT * 4) | 0) % 2 === 0;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const v = dots[idx(x, y)];
    if (!v) continue;
    const sx = MAZE_X + x * TILE, sy = MAZE_Y + y * TILE;
    ctx.fillStyle = '#ffb8ae';
    if (v === 1) ctx.fillRect(sx + 6, sy + 6, 4, 4);
    else if (blink || state !== 'play') { ctx.fillRect(sx + 3, sy + 1, 10, 14); ctx.fillRect(sx + 1, sy + 3, 14, 10); }
  }

  // actors, with the tunnel handled by drawing a second copy one maze-width over
  const drawWrapped = (p, fn) => {
    const sp = screenPos(p);

    ctx.beginPath(); ctx.rect(MAZE_X, MAZE_Y - 30, COLS * TILE, ROWS * TILE + 30); ctx.clip();
    fn(sp);

  const showPac = state !== 'caught' || ((animT * 8) | 0) % 2;
  for (const g of order.slice(0, -1)) drawWrapped(bob(g), sp => drawGhost(g, sp, false));
  if (showPac) drawWrapped(posOf(pac), sp => drawPac(sp, pac.dir, state === 'play' ? Math.abs(Math.sin(pac.moved * Math.PI)) : 0.5));
  const ag = ghosts[active];
  drawWrapped(bob(ag), sp => drawGhost(ag, sp, true));

  for (const p of popups) { const sp = screenPos(p); text(p.text, sp.x, sp.y - 6, 2, p.color, 'center'); }

  drawHud();

  const cy = MAZE_Y + 13 * TILE + 3, cx = W / 2;
  if (state === 'ready') banner('READY!', '#ffff00', 'YOU ARE ' + GHOST_NAMES[active]);
  if (state === 'paused') banner('PAUSED', '#ffffff', 'PRESS START');
  if (state === 'caught') banner(lastCatch + '!', lastCatch === 'TRAPPED' ? '#40ff80' : '#ffff00',
    (lastCatch === 'TRAPPED' ? 'TEAM TRAP BONUS  ' : '') + 'LEVEL ' + (level + 1) + ' NEXT');
  if (state === 'cleared') banner('MAZE CLEARED', '#ff4040', lives > 1 ? 'YOU LOSE A LIFE' : 'LAST LIFE GONE');
  if (state === 'gameover') {
    ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, MAZE_Y + 8 * TILE, W, 12 * TILE);
    text('GAME OVER', cx, cy - 50, 6, '#ff2020', 'center');
    text('SCORE ' + score, cx, cy + 10, 3, '#fff', 'center');
    text('REACHED LEVEL ' + level, cx, cy + 40, 2, '#aaa', 'center');
    if (((animT * 2) | 0) % 2) text('PRESS START', cx, cy + 70, 2, '#ffff00', 'center');
  }

}
function bob(g) {
  const p = posOf(g);
  if (g.state === 'house') return {x: p.x, y: p.y + Math.sin(animT * 6 + g.id) * 0.25};
  return p;
}
function banner(big, color, small) {
  const cy = MAZE_Y + 13 * TILE;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, cy - 26, W, 60);

function drawHud() {

  text('HI', W / 2, 6, 2, '#aaa', 'center');
  text(Math.max(hiScore, score), W / 2, 20, 2, '#fff', 'center');
  text('LEVEL', W - 8, 6, 2, '#aaa', 'right');
  text(level, W - 8, 20, 2, '#fff', 'right');

  // dots meter: the clock you are racing

  const frac = dotsTotal ? dotsLeft / dotsTotal : 0;
  text('DOTS', 8, by + 1, 2, '#aaa');
  const bx = 48, bw = 200;
  ctx.fillStyle = '#333'; ctx.fillRect(bx, by, bw, 12);
  ctx.fillStyle = frac > 0.5 ? '#40e040' : frac > 0.2 ? '#ffd020' : (((animT * 6) | 0) % 2 ? '#ff2020' : '#802020');
  ctx.fillRect(bx, by, Math.round(bw * frac), 12);
  text(dotsLeft, bx + bw + 6, by + 1, 2, '#fff');
  text('BONUS ' + catchValue(), W - 8, by + 1, 2, '#ffff00', 'right');

  // ghost picker and lives
  const gy = by + 34;
  for (let i = 0; i < 4; i++) {
    const g = ghosts[i], x = 18 + i * 34;
    if (i === active) { ctx.fillStyle = '#fff'; ctx.fillRect(x - 13, gy - 13, 26, 26); ctx.fillStyle = '#000'; ctx.fillRect(x - 11, gy - 11, 22, 22); }
    if (g.state === 'eyes') drawEyes(x, gy, 3, 1);
    else drawMask(MASKS[0], x, gy, 1, g.fright ? '#2121de' : GHOST_COLORS[i]);
    text(i + 1, x + 10, gy + 6, 1, '#888');
  }
  text('LIVES', 170, gy - 4, 2, '#aaa');
  for (let i = 0; i < lives; i++) drawMask(MASKS[0], 226 + i * 18, gy, 1, '#ff2020');
  if (padNote > 0) text('CONTROLLER CONNECTED', W - 8, gy - 10, 1, '#40e040', 'right');
  else if (padName) text('PAD', W - 36, gy - 10, 1, '#40e040', 'right');
  text('V0.1', W - 8, gy - 10, 1, '#666', 'right');
}

function drawTitle() {
  const cx = W / 2;
  text('HAUNT', cx, 50, 10, '#ff2020', 'center');
  text('YOU ARE THE GHOSTS.', cx, 120, 2, '#fff', 'center');
  // a little parade: Pac-Man fleeing, the four of you after him
  const t = (animT * 70) % (W + 260) - 130;
  drawPac({x: t + 110, y: 170}, 3, Math.abs(Math.sin(animT * 12)));
  for (let i = 0; i < 4; i++) drawGhost({id: i, state: 'out', dir: 3, fright: false}, {x: t - i * 32 + 60, y: 170}, i === ((animT / 1.5) | 0) % 4);
  const rows = [
    ['D-PAD', 'STEER YOUR GHOST'],
    ['A', 'NEXT GHOST'],
    ['B', 'PREVIOUS GHOST'],
    ['SELECT', 'GHOST NEAREST PAC-MAN'],
    ['START', 'START / PAUSE'],
  ];
  let y = 214;
  for (const [k, v] of rows) { text(k, 60, y, 2, '#ffff00'); text(v, 160, y, 2, '#fff'); y += 20; }
  y += 8;
  text('KEYS: ARROWS OR WASD   Z/K = A   X/J = B', cx, y, 2, '#aaa', 'center'); y += 14;
  text('SHIFT = SELECT   ENTER = START   1-4 = PICK GHOST', cx, y, 2, '#aaa', 'center'); y += 30;
  text('CATCH PAC-MAN BEFORE HE EATS EVERY DOT.', cx, y, 2, '#ffb8ae', 'center'); y += 18;
  text('ONLY THE GHOST YOU STEER IS FAST', cx, y, 2, '#ffb8ae', 'center'); y += 18;
  text('ENOUGH TO CATCH HIM. THE OTHERS HERD.', cx, y, 2, '#ffb8ae', 'center'); y += 18;
  text('POWER PELLETS TURN THE TABLES.', cx, y, 2, '#ffb8ae', 'center'); y += 40;
  if (((animT * 2) | 0) % 2) text('PRESS START', cx, y, 3, '#ffff00', 'center');
  text('HI ' + hiScore, 8, H - 14, 2, '#888');
  if (padName) text('CONTROLLER CONNECTED', cx, H - 14, 1, '#40e040', 'center');
  text('V0.1', W - 8, H - 14, 2, '#666', 'right');
}

// ---------------------------------------------------------------- layout
// the canvas keeps its own small resolution and is scaled to fit the window
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit);
fit();

// ---------------------------------------------------------------- loop
// a fixed physics step, so speed ratios and collisions do not depend on the
// monitor's refresh rate; rendering just shows the latest step
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  pollInput();
  acc += dt * SIM_SPEED;
  while (acc >= STEP) { update(STEP); animT += STEP; acc -= STEP; }
  draw();
  requestAnimationFrame(frame);
}
freshDots(); resetActors();
if (DEMO) newGame();
// ?demo&sim=N fast-forwards N seconds of play before the first frame, so a
// headless browser can check pathing and balance without waiting in real time
const SIM = +params.get('sim') || 0;
if (DEMO && SIM > 0) {
  for (let i = 0; i < SIM / STEP; i++) { update(STEP); animT += STEP; }
  console.log('HAUNT summary ' + JSON.stringify({state, level, lives, score, dotsLeft, t: SIM}, null, 0) + ' ' + JSON.stringify(stats));
}
requestAnimationFrame(frame);
</script>
