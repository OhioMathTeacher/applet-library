function pop(x, y, s) { pops.push({x, y, s, t: 1.3}); }
function addScore(n) {
  score += n;
  if (score >= nextLife) { nextLife += 10000; lives++; SFX.life(); say('EXTRA TOAD!'); }
}

/* ---------------- lanes ---------------- */
/* Every lane is a loop wider than the screen: things leave one side and come
   back on the other. M is the hidden margin each side. */
const M = 96, LOOP = W + 2*M;
const WIDTH = {car: 26, bike: 14, lorry: 62, tractor: 30};
const NAME = {car: 'CAR', bike: 'MOTORBIKE', lorry: 'LORRY', tractor: 'TRACTOR'};
const CAR_COLS = [C.red, C.cyan, C.yellow, C.pink, C.ltblue, C.white, C.purple];
let lanes = [], laneAt = {};
function buildLanes(lv) {
  /* Level 1 is gentle. Each level after is 10% quicker (to a cap), and the
     road gets busier every couple of levels. */
  const k = Math.min(1.9, 1 + 0.1*(lv - 1));
  const more = i => (lv >= 3 && i % 2 === 0 ? 1 : 0) + (lv >= 5 && i % 2 === 1 ? 1 : 0) + (lv >= 7 ? 1 : 0);
  const dives = lv >= 3 ? 2 : 1;
  const shrink = lv >= 4 ? 16 : 0;
  const defs = [
    {row: 2, kind: 'log',    dir:  1, v: 20, len: 64 - shrink, n: 3},
    {row: 3, kind: 'turtle', dir: -1, v: 16, len: 2, n: 4},
    {row: 4, kind: 'log',    dir:  1, v: 24, len: 80 - shrink, n: 3},
    {row: 5, kind: 'log',    dir:  1, v: 15, len: 48, n: 4},
    {row: 6, kind: 'turtle', dir: -1, v: 13, len: 3, n: 4},
    {row: 8, kind: 'bike',    dir:  1, v: 46, n: 1},
    {row: 9, kind: 'car',     dir: -1, v: 26, n: 2},
    {row: 10, kind: 'lorry',  dir:  1, v: 17, n: 1},
    {row: 11, kind: 'car',    dir: -1, v: 20, n: 3},
    {row: 12, kind: 'tractor', dir: 1, v: 11, n: 2},
  ];
  let ci = 0;
  lanes = defs.map((d, i) => {
    const road = d.row >= ROAD_TOP;
    const n = d.n + (road ? more(i) : 0);
    const L = {row: d.row, kind: d.kind, v: d.v*k*d.dir, objs: []};
    const gap = LOOP/n;
    for (let j = 0; j < n; j++) {
      let kind = d.kind;
      if (d.row === 12 && j >= 2) kind = 'car';              // later levels: cars behind the tractors
      const o = {kind, x: -M + j*gap + (road ? rnd(0, gap*0.25) : rnd(0, gap*0.15)), ph: rnd(0, 8)};
      o.w = d.kind === 'log' ? d.len : d.kind === 'turtle' ? d.len*T : WIDTH[kind];
      o.col = CAR_COLS[ci++ % CAR_COLS.length];
      o.dive = d.kind === 'turtle' && j < dives && (d.row === 6 || lv >= 2 || j === 0);
      if (d.kind === 'turtle' && d.row === 3 && lv === 1) o.dive = false;   // level 1: one diving group only
      L.objs.push(o);
    }
    return L;
  });
  laneAt = {}; for (const L of lanes) laneAt[L.row] = L;
}
/* Diving turtles: up, sinking (still safe, drawn darker as a warning),
   under (not safe), rising (not safe yet). */
function turtleState(o) {
  if (!o.dive) return 0;
  const c = o.ph % 8;
  return c < 4.8 ? 0 : c < 6 ? 1 : c < 7.4 ? 2 : 3;
}
function floaterAt(row, x) {
  const L = laneAt[row]; if (!L || !isCreek(row)) return null;
  for (const o of L.objs) if (x > o.x + 1 && x < o.x + o.w - 1 && (o.kind !== 'turtle' || turtleState(o) < 2)) return o;
  return null;
}
function vehicleAt(row, x) {
  const L = laneAt[row]; if (!L || !isRoad(row)) return null;
  for (const o of L.objs) if (x + 5 > o.x + 2 && x - 5 < o.x + o.w - 2) return o;
  return null;
}
function updateLanes(dt) {
  for (const L of lanes) {
    if (P.ride && isRoad(L.row)) continue;         // the traffic waits for the volunteer
    for (const o of L.objs) {
      o.x += L.v*dt; o.ph += dt; o.stopped = false;
      if (L.v > 0 && o.x >= -M + LOOP) o.x -= LOOP;
      if (L.v < 0 && o.x < -M) o.x += LOOP;
    }
    /* The volunteer's lane: traffic behind her slows and queues. */
    if (L.row === ROAD_BOT && V.on) {
      let limit = V.x - 12;
      const behind = L.objs.filter(o => o.x < V.x).sort((a, b) => b.x - a.x);
      for (const o of behind) {
        if (o.x + o.w > limit) { o.x = limit - o.w; o.stopped = true; }
        limit = o.x - 6;
      }
    }
  }
}

/* ---------------- the night's other characters ---------------- */
const V = {on: false, x: -24, y: ROAD_BOT, cd: 6};                 // the toad-patrol volunteer
const S = {on: false, x: 0, dir: 1, v: 18, cd: 16, len: 46, scared: false, t: 0};   // grass snake
const HR = {bay: -1, t: 0, cd: 26, fly: 0, fx: 0};                 // heron
const MF = {bay: -1, t: 0, cd: 9};                                  // mayfly
const MALE = {on: false, cd: 10, obj: null, off: 0, row: 0, x: 0, t: 0};

function updateWorld(dt) {
  const spawning = state === 'play' && !P.ride;
  const k = Math.min(1.9, 1 + 0.1*(level - 1));
  // volunteer
  if (!V.on) {
    if (spawning) V.cd -= dt;
    const clear = !laneAt[ROAD_BOT].objs.some(o => o.x < 12 && o.x + o.w > -50);
    if (V.cd <= 0 && clear) { V.on = true; V.x = -24; V.y = ROAD_BOT; }
  } else if (!P.ride) {
    V.x += 9*dt;
    if (V.x > W + 24) { V.on = false; V.cd = rnd(18, 28); }
  }
  // grass snake on the median
  if (!S.on) {
    if (spawning) S.cd -= dt;
    if (S.cd <= 0 && !(P.row === MEDIAN && !P.hop)) {
      S.on = true; S.scared = false; S.dir = Math.random() < 0.5 ? 1 : -1;
      S.x = S.dir > 0 ? -8 : W + 8; S.v = 17*k; S.t = 0; SFX.snake();
    }
  } else {
    S.x += S.dir*S.v*dt; S.t += dt;
    const tail = S.x - S.dir*S.len;
    if ((S.dir > 0 && tail > W + 8) || (S.dir < 0 && tail < -8)) { S.on = false; S.cd = rnd(22, 36) - Math.min(10, level*1.5); }
  }
  // heron in a bay
  const bayFree = b => !homes[b] && MF.bay !== b && HR.bay !== b;
  if (HR.fly > 0) HR.fly -= dt;
  if (HR.bay < 0) {
    if (spawning) HR.cd -= dt;
    if (HR.cd <= 0) {
      const ok = [0, 1, 2, 3, 4].filter(b => bayFree(b) && !(P.row <= CREEK_TOP + 1 && Math.abs(BAYS[b] - P.x) < 24));
      if (ok.length) { HR.bay = ok[Math.floor(Math.random()*ok.length)]; HR.t = Math.max(5, 8 - level*0.3); SFX.heron(); }
      else HR.cd = 3;
    }
  } else {
    HR.t -= dt;
    if (HR.t <= 0) heronLeaves();
  }
  // mayfly in a bay
  if (MF.bay < 0) {
    if (spawning) MF.cd -= dt;
    if (MF.cd <= 0) {
      const ok = [0, 1, 2, 3, 4].filter(bayFree);
      if (ok.length) { MF.bay = ok[Math.floor(Math.random()*ok.length)]; MF.t = 6; }
      MF.cd = rnd(10, 18);
    }
  } else { MF.t -= dt; if (MF.t <= 0) MF.bay = -1; }
  // the lone male toad: on a log drifting in, or sitting on the median
  if (!MALE.on) {
    if (spawning && !P.rider) MALE.cd -= dt;
    if (MALE.cd <= 0) {
      MALE.cd = rnd(12, 20);
      const row = Math.random() < 0.5 ? 4 : 5, L = laneAt[row];
      const cands = L.objs.filter(o => o.x + o.w < -4);
      if (cands.length && Math.random() < 0.7) {
        const o = cands[0]; Object.assign(MALE, {on: true, obj: o, off: o.w/2, row, x: o.x + o.w/2, t: 0});
      } else if (!S.on && P.row !== MEDIAN) {
        Object.assign(MALE, {on: true, obj: null, row: MEDIAN, x: rnd(40, 360), t: 0});
      }
    }
  } else {
    MALE.t += dt;
    if (MALE.obj) {
      MALE.x = MALE.obj.x + MALE.off;
      if (MALE.t > 2 && (MALE.x > W + 12 || MALE.x < -12)) MALE.on = false;
    } else if (MALE.t > 11) MALE.on = false;
  }
}
function heronLeaves() {
  if (HR.bay < 0) return;
  HR.fx = BAYS[HR.bay]; HR.fly = 1; HR.bay = -1; HR.cd = rnd(14, 24) - Math.min(8, level); SFX.flap();
}
function scareSnake() {
  if (!S.on || S.scared) return;
  S.scared = true; S.x = S.x - S.dir*S.len; S.dir = -S.dir; S.v *= 2.4; SFX.scared();
  pop(P.x, MEDIAN*T, 'SHOO!');
}

/* ---------------- the toad ---------------- */
function resetToad() {
  Object.assign(P, {x: START_X, row: START_ROW, face: 'up', hop: null, swim: false, puffing: false, puffT: 0,
    puffCd: 0, longCd: 0, rep: 0, repDir: null, buffered: null, maxRow: START_ROW, rider: false, ride: null, dead: null});
  P.maxTime = P.time = toadTime(); P.lastTick = 0;
}
function bayAt(x) { return BAYS.findIndex(b => Math.abs(x - b) <= BAY_HALF); }

function tryHop(dir) {
  if (state !== 'play' || P.dead || P.ride || P.puffing) return false;
  if (P.hop) { if (!P.hop.long && P.hop.t > P.hop.dur*0.35) P.buffered = dir; return false; }
  const long = dir === 'long';
  let dx = 0, dr = 0;
  if (dir === 'up') dr = -1; else if (dir === 'down') dr = 1;
  else if (dir === 'left') dx = -T; else if (dir === 'right') dx = T;
  else if (long) dr = -2;
  P.face = long ? 'up' : dir;
  let r1 = P.row + dr; const x1 = P.x + dx;
  if (r1 < HOME_ROW) r1 = HOME_ROW;
  if (r1 > START_ROW || r1 === P.row && dx === 0) return false;
  if (x1 < 8 || x1 > W - 8) { SFX.thud(); return false; }
  if (r1 === HOME_ROW) {
    const b = bayAt(x1);
    if (b < 0 || homes[b]) { SFX.thud(); return false; }    // reeds, or a bay already taken
  }
  const dur = long ? 0.24 : 0.12;
  if (P.swim) {
    /* In the creek the current is too strong to swim across: you can only
       hop out onto something -- a log, a turtle, the bank or a bay. */
    const L = laneAt[r1];
    const solid = !isCreek(r1) || floaterAt(r1, x1 - (L ? L.v*dur : 0)) || floaterAt(r1, x1);
    if (!solid) {
      if (P.paddleCd <= 0) { SFX.paddle(); ripples.push({x: P.x, y: P.row*T + 8, t: 0}); P.paddleCd = 0.18; }
      return false;
    }
  }
  P.hop = {x0: P.x, r0: P.row, x1, r1, t: 0, dur, long};
  P.swim = false;
  if (long) { P.longCd = LONG_CD; SFX.long(); } else SFX.hop();
  hops++;
  return true;
}
function landed() {
  const h = P.hop; P.hop = null;
  P.x = h.x1; P.row = h.r1;
  if (P.row === HOME_ROW) return reachHome();
  if (isCreek(P.row)) {
    if (floaterAt(P.row, P.x)) { P.swim = false; SFX.plop(); }
    else { P.swim = true; SFX.splash(); ripples.push({x: P.x, y: P.row*T + 8, t: 0}); say('IN THE CREEK! GRAB A LOG', 1.5); }
  } else P.swim = false;
  if (P.row < P.maxRow) { addScore(10*(P.maxRow - P.row)); P.maxRow = P.row; }
  if (P.buffered) { const b = P.buffered; P.buffered = null; tryHop(b); }
}
function reachHome() {
  const b = bayAt(P.x);
  if (b === HR.bay) {
    if (IMMORTAL) { resetToad(); return; }
    return kill('A HERON WAS WAITING IN THAT BAY', 'eaten');
  }
  homes[b] = true; P.x = BAYS[b];
  let bonus = 50 + Math.ceil(P.time)*10, extra = [];
  if (MF.bay === b) { bonus += 200; MF.bay = -1; extra.push('MAYFLY'); SFX.mayfly(); }
  if (P.rider) { bonus += 200; extra.push('PAIR'); SFX.croak(); }
  addScore(bonus);
  pop(BAYS[b], HOME_ROW*T - 4, '+' + bonus);
  say(extra.length ? 'HOME!  ' + extra.join(' + ') + ' BONUS' : 'HOME!', 1.6);
  SFX.home();
  if (homes.every(Boolean)) {
    clearBonus = 1000; addScore(clearBonus);
    state = 'clear'; clearT = 3.2; SFX.clear();
    return;
  }
  resetToad();
}
function kill(cause, how) {
  if (state !== 'play' || P.dead) return;
  if (IMMORTAL) return;
  P.dead = {cause, how, t: 0, x: P.x, row: P.row};
  P.hop = null; P.puffing = false; P.rider = false;
  (SFX[how] || SFX.road)();
  state = 'dying';
}
function afterDeath() {
  lives--;
  if (lives <= 0) {
    state = 'over'; SFX.gameover();
    if (!DEMO && score > hi) { hi = score; try { localStorage.setItem(HI_KEY, hi); } catch (e) {} }
    return;
  }
  resetToad(); state = 'play';
}
function startRide() {
  P.ride = {t: 0, dur: 1.8, x0: V.x + 10}; P.hop = null; P.swim = false; P.buffered = null;
  SFX.bucket(); say('A VOLUNTEER CARRIES YOU ACROSS', 1.8);
}

function updatePlayer(dt) {
  P.puffCd = Math.max(0, P.puffCd - dt); P.longCd = Math.max(0, P.longCd - dt); P.paddleCd = Math.max(0, P.paddleCd - dt);
  if (P.ride) {
    const r = P.ride; r.t += dt;
    V.y = ROAD_BOT + (MEDIAN - ROAD_BOT)*Math.min(1, r.t/(r.dur*0.85));
    P.x = V.x + 10; P.row = V.y;
    if (r.t >= r.dur) {
      P.ride = null; P.row = MEDIAN; P.x = clamp(V.x + 10, 8, W - 8);
      /* She won't set you down next to a snake: she shoos it off first. */
      if (S.on && !S.scared && Math.abs(S.x - P.x) < 60) scareSnake();
      V.on = false; V.y = ROAD_BOT; V.cd = rnd(22, 30);
      addScore(200); pop(P.x, MEDIAN*T - 6, '+200');
      if (MEDIAN < P.maxRow) { addScore(10*(P.maxRow - MEDIAN)); P.maxRow = MEDIAN; }
    }
    return;
  }
  /* The clock. Last ten seconds tick. */
  P.time -= dt;
  if (P.time < 10 && Math.ceil(P.time) !== P.lastTick) { P.lastTick = Math.ceil(P.time); SFX.tick(); }
  if (P.time <= 0) { if (IMMORTAL) P.time = P.maxTime; else return kill('OUT OF TIME', 'time'); }

  /* B: puff up. You can't move while puffed. */
  if (P.puffing) {
    P.puffT += dt;
    if (!held.b || P.puffT >= PUFF_MAX) { P.puffing = false; P.puffCd = PUFF_CD; }
  } else if (pressed.b && P.puffCd <= 0 && !P.hop) { P.puffing = true; P.puffT = 0; SFX.puff(); }
  if (P.puffing) {
    if (HR.bay >= 0 && P.row <= CREEK_TOP + 1 && Math.abs(BAYS[HR.bay] - P.x) < 40) { heronLeaves(); pop(P.x, P.row*T - 6, 'SHOO!'); }
    if (S.on && !S.scared && P.row === MEDIAN && Math.abs(S.x - P.x) < 34) scareSnake();
  }

  /* D-pad: one hop per press. Holding repeats, but slowly. A: long hop. */
  let want = null;
  for (const d of DIRS) if (pressed[d]) want = d;
  if (want) { tryHop(want); P.rep = 0.32; P.repDir = want; }
  else if (P.repDir && held[P.repDir]) {
    P.rep -= dt;
    if (P.rep <= 0 && !P.hop && !P.puffing) { if (tryHop(P.repDir)) P.rep = 0.3; }
  } else P.repDir = null;
  if (pressed.a && P.longCd <= 0) tryHop('long');

  if (P.hop) {
    P.hop.t += dt;
    if (P.hop.t >= P.hop.dur) landed();
  }
  if (state !== 'play') return;
  if (!P.hop) {
    /* The creek: ride what you stand on; in the water, the current takes you. */
    if (isCreek(P.row)) {
      const L = laneAt[P.row];
      if (!P.swim && !floaterAt(P.row, P.x)) {
        P.swim = true; SFX.splash(); ripples.push({x: P.x, y: P.row*T + 8, t: 0}); say('THE TURTLES DIVED!', 1.5);
      }
      if (P.swim) {
        P.x += Math.sign(L.v)*(Math.abs(L.v)*0.5 + 6)*dt;
        if (floaterAt(P.row, P.x)) { P.swim = false; SFX.plop(); }
      } else P.x += L.v*dt;
      if (P.x < 0 || P.x > W) {
        if (IMMORTAL) P.x = clamp(P.x, 8, W - 8);
        else return kill(P.swim ? 'SWEPT DOWNSTREAM' : 'CARRIED OFF DOWNSTREAM', 'swept');
      }
    }
  }
  /* What you're touching. Mid-hop you count as in the row you're nearer;
     a long hop is in the air until it lands. */
  const h = P.hop;
  const row = h ? (h.long ? -1 : (h.t < h.dur/2 ? h.r0 : h.r1)) : P.row;
  const x = h ? h.x0 + (h.x1 - h.x0)*(h.t/h.dur) : P.x;
  if (isRoad(row)) {
    if (row === ROAD_BOT && V.on && x > V.x - 12 && x < V.x + 20) return startRide();
    const o = vehicleAt(row, x);
    if (o) return kill('HIT BY A ' + NAME[o.kind], 'road');
  }
  if (row === MEDIAN && S.on && !S.scared && !h) {
    const a = Math.min(S.x, S.x - S.dir*S.len), b = Math.max(S.x, S.x - S.dir*S.len);
    if (x + 5 > a && x - 5 < b) {
      if (P.puffing) scareSnake(); else return kill('A GRASS SNAKE GOT YOU', 'eaten');
    }
  }
  if (MALE.on && !P.rider && !h && P.row === MALE.row && Math.abs(P.x - MALE.x) < 10) {
    P.rider = true; MALE.on = false; SFX.croak(); pop(P.x, P.row*T - 6, 'PAIRED!');
    say('A MALE CLIMBS ON YOUR BACK: AMPLEXUS', 2);
  }
}

/* ---------------- flow ---------------- */
function newGame() {
  score = 0; lives = 4; nextLife = 10000;
  level = DEMO ? Math.max(1, parseInt(Q.get('level')) || 1) : 1;
  startLevel();
  state = 'play';
}
function startLevel() {
  buildLanes(level);
  homes.fill(false); hops = 0;
  Object.assign(V, {on: false, x: -24, y: ROAD_BOT, cd: DEMO && Q.has('bucket') ? 0.5 : 6});
  Object.assign(S, {on: false, cd: level === 1 ? 18 : 10});
  Object.assign(HR, {bay: -1, cd: level === 1 ? 26 : 14, fly: 0});
  Object.assign(MF, {bay: -1, cd: 9});
  Object.assign(MALE, {on: false, cd: 10});
  /* &male (demo): a male waits on the median in the autopilot's path. */
  if (DEMO && Q.has('male')) Object.assign(MALE, {on: true, obj: null, row: MEDIAN, x: START_X, t: -60});
  resetToad();
  say('LEVEL ' + level, 2);
}

function update(dt) {
  time += dt; blink += dt;
  if (toastT > 0) toastT -= dt; if (footT > 0) footT -= dt;
  for (const p of pops) p.t -= dt; pops = pops.filter(p => p.t > 0);
  for (const r of ripples) r.t += dt; ripples = ripples.filter(r => r.t < 0.8);
  if (Math.random() < dt*7) ripples.push({x: rnd(0, W), y: Math.random() < 0.15 ? rnd(3, 13) : rnd(CREEK_TOP*T + 2, (CREEK_BOT + 1)*T - 2), t: 0});
  updateRain(dt);

  if (state === 'notes') {
    if (pressed.a) { setSound(!soundOn); footNote(soundOn ? 'SOUND ON' : 'SOUND OFF'); }
    if (pressed.select || pressed.start || pressed.b) state = notesFrom;
    return;
  }
  if (pressed.select && (state === 'play' || state === 'pause' || state === 'title' || state === 'over')) {
    notesFrom = state; state = 'notes'; return;
  }
  if (state === 'title' || state === 'over') { updateLanes(dt); if (pressed.start) newGame(); return; }
  if (state === 'pause') { if (pressed.start) { state = 'play'; SFX.pause(false); } return; }
  if (state === 'play' && pressed.start) { state = 'pause'; SFX.pause(true); return; }

  /* The night itself: distant thunder now and then, toads calling. */
  thunderT -= dt;
  if (thunderT <= 0) { SFX.thunder(); thunderT = rnd(25, 50); }
  if (Math.random() < dt*0.35) SFX.chorus();

  updateLanes(dt);
  updateWorld(dt);
  if (state === 'dying') { P.dead.t += dt; if (P.dead.t > 1.7) afterDeath(); return; }
  if (state === 'clear') {
    clearT -= dt;
    if (clearT <= 0) { level++; startLevel(); state = 'play'; }
    return;
  }
  updatePlayer(dt);
}

/* ---------------- demo autopilot ---------------- */
/* Invincible on the road, and it never drowns -- but it still reads the
   lanes, so the screenshots show real play. */
let demoT = 0;
function demoPilot() {
  for (const d of DIRS) pressed[d] = false; pressed.a = pressed.b = false;
  held.b = P.puffing && S.on && !S.scared;
  if (P.hop || P.ride || P.puffing) return;
  demoT -= STEP; if (demoT > 0) return;
  demoT = 0.12;
  const r = P.row, x = P.x;
  const go = d => { pressed[d] = true; demoT = 0.2; };
  if (r === START_ROW && Q.has('bucket')) {
    if (V.on && V.x > x - 24 && V.x < x - 4) go('up');
    return;
  }
  if (r === MEDIAN && S.on && !S.scared && Math.abs(S.x - x) < 40) { pressed.b = held.b = true; return; }
  if (isRoad(r - 1) || r - 1 === MEDIAN) {
    const L = laneAt[r - 1];
    const danger = L && L.objs.some(o => {
      const ahead = L.v > 0 ? x - (o.x + o.w) : o.x - x;

  'They travel on the first mild, wet nights of early spring, mostly after dark.',
  'A male grabs a female and rides on her back to the pond. This hold is called amplexus.',
  'On migration nights, volunteers patrol the roads with buckets and torches and carry toads across.',
];
function drawNotes() {
  panel('FIELD NOTES', 14, 212);
  let y = HUD + 40;
  for (const f of FACTS) {
    const lines = wrap(f, 58);
    rect(36, y + 2, 4, 4, C.orange);
    lines.forEach((l, i) => text(l, 46, y + i*10, C.white));
    y += lines.length*10 + 10;
  }
  text('A: SOUND ' + (soundOn ? 'ON' : 'OFF'), W/2, HUD + 196, C.cyan, 'center');
  text('SELECT OR START: BACK', W/2, HUD + 208, C.gray, 'center');
}
function drawTitle() {
  ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, HUD, W, PH);
  text('HOP COUNT', W/2, HUD + 14, C.orange, 'center', 24);
  text('A TOAD MIGRATION ON A RAINY SPRING NIGHT', W/2, HUD + 44, C.tan, 'center');
  sprite(TOAD, W/2 - 90, HUD + 26, 2, TOAD_COL); sprite(TOAD, W/2 + 90, HUD + 26, 2, MALE_COL);
  const rows = [
    'Cross the road and the creek to the pond.',
    'Fill all five bays in the reeds.',
    '',
    '',
    '',
    '',
    '',
    '',
    'Fall in the creek and the current takes you:',
    'hop onto a log or turtle before you are swept off.',
    'Hop into the volunteer\'s bucket for a lift.',
  ];
  rows.forEach((r, i) => text(r, W/2, HUD + 62 + i*11, C.white, 'center'));
  [['D-PAD', 'hop, one tile a press'], ['A', 'long hop: two rows forward'], ['B', 'hold to puff up: snakes and herons give up'],
   ['SELECT', 'field notes'], ['START', 'start / pause']].forEach(([b, d], i) => {
    text(b, 78, HUD + 92 + i*11, C.yellow); text(d, 128, HUD + 92 + i*11, C.white);
  });
  if (Math.floor(blink*2) % 2) text('PRESS START', W/2, HUD + 196, C.ygreen, 'center', 12);
  text('HI ' + pad(hi, 6), W/2, HUD + 216, C.cyan, 'center');
}
function draw() {
  drawScene();
  drawHud();
  if (state === 'title') drawTitle();
  if (state === 'notes') drawNotes();
  if (state === 'pause') { panel('PAUSED', 70, 80); text('START TO GO ON', W/2, HUD + 104, C.white, 'center'); text('SELECT FOR FIELD NOTES', W/2, HUD + 118, C.gray, 'center'); }
  if (state === 'dying') text(P.dead.cause, W/2, HUD + WOOD_ROW*T + 3, C.red, 'center', 10);
  if (state === 'clear') {
    panel('LEVEL ' + level + ' CLEAR', 60, 100);
    text('ALL FIVE TOADS HOME IN ' + hops + ' HOPS', W/2, HUD + 92, C.ygreen, 'center');
    text('BONUS ' + clearBonus, W/2, HUD + 110, C.white, 'center');
    text('NEXT: A BUSIER NIGHT', W/2, HUD + 128, C.gray, 'center');
  }
  if (state === 'over') {
    panel('GAME OVER', 50, 130);
    text('SCORE ' + score, W/2, HUD + 86, C.yellow, 'center', 10);
    if (score >= hi && score > 0 && !DEMO) text('NEW HIGH SCORE', W/2, HUD + 104, C.cyan, 'center');
    text('REACHED LEVEL ' + level, W/2, HUD + 120, C.white, 'center');
    if (Math.floor(blink*2) % 2) text('PRESS START', W/2, HUD + 150, C.ygreen, 'center');
  }
}

/* ---------------- loop ---------------- */
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last)/1000); last = now;
  while (acc >= STEP) { pollInput(); update(STEP); acc -= STEP; for (const b of BTN) pressed[b] = false; }
  audioFrame();
  draw();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });
buildLanes(1);
if (DEMO) {
  newGame();
  /* ?demo&warp=N runs N simulation steps up front -- headless browsers barely
     tick requestAnimationFrame, and this lets a screenshot show real play. */
  const warp = Math.min(60*900, parseInt(Q.get('warp')) || 0);
  for (let i = 0; i < warp; i++) { pollInput(); update(STEP); for (const b of BTN) pressed[b] = false; }
  /* &notes opens the field notes card, to check it. */
  if (Q.has('notes')) { notesFrom = state; state = 'notes'; }
}
requestAnimationFrame(frame);
</script>
