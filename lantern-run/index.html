    const nf = scr.resident === 'firefly' ? 9 : (BYTES[screen] % 3);

    for (let i = 0; i < nf; i++) fireflies.push({cx: fh.x, cy: fh.y, r: 14 + Math.random()*22, a: Math.random()*6.3, w: 0.6 + Math.random(), blink: Math.random()*4});
  }
}

const pbox = () => ({x0: P.x - 4, x1: P.x + 4, y0: P.y - 18, y1: P.y});
const hit = (a, b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;

/* By day the animals can see you too. Run near one and it's gone for a
   while; creep (hold B) and you can get much closer; stand still and you
   are part of the forest. Night animals mostly trust the dark. */
function spooked(a, radius) {
  const c = animalCenter(a), d = Math.hypot(c.x - P.x, c.y - (P.y - 10));
  const speed = Math.abs(P.vx) + Math.abs(P.vy)*0.5;
  if (speed < 8) return false;
  return d < (held.b && speed < 50 ? radius*0.45 : radius);
}
function flee(a, secs) { a.state = 'away'; a.away = secs; SFX.flee(); }

function updateAnimal(a, dt) {
  a.t += dt;
  const px = P.x, near = Math.abs(px - a.x), sameFloor = P.ground && Math.abs(P.y - FLOOR) < 2;
  const running = Math.abs(P.vx) > 60;
  if (a.state === 'away') {
    a.away -= dt; if (a.away <= 0) a.state = 'calm';
    a.shy = a.state !== 'calm'; a.box = null; return;
  }
  switch (a.id) {
    case 'anaconda':
      a.x += a.dir * 14 * dt;
      if (a.x < a.x0 + 20) a.dir = 1; if (a.x > a.x1 - 20) a.dir = -1;
      a.box = {x0: a.x - 20, x1: a.x + 20, y0: a.y - 6, y1: a.y}; a.kill = 'CRUSHED BY AN ANACONDA';
      break;
    case 'jaguar':
      if (a.pause > 0) a.pause -= dt;
      else {
        a.x += a.dir * 115 * dt;
        if (a.x < a.x0 + 14) { a.dir = 1; a.pause = 1.2; } if (a.x > a.x1 - 14) { a.dir = -1; a.pause = 1.2; }
      }
      a.box = {x0: a.x - 13, x1: a.x + 13, y0: a.y - 12, y1: a.y}; a.kill = 'TAKEN BY A JAGUAR';
      break;
    case 'viper': {
      /* It feels your warmth before it could ever see you. */
      a.cd = Math.max(0, (a.cd || 0) - dt); a.strike = Math.max(0, (a.strike || 0) - dt);
      if (sameFloor && near < 34 && a.cd <= 0) { a.strike = 0.28; a.cd = 1.3; a.dir = px < a.x ? -1 : 1; }
      const reach = a.strike > 0 ? 20 : 0;
      a.box = {x0: a.x - 7 + Math.min(0, a.dir*reach), x1: a.x + 7 + Math.max(0, a.dir*reach), y0: a.y - 8, y1: a.y};
      a.kill = 'BITTEN BY A FER-DE-LANCE';
      break;
    }
    case 'armadillo':
      /* Startled, it leaps straight up -- then trots off to calm down. */
      if (a.state === 'calm') {
        a.x += a.dir * 18 * dt; if (a.x < a.x0) a.dir = 1; if (a.x > a.x1) a.dir = -1;
        if (sameFloor && near < 60 && running) { a.state = 'leap'; a.vy = -170; a.ay = 0; }
      } else if (a.state === 'leap') {
        a.vy += 600*dt; a.ay += a.vy*dt;
        if (a.ay >= 0) { a.ay = 0; a.state = 'wary'; a.wary = 4; a.dir = px < a.x ? 1 : -1; }
      } else {
        a.wary -= dt; a.x += a.dir * 50 * dt;
        if (a.x < a.x0) a.dir = 1; if (a.x > a.x1) a.dir = -1;
        if (a.wary <= 0) a.state = 'calm';
      }
      a.box = {x0: a.x - 8, x1: a.x + 8, y0: a.y + (a.ay || 0) - 9, y1: a.y + (a.ay || 0)};
      a.knock = a.state === 'leap';
      a.shy = a.state !== 'calm';
      break;
    case 'bat': {
      /* Loops back and forth across the screen, slowing at each turn --
         which is where you can hold it in your light long enough. */
      if (a.gone > 0) { a.gone -= dt; a.box = null; break; }
      const nx = 200 + 165*Math.sin(a.t*0.45 + (a.ph || 0));
      a.dir = nx >= a.x ? 1 : -1; a.x = nx;
      a.dy = Math.sin(a.t * 3) * 14;
      a.box = {x0: a.x - 6, x1: a.x + 6, y0: a.y + a.dy - 4, y1: a.y + a.dy + 4};
      a.bite = 'BITTEN BY A VAMPIRE BAT';
      break;
    }
    case 'owl':
      if (Math.abs(P.y - a.y) < 60 && near < 70 && running) flee(a, 8);
      break;
    case 'kinkajou':
      a.x += a.dir * 26 * dt; if (a.x < a.x0) a.dir = 1; if (a.x > a.x1) a.dir = -1;
      break;
    case 'sloth': case 'sloth3':
      /* Sloths can't flee. That's the whole strategy. */
      a.x += a.dir * 3 * dt; if (a.x < a.x0) a.dir = 1; if (a.x > a.x1) a.dir = -1;
      break;
    case 'monkey': case 'squirrel': {
      /* Hops from branch to branch: night monkeys up high, squirrel monkeys
         lower and quicker. A squirrel monkey troop bolts if you run at it. */
      if (a.id === 'squirrel' && spooked(a, 80)) { flee(a, 7); break; }
      const tiers = a.id === 'monkey' ? [CANOPY, EMERGENT] : [UNDER, CANOPY];
      if (!a.hop) { a.wait = (a.wait || 2) - dt; if (a.wait <= 0) {
        const ps = scr.layout.plat.filter(p => tiers.includes(p[0]));
        const p = ps[Math.floor(Math.random()*ps.length)];
        a.hop = {x0: a.x, y0: a.y, x1: p[1] + 8 + Math.random()*(p[2] - p[1] - 16), y1: p[0], t: 0};
      } } else {
        a.hop.t += dt/(a.id === 'squirrel' ? 0.55 : 0.8); const k = Math.min(1, a.hop.t);
        a.x = a.hop.x0 + (a.hop.x1 - a.hop.x0)*k; a.y = a.hop.y0 + (a.hop.y1 - a.hop.y0)*k - Math.sin(k*Math.PI)*30;
        a.dir = a.hop.x1 > a.hop.x0 ? 1 : -1;
        if (k >= 1) { a.hop = null; a.wait = (a.id === 'squirrel' ? 1 : 2) + Math.random()*2; }
      }
      break;
    }
    case 'potoo':
      /* Holds dead still. Easy to look straight at and never notice. */
      break;
    /* ---- by day ---- */
    case 'frog':
      /* Small, slow, and you must not touch it. */
      a.hopT = (a.hopT || 1.5) - dt;
      if (a.hopT <= 0) { a.hopT = 1.5 + Math.random()*2; a.dir = Math.random() < 0.5 ? -1 : 1; a.hopV = 1; }
      if (a.hopV > 0) { a.hopV -= dt*3; a.x += a.dir*30*dt; a.ay = -Math.sin(Math.max(0, a.hopV)*Math.PI)*5; }
      else a.ay = 0;
      a.x = Math.max(a.x0, Math.min(a.x1, a.x));
      a.box = {x0: a.x - 4, x1: a.x + 4, y0: a.y - 5 + a.ay, y1: a.y + a.ay};
      a.bite = 'TOUCHED A POISON DART FROG';
      break;
    case 'otter':
      if (spooked(a, 90)) { flee(a, 6); break; }
      a.x += a.dir * (a.swim ? 40 : 22) * dt; if (a.x < a.x0) a.dir = 1; if (a.x > a.x1) a.dir = -1;
      if (Math.random() < dt*0.4) SFX.bird();       // otters chirp and squeal all day
      break;
    case 'capybara':
      if (spooked(a, 80)) { flee(a, 6); break; }
      a.x += a.dir * 8 * dt; if (a.x < a.x0) a.dir = 1; if (a.x > a.x1) a.dir = -1;
      break;
    case 'morpho':
      a.x = 200 + 150*Math.sin(a.t*0.35) + 12*Math.sin(a.t*2.3);
      a.y = UNDER - 40 + 20*Math.sin(a.t*0.9) + 6*Math.sin(a.t*5.1);
      a.dir = Math.cos(a.t*0.35) >= 0 ? 1 : -1;
      break;
    case 'hoatzin': case 'toucan': case 'macaw': case 'harpy': {
      /* Perched birds. Run at one and it flies off for a while. */
      const r = {hoatzin: 60, toucan: 80, macaw: 90, harpy: 110}[a.id];
      if (spooked(a, r)) { flee(a, a.id === 'harpy' ? 12 : 8); break; }
      if (a.id === 'macaw' && Math.random() < dt*0.3) SFX.macaw();
      break;
    }
    case 'iguana':
      /* Startled, it lets go of the branch and drops to the forest floor. */
      if (a.state === 'calm' && spooked(a, 70)) { a.state = 'drop'; a.vy = 0; SFX.flee(); }
      if (a.state === 'drop') {
        a.vy += 600*dt; a.y += a.vy*dt;
        if (a.y >= FLOOR) { a.y = FLOOR; a.state = 'away'; a.away = 10; }
      }
      a.shy = a.state !== 'calm';
      break;
    case 'howler':
      a.x += a.dir * 10 * dt; if (a.x < a.x0) a.dir = 1; if (a.x > a.x1) a.dir = -1;
      a.howlT = (a.howlT === undefined ? 2 : a.howlT) - dt;
      if (a.howlT <= 0) { a.howlT = 9 + Math.random()*8; a.howling = 1.4; SFX.howl(); }
      a.howling = Math.max(0, (a.howling || 0) - dt);
      break;
  }
  if (a.state !== 'drop' && a.id !== 'armadillo') a.shy = a.state !== 'calm';
}

/* What you can see, and what counts as "in view" to observe. */
function lightR() { return (DEMO ? 140 : (held.b ? 92 : 58)) + Math.sin(time*23)*1.5 + Math.sin(time*7)*1; }
function lanternPos() { return {x: P.x + P.face*5, y: P.y - 11}; }
function animalCenter(a) {
  if (a.id === 'firefly' || a.id === 'morpho') return {x: a.x, y: a.y};
  if (a.id === 'bat') return {x: a.x, y: a.y + (a.dy || 0)};
  if (a.id === 'sloth' || a.id === 'sloth3') return {x: a.x, y: a.y + 6};
  return {x: a.x, y: a.y - 6 + (a.ay || 0)};
}

/* ---------------- player ---------------- */
function kill(cause) {
  if (P.inv > 0 || DEMO || state !== 'play') return;
  P.deadT = 1.6; P.cause = cause; P.swing = false; P.climb = null;
  if (cause.includes('CREEK')) SFX.splash(); else SFX.die();
  state = 'dying';
}
function respawn() {
  P.x = 24; P.y = 0; P.vx = 0; P.vy = 0; P.ground = false; P.inv = 2; P.stun = 0; P.obs = 0;
  state = 'play';
}

function updatePlayer(dt) {
  P.inv = Math.max(0, P.inv - dt); P.stun = Math.max(0, P.stun - dt);
  P.swingCd = Math.max(0, P.swingCd - dt); P.drop = Math.max(0, P.drop - dt);
  const sneaking = held.b;

  /* On the vine: you go where it goes until you let go. */
  if (P.swing) {
    const tip = vineTip(time);
    P.x = tip.x; P.y = tip.y + 16;
    if (pressed.a || pressed.down) {
      const a = vineAngle(time), w = VINE.amp*2*Math.PI/VINE.period*Math.cos(2*Math.PI*time/VINE.period);
      P.vx = VINE.len*w*Math.cos(a); P.vy = -VINE.len*w*Math.sin(a) - 80;
      P.swing = false; P.swingCd = 0.4; SFX.jump();
    }
    return;
  }
  /* On a liana: climb, or jump off sideways. */
  if (P.climb) {
    const l = P.climb;
    if (held.up) P.y -= 70*dt; if (held.down) P.y += 70*dt;
    if (P.y < l[1]) { P.y = l[1]; P.climb = null; P.ground = true; P.vy = 0; return; }
    if (P.y > l[2]) { P.y = l[2]; P.climb = null; P.ground = l[2] === FLOOR; return; }
    if (pressed.a && (held.left || held.right)) {
      P.climb = null; P.vx = held.left ? -95 : 95; P.vy = -200; P.face = held.left ? -1 : 1; SFX.jump();
    }
    return;
  }

  const dirx = (held.right ? 1 : 0) - (held.left ? 1 : 0);
  const target = P.stun > 0 ? 0 : dirx * (sneaking ? 34 : 98);
  const accel = P.ground ? 900 : 420;
  if (P.vx < target) P.vx = Math.min(target, P.vx + accel*dt); else P.vx = Math.max(target, P.vx - accel*dt);
  if (dirx && P.stun <= 0) P.face = dirx;

  /* Grab a liana: press up beside one, or down standing at its top. */
  if ((held.up || (held.down && !held.a && P.ground)) && P.stun <= 0) {
    for (const l of scr.layout.lianas) {
      const up = held.up && P.y >= l[1] - 1 && P.y <= l[2] + 1;
      const down = held.down && Math.abs(P.y - l[1]) < 1;
      if (Math.abs(P.x - l[0]) < 6 && (up || down)) {
        P.climb = l; P.x = l[0]; P.vx = 0; P.vy = 0; P.ground = false; if (down) P.y += 1; return;
      }
    }
  }
  /* Jump: hold A to go higher. Down + A drops through a branch. */
  if (pressed.a && P.ground && P.stun <= 0) {
    if (held.down && P.y < FLOOR - 1) { P.drop = 0.25; P.ground = false; P.y += 1; }
    else { P.vy = -262; P.ground = false; SFX.jump(); }
  }
  const g = (P.vy < 0 && held.a) ? 610 : 1500;
  P.vy = Math.min(480, P.vy + g*dt);
  P.x += P.vx*dt;

  /* Off the edge of the screen: the next one flips in. */
  if (P.x < 0 || P.x >= W) {
    screen = (screen + (P.x < 0 ? -1 : 1) + NSCREENS) % NSCREENS;
    P.x = P.x < 0 ? P.x + W : P.x - W;
    spawnScreen(); P.obs = 0; P.obsTarget = null;
  }

  const prevY = P.y, wasGround = P.ground;
  P.y += P.vy*dt; P.ground = false;
  if (P.vy >= 0) {
    /* Branches are one-way: land from above, never bump from below. */
    if (P.drop <= 0) for (const p of scr.layout.plat) {
      if (prevY <= p[0] + 0.5 && P.y >= p[0] && P.x > p[1] - 3 && P.x < p[2] + 3) { P.y = p[0]; P.ground = true; break; }
    }
    if (!P.ground && scr.floor === 1) for (const h of caimanHeads()) {
      if (prevY <= FLOOR + 2.5 && P.y >= FLOOR + 2 && Math.abs(P.x - h.x) < 9) {
        if (h.open) kill('EATEN BY A CAIMAN'); else { P.y = FLOOR + 2; P.ground = true; }
        break;
      }
    }
    if (!P.ground && P.y >= FLOOR && !overCreek(P.x)) { P.y = FLOOR; P.ground = true; }
  }
  if (P.ground && !wasGround && P.vy > 120) SFX.land();
  if (P.ground) P.vy = 0;
  /* Standing on a caiman when its jaws open. */
  if (P.ground && scr.floor === 1 && P.y > FLOOR + 1) {
    for (const h of caimanHeads()) if (Math.abs(P.x - h.x) < 9 && h.open) kill('EATEN BY A CAIMAN');
  }
  if (P.y > FLOOR + 14) {
    if (DEMO) { P.y = FLOOR; P.vy = 0; P.ground = true; P.x = POND.x1 + 2; }
    else kill(scr.floor === 1 ? 'EATEN BY A CAIMAN' : 'SWEPT AWAY IN THE CREEK');
  }

  /* Catch the swinging vine in mid-air. */
  if (scr.floor === 2 && !P.ground && P.swingCd <= 0) {
    const tip = vineTip(time);
    if (Math.abs(P.x - tip.x) < 9 && Math.abs((P.y - 16) - tip.y) < 10) { P.swing = true; P.vx = 0; P.vy = 0; SFX.grab(); }
  }

  if (P.ground && Math.abs(P.vx) > 20) { P.run += dt*Math.abs(P.vx)/12; }
}

/* Stand still holding B with an undocumented species in view. By night that
   means inside your lantern light; by day, through binoculars, much further
   off -- but facing it. */
function canObserve(a) {
  if (documented.has(a.id) || a.shy || a.gone > 0 || a.state === 'away') return false;
  if (SPEC[a.id].when !== when) return false;     // a night species glimpsed at dawn waits for night
  const c = animalCenter(a);
  if (isDay()) {
    const dx = c.x - P.x, d = Math.hypot(dx, c.y - (P.y - 16));
    return d < 160 && (Math.abs(dx) < 12 || Math.sign(dx) === P.face);
  }
  const lp = lanternPos();
  return Math.hypot(c.x - lp.x, c.y - lp.y) < Math.min(lightR(), 96);
}
function updateObserve(dt) {
  let best = null, bd = 1e9;
  if (held.b && P.ground && Math.abs(P.vx) < 6 && P.stun <= 0 && !turning) {
    for (const a of animals) {
      if (!canObserve(a)) continue;
      const c = animalCenter(a), d = Math.hypot(c.x - P.x, c.y - P.y);
      if (d < bd) { best = a; bd = d; }
    }
  }
  if (best && best === P.obsTarget) {
    P.obs += dt;
    if (Math.floor(P.obs*4) !== Math.floor((P.obs - dt)*4)) SFX.tick();
    if (P.obs >= 2) {
      documented.add(best.id);
      const sp = SPEC[best.id];
      score += 500 * (1 + TIER_RANK[sp.tier]);
      say('DOCUMENTED: ' + sp.name, 3.5); SFX.doc();
      P.obs = 0; P.obsTarget = null;
      if (documented.size === SPECIES.length) { score += Math.floor(clock)*5; state = 'won'; }
    }
  } else {
    P.obsTarget = best; P.obs = 0;
  }
}

function update(dt) {
  time += dt; nightT += dt;
  if (toastT > 0) toastT -= dt; if (footT > 0) footT -= dt;
  if (pressed.select && (state === 'play' || state === 'journal')) {
    if (state === 'play') journalPage = when;
    state = state === 'journal' ? 'play' : 'journal'; return;
  }
  if (state === 'journal') {
    if (pressed.up) journalSel = (journalSel + 11) % 12;
    if (pressed.down) journalSel = (journalSel + 1) % 12;
    if (pressed.left || pressed.right) journalPage = journalPage === 'night' ? 'day' : 'night';
    if (pressed.a) { setSound(!soundOn); footNote(soundOn ? 'SOUND ON' : 'SOUND OFF'); }
    if (pressed.b && !turning) { turnTime(); state = 'play'; }
    if (pressed.start) state = 'play';
    return;
  }
  if (state === 'title' || state === 'over' || state === 'won') {
    if (pressed.start) newGame();
    return;
  }
  if (pressed.start) { state = state === 'pause' ? 'play' : (state === 'play' ? 'pause' : state); return; }
  if (state === 'pause') return;

  /* Dusk and dawn. The cast changes over at the darkest-brightest middle. */
  if (turning) {
    const before = light;
    light = Math.max(0, Math.min(1, light + turning*dt/2));
    if ((before < 0.5) !== (light < 0.5)) { when = light >= 0.5 ? 'day' : 'night'; spawnScreen(); P.obs = 0; P.obsTarget = null; }
    if (light === 0 || light === 1) turning = 0;
  }

  /* The forest: crickets and frogs by night, birds by day, and at night now
     and then a storm. */
  if (light < 0.5) {
    if (Math.random() < dt*2.2) SFX.cricket();
    if (Math.random() < dt*0.25) SFX.frog();
    nextBolt -= dt;
    if (nextBolt <= 0) { flash = 1; nextBolt = 9 + Math.random()*14; SFX.thunder(0.4 + Math.random()*1.2); }
  } else if (Math.random() < dt*0.9) SFX.bird();
  flash = Math.max(0, flash - dt*1.4);

  if (state === 'dying') {
    P.deadT -= dt;
    if (P.deadT <= 0) { lives--; if (lives <= 0) state = 'over'; else respawn(); }
    return;
  }
  clock -= dt;
  if (clock <= 0) { clock = 0; state = 'over'; P.cause = 'TIME\'S UP. THE EXPEDITION IS OVER.'; return; }

  updatePlayer(dt);
  for (const a of animals) updateAnimal(a, dt);
  for (const f of fireflies) { f.a += f.w*dt; f.blink += dt; }

  /* Contact. */
  if (state === 'play' && P.inv <= 0 && !P.swing) {
    const pb = pbox();
    for (const a of animals) {
      if (!a.box || !hit(pb, a.box)) continue;
      if (a.kill) { kill(a.kill); break; }
      if (a.knock && P.stun <= 0) { P.stun = 0.7; P.vx = (P.x < a.x ? -1 : 1)*120; P.vy = -120; P.ground = false; SFX.bite(); say('KNOCKED OVER BY A LEAPING ARMADILLO'); }
      if (a.bite && P.stun <= 0) {
        P.stun = 0.8; clock = Math.max(0, clock - 15); a.gone = 4; SFX.bite();
        say(a.bite + '  -15 SEC');
      }
    }
  }
  updateObserve(dt);
}

function newGame() {
  score = 0; lives = 3; clock = EXPEDITION; time = 0; screen = 0; documented.clear();
  when = DEMO && Q.has('day') ? 'day' : 'night'; light = when === 'day' ? 1 : 0; turning = 0;
  Object.assign(P, {x: 30, y: FLOOR, vx: 0, vy: 0, ground: true, face: 1, climb: null, swing: false, stun: 0, inv: 1, obs: 0, obsTarget: null});
  spawnScreen(); state = 'play'; nextBolt = 3; say('DOCUMENT 24 SPECIES. SELECT, THEN B, TURNS NIGHT TO DAY', 5);
}

/* ---------------- drawing ---------------- */
function drawScene() {
  const L = scr.layout, k = light;
  /* sky and the far forest, night sliding to day */
  const g = ctx.createLinearGradient(0, HUD, 0, HUD + PH);
  g.addColorStop(0, mix(C.night, '#7cc0ea', k)); g.addColorStop(0.55, mix('#0b1a24', '#4f9a5a', k)); g.addColorStop(1, mix('#0a1d14', '#2f6b3a', k));
  ctx.fillStyle = g; ctx.fillRect(0, HUD, W, PH);
  if (k < 0.4) for (let i = 0; i < 9; i++) {      // stars through gaps in the canopy
    const sx = (BYTES[(screen + i) % NSCREENS]*37 + i*53) % W, sy = HUD + 4 + (i*29 % 40);
    if ((time*2 + i) % 7 > 0.4) rect(sx, sy, 1, 1, '#9fb4d8');
  }
  if (k > 0.6) {                                   // by day, shafts of light through the canopy
    ctx.fillStyle = `rgba(255,250,200,${((k - 0.6)*0.18).toFixed(3)})`;
    for (const sx of [90, 230, 330]) { ctx.beginPath(); ctx.moveTo(sx, HUD); ctx.lineTo(sx + 16, HUD); ctx.lineTo(sx - 30, HUD + FLOOR); ctx.lineTo(sx - 52, HUD + FLOOR); ctx.fill(); }
  }
  const leaf = mix(C.dkgreen, '#2e8b3a', k), trunk = mix(C.brown, '#6b4224', k), bark = mix(C.bark, '#9a6634', k);
  for (const tx of L.trunks) {                     // trunks, floor to treetops
    rect(tx - 5, HUD + EMERGENT - 20, 10, FLOOR - EMERGENT + 20, trunk);
    rect(tx - 2, HUD + EMERGENT - 20, 2, FLOOR - EMERGENT + 20, bark);
  }
  for (const p of L.plat) {                        // foliage clumps behind each branch
    const [y, x0, x1] = p;
    ctx.fillStyle = leaf;
    for (let x = x0 - 6; x < x1 + 6; x += 14) { ctx.beginPath(); ctx.ellipse(x + 7, HUD + y - 9, 11, 9, 0, 0, 7); ctx.fill(); }
  }
  for (const p of L.plat) {                        // the branches you stand on
    const [y, x0, x1] = p;
    rect(x0, HUD + y, x1 - x0, 4, bark); rect(x0, HUD + y + 4, x1 - x0, 2, trunk);
    for (let x = x0; x < x1; x += 9) rect(x, HUD + y - 2, 4, 2, C.green);
  }
  for (const l of L.lianas) {                      // lianas
    for (let y = l[1]; y < l[2]; y += 4) rect(l[0] + Math.round(Math.sin((y + l[0])*0.3)), HUD + y, 1, 3, C.ltgreen);
  }
  /* the forest floor, and the creek */
  rect(0, HUD + FLOOR, W, PH - FLOOR, mix(C.brown, '#7a4f2a', k));
  rect(0, HUD + FLOOR, W, 3, C.green);
  for (let x = 4; x < W; x += 13) rect(x, HUD + FLOOR - 3, 2, 3, C.ltgreen);
  if (scr.floor === 1 || scr.floor === 2) {
    rect(POND.x0, HUD + FLOOR, POND.x1 - POND.x0, PH - FLOOR, mix(C.water, '#2f86c8', k));
    for (let x = POND.x0; x < POND.x1; x += 6) rect(x + Math.round(Math.sin(time*2 + x)*2), HUD + FLOOR + 6 + (x % 3)*4, 3, 1, C.blue);
  }
  if (scr.floor === 2) {                           // the vine, hung from the canopy
    const tip = vineTip(time);
    ctx.strokeStyle = C.ltgreen; ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(VINE.ax, HUD + VINE.ay); ctx.lineTo(tip.x, HUD + tip.y); ctx.stroke();
  }
  if (scr.floor === 1) for (const h of caimanHeads()) {
    const y = HUD + FLOOR + 2;
    rect(h.x - 8, y, 16, 5, '#3e5a2a');
    rect(h.x - 8, y - 1, 5, 2, '#557a38');
    if (h.open) { rect(h.x - 1, y - 5, 9, 4, '#3e5a2a'); rect(h.x, y - 4, 7, 2, C.red); }
  }
}

function drawAnimal(a) {
  if (a.state === 'away') return;
  const x = Math.round(a.x), y = HUD + Math.round(a.y + (a.ay || 0)), d = a.dir;
  switch (a.id) {
    case 'anaconda':
      for (let i = -20; i < 20; i += 2) rect(x + i, y - 5 + Math.round(Math.sin((i + a.t*30)*0.25)*1.5), 2, 4, i % 6 ? '#4f6b2a' : '#2d3d17');
      rect(x + d*20 - (d < 0 ? 4 : 0), y - 6, 4, 4, '#4f6b2a');
      break;
    case 'jaguar': {
      rect(x - 12, y - 11, 24, 8, '#c98a2c');
      for (let i = -10; i < 10; i += 5) rect(x + i, y - 9, 2, 2, '#3a250f');
      rect(x + d*12 - (d < 0 ? 6 : 0), y - 13, 6, 6, '#c98a2c');
      const step = Math.floor(a.t*10) % 2;
      rect(x - 10, y - 3, 3, 3 - step, '#c98a2c'); rect(x + 7, y - 3, 3, 2 + step, '#c98a2c');
      rect(x - d*12 - (d > 0 ? 6 : 0), y - 10, 6, 2, '#c98a2c');
      break;
    }
    case 'viper': {
      const reach = (a.strike || 0) > 0 ? 18 : 0;
      ctx.fillStyle = '#8a6a3a'; ctx.beginPath(); ctx.ellipse(x, y - 3, 7, 3, 0, 0, 7); ctx.fill();
      rect(x - 4, y - 5, 2, 1, '#3a2a14'); rect(x + 2, y - 4, 2, 1, '#3a2a14');
      rect(x + (d > 0 ? 3 : -3 - reach), y - 8, reach + 1, 2, '#8a6a3a');
      rect(x + d*(4 + reach) - 1, y - 9, 3, 3, '#8a6a3a');
      break;
    }
    case 'armadillo':
      rect(x - 7, y - 7, 14, 6, '#9a8a7a');
      for (let i = -6; i < 7; i += 3) rect(x + i, y - 7, 1, 6, '#6e6256');
      rect(x + d*7 - (d < 0 ? 3 : 0), y - 5, 3, 3, '#b8a898');
      rect(x - d*7 - (d > 0 ? 3 : 0), y - 3, 3, 1, '#9a8a7a');
      break;
    case 'bat': {
      if (a.gone > 0) break;
      const by = y + Math.round(a.dy || 0), flap = Math.floor(a.t*14) % 2;
      rect(x - 2, by - 2, 4, 4, '#3a2a2a');
      rect(x - 8, by - (flap ? 3 : 0), 6, 2, '#3a2a2a'); rect(x + 2, by - (flap ? 3 : 0), 6, 2, '#3a2a2a');
      break;
    }
    case 'owl':
      rect(x - 5, y - 14, 10, 13, '#5a3a20'); rect(x - 4, y - 8, 8, 6, '#d8c49a');
      rect(x - 4, y - 13, 3, 3, C.white); rect(x + 1, y - 13, 3, 3, C.white);
      break;
    case 'kinkajou':
      rect(x - 6, y - 7, 12, 6, '#a86a2a'); rect(x + d*6 - (d < 0 ? 4 : 0), y - 9, 4, 4, '#a86a2a');
      for (let i = 0; i < 8; i++) rect(x - d*(6 + i), y - 4 + Math.round(Math.sin(i*0.8 + a.t*3)), 1, 1, '#a86a2a');
      break;
    case 'sloth': case 'sloth3': {
      const fur = a.id === 'sloth' ? '#7a6a4a' : '#8a7a5e';
      rect(x - 7, y, 14, 7, fur); rect(x - 7, y - 3, 2, 3, '#4a3a2a'); rect(x + 5, y - 3, 2, 3, '#4a3a2a');
      rect(x + d*5 - 2, y + 2, 4, 4, a.id === 'sloth' ? '#a89a7a' : '#e0d6b8');
      if (a.id === 'sloth3') rect(x + d*5 - 1, y + 3, 2, 1, '#3a2a1a');       // the dark eye-stripe
      if (Math.floor(a.t*0.5) % 2) rect(x - 3, y + 3, 2, 1, '#4c8a3a');         // algae
      break;
    }
    case 'monkey':
      rect(x - 4, y - 10, 8, 8, '#8a7a5a'); rect(x - 3, y - 14, 6, 5, '#8a7a5a');
      rect(x - 2, y - 13, 1, 1, C.white); rect(x + 1, y - 13, 1, 1, C.white);
      for (let i = 0; i < 9; i++) rect(x - d*(4 + i), y - 4 + (i > 5 ? i - 5 : 0), 1, 1, '#8a7a5a');
      break;
    case 'potoo':
      /* a stub of broken branch -- until you look closely */
      rect(x - 2, y - 16, 5, 16, '#6a5a44'); rect(x - 1, y - 18, 3, 2, '#7a6a52');
      rect(x - 1, y - 13, 1, 1, '#2a2218'); rect(x + 1, y - 13, 1, 1, '#2a2218');
      break;
    case 'frog':
      rect(x - 4, y - 4, 8, 4, '#2a5ad8'); rect(x - 3, y - 5, 6, 1, '#2a5ad8');
      rect(x - 3, y - 4, 2, 1, '#111'); rect(x + 1, y - 3, 2, 1, '#111');
      rect(x - 2, y - 6, 1, 1, '#f6e05e'); rect(x + 1, y - 6, 1, 1, '#f6e05e');
      break;
    case 'otter':
      rect(x - 10, y - 6, 20, 5, '#5a3a24'); rect(x + d*10 - (d < 0 ? 5 : 0), y - 8, 5, 5, '#5a3a24');
      rect(x + d*10 - (d < 0 ? 3 : 2) + d, y - 5, 2, 2, '#e8dcc0');            // the pale throat patch
      rect(x - d*10 - (d > 0 ? 6 : 0), y - 4, 6, 2, '#5a3a24');
      break;
    case 'capybara':
      rect(x - 11, y - 11, 22, 9, '#8a5a34'); rect(x + d*11 - (d < 0 ? 7 : 0), y - 12, 7, 7, '#8a5a34');
      rect(x + d*14 - (d < 0 ? 2 : 0) - d*2, y - 10, 1, 1, '#111');
      rect(x - 9, y - 3, 3, 3, '#6a4426'); rect(x + 6, y - 3, 3, 3, '#6a4426');
      break;
    case 'morpho': {
      const open = Math.floor(a.t*9) % 2;
      rect(x - (open ? 5 : 2), y - 3, open ? 4 : 2, 5, '#3aa0ff'); rect(x + 1, y - 3, open ? 4 : 2, 5, '#3aa0ff');
      rect(x - 1, y - 3, 1, 6, '#222');
      break;
    }
    case 'squirrel':
      rect(x - 3, y - 8, 6, 6, '#d8b048'); rect(x - 3, y - 12, 6, 4, '#e8e0c8'); rect(x - 2, y - 10, 4, 1, '#222');
      for (let i = 0; i < 8; i++) rect(x - d*(3 + i), y - 4 + (i > 4 ? i - 4 : 0), 1, 1, '#d8b048');
      break;
    case 'hoatzin':
      rect(x - 5, y - 12, 10, 11, '#8a5a34'); rect(x - 4, y - 8, 8, 5, '#d8a060');
      rect(x - 2, y - 16, 4, 4, '#2a6ad8'); rect(x - 1, y - 19, 2, 3, '#d86a2a');   // blue face, spiky crest
      rect(x + d*2, y - 15, 1, 1, C.red);
      break;
    case 'iguana':
      rect(x - 9, y - 5, 18, 4, '#5aa83a'); rect(x + d*9 - (d < 0 ? 4 : 0), y - 7, 4, 4, '#5aa83a');
      for (let i = -7; i < 8; i += 3) rect(x + i, y - 6, 1, 1, '#3a7a2a');
      for (let i = 0; i < 10; i++) rect(x - d*(9 + i), y - 3, 1, 1, i % 3 ? '#5aa83a' : '#2a4a1a');
      break;
    case 'toucan':
      rect(x - 4, y - 13, 8, 12, '#111'); rect(x - 3, y - 11, 5, 4, C.white);
      rect(x + d*4 - (d < 0 ? 8 : 0), y - 12, 8, 3, '#f08a24'); rect(x + d*4 - (d < 0 ? 8 : 0), y - 10, 8, 1, C.yellow);
      break;
    case 'howler': {
      rect(x - 6, y - 11, 12, 9, '#a8402a'); rect(x - 4, y - 15, 8, 5, '#a8402a');
      if (a.howling > 0) rect(x - 1, y - 12, 3, 2, '#2a0a0a');                  // mouth open, howling
      for (let i = 0; i < 10; i++) rect(x - d*(6 + i), y - 5 + (i > 6 ? i - 6 : 0), 1, 1, '#a8402a');
      break;
    }
    case 'macaw':
      rect(x - 3, y - 14, 6, 12, C.red); rect(x - 3, y - 7, 6, 2, C.yellow); rect(x - 3, y - 5, 6, 3, '#2a6ad8');
      rect(x - 2, y - 13, 1, 1, C.white); rect(x + d*3 - (d < 0 ? 2 : 0), y - 13, 2, 2, '#ddd');
      for (let i = 0; i < 7; i++) rect(x - 1, y - 2 + i, 2, 1, i % 2 ? C.red : '#2a6ad8');
      break;
    case 'harpy':
      rect(x - 6, y - 15, 12, 14, '#6a6a6a'); rect(x - 5, y - 9, 10, 7, C.white);
      rect(x - 3, y - 18, 6, 4, '#9a9a9a'); rect(x - 4, y - 19, 2, 2, '#3a3a3a'); rect(x + 2, y - 19, 2, 2, '#3a3a3a');
      rect(x - 3, y - 1, 2, 1, C.yellow); rect(x + 1, y - 1, 2, 1, C.yellow);
      break;
    case 'firefly': break;               // the swarm is drawn as light
    case 'caiman': break;                // drawn with the creek
  }
}

/* Eyes that catch the lantern: shown even in the dark, which is the point. */
function drawEyeshine(a) {
  if (a.state === 'away') return;
  const x = Math.round(a.x), y = HUD + Math.round(a.y + (a.ay || 0)), d = a.dir;
  const eye = (ex, ey, c) => { rect(ex, ey, 2, 1, c); };
  switch (a.id) {
    case 'jaguar': eye(x + d*14 - 1, y - 12, '#7dff6a'); break;
    case 'owl': eye(x - 3, y - 12, C.orange); eye(x + 2, y - 12, C.orange); break;
    case 'kinkajou': eye(x + d*7 - 1, y - 8, C.yellow); break;
    case 'monkey': eye(x - 2, y - 12, C.orange); eye(x + 1, y - 12, C.orange); break;
    case 'armadillo': eye(x + d*8 - 1, y - 4, '#ff9a6a'); break;
    case 'potoo': eye(x - 1, y - 13, '#ffd27a'); break;   // the one thing that gives a potoo away at night
  }
}
function drawCaimanEyes() {
  if (scr.floor !== 1) return;
  for (const h of caimanHeads()) { rect(h.x - 7, HUD + FLOOR + 1, 2, 1, '#ff3020'); rect(h.x - 3, HUD + FLOOR + 1, 2, 1, '#ff3020'); }
}

function drawPlayer() {
  if (state === 'dying' && Math.floor(P.deadT*10) % 2) return;
  if (P.inv > 0 && Math.floor(P.inv*12) % 2) return;
  const x = Math.round(P.x), y = HUD + Math.round(P.y), f = P.face;
  const leg = P.ground && Math.abs(P.vx) > 20 ? Math.floor(P.run) % 2 : (P.ground ? 0 : 1);
  rect(x - 3, y - 6, 2, 6 - leg*2, C.brown); rect(x + 1, y - 6 + leg*2, 2, 6 - leg*2, C.brown);  // legs
  rect(x - 4, y - 13, 8, 7, C.khaki);                                                            // shirt
  rect(x - 3, y - 17, 6, 4, C.pink);                                                             // face
  rect(x - 5, y - 19, 10, 2, C.tan); rect(x - 3, y - 21, 6, 2, C.tan);                           // hat
  rect(x + f*2 - (f < 0 ? 1 : 0), y - 16, 1, 1, '#000');                                         // eye
  if (isDay()) {
    /* by day the lantern hangs at the belt; B brings up the binoculars */
    rect(x - f*5 - 1, y - 10, 2, 3, '#7a7050');
    if (held.b) { rect(x + f*3 - (f < 0 ? 3 : 0), y - 17, 4, 2, '#222'); rect(x + f*3 - (f < 0 ? 3 : 0), y - 15, 4, 1, '#222'); }
  } else {
    /* the lantern, raised when you hold B */
    const ly = held.b ? y - 19 : y - 11;
    rect(x + f*5 - 1, ly, 3, 4, C.yellow); rect(x + f*5 - 1, ly - 1, 3, 1, C.gray);
  }
}

function drawDarkness() {
  const night = 1 - light;
  if (night <= 0.001) return;
  const lp = lanternPos(), r = lightR();
  dctx.globalCompositeOperation = 'source-over';
  dctx.clearRect(0, 0, W, PH);
  dctx.fillStyle = `rgba(0,0,6,${(0.96*night*(1 - Math.min(1, flash*1.6))).toFixed(3)})`;
  dctx.fillRect(0, 0, W, PH);
  dctx.globalCompositeOperation = 'destination-out';
  const hole = (x, y, rad, k = 1) => {
    const g = dctx.createRadialGradient(x, y, 0, x, y, rad);
    g.addColorStop(0, `rgba(0,0,0,${k})`); g.addColorStop(0.55, `rgba(0,0,0,${k*0.9})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = g; dctx.beginPath(); dctx.arc(x, y, rad, 0, 7); dctx.fill();
  };
  if (state !== 'dying' || P.deadT > 0.8) hole(lp.x, lp.y, r);
  for (const f of fireflies) {
    const on = (f.blink % 2.2) < 0.9;
    if (on) hole(f.cx + Math.cos(f.a)*f.r, f.cy + Math.sin(f.a*1.3)*f.r*0.6, 13, 0.75);
  }
  dctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(dark, 0, HUD);
  /* a warm tint inside the lantern's reach */
  const g = ctx.createRadialGradient(lp.x, HUD + lp.y, 0, lp.x, HUD + lp.y, r);
  g.addColorStop(0, `rgba(255,200,90,${(0.16*night).toFixed(3)})`); g.addColorStop(1, 'rgba(255,200,90,0)');
  ctx.fillStyle = g; ctx.fillRect(0, HUD, W, PH);
  if (flash > 0.5) { ctx.fillStyle = `rgba(200,210,255,${((flash - 0.5)*0.5).toFixed(3)})`; ctx.fillRect(0, HUD, W, PH); }
}
function drawFireflies() {
  for (const f of fireflies) {
    if ((f.blink % 2.2) >= 0.9) continue;
    rect(f.cx + Math.cos(f.a)*f.r, HUD + f.cy + Math.sin(f.a*1.3)*f.r*0.6, 2, 2, '#e8ff7a');
  }
}

function drawObserve() {
  if (!P.obsTarget || P.obs <= 0) return;
  const c = animalCenter(P.obsTarget), k = Math.min(1, P.obs/2);
  ctx.strokeStyle = C.yellow; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(c.x, HUD + c.y, 13, -Math.PI/2, -Math.PI/2 + k*Math.PI*2); ctx.stroke();
  text('OBSERVING...', W/2, HUD + 4, C.yellow, 'center');
}

function drawHud() {
  rect(0, 0, W, HUD, '#000');
  const mm = Math.floor(clock/60), ss = Math.floor(clock % 60);
  text('SCORE ' + String(score).padStart(6, '0'), 4, 6, C.white);
  text('SPECIES ' + documented.size + '/' + SPECIES.length, 112, 6, C.ltgreen);
  /* the moon or the sun, beside the clock */
  if (light >= 0.5) { ctx.fillStyle = C.yellow; ctx.beginPath(); ctx.arc(232, 10, 4, 0, 7); ctx.fill(); }
  else { ctx.fillStyle = '#dfe6ff'; ctx.beginPath(); ctx.arc(232, 10, 4, 0, 7); ctx.fill(); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(234, 9, 3.5, 0, 7); ctx.fill(); }
  text(String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0'), 242, 6, clock < 120 ? C.red : C.yellow);
  for (let i = 0; i < lives; i++) rect(W - 12 - i*10, 7, 6, 7, C.tan);
  rect(0, HUD + PH, W, FOOT, '#000');
  const tier = TIER_NAME[P.y >= FLOOR - 1 ? FLOOR : (P.y >= UNDER - 1 ? UNDER : (P.y >= CANOPY - 1 ? CANOPY : EMERGENT))] || '';
  text(footT > 0 ? footMsg : `LANTERN RUN ${VERSION}  ${when === 'day' ? 'DAY' : 'NIGHT'}  SCREEN ${String(screen + 1).padStart(2, '0')}  ${tier}`, 4, HUD + PH + 2, C.gray);
  /* Browsers start sound only after a key press or click, and a gamepad
     button may not count -- so say so rather than be silently quiet. */
  if (soundOn && !live()) text('PRESS ANY KEY FOR SOUND', W - 4, HUD + PH + 2, C.yellow, 'right');
  else text(soundOn ? 'SND' : 'MUTE', W - 4, HUD + PH + 2, C.gray, 'right');
  if (toastT > 0) text(toast, W/2, HUD + 16, light > 0.6 ? '#fffbe0' : C.white, 'center');
}

function panel(title) {
  ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(16, HUD + 6, W - 32, PH - 12);
  ctx.strokeStyle = C.tan; ctx.lineWidth = 1; ctx.strokeRect(16.5, HUD + 6.5, W - 33, PH - 13);
  text(title, W/2, HUD + 12, C.yellow, 'center', 10);
}
function wrap(s, n) {
  const out = []; let line = '';
  for (const w of s.split(' ')) { if ((line + ' ' + w).trim().length > n) { out.push(line); line = w; } else line = (line + ' ' + w).trim(); }
  if (line) out.push(line); return out;
}
function drawJournal() {
  const list = OF(journalPage), got = list.filter(s => documented.has(s.id)).length;
  panel('FIELD JOURNAL: ' + (journalPage === 'night' ? 'BY NIGHT' : 'BY DAY') + '  ' + got + '/12');
  list.forEach((s, i) => {
    const have = documented.has(s.id), y = HUD + 28 + i*12, sel = i === journalSel;
    if (sel) rect(26, y - 2, W - 52, 11, '#2a2a10');
    text(have ? s.name : '? ? ?', 32, y, have ? C.ltgreen : C.gray);
    text(TIER_NAME[s.tier], W - 32, y, have ? C.tan : '#555', 'right');
  });
  const s = list[journalSel], fy = HUD + 28 + 12*12 + 4;
  const lines = documented.has(s.id) ? wrap(s.fact, 52)
    : ['NOT YET DOCUMENTED. OUT BY ' + (s.when === 'night' ? 'NIGHT' : 'DAY') + ', IN THE ' + TIER_NAME[s.tier] + '.'];
  lines.forEach((l, i) => text(l, W/2, fy + i*10, C.white, 'center'));
  text('UP/DOWN BROWSE  LEFT/RIGHT ' + (journalPage === 'night' ? 'DAY' : 'NIGHT') + ' PAGE  A SOUND', W/2, HUD + PH - 32, C.gray, 'center');
  text(turning ? 'THE LIGHT IS TURNING...' : 'B: TURN ' + (when === 'night' ? 'NIGHT TO DAY' : 'DAY TO NIGHT') + '   SELECT: BACK', W/2, HUD + PH - 20, C.yellow, 'center');
}
function drawTitle() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  text('LANTERN RUN', W/2, 30, C.yellow, 'center', 22);
  text('AN EXPEDITION IN THE AMAZON', W/2, 60, C.tan, 'center', 10);
  const rows = [
    'You are a zoologist. Twelve species come out by night,',
    'twelve by day, across the four layers of the forest.',
    'Hold B near one and stand still: documented.',
    'By night you see by lantern. By day you see everything,',
    'and so can they: creep (hold B) or they bolt.',
    '',
    'D-PAD  run, climb lianas     A  jump (hold = higher)',
    'DOWN+A  drop through a branch   B  lantern/binoculars, creep',
    'SELECT  field journal: B there turns night to day',
  ];
  rows.forEach((r, i) => text(r, W/2, 84 + i*12, C.white, 'center'));
  if (Math.floor(nightT*2) % 2) text('PRESS START', W/2, 210, C.ltgreen, 'center', 12);
  if (!live()) text('PRESS ANY KEY FOR SOUND', W/2, 236, C.yellow, 'center');
  text(VERSION, W - 4, H - 12, C.gray, 'right');
}

function draw() {
  if (state === 'title') { drawTitle(); return; }
  drawScene();
  for (const a of animals) drawAnimal(a);
  drawPlayer();
  drawDarkness();
  if (light < 0.5) {
    drawFireflies();
    drawCaimanEyes();
    for (const a of animals) drawEyeshine(a);
  }
  drawObserve();
  drawHud();
  if (state === 'journal') drawJournal();
  if (state === 'pause') { panel('PAUSED'); text('START TO GO ON   SELECT FOR THE JOURNAL', W/2, HUD + 110, C.white, 'center'); }
  if (state === 'dying') text(P.cause, W/2, HUD + 100, C.red, 'center', 10);
  if (state === 'over') {
    panel('EXPEDITION OVER');
    text(P.cause, W/2, HUD + 60, C.white, 'center');
    text('SPECIES DOCUMENTED: ' + documented.size + ' OF ' + SPECIES.length, W/2, HUD + 90, C.ltgreen, 'center');
    text('SCORE ' + score, W/2, HUD + 110, C.yellow, 'center', 10);
    text('PRESS START', W/2, HUD + 160, C.white, 'center');
  }
  if (state === 'won') {
    panel('EXPEDITION COMPLETE');
    text('ALL 24 SPECIES DOCUMENTED, BY NIGHT AND BY DAY.', W/2, HUD + 60, C.ltgreen, 'center');
    text('TIME BONUS ' + Math.floor(clock)*5, W/2, HUD + 90, C.white, 'center');
    text('SCORE ' + score, W/2, HUD + 110, C.yellow, 'center', 10);
    text('PRESS START', W/2, HUD + 160, C.white, 'center');
  }
}

/* ---------------- loop ---------------- */
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last)/1000); last = now;
  while (acc >= STEP) { pollInput(); update(STEP); acc -= STEP; for (const b of BTN) pressed[b] = false; }
  draw();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });
spawnScreen();
if (DEMO) {
  newGame();
  /* ?demo&warp=N runs N simulation steps up front -- headless browsers barely
     tick requestAnimationFrame, and this lets a screenshot show real play. */
  const warp = Math.min(60*600, parseInt(Q.get('warp')) || 0);
  /* &turn=N: dusk or dawn falls at step N, to test the change-over. */
  const turnAt = Q.has('turn') ? parseInt(Q.get('turn')) || 0 : -1;
  for (let i = 0; i < warp; i++) { if (i === turnAt) turnTime(); pollInput(); update(STEP); for (const b of BTN) pressed[b] = false; }
}
requestAnimationFrame(frame);
</script>
