      } } else {
        a.hop.t += dt/0.8; const k = Math.min(1, a.hop.t);
        a.x = a.hop.x0 + (a.hop.x1 - a.hop.x0)*k; a.y = a.hop.y0 + (a.hop.y1 - a.hop.y0)*k - Math.sin(k*Math.PI)*30;
        a.dir = a.hop.x1 > a.hop.x0 ? 1 : -1;
        if (k >= 1) { a.hop = null; a.wait = 2 + Math.random()*2; }
      }
      break;
    }
  }
}

/* What the lantern lets you see, and what counts as "in view" to observe. */
function lightR() { return (DEMO ? 140 : (held.b ? 92 : 58)) + Math.sin(time*23)*1.5 + Math.sin(time*7)*1; }
function lanternPos() { return {x: P.x + P.face*5, y: P.y - 11}; }
function animalCenter(a) {
  if (a.id === 'firefly') return {x: a.x, y: a.y};
  if (a.id === 'bat') return {x: a.x, y: a.y + (a.dy || 0)};
  if (a.id === 'sloth') return {x: a.x, y: a.y + 6};
  return {x: a.x, y: a.y - 6 + (a.ay || 0)};
}

/* ---------------- player ---------------- */
function kill(cause) {
  if (P.inv > 0 || DEMO || state !== 'play') return;
  P.deadT = 1.6; P.cause = cause; P.swing = false; P.climb = null;
  if (cause.includes('CREEK')) SFX.splash(); else SFX.die();
  state = 'dying';
}
function respawn() {
  P.x = 24; P.y = 0; P.vx = 0; P.vy = 0; P.ground = false; P.inv = 2; P.stun = 0; P.obs = 0;
  state = 'play';
}

function updatePlayer(dt) {
  P.inv = Math.max(0, P.inv - dt); P.stun = Math.max(0, P.stun - dt);
  P.swingCd = Math.max(0, P.swingCd - dt); P.drop = Math.max(0, P.drop - dt);
  const sneaking = held.b;

  /* On the vine: you go where it goes until you let go. */
  if (P.swing) {
    const tip = vineTip(time);
    P.x = tip.x; P.y = tip.y + 16;
    if (pressed.a || pressed.down) {
      const a = vineAngle(time), w = VINE.amp*2*Math.PI/VINE.period*Math.cos(2*Math.PI*time/VINE.period);
      P.vx = VINE.len*w*Math.cos(a); P.vy = -VINE.len*w*Math.sin(a) - 80;
      P.swing = false; P.swingCd = 0.4; SFX.jump();
    }
    return;
  }
  /* On a liana: climb, or jump off sideways. */
  if (P.climb) {
    const l = P.climb;
    if (held.up) P.y -= 70*dt; if (held.down) P.y += 70*dt;
    if (P.y < l[1]) { P.y = l[1]; P.climb = null; P.ground = true; P.vy = 0; return; }
    if (P.y > l[2]) { P.y = l[2]; P.climb = null; P.ground = l[2] === FLOOR; return; }
    if (pressed.a && (held.left || held.right)) {
      P.climb = null; P.vx = held.left ? -95 : 95; P.vy = -200; P.face = held.left ? -1 : 1; SFX.jump();
    }
    return;
  }

  const dirx = (held.right ? 1 : 0) - (held.left ? 1 : 0);
  const target = P.stun > 0 ? 0 : dirx * (sneaking ? 34 : 98);
  const accel = P.ground ? 900 : 420;
  if (P.vx < target) P.vx = Math.min(target, P.vx + accel*dt); else P.vx = Math.max(target, P.vx - accel*dt);
  if (dirx && P.stun <= 0) P.face = dirx;

  /* Grab a liana: press up beside one, or down standing at its top. */
  if ((held.up || (held.down && !held.a && P.ground)) && P.stun <= 0) {
    for (const l of scr.layout.lianas) {
      const up = held.up && P.y >= l[1] - 1 && P.y <= l[2] + 1;
      const down = held.down && Math.abs(P.y - l[1]) < 1;
      if (Math.abs(P.x - l[0]) < 6 && (up || down)) {
        P.climb = l; P.x = l[0]; P.vx = 0; P.vy = 0; P.ground = false; if (down) P.y += 1; return;
      }
    }
  }
  /* Jump: hold A to go higher. Down + A drops through a branch. */
  if (pressed.a && P.ground && P.stun <= 0) {
    if (held.down && P.y < FLOOR - 1) { P.drop = 0.25; P.ground = false; P.y += 1; }
    else { P.vy = -262; P.ground = false; SFX.jump(); }
  }
  const g = (P.vy < 0 && held.a) ? 610 : 1500;
  P.vy = Math.min(480, P.vy + g*dt);
  P.x += P.vx*dt;

  /* Off the edge of the screen: the next one flips in. */
  if (P.x < 0 || P.x >= W) {
    screen = (screen + (P.x < 0 ? -1 : 1) + NSCREENS) % NSCREENS;
    P.x = P.x < 0 ? P.x + W : P.x - W;
    spawnScreen(); P.obs = 0; P.obsTarget = null;
  }

  const prevY = P.y, wasGround = P.ground;
  P.y += P.vy*dt; P.ground = false;
  if (P.vy >= 0) {
    /* Branches are one-way: land from above, never bump from below. */
    if (P.drop <= 0) for (const p of scr.layout.plat) {
      if (prevY <= p[0] + 0.5 && P.y >= p[0] && P.x > p[1] - 3 && P.x < p[2] + 3) { P.y = p[0]; P.ground = true; break; }
    }
    if (!P.ground && scr.floor === 1) for (const h of caimanHeads()) {
      if (prevY <= FLOOR + 2.5 && P.y >= FLOOR + 2 && Math.abs(P.x - h.x) < 9) {
        if (h.open) kill('EATEN BY A CAIMAN'); else { P.y = FLOOR + 2; P.ground = true; }
        break;
      }
    }
    if (!P.ground && P.y >= FLOOR && !overCreek(P.x)) { P.y = FLOOR; P.ground = true; }
  }
  if (P.ground && !wasGround && P.vy > 120) SFX.land();
  if (P.ground) P.vy = 0;
  /* Standing on a caiman when its jaws open. */
  if (P.ground && scr.floor === 1 && P.y > FLOOR + 1) {
    for (const h of caimanHeads()) if (Math.abs(P.x - h.x) < 9 && h.open) kill('EATEN BY A CAIMAN');
  }
  if (P.y > FLOOR + 14) {
    if (DEMO) { P.y = FLOOR; P.vy = 0; P.ground = true; P.x = POND.x1 + 2; }
    else kill(scr.floor === 1 ? 'EATEN BY A CAIMAN' : 'SWEPT AWAY IN THE CREEK');
  }

  /* Catch the swinging vine in mid-air. */
  if (scr.floor === 2 && !P.ground && P.swingCd <= 0) {
    const tip = vineTip(time);
    if (Math.abs(P.x - tip.x) < 9 && Math.abs((P.y - 16) - tip.y) < 10) { P.swing = true; P.vx = 0; P.vy = 0; SFX.grab(); }
  }

  if (P.ground && Math.abs(P.vx) > 20) { P.run += dt*Math.abs(P.vx)/12; }
}

/* Stand still, lantern raised, with an undocumented species in the light. */
function updateObserve(dt) {
  const lp = lanternPos(), r = lightR();
  let best = null, bd = 1e9;
  if (held.b && P.ground && Math.abs(P.vx) < 6 && P.stun <= 0) {
    for (const a of animals) {
      if (documented.has(a.id) || a.shy || a.gone > 0) continue;
      const c = animalCenter(a), d = Math.hypot(c.x - lp.x, c.y - lp.y);
      if (d < Math.min(r, 96) && d < bd) { best = a; bd = d; }
    }
  }
  if (best && best === P.obsTarget) {
    P.obs += dt;
    if (Math.floor(P.obs*4) !== Math.floor((P.obs - dt)*4)) SFX.tick();
    if (P.obs >= 2) {
      documented.add(best.id);
      const sp = SPEC[best.id];
      score += 500 * (1 + TIER_RANK[sp.tier]);
      say('DOCUMENTED: ' + sp.name, 3.5); SFX.doc();
      P.obs = 0; P.obsTarget = null;
      if (documented.size === SPECIES.length) { score += Math.floor(clock)*5; state = 'won'; }
    }
  } else {
    P.obsTarget = best; P.obs = 0;
  }
}

function update(dt) {
  time += dt; nightT += dt;
  if (toastT > 0) toastT -= dt; if (footT > 0) footT -= dt;
  if (pressed.select && (state === 'play' || state === 'journal')) { state = state === 'journal' ? 'play' : 'journal'; return; }
  if (state === 'journal') {
    if (pressed.up) journalSel = (journalSel + SPECIES.length - 1) % SPECIES.length;
    if (pressed.down) journalSel = (journalSel + 1) % SPECIES.length;
    if (pressed.a) { setSound(!soundOn); footNote(soundOn ? 'SOUND ON' : 'SOUND OFF'); }
    if (pressed.start) state = 'play';
    return;
  }
  if (state === 'title' || state === 'over' || state === 'won') {
    if (pressed.start) newGame();
    return;
  }
  if (pressed.start) { state = state === 'pause' ? 'play' : (state === 'play' ? 'pause' : state); return; }
  if (state === 'pause') return;

  /* The night: crickets, frogs, and now and then a storm. */
  if (Math.random() < dt*2.2) SFX.cricket();
  if (Math.random() < dt*0.25) SFX.frog();
  flash = Math.max(0, flash - dt*1.4);
  nextBolt -= dt;
  if (nextBolt <= 0) { flash = 1; nextBolt = 9 + Math.random()*14; SFX.thunder(0.4 + Math.random()*1.2); }

  if (state === 'dying') {
    P.deadT -= dt;
    if (P.deadT <= 0) { lives--; if (lives <= 0) state = 'over'; else respawn(); }
    return;
  }
  clock -= dt;
  if (clock <= 0) { clock = 0; state = 'over'; P.cause = 'DAWN. THE NIGHT IS OVER.'; return; }

  updatePlayer(dt);
  for (const a of animals) updateAnimal(a, dt);
  for (const f of fireflies) { f.a += f.w*dt; f.blink += dt; }

  /* Contact. */
  if (state === 'play' && P.inv <= 0 && !P.swing) {
    const pb = pbox();
    for (const a of animals) {
      if (!a.box || !hit(pb, a.box)) continue;
      if (a.kill) { kill(a.kill); break; }
      if (a.knock && P.stun <= 0) { P.stun = 0.7; P.vx = (P.x < a.x ? -1 : 1)*120; P.vy = -120; P.ground = false; SFX.bite(); say('KNOCKED OVER BY A LEAPING ARMADILLO'); }
      if (a.bite && P.stun <= 0) {
        P.stun = 0.8; clock = Math.max(0, clock - 15); a.gone = 4; SFX.bite();
        say('BITTEN BY A VAMPIRE BAT  -15 SEC');
      }
    }
  }
  updateObserve(dt);
}

function newGame() {
  score = 0; lives = 3; clock = 1200; time = 0; screen = 0; documented.clear();
  Object.assign(P, {x: 30, y: FLOOR, vx: 0, vy: 0, ground: true, face: 1, climb: null, swing: false, stun: 0, inv: 1, obs: 0, obsTarget: null});
  spawnScreen(); state = 'play'; nextBolt = 3; say('FIND AND DOCUMENT 12 SPECIES BEFORE DAWN', 4);
}

/* ---------------- drawing ---------------- */
function drawScene() {
  const L = scr.layout;
  /* sky and the far forest */
  const g = ctx.createLinearGradient(0, HUD, 0, HUD + PH);
  g.addColorStop(0, C.night); g.addColorStop(1, '#0a1d14');
  ctx.fillStyle = g; ctx.fillRect(0, HUD, W, PH);
  for (let i = 0; i < 9; i++) {           // stars through gaps in the canopy
    const sx = (BYTES[(screen + i) % NSCREENS]*37 + i*53) % W, sy = HUD + 4 + (i*29 % 40);
    if ((time*2 + i) % 7 > 0.4) rect(sx, sy, 1, 1, '#9fb4d8');
  }
  for (const tx of L.trunks) {            // trunks, floor to treetops
    rect(tx - 5, HUD + EMERGENT - 20, 10, FLOOR - EMERGENT + 20, C.brown);
    rect(tx - 2, HUD + EMERGENT - 20, 2, FLOOR - EMERGENT + 20, C.bark);
  }
  /* foliage clumps behind each branch */
  for (const p of L.plat) {
    const [y, x0, x1] = p;
    ctx.fillStyle = C.dkgreen;
    for (let x = x0 - 6; x < x1 + 6; x += 14) {
      ctx.beginPath(); ctx.ellipse(x + 7, HUD + y - 9, 11, 9, 0, 0, 7); ctx.fill();
    }
  }
  for (const p of L.plat) {               // the branches you stand on
    const [y, x0, x1] = p;
    rect(x0, HUD + y, x1 - x0, 4, C.bark); rect(x0, HUD + y + 4, x1 - x0, 2, C.brown);
    for (let x = x0; x < x1; x += 9) rect(x, HUD + y - 2, 4, 2, C.green);
  }
  for (const l of L.lianas) {             // lianas
    for (let y = l[1]; y < l[2]; y += 4) rect(l[0] + Math.round(Math.sin((y + l[0])*0.3)), HUD + y, 1, 3, C.ltgreen);
  }
  /* the forest floor, and the creek */
  rect(0, HUD + FLOOR, W, PH - FLOOR, C.brown);
  rect(0, HUD + FLOOR, W, 3, C.green);
  for (let x = 4; x < W; x += 13) rect(x, HUD + FLOOR - 3, 2, 3, C.ltgreen);
  if (scr.floor === 1 || scr.floor === 2) {
    rect(POND.x0, HUD + FLOOR, POND.x1 - POND.x0, PH - FLOOR, C.water);
    for (let x = POND.x0; x < POND.x1; x += 6) rect(x + Math.round(Math.sin(time*2 + x)*2), HUD + FLOOR + 6 + (x % 3)*4, 3, 1, C.blue);
  }
  if (scr.floor === 2) {                  // the vine, hung from the canopy
    const tip = vineTip(time);
    ctx.strokeStyle = C.ltgreen; ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(VINE.ax, HUD + VINE.ay); ctx.lineTo(tip.x, HUD + tip.y); ctx.stroke();
  }
  if (scr.floor === 1) for (const h of caimanHeads()) {
    const y = HUD + FLOOR + 2;
    rect(h.x - 8, y, 16, 5, '#3e5a2a');
    rect(h.x - 8, y - 1, 5, 2, '#557a38');
    if (h.open) { rect(h.x - 1, y - 5, 9, 4, '#3e5a2a'); rect(h.x, y - 4, 7, 2, C.red); }
  }
}

function drawAnimal(a) {
  const x = Math.round(a.x), y = HUD + Math.round(a.y + (a.ay || 0)), d = a.dir;
  switch (a.id) {
    case 'anaconda':
      for (let i = -20; i < 20; i += 2) rect(x + i, y - 5 + Math.round(Math.sin((i + a.t*30)*0.25)*1.5), 2, 4, i % 6 ? '#4f6b2a' : '#2d3d17');
      rect(x + d*20 - (d < 0 ? 4 : 0), y - 6, 4, 4, '#4f6b2a');
      break;
    case 'jaguar':
      rect(x - 12, y - 11, 24, 8, '#c98a2c');
      for (let i = -10; i < 10; i += 5) rect(x + i, y - 9, 2, 2, '#3a250f');
      rect(x + d*12 - (d < 0 ? 6 : 0), y - 13, 6, 6, '#c98a2c');
      const step = Math.floor(a.t*10) % 2;
      rect(x - 10, y - 3, 3, 3 - step, '#c98a2c'); rect(x + 7, y - 3, 3, 2 + step, '#c98a2c');
      rect(x - d*12 - (d > 0 ? 6 : 0), y - 10, 6, 2, '#c98a2c');
      break;
    case 'viper': {
      const reach = (a.strike || 0) > 0 ? 18 : 0;
      ctx.fillStyle = '#8a6a3a'; ctx.beginPath(); ctx.ellipse(x, y - 3, 7, 3, 0, 0, 7); ctx.fill();
      rect(x - 4, y - 5, 2, 1, '#3a2a14'); rect(x + 2, y - 4, 2, 1, '#3a2a14');
      rect(x + (d > 0 ? 3 : -3 - reach), y - 8, reach + 1, 2, '#8a6a3a');
      rect(x + d*(4 + reach) - 1, y - 9, 3, 3, '#8a6a3a');
      break;
    }
    case 'armadillo':
      rect(x - 7, y - 7, 14, 6, '#9a8a7a');
      for (let i = -6; i < 7; i += 3) rect(x + i, y - 7, 1, 6, '#6e6256');
      rect(x + d*7 - (d < 0 ? 3 : 0), y - 5, 3, 3, '#b8a898');
      rect(x - d*7 - (d > 0 ? 3 : 0), y - 3, 3, 1, '#9a8a7a');
      break;
    case 'bat': {
      if (a.gone > 0) break;
      const by = y + Math.round(a.dy || 0), flap = Math.floor(a.t*14) % 2;
      rect(x - 2, by - 2, 4, 4, '#3a2a2a');
      rect(x - 8, by - (flap ? 3 : 0), 6, 2, '#3a2a2a'); rect(x + 2, by - (flap ? 3 : 0), 6, 2, '#3a2a2a');
      break;
    }
    case 'owl':
      if (a.state === 'away') break;
      rect(x - 5, y - 14, 10, 13, '#5a3a20'); rect(x - 4, y - 8, 8, 6, '#d8c49a');
      rect(x - 4, y - 13, 3, 3, C.white); rect(x + 1, y - 13, 3, 3, C.white);
      break;
    case 'kinkajou':
      rect(x - 6, y - 7, 12, 6, '#a86a2a'); rect(x + d*6 - (d < 0 ? 4 : 0), y - 9, 4, 4, '#a86a2a');
      for (let i = 0; i < 8; i++) rect(x - d*(6 + i) , y - 4 + Math.round(Math.sin(i*0.8 + a.t*3)), 1, 1, '#a86a2a');
      break;
    case 'sloth':
      rect(x - 7, y, 14, 7, '#7a6a4a'); rect(x - 7, y - 3, 2, 3, '#4a3a2a'); rect(x + 5, y - 3, 2, 3, '#4a3a2a');
      rect(x + d*5 - 2, y + 2, 4, 4, '#a89a7a');
      if (Math.floor(a.t*0.5) % 2) rect(x - 3, y + 3, 2, 1, '#4c8a3a');   // algae
      break;
    case 'monkey':
      rect(x - 4, y - 10, 8, 8, '#8a7a5a'); rect(x - 3, y - 14, 6, 5, '#8a7a5a');
      rect(x - 2, y - 13, 1, 1, C.white); rect(x + 1, y - 13, 1, 1, C.white);
      for (let i = 0; i < 9; i++) rect(x - d*(4 + i), y - 4 + (i > 5 ? i - 5 : 0), 1, 1, '#8a7a5a');
      break;
    case 'harpy':
      rect(x - 6, y - 15, 12, 14, '#6a6a6a'); rect(x - 5, y - 9, 10, 7, C.white);
      rect(x - 3, y - 18, 6, 4, '#9a9a9a'); rect(x - 4, y - 19, 2, 2, '#3a3a3a'); rect(x + 2, y - 19, 2, 2, '#3a3a3a');
      rect(x - 3, y - 1, 2, 1, C.yellow); rect(x + 1, y - 1, 2, 1, C.yellow);
      break;
    case 'firefly': break;               // the swarm is drawn as light
    case 'caiman': break;                // drawn with the creek
  }
}

function drawDarkness() {

  if (flash > 0.5) { ctx.fillStyle = `rgba(200,210,255,${((flash - 0.5)*0.5).toFixed(3)})`; ctx.fillRect(0, HUD, W, PH); }
}
function drawFireflies() {
  for (const f of fireflies) {
    if ((f.blink % 2.2) >= 0.9) continue;
    rect(f.cx + Math.cos(f.a)*f.r, HUD + f.cy + Math.sin(f.a*1.3)*f.r*0.6, 2, 2, '#e8ff7a');
  }
}

function drawObserve() {
  if (!P.obsTarget || P.obs <= 0) return;
  const c = animalCenter(P.obsTarget), k = Math.min(1, P.obs/2);
  ctx.strokeStyle = C.yellow; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(c.x, HUD + c.y, 13, -Math.PI/2, -Math.PI/2 + k*Math.PI*2); ctx.stroke();
  text('OBSERVING...', W/2, HUD + 4, C.yellow, 'center');
}

function drawHud() {
  rect(0, 0, W, HUD, '#000');
  const mm = Math.floor(clock/60), ss = Math.floor(clock % 60);
  text('SCORE ' + String(score).padStart(6, '0'), 4, 6, C.white);
  text('SPECIES ' + documented.size + '/' + SPECIES.length, 118, 6, C.ltgreen);
  text(String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0'), 238, 6, clock < 120 ? C.red : C.yellow);
  for (let i = 0; i < lives; i++) rect(W - 12 - i*10, 7, 6, 7, C.tan);
  rect(0, HUD + PH, W, FOOT, '#000');
  const tier = TIER_NAME[P.y >= FLOOR - 1 ? FLOOR : (P.y >= UNDER - 1 ? UNDER : (P.y >= CANOPY - 1 ? CANOPY : EMERGENT))] || '';
  text(footT > 0 ? footMsg : `LANTERN RUN ${VERSION}   SCREEN ${String(screen + 1).padStart(2, '0')}   ${tier}`, 4, HUD + PH + 2, C.gray);
  /* Browsers start sound only after a key press or click, and a gamepad
     button may not count -- so say so rather than be silently quiet. */
  if (soundOn && !live()) text('PRESS ANY KEY FOR SOUND', W - 4, HUD + PH + 2, C.yellow, 'right');
  else text(soundOn ? 'SND' : 'MUTE', W - 4, HUD + PH + 2, C.gray, 'right');
  if (toastT > 0) text(toast, W/2, HUD + 16, C.white, 'center');
}

function panel(title) {
  ctx.fillStyle = 'rgba(0,0,0,0.82)'; ctx.fillRect(16, HUD + 10, W - 32, PH - 20);
  ctx.strokeStyle = C.tan; ctx.lineWidth = 1; ctx.strokeRect(16.5, HUD + 10.5, W - 33, PH - 21);
  text(title, W/2, HUD + 18, C.yellow, 'center', 10);
}
function wrap(s, n) {
  const out = []; let line = '';
  for (const w of s.split(' ')) { if ((line + ' ' + w).trim().length > n) { out.push(line); line = w; } else line = (line + ' ' + w).trim(); }
  if (line) out.push(line); return out;
}
function drawJournal() {
  panel('FIELD JOURNAL');
  SPECIES.forEach((s, i) => {
    const got = documented.has(s.id), y = HUD + 36 + i*12, sel = i === journalSel;
    if (sel) rect(26, y - 2, W - 52, 11, '#2a2a10');
    text(got ? s.name : '? ? ?', 32, y, got ? C.ltgreen : C.gray);
    text(TIER_NAME[s.tier], W - 32, y, got ? C.tan : '#555', 'right');
  });
  const s = SPECIES[journalSel], fy = HUD + 36 + SPECIES.length*12 + 6;
  const lines = documented.has(s.id) ? wrap(s.fact, 52) : ['NOT YET DOCUMENTED. LOOK IN THE ' + TIER_NAME[s.tier] + '.'];
  lines.forEach((l, i) => text(l, W/2, fy + i*10, C.white, 'center'));
  text('UP/DOWN: BROWSE   A: SOUND ' + (soundOn ? 'OFF' : 'ON') + '   SELECT: BACK', W/2, HUD + PH - 22, C.gray, 'center');
}
function drawTitle() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  text('LANTERN RUN', W/2, 40, C.yellow, 'center', 22);
  text('A NIGHT IN THE AMAZON', W/2, 72, C.tan, 'center', 10);
  const rows = [
    'You are a zoologist with one lantern and one night.',
    'Find 12 species across the four layers of the forest.',
    'Hold B near one, stand still in your light: documented.',
    '',
    'D-PAD  run, climb lianas     A  jump (hold = higher)',
    'DOWN+A  drop through a branch   B  raise lantern, creep',
    'SELECT  field journal          START  pause',
  ];
  rows.forEach((r, i) => text(r, W/2, 100 + i*13, C.white, 'center'));
  if (Math.floor(nightT*2) % 2) text('PRESS START', W/2, 210, C.ltgreen, 'center', 12);
  if (!live()) text('PRESS ANY KEY FOR SOUND', W/2, 236, C.yellow, 'center');
  text(VERSION, W - 4, H - 12, C.gray, 'right');
}

function draw() {
  if (state === 'title') { drawTitle(); return; }
  drawScene();
  for (const a of animals) drawAnimal(a);
  drawPlayer();
  drawDarkness();
  drawFireflies();
  drawCaimanEyes();
  for (const a of animals) drawEyeshine(a);
  drawObserve();
  drawHud();
  if (state === 'journal') drawJournal();
  if (state === 'pause') { panel('PAUSED'); text('START TO GO ON   SELECT FOR THE JOURNAL', W/2, HUD + 110, C.white, 'center'); }
  if (state === 'dying') text(P.cause, W/2, HUD + 100, C.red, 'center', 10);
  if (state === 'over') {
    panel(P.cause.startsWith('DAWN') ? 'DAWN' : 'EXPEDITION OVER');
    text(P.cause, W/2, HUD + 60, C.white, 'center');
    text('SPECIES DOCUMENTED: ' + documented.size + ' OF ' + SPECIES.length, W/2, HUD + 90, C.ltgreen, 'center');
    text('SCORE ' + score, W/2, HUD + 110, C.yellow, 'center', 10);
    text('PRESS START', W/2, HUD + 160, C.white, 'center');
  }
  if (state === 'won') {
    panel('EXPEDITION COMPLETE');
    text('ALL 12 SPECIES DOCUMENTED BEFORE DAWN.', W/2, HUD + 60, C.ltgreen, 'center');
    text('TIME BONUS ' + Math.floor(clock)*5, W/2, HUD + 90, C.white, 'center');
    text('SCORE ' + score, W/2, HUD + 110, C.yellow, 'center', 10);
    text('PRESS START', W/2, HUD + 160, C.white, 'center');
  }
}

/* ---------------- loop ---------------- */
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last)/1000); last = now;
  while (acc >= STEP) { pollInput(); update(STEP); acc -= STEP; for (const b of BTN) pressed[b] = false; }
  draw();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });
spawnScreen();
if (DEMO) {
  newGame();
  /* ?demo&warp=N runs N simulation steps up front -- headless browsers barely
     tick requestAnimationFrame, and this lets a screenshot show real play. */
  const warp = Math.min(60*600, parseInt(Q.get('warp')) || 0);
  for (let i = 0; i < warp; i++) { pollInput(); update(STEP); for (const b of BTN) pressed[b] = false; }
}
requestAnimationFrame(frame);
</script>
