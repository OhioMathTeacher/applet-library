    r.throbT = r.state === 'pass' ? [1.1, 0.85, 0.6, 0.42][r.band] : 0.22;
    SFX.hum(T.hum*(r.state === 'dive' ? 1.5 : 1), r.x, 0.012 + 0.006*r.band);
  }
}

function rbox(r) { return {x0: r.x, x1: r.x + r.T.w, y0: r.y - r.T.h/2, y1: r.y + r.T.h/2}; }

function fire(id) {
  const s = cannon(id);
  if (!s || s.down) { if (s) SFX.dry(); return; }
  if (cool[id] > 0 || shots.filter(p => p.gun === id).length >= 2) return;
  const g = GUN[id], y = topOf(s) - 2;
  shots.push({gun: id, x: s.x + g.dx*8, y: y + g.dy*8, vx: g.dx*SHOT_V, vy: g.dy*SHOT_V});
  cool[id] = 0.2; SFX.fire(s.x);
}

function boom(x, y, n, cols, power = 1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random()*Math.PI*2, v = (20 + Math.random()*70)*power;
    bits.push({x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 20, life: 0.5 + Math.random()*0.6, c: cols[i % cols.length]});
  }
  booms.push({x, y, r: 16*power, t: 0.35});
}

function fell(s) {
  if (s.down) return;
  s.down = true; s.fallT = 1.2; quake = 0.5;
  boom(s.x, topOf(s) + s.h/2, 22, [C.orange, C.yellow, C.gray, C.red], 1.2);
  SFX.fall(s.x);
  if (s.kind === 'bldg') { tideTarget = Math.max(TIDE0 - 6*TIDE_STEP, tideTarget - TIDE_STEP); SFX.swell(); }
  const lost = s.kind === 'bldg' ? (s.lamp ? 'A SEARCHLIGHT TOWER IS DOWN' : 'A BUILDING FALLS. THE TIDE RISES') : 'A CANNON IS LOST';
  say(lost, 2);
}

function rebuild() {
  /* Every 10,000 points one fallen structure rises again, and the sea
     draws back a step if it was a building. */
  const cannonsUp = city.some(s => s.kind === 'cannon' && !s.down);
  const pick = (!cannonsUp && city.find(s => s.kind === 'cannon' && s.down)) || city.find(s => s.kind === 'bldg' && s.down) || city.find(s => s.down);
  if (!pick) return;
  pick.down = false; pick.fallT = 0; pick.rise = 1;
  if (pick.kind === 'bldg') tideTarget = Math.min(TIDE0, tideTarget + TIDE_STEP);
  say(pick.kind === 'bldg' ? 'REBUILT! THE SEA DRAWS BACK' : 'A CANNON IS REBUILT', 2.2); SFX.rebuild();
}

function addScore(n) {
  score += n;
  while (score >= nextRebuild) { nextRebuild += 10000; rebuild(); }
}

function gameOver(cause) {
  state = 'over'; overT = 0; overCause = cause; saveHi(); SFX.over();
}

/* ---------------- searchlights ---------------- */
/* The one you steer stands on the central post (it survives the post), and
   two sweep by themselves from the lamp towers while those stand. */
const LAMP = {x: 200, y: wallTop(200) - 21};
function beams() {
  const out = [{x: LAMP.x, y: LAMP.y, a: aim, hw: 0.09, len: 270, mine: true}];
  city.forEach((s, i) => {
    if (!s.lamp || s.down) return;
    const ph = i < 4 ? 0 : 2.4;
    out.push({x: s.x, y: topOf(s) - 6, a: (i < 4 ? 0.15 : -0.15) + 0.95*Math.sin(time*0.55 + ph), hw: 0.07, len: 260});
  });
  return out;
}
function inBeam(b, x, y, pad = 0) {
  const dx = x - b.x, dy = b.y - y;
  if (dy <= 2) return false;
  const d = Math.hypot(dx, dy);
  return d < b.len && Math.abs(Math.atan2(dx, dy) - b.a) < b.hw + pad/d;
}
const flareK = () => flareT > 0 ? Math.min(1, flareT/0.8) : 0;
function lit(r, bs) {
  if (mode === 'moon') return true;
  if (flareK() > 0.3) return true;
  const cx = r.x + r.T.w/2;
  return bs.some(b => inBeam(b, cx, r.y, r.T.w/2));
}

/* ---------------- the demo autopilot ---------------- */
/* It plays fair: it fires only at raiders it can see (in a beam, or under
   a flare), and steers its beam toward the one it can hear lowest. */
function demoPilot() {
  for (const b of ['left', 'right', 'a', 'b', 'up', 'select']) { held[b] = false; pressed[b] = false; }
  const bs = beams();
  const active = raiders.filter(r => r.state !== 'wait' && r.x > -r.T.w && r.x < W && !r.ignored);
  let worst = null, wv = -1;
  for (const r of active) { const v = r.band + (r.state !== 'pass' ? 2 : 0) + (r.type === 'bandit' ? 2 : 0); if (v > wv) { wv = v; worst = r; } }
  if (worst) {
    const want = Math.atan2(worst.x + worst.T.w/2 + worst.vx*0.3 - LAMP.x, LAMP.y - worst.y);
    if (want > aim + 0.04) held.right = true; else if (want < aim - 0.04) held.left = true;
  }
  for (const id of ['L', 'C', 'R']) {
    const s = cannon(id); if (s.down || cool[id] > 0) continue;
    const g = GUN[id], ox = s.x + g.dx*8, oy = topOf(s) - 2 + g.dy*8;
    const go = (tx, ty, vx, vy, half) => {
      const t = (oy - ty)/(SHOT_V*-g.dy); if (t <= 0) return false;
      return Math.abs(ox + g.dx*SHOT_V*t - (tx + vx*t)) < half && Math.abs(vy*t) < 30;
    };
    let shoot = false;
    for (const r of active) if (lit(r, bs) && go(r.x + r.T.w/2, r.y, r.vx, r.vy, r.T.w/2 - 1)) shoot = true;
    for (const b of bombs) if (b.y < 150 && go(b.x, b.y + b.vy*0.3, b.vx, b.vy, 3)) shoot = true;
    if (shoot) { if (id === 'L') pressed.b = true; if (id === 'R') pressed.a = true; if (id === 'C') pressed.up = true; }
  }
  const unseenLow = active.filter(r => r.band >= 2 && !lit(r, bs)).length;
  if (flares > 0 && flareT <= 0 && unseenLow >= 2) pressed.select = true;
}

/* ---------------- update ---------------- */
function update(dt) {
  time += dt;
  if (footT > 0) footT -= dt;
  if (state === 'title') {
    if (pressed.left || pressed.right || pressed.select) { mode = mode === 'moon' ? 'dark' : 'moon'; loadHi(); SFX.pause(mode === 'dark'); }
    if (pressed.start) newGame();
    return;
  }
  if (state === 'over') {
    overT += dt;
    if (overT > 1 && pressed.start) newGame();
    for (const p of bits) { p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 120*dt; p.life -= dt; }
    bits = bits.filter(p => p.life > 0);
    for (const b of booms) b.t -= dt;
    booms = booms.filter(b => b.t > 0);
    for (const s of city) if (s.fallT > 0) s.fallT = Math.max(0, s.fallT - dt);
    tide += (tideTarget - tide)*Math.min(1, dt*0.8);
    return;
  }
  if (pressed.start) { state = state === 'pause' ? 'play' : 'pause'; SFX.pause(state === 'pause'); return; }
  if (state === 'pause') { if (pressed.select) { setSound(!soundOn); footNote(soundOn ? 'SOUND ON' : 'SOUND OFF'); } return; }

  if (bannerT > 0) bannerT -= dt;
  quake = Math.max(0, quake - dt);
  /* Steer your beam. */
  if (held.left) aim -= 1.7*dt;
  if (held.right) aim += 1.7*dt;
  aim = clamp(aim, -1.2, 1.2);
  /* Fire: B the left cannon, A the right, Up the centre. */
  for (const k in cool) cool[k] = Math.max(0, cool[k] - dt);
  if (pressed.b) fire('L');
  if (pressed.a) fire('R');
  if (pressed.up) fire('C');
  /* Select: a flare that lights the whole sky for a few seconds. */
  if (pressed.select) {
    if (flares > 0 && flareT <= 0) { flares--; flareT = 3.2; flareY = 10; SFX.flare(); }
    else SFX.dry();
  }
  flareT = Math.max(0, flareT - dt); flareY += 14*dt;

  /* Raiders arrive. */
  spawnT -= dt;
  if (queue.length && spawnT <= 0 && raiders.length < maxActive()) {
    spawn(queue.shift()); spawnT = Math.max(0.5, 2.0 - 0.14*wave) + Math.random()*0.8;
  }
  for (const r of raiders) updateRaider(r, dt);

  /* Shots. Each one checks the stretch it moved, so nothing slips between frames. */
  for (const p of shots) {
    const px = p.x, py = p.y;
    p.x += p.vx*dt; p.y += p.vy*dt;
    for (const r of raiders) {
      if (r.state === 'wait' || p.dead) continue;
      const b = rbox(r);
      for (let k = 0; k <= 3; k++) {
        const sx = px + (p.x - px)*k/3, sy = py + (p.y - py)*k/3;
        if (sx > b.x0 - 1 && sx < b.x1 + 1 && sy > b.y0 - 2 && sy < b.y1 + 2) {
          p.dead = true; r.hp--; r.flash = 0.15;
          if (r.hp <= 0) {
            r.dead = true; addScore(r.T.pts);
            boom(r.x + r.T.w/2, r.y, 16, [r.T.col.X, r.T.col.Y, C.white, C.orange]); SFX.hit(r.x);
          } else SFX.clang(r.x);
          break;
        }
      }
    }
    for (const b of bombs) {
      if (p.dead || b.dead) continue;
      if (Math.hypot(p.x - b.x, p.y - b.y) < 6 || Math.hypot((px + p.x)/2 - b.x, (py + p.y)/2 - b.y) < 6) {
        p.dead = b.dead = true; addScore(50); boom(b.x, b.y, 8, [C.yellow, C.white], 0.6); SFX.bombPop(b.x);
      }
    }
    if (p.y < -6 || p.x < -6 || p.x > W + 6) p.dead = true;
  }
  shots = shots.filter(p => !p.dead);
  raiders = raiders.filter(r => !r.dead);

  /* Bombs. */
  for (const b of bombs) {
    b.vy += b.g*dt; b.x += b.vx*dt; b.y += b.vy*dt;
    for (const s of city) {
      if (s.down || b.dead) continue;
      if (Math.abs(b.x - s.x) < s.w/2 + 1 && b.y >= topOf(s)) { b.dead = true; fell(s); }
    }
    if (!b.dead && b.y >= wallTop(b.x)) {
      b.dead = true;
      if (b.y >= tide - 1) SFX.splash(b.x); else boom(b.x, b.y, 6, [C.orange, C.gray], 0.5);
    }
  }
  bombs = bombs.filter(b => !b.dead);

  for (const p of bits) { p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 120*dt; p.life -= dt; }
  bits = bits.filter(p => p.life > 0);
  for (const b of booms) b.t -= dt;
  booms = booms.filter(b => b.t > 0);
  for (const s of city) { if (s.fallT > 0) s.fallT = Math.max(0, s.fallT - dt); if (s.rise > 0) s.rise = Math.max(0, s.rise - dt); }
  tide += (tideTarget - tide)*Math.min(1, dt*0.8);

  /* How bad is it? 0 = everything high, 1 = something diving or bombing. */
  let t = 0;
  for (const r of raiders) if (r.state !== 'wait') t = Math.max(t, r.state === 'pass' ? r.band/3*0.85 : 1);
  if (bombs.length) t = 1;
  threat += (t - threat)*Math.min(1, dt*3);

  if (buildingsLeft() === 0) { gameOver('THE SEA HAS TAKEN THE CITY'); return; }
  if (!city.some(s => s.kind === 'cannon' && !s.down)) { gameOver('THE GUNS ARE SILENT. THE CITY FALLS'); return; }
  saveHi();

  /* Wave over: bonus for what still stands, then the next. */
  if (!queue.length && !raiders.length && !bombs.length) {
    if (breakT === 0) {
      const bonus = 50*wave*standing().length;
      breakT = 2.6; addScore(bonus); say('WAVE ' + wave + ' HELD   BONUS ' + bonus, 2.5); SFX.clear();
    } else {
      breakT -= dt;
      if (breakT <= 0) nextWave();
    }
  }
}

/* ---------------- drawing ---------------- */
const STARS = Array.from({length: 46}, (_, i) => ({x: (i*97 + 13) % W, y: (i*53 + 7) % 170, p: (i*1.7) % 6}));
function drawSky() {
  const g = ctx.createLinearGradient(0, HUD, 0, HUD + 200);
  g.addColorStop(0, '#02020c'); g.addColorStop(1, '#0a0f2e');
  ctx.fillStyle = g; ctx.fillRect(0, HUD, W, PH);
  for (const s of STARS) if ((time*0.7 + s.p) % 6 > 0.3) rect(s.x, HUD + s.y, 1, 1, s.y < 90 ? '#5a6488' : '#3c4568');
}
function drawRaiders(bs) {
  for (const r of raiders) {
    if (r.state === 'wait') continue;
    const col = r.flash > 0 ? {X: C.white, Y: C.white, Z: C.white} : r.T.col;
    sprite(SPR[r.type], r.x, HUD + r.y - Math.floor(r.T.h/2), col, r.vx < 0);
  }
}
/* Outside the beams the sky is black. Cut the beams out of the dark. */
function drawDarkness(bs) {
  const k = 1 - flareK()*0.85;
  dctx.globalCompositeOperation = 'source-over';
  dctx.clearRect(0, 0, W, PH);
  /* The city's own glow thins the dark just above the rooftops, so a
     raider diving at it shows dimly even outside the beams. */
  const g0 = dctx.createLinearGradient(0, 0, 0, 196);
  const top = mode === 'moon' ? 0.3 : 0.97, low = mode === 'moon' ? 0.12 : 0.45;
  g0.addColorStop(0, `rgba(0,0,0,${(top*k).toFixed(3)})`);
  g0.addColorStop(0.56, `rgba(0,0,0,${(top*k).toFixed(3)})`);
  g0.addColorStop(1, `rgba(0,0,0,${(low*k).toFixed(3)})`);
  dctx.fillStyle = g0;
  dctx.fillRect(0, 0, W, 196);
  dctx.globalCompositeOperation = 'destination-out';
  for (const b of bs) {
    const ex = b.x + Math.sin(b.a)*b.len, ey = b.y - Math.cos(b.a)*b.len;
    const g = dctx.createLinearGradient(b.x, b.y, ex, ey);
    g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.75, 'rgba(0,0,0,0.9)'); g.addColorStop(1, 'rgba(0,0,0,0.55)');
    dctx.fillStyle = g; dctx.beginPath(); dctx.moveTo(b.x, b.y);
    dctx.lineTo(b.x + Math.sin(b.a - b.hw)*b.len, b.y - Math.cos(b.a - b.hw)*b.len);
    dctx.lineTo(b.x + Math.sin(b.a + b.hw)*b.len, b.y - Math.cos(b.a + b.hw)*b.len);
    dctx.closePath(); dctx.fill();
  }
  for (const e of booms) {
    const g = dctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r*2);
    g.addColorStop(0, 'rgba(0,0,0,0.9)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = g; dctx.beginPath(); dctx.arc(e.x, e.y, e.r*2, 0, 7); dctx.fill();
  }
  dctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(dark, 0, HUD);
  /* the haze in each beam */
  for (const b of bs) {
    ctx.fillStyle = b.mine ? 'rgba(250,234,39,0.10)' : 'rgba(190,210,255,0.07)';
    ctx.beginPath(); ctx.moveTo(b.x, HUD + b.y);
    ctx.lineTo(b.x + Math.sin(b.a - b.hw)*b.len, HUD + b.y - Math.cos(b.a - b.hw)*b.len);
    ctx.lineTo(b.x + Math.sin(b.a + b.hw)*b.len, HUD + b.y - Math.cos(b.a + b.hw)*b.len);
    ctx.closePath(); ctx.fill();
  }
  if (flareT > 0) {
    ctx.fillStyle = `rgba(255,240,200,${(0.08*flareK()).toFixed(3)})`; ctx.fillRect(0, HUD, W, 196);
    const fx = 200 + Math.sin(time*2)*30;
    rect(fx - 1, HUD + flareY, 3, 3, C.white); rect(fx, HUD + flareY - 3, 1, 3, C.yellow);
  }
}
/* What you get when you can't see a raider: a running light that winks now
   and then. Enough to know something's there, not enough to aim by. */
function drawGlints(bs) {
  for (const r of raiders) {
    if (r.state === 'wait' || lit(r, bs)) continue;
    const ph = r.glint % 1.3;
    if (ph < 0.12) rect(r.x + (r.vx > 0 ? r.T.w - 1 : 0), HUD + r.y, 1, 1, r.T.glint);
    if (r.state !== 'pass' && ph > 0.6 && ph < 0.7) rect(r.x + r.T.w/2, HUD + r.y + 2, 1, 1, C.red);
  }
}
function drawCity() {
  /* the wall, stepped low at the left end */
  for (let x = 0; x < W; x += 2) {
    const t = wallTop(x);
    rect(x, HUD + t, 2, PH - t, '#3a3428');
    if ((x >> 1) % 9 === 0) rect(x, HUD + t + 6, 1, PH - t, '#2a251c');
  }
  for (let x = 0; x < W; x += 2) rect(x, HUD + wallTop(x), 2, 2, '#6a6250');
  for (let y = 214; y < PH; y += 8) for (let x = (y % 16 ? 0 : 10); x < W; x += 20) rect(x, HUD + y, 1, 8, '#2a251c');
  for (const s of city) {
    const base = wallTop(s.x - s.w/2), x0 = s.x - s.w/2;
    if (s.down && s.fallT <= 0) {
      /* rubble */
      for (let i = 0; i < s.w; i += 3) rect(x0 + i, HUD + base - 2 - ((i*7) % 4), 3, 3 + ((i*7) % 4), i % 2 ? '#4a4438' : '#5c5446');
      continue;
    }
    const k = s.down ? s.fallT/1.2 : 1 - (s.rise || 0);
    const h = Math.max(2, Math.round(s.h*k)), top = base - h;
    const jit = s.down ? (Math.random() - 0.5)*2 : 0;
    if (s.kind === 'bldg') {
      rect(x0 + jit, HUD + top, s.w, h, s.c);
      rect(x0 + jit + s.w - 3, HUD + top, 3, h, '#00000055');
      /* windows: most lit, a few flickering */
      for (let wy = top + 4; wy < base - 4; wy += 6) for (let wx = x0 + 3; wx < x0 + s.w - 5; wx += 5) {
        const n = (wx*13 + wy*7) % 11, on = n > 2 || ((time + s.flick + n) % 7 > 3.5);
        rect(wx + jit, HUD + wy, 3, 3, on ? C.yellow : '#1a1a10');
      }
      if (s.lamp && !s.down) {
        rect(s.x - 3, HUD + top - 6, 6, 6, C.gray); rect(s.x - 2, HUD + top - 5, 4, 3, C.white);
      }
    } else {
      /* a cannon post: a stone block, a dome, a barrel pointing its way */
      rect(x0 + jit, HUD + top + 6, s.w, h - 6, '#7a7468');
      rect(x0 + 2 + jit, HUD + top + 8, s.w - 4, 2, '#5c574c');
      ctx.fillStyle = s.id === 'C' ? C.cyan : C.green;
      ctx.beginPath(); ctx.arc(s.x + jit, HUD + top + 6, 7, Math.PI, 0); ctx.fill();
      if (!s.down) {
        const g = GUN[s.id], bx = s.x, by = HUD + top + 2;
        for (let i = 0; i < 9; i++) rect(bx + g.dx*i - 1, by + g.dy*i - 1, 2, 2, cool[s.id] > 0.1 ? C.orange : C.white);
      }
    }
  }
  /* your searchlight, on the central post */
  rect(LAMP.x - 3, HUD + LAMP.y - 1, 6, 4, C.yellow);
}
function drawSea() {
  const t = Math.round(tide);
  ctx.fillStyle = 'rgba(0,45,255,0.55)';
  ctx.fillRect(0, HUD + t, W, PH - t);
  ctx.fillStyle = 'rgba(0,20,120,0.55)';
  ctx.fillRect(0, HUD + t + 6, W, PH - t - 6);
  for (let x = 0; x < W; x += 4) {
    const y = t + Math.round(Math.sin(x*0.15 + time*2.2)*1.2);
    rect(x, HUD + y, 3, 1, (x + Math.floor(time*8)) % 16 < 3 ? C.white : C.cyan);
  }
  /* where the sea comes over the wall, it spills */
  for (let x = 0; x < W; x += 2) if (wallTop(x) > t + 1 && (x + Math.floor(time*20)) % 7 === 0) rect(x, HUD + t - 1, 1, 1, C.white);
}
function drawShots() {
  for (const p of shots) {
    const n = Math.hypot(p.vx, p.vy), ux = p.vx/n, uy = p.vy/n;
    for (let i = 0; i < 5; i++) rect(p.x - ux*i, HUD + p.y - uy*i, 1, 1, i < 2 ? C.white : C.yellow);
  }
  for (const b of bombs) {
    rect(b.x - 1, HUD + b.y - 1, 3, 3, C.red);
    if (Math.floor(time*12) % 2) rect(b.x, HUD + b.y - 3, 1, 1, C.yellow);
  }
  for (const p of bits) rect(p.x, HUD + p.y, p.life > 0.3 ? 2 : 1, p.life > 0.3 ? 2 : 1, p.c);
  /* a flash, then a ring blowing outward */
  for (const e of booms) {
    const k = 1 - e.t/0.35;
    if (k < 0.3) { ctx.fillStyle = k < 0.15 ? C.white : C.yellow; ctx.beginPath(); ctx.arc(e.x, HUD + e.y, 3 + k*12, 0, 7); ctx.fill(); }
    ctx.strokeStyle = k < 0.5 ? C.yellow : C.orange; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(e.x, HUD + e.y, 2 + e.r*k, 0, 7); ctx.stroke();
  }
}

const pad6 = n => String(n).padStart(6, '0');
function drawHud() {
  rect(0, 0, W, HUD, '#000');
  text('SCORE ' + pad6(score), 4, 6, C.white);
  text('WAVE ' + Math.max(1, wave), 134, 6, C.cyan);
  text('HI ' + pad6(hi), 206, 6, C.yellow);
  /* flares left */
  for (let i = 0; i < flares; i++) { rect(W - 10 - i*9, 6, 3, 7, C.orange); rect(W - 10 - i*9, 4, 3, 2, C.yellow); }
  rect(0, HUD + PH, W, FOOT, '#000');
  const rise = Math.round((TIDE0 - tide)/TIDE_STEP*10)/10;
  text(footT > 0 ? footMsg : `${mode === 'moon' ? 'MOONLIT' : 'SEARCHLIGHT'}   TIDE +${rise.toFixed(1)}   BUILDINGS ${buildingsLeft()}/6`, 4, HUD + PH + 2, C.gray);
  /* Browsers start sound only after a key press or click, and a gamepad
     button may not count -- so say so rather than be silently quiet. */
  if (soundOn && !live()) text('PRESS ANY KEY FOR SOUND', W - 4, HUD + PH + 2, C.yellow, 'right');
  else text(soundOn ? 'SND' : 'MUTE', W - 4, HUD + PH + 2, C.gray, 'right');
  if (bannerT > 0 && state === 'play') text(banner, W/2, HUD + 140, C.white, 'center');
}

function panel(title, y0 = 20, y1 = 200) {
  ctx.fillStyle = 'rgba(0,0,0,0.86)'; ctx.fillRect(30, HUD + y0, W - 60, y1 - y0);
  ctx.strokeStyle = C.cyan; ctx.lineWidth = 1; ctx.strokeRect(30.5, HUD + y0 + 0.5, W - 61, y1 - y0 - 1);
  text(title, W/2, HUD + y0 + 8, C.yellow, 'center', 10);
}
const CONTROLS = [
  ['B',      'X J',     'LEFT CANNON (FIRES UP-RIGHT)'],
  ['A',      'Z K SPC', 'RIGHT CANNON (FIRES UP-LEFT)'],
  ['UP',     'UP W',    'CENTRE CANNON (STRAIGHT UP)'],
  ['L / R',  'ARROWS',  'STEER YOUR SEARCHLIGHT'],
  ['SELECT', 'SHIFT',   'FLARE: LIGHTS THE WHOLE SKY'],
  ['START',  'ENTER P', 'START / PAUSE'],
];
function drawControls(y) {
  CONTROLS.forEach(([p, k, d], i) => {
    text(p, 50, y + i*11, C.yellow); text(k, 104, y + i*11, C.gray); text(d, 160, y + i*11, C.white);
  });
}
function drawTitle() {
  drawSky();
  const bs = [{x: LAMP.x, y: LAMP.y, a: Math.sin(time*0.6)*0.9, hw: 0.09, len: 270, mine: true}];
  drawDarkness(bs);
  drawCity(); drawSea();
  ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, 0, W, H);
  text('TIDEWALL', W/2, 26, C.cyan, 'center', 26);
  text('HOLD THE CITY ON THE SEA WALL', W/2, 58, C.tan, 'center', 10);
  const rows = [
    'Raiders cross the night sky, lower every pass.',
    'At the lowest band they dive and bomb.',
    mode === 'moon' ? 'A clear moonlit night: you can see them all.' : 'You see them only in a searchlight.',
    'Every building lost, the sea climbs higher.',
  ];
  rows.forEach((r, i) => text(r, W/2, 74 + i*10, C.white, 'center'));
  text('LEFT/RIGHT:  < ' + (mode === 'moon' ? 'MOONLIT' : 'SEARCHLIGHT (HARD)') + ' >', W/2, 118, mode === 'moon' ? C.ltgreen : C.orange, 'center');
  drawControls(134);
  if (Math.floor(time*2) % 2) text('PRESS START', W/2, 206, C.ltgreen, 'center', 12);
  text('HI ' + pad6(hi), 6, H - 12, C.yellow);
  if (!live()) text('PRESS ANY KEY FOR SOUND', W/2, 228, C.yellow, 'center');
  text(VERSION, W - 4, H - 12, C.gray, 'right');
}

function draw() {
  if (state === 'title') { drawTitle(); return; }
  ctx.save();
  if (quake > 0) ctx.translate(Math.round((Math.random() - 0.5)*3*quake*2), 0);
  const bs = beams();
  drawSky();
  drawRaiders(bs);
  drawDarkness(bs);
  drawGlints(bs);
  drawCity();
  drawShots();
  drawSea();
  ctx.restore();
  drawHud();
  if (state === 'pause') {
    panel('PAUSED', 20, 196);
    drawControls(HUD + 44);
    text('RAIDERS: SKIFF 100  BARGE 250 (2 HITS)', W/2, HUD + 118, C.white, 'center');
    text('HAWK 300  BANDIT 1000  BOMB 50', W/2, HUD + 130, C.white, 'center');
    text('A BUILDING IS REBUILT EVERY 10,000 POINTS', W/2, HUD + 146, C.ltgreen, 'center');
    text('START: GO ON    SELECT: SOUND ' + (soundOn ? 'OFF' : 'ON'), W/2, HUD + 170, C.yellow, 'center');
  }
  if (state === 'over') {
    panel('GAME OVER', 40, 170);
    text(overCause, W/2, HUD + 68, C.white, 'center');
    text('WAVE ' + wave + '   SCORE ' + score, W/2, HUD + 92, C.yellow, 'center', 10);
    text(score >= hi && score > 0 ? 'A NEW HIGH SCORE!' : 'HIGH SCORE ' + hi, W/2, HUD + 112, C.ltgreen, 'center');
    if (overT > 1) text('PRESS START', W/2, HUD + 142, C.white, 'center');
  }
}

/* ---------------- loop ---------------- */
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last)/1000); last = now;
  while (acc >= STEP) { pollInput(); update(STEP); acc -= STEP; for (const b of BTN) pressed[b] = false; }
  if (live() && soundOn && state === 'play') scheduleMusic(threat);
  draw();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') { state = 'pause'; } });
city = LAYOUT.map(s => ({...s, down: false, fallT: 0, flick: Math.random()*10}));
if (DEMO) {
  /* &sound starts audio without a key press (needs a browser that allows
     autoplay), so headless runs exercise the sound code too. */
  if (Q.has('sound')) ensureAudio();
  newGame();
  /* ?demo&warp=N runs N simulation steps up front -- headless browsers barely
     tick requestAnimationFrame, and this lets a screenshot show real play. */
  const warp = Math.min(60*900, parseInt(Q.get('warp')) || 0);
  /* &flare=N fires a flare at step N, to check how it looks. */
  const flareAt = Q.has('flare') ? parseInt(Q.get('flare')) || 0 : -1;
  for (let i = 0; i < warp; i++) { pollInput(); if (i === flareAt) pressed.select = true; update(STEP); for (const b of BTN) pressed[b] = false; }
  if (Q.has('pause')) state = 'pause';
  /* For headless checks: what the warp left behind, readable with --dump-dom. */
  document.body.dataset.demo = JSON.stringify({state, wave, score, buildings: buildingsLeft(),
    cannons: city.filter(s => s.kind === 'cannon' && !s.down).length, tide: +(TIDE0 - tide).toFixed(1), raiders: raiders.length, queue: queue.length, bombs: bombs.length, flareT: +flareT.toFixed(2), diving: raiders.filter(r => r.state === "dive" || r.state === "climb").length, flares, audio: actx ? actx.state : "none"});
}
requestAnimationFrame(frame);
</script>
