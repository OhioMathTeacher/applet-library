<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tree Diagram Builder</title>
  <style>
    :root {
      --blue: #2563eb;
      --blue-deep: #1e40af;
      --blue-soft: #dbeafe;
      --green: #16a34a;
      --green-soft: #dcfce7;
      --red: #dc2626;
      --red-soft: #fee2e2;
      --gray: #6b7280;
      --gray-soft: #f3f4f6;
      --border: #e5e7eb;
      --grid-dot: #c7d2db;
      --grid-bg: #fafafa;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 16px;
      margin: 0;
      background: #fff;
      color: #111827;
    }

    /* HEADER */
    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 1.2em; }
    header h1 a { color: inherit; text-decoration: none; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .toolbar button, .toolbar select, .toolbar label.file-btn {
      font: inherit;
      padding: 8px 14px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
    }
    .toolbar button:hover, .toolbar label.file-btn:hover { background: var(--gray-soft); }
    .toolbar button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .toolbar button.primary:hover { background: var(--blue-deep); }
    .toolbar #tidyTree {
      background: #fef3c7;
      border-color: #fde68a;
      color: #78350f;
    }
    .toolbar #tidyTree:hover { background: #fde68a; }
    .toolbar #magnetBtn[data-mode="off"]   { background: var(--gray-soft); color: var(--gray); border-color: var(--border); }
    .toolbar #magnetBtn[data-mode="loose"] { background: #ecfeff; color: #155e75; border-color: #a5f3fc; }
    .toolbar #magnetBtn[data-mode="force"] { background: #ecfdf5; color: #065f46; border-color: #a7f3d0; }
    .toolbar #magnetBtn:hover { filter: brightness(0.96); }

    /* PROBLEM PANEL */
    #problemPanel {
      padding: 14px 20px;
      background: var(--blue-soft);
      border-bottom: 1px solid var(--border);
    }
    #problemPanel.empty { display: none; }
    #problemTitle { margin: 0 0 4px 0; font-size: 1.15em; }
    #problemText { margin: 0; white-space: pre-wrap; }
    #scaffoldTag {
      display: inline-block;
      font-size: 0.85em;
      padding: 2px 10px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--border);
      margin-left: 8px;
      vertical-align: middle;
    }

    /* MAIN LAYOUT */
    main {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 0;
      min-height: 60vh;
    }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
    }

    /* TREE CANVAS */
    #treeContainer {
      position: relative;
      overflow: auto;
      padding: 0;
      background:
        radial-gradient(circle, var(--grid-dot) 1.5px, transparent 1.6px) 0 0 / 60px 60px,
        var(--grid-bg);
    }
    #treeStage {
      position: relative;
      min-width: 100%;
      min-height: 100%;
    }
    #branchLayer {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
    }

    /* NODES */
    .node {
      position: absolute;
      transform: translate(-50%, -50%);
      user-select: none;
      z-index: 2;
      /* Width/height auto-fits the dot only — auxiliary elements
         (actions, leaf-prob, root-label) are positioned absolutely
         so they don't shift the node's center. This is what makes
         line endpoints land exactly on the dot's center. */
    }
    .node .dot {
      display: block;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--blue);
      box-shadow: 0 0 0 4px var(--grid-bg);
      cursor: grab;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      touch-action: none;
    }
    .node .dot:hover { transform: scale(1.12); }
    .node.dragging .dot {
      cursor: grabbing;
      transform: scale(1.18);
      box-shadow: 0 0 0 4px var(--grid-bg), 0 4px 12px rgba(37, 99, 235, 0.35);
    }
    .node.leaf .dot { background: var(--blue-soft); }
    .node.root .dot {
      width: 26px;
      height: 26px;
      background: #111827;
      border-color: #111827;
    }
    .node .actions {
      position: absolute;
      left: 50%;
      bottom: 100%;
      transform: translateX(-50%);
      /* The padding here is mostly invisible "hover slack": it bridges
         the gap from the buttons down to the dot, and gives extra
         room on top/sides so the cursor doesn't fall out of the hover
         zone while traveling toward the buttons. */
      padding: 8px 12px 12px 12px;
      display: flex;
      gap: 4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    .node:hover .actions,
    .node.dragging .actions,
    .node:focus-within .actions {
      opacity: 1;
      pointer-events: auto;
    }
    .node .actions button {
      font: inherit;
      width: 26px;
      height: 26px;
      padding: 0;
      border: 1.5px solid var(--border);
      background: #fff;
      border-radius: 50%;
      cursor: pointer;
      line-height: 1;
      font-size: 16px;
      color: var(--gray);
    }
    .node .actions button:hover { background: var(--gray-soft); color: #111827; }
    .node .actions button.add { color: var(--green); border-color: #86efac; }
    .node .actions button.del { color: var(--red); border-color: #fca5a5; }
    .node .leaf-prob {
      position: absolute;
      left: 100%;
      top: 50%;
      transform: translateY(-50%);
      margin-left: 10px;
      padding: 4px 10px;
      background: var(--blue);
      color: #fff;
      border-radius: 6px;
      font-variant-numeric: tabular-nums;
      font-size: 0.95em;
      font-weight: 700;
      white-space: nowrap;
    }
    .node .root-label {
      position: absolute;
      right: 100%;
      top: 50%;
      transform: translateY(-50%);
      margin-right: 10px;
      font-weight: 700;
      color: #111827;
      font-size: 1.05em;
      white-space: nowrap;
    }

    /* BRANCH LABELS */
    .branch-label {
      position: absolute;
      transform: translate(-50%, -50%);
      display: inline-flex;
      gap: 8px;
      align-items: baseline;
      background: rgba(255, 255, 255, 0.55);
      padding: 3px 10px;
      border-radius: 7px;
      font-size: 1em;
      line-height: 1.4;
      transition: background 0.12s ease;
      z-index: 1;
    }
    .branch-label:hover,
    .branch-label:focus-within {
      background: rgba(255, 255, 255, 0.95);
    }
    .branch-label input {
      font: inherit;
      border: none;
      border-bottom: 1.5px dashed #cbd5e1;
      border-radius: 0;
      padding: 2px 4px;
      background: transparent;
      color: #111827;
    }
    .branch-label input.label-input { width: 100px; }
    .branch-label input.prob-input {
      width: 60px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .branch-label input:hover { border-bottom-color: var(--blue); }
    .branch-label input:focus {
      outline: none;
      border-bottom: 1.5px solid var(--blue);
      background: var(--blue-soft);
    }
    .branch-label input::placeholder { color: #d1d5db; font-style: italic; }
    .branch-label.bad-sum input.prob-input {
      border-bottom-color: var(--red);
      background: var(--red-soft);
      color: #991b1b;
    }
    .branch-label .sep { color: var(--gray); font-size: 0.9em; }

    /* SIDE PANEL */
    aside {
      border-left: 1px solid var(--border);
      padding: 18px 20px;
      background: #fafafa;
      overflow-y: auto;
    }
    aside h3 {
      margin: 0 0 8px 0;
      font-size: 0.9em;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--gray);
    }
    aside section { margin-bottom: 24px; }
    .check-item {
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 0.95em;
    }
    .check-item.ok { background: var(--green-soft); color: #166534; }
    .check-item.bad { background: var(--red-soft); color: #991b1b; }
    .check-item.info { background: var(--gray-soft); color: #374151; }
    .leaf-list { list-style: none; padding: 0; margin: 0; font-size: 0.95em; }
    .leaf-list li {
      padding: 6px 0;
      border-bottom: 1px dashed var(--border);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .leaf-list li:last-child { border-bottom: none; }
    .leaf-list .path { color: #374151; }
    .leaf-list .prob { font-variant-numeric: tabular-nums; color: var(--blue); font-weight: 700; }
    .question {
      padding: 10px 12px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 0.95em;
    }
    .question .answer {
      display: none;
      margin-top: 6px;
      color: var(--green);
      font-weight: 700;
    }
    .question.show-answer .answer { display: block; }
    .question button.toggle-answer {
      font: inherit;
      font-size: 0.9em;
      margin-top: 6px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }
    footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      font-size: 0.95em;
      color: var(--gray);
      background: #fafafa;
    }
    footer code {
      background: var(--gray-soft);
      padding: 2px 6px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <header>
    <h1><a href="../index.html">🧩 Applet Library</a> &rsaquo; Tree Diagram Builder</h1>
    <div class="toolbar">
      <button id="newTree" class="primary">New blank tree</button>
      <button id="tidyTree" title="Snap nodes back to a clean layout">✨ Tidy</button>
      <button id="magnetBtn" data-mode="force" title="Toggle snap-to-grid mode (off / loose / force)">🧲 Magnet: force</button>
      <select id="exampleSelect">
        <option value="">Load example…</option>
      </select>
      <label class="file-btn">
        Load file…
        <input type="file" id="fileInput" accept="application/json,.json" hidden>
      </label>
      <button id="exportFile">Export JSON</button>
    </div>
  </header>

  <section id="problemPanel" class="empty">
    <h2 id="problemTitle"></h2>
    <span id="scaffoldTag"></span>
    <p id="problemText"></p>
  </section>

  <main>
    <div id="treeContainer">
      <div id="treeStage">
        <svg id="branchLayer"></svg>
      </div>
    </div>
    <aside>
      <section>
        <h3>Validation</h3>
        <div id="validationList"></div>
      </section>
      <section>
        <h3>Outcomes</h3>
        <ul id="leafList" class="leaf-list"></ul>
      </section>
      <section id="questionsSection" hidden>
        <h3>Questions</h3>
        <div id="questionList"></div>
      </section>
    </aside>
  </main>

  <footer>
    Build a probability tree by clicking <b>+</b> to add branches. <b>Drag</b> any node to move it — nodes snap to the dot grid. Press <b>✨ Tidy</b> to auto-arrange. Type fractions like <code>1/2</code> or decimals like <code>0.5</code>.
  </footer>

  <script>
    /* =============================================================
       Tree Diagram Builder

       Free-position grid model: every node carries integer grid
       coordinates (column, row). Pixel position = PAD + g * GRID.
       Nodes are draggable and snap to the grid on release. The
       "Tidy" button re-runs auto-layout to put everything in a
       textbook-clean arrangement.
       ============================================================= */

    const GRID = 60;
    const PAD  = 30;

    function gridToPx(g) { return PAD + g * GRID; }
    function pxToGridFloat(p) { return (p - PAD) / GRID; }

    // ---------- Magnet (snap) mode ----------
    // 'off'   = free pixel placement, no snapping
    // 'loose' = pull to grid only when within ~1/4 cell of a lattice point
    // 'force' = always lock to nearest lattice point during drag
    let magnetMode = 'force';
    const MAGNET_MODES = ['off', 'loose', 'force'];

    function applyMagnetPx(px) {
      if (magnetMode === 'force') {
        return {
          x: gridToPx(Math.round(pxToGridFloat(px.x))),
          y: gridToPx(Math.round(pxToGridFloat(px.y))),
        };
      }
      if (magnetMode === 'loose') {
        return { x: looseAxis(px.x), y: looseAxis(px.y) };
      }
      return { x: px.x, y: px.y };
    }
    function looseAxis(p) {
      const raw = pxToGridFloat(p);
      const snapped = Math.round(raw);
      return Math.abs(raw - snapped) < 0.25 ? gridToPx(snapped) : p;
    }
    function setMagnetMode(mode) {
      magnetMode = mode;
      const btn = document.getElementById('magnetBtn');
      if (btn) {
        btn.dataset.mode = mode;
        btn.textContent = '🧲 Magnet: ' + mode;
      }
    }
    function cycleMagnet() {
      const i = MAGNET_MODES.indexOf(magnetMode);
      setMagnetMode(MAGNET_MODES[(i + 1) % MAGNET_MODES.length]);
    }

    // ---------- State ----------
    const state = {
      tree: null,
      problem: null,
    };

    function blankTree() {
      return { rootLabel: 'Start', rootPos: { x: 1, y: 5 }, children: [] };
    }
    function emptyChild(parent) {
      const siblings = parent.children || [];
      const pp = posOf(parent);
      let cy;
      if (siblings.length === 0) {
        cy = pp.y - 2;
      } else {
        const maxY = Math.max(...siblings.map(s => s.pos.y));
        cy = maxY + 3;
      }
      if (cy < 0) cy = 0;
      return {
        branchLabel: '',
        branchProb: '',
        pos: { x: pp.x + 4, y: cy },
        children: [],
      };
    }
    function posOf(node) {
      return node === state.tree ? state.tree.rootPos : node.pos;
    }
    function setPos(node, p) {
      if (node === state.tree) state.tree.rootPos = p;
      else node.pos = p;
    }

    // ---------- Probability helpers ----------
    function parseProb(s) {
      if (s == null) return NaN;
      const t = String(s).trim();
      if (!t) return NaN;
      if (t.includes('/')) {
        const parts = t.split('/');
        if (parts.length !== 2) return NaN;
        const a = Number(parts[0]);
        const b = Number(parts[1]);
        if (!isFinite(a) || !isFinite(b) || b === 0) return NaN;
        return a / b;
      }
      const n = Number(t);
      return isFinite(n) ? n : NaN;
    }
    function gcd(a, b) { return b ? gcd(b, a % b) : a; }
    function fmt(n) {
      if (!isFinite(n)) return '—';
      for (let d = 2; d <= 64; d++) {
        const num = n * d;
        if (Math.abs(num - Math.round(num)) < 1e-9) {
          const top = Math.round(num);
          if (top === 0) return '0';
          if (top === d) return '1';
          const g = gcd(Math.abs(top), d);
          return `${top / g}/${d / g}`;
        }
      }
      return n.toFixed(4).replace(/0+$/, '').replace(/\.$/, '');
    }
    function approxEq(a, b, eps = 1e-6) { return Math.abs(a - b) < eps; }

    // ---------- Tree operations ----------
    function addChild(parent) {
      parent.children = parent.children || [];
      parent.children.push(emptyChild(parent));
      render();
    }
    function removeNode(parent, idx) {
      parent.children.splice(idx, 1);
      render();
    }
    function withParents(root) {
      const m = new Map();
      function walk(node, p) {
        m.set(node, p);
        (node.children || []).forEach(c => walk(c, node));
      }
      walk(root, null);
      return m;
    }
    function pathFromRoot(node) {
      const parents = withParents(state.tree);
      const path = [];
      let cur = node;
      while (cur && cur !== state.tree) {
        path.unshift(cur);
        cur = parents.get(cur);
      }
      return path;
    }
    function pathProbability(node) {
      const path = pathFromRoot(node);
      if (path.length === 0) return NaN;
      let prod = 1;
      for (const n of path) {
        const v = parseProb(n.branchProb);
        if (!isFinite(v)) return NaN;
        prod *= v;
      }
      return prod;
    }
    function pathLabel(node) {
      return pathFromRoot(node).map(n => n.branchLabel || '·').join(' & ');
    }
    function leaves(node, acc = []) {
      if (!node.children || node.children.length === 0) {
        if (node !== state.tree) acc.push(node);
        return acc;
      }
      node.children.forEach(c => leaves(c, acc));
      return acc;
    }
    function allNodes(root, acc = []) {
      acc.push(root);
      (root.children || []).forEach(c => allNodes(c, acc));
      return acc;
    }

    // ---------- Tidy: auto-layout ----------
    function tidyLayout(root = state.tree) {
      const VERT  = 3;
      const HORIZ = 5;
      const TOP_X = 1;
      const TOP_Y = 1;

      let leafIdx = 0;
      function walk(node, depth) {
        const x = TOP_X + depth * HORIZ;
        if (!node.children || node.children.length === 0) {
          const y = TOP_Y + leafIdx * VERT;
          leafIdx += 1;
          if (node === root) root.rootPos = { x, y };
          else node.pos = { x, y };
          return y;
        }
        const childYs = node.children.map(c => walk(c, depth + 1));
        const avgY = Math.round(childYs.reduce((a, b) => a + b, 0) / childYs.length);
        if (node === root) root.rootPos = { x, y: avgY };
        else node.pos = { x, y: avgY };
        return avgY;
      }
      walk(root, 0);
    }
    function tidyAndRender() {
      tidyLayout(state.tree);
      render();
    }

    // ---------- Rendering ----------
    function render() {
      const stage = document.getElementById('treeStage');
      const svg = document.getElementById('branchLayer');
      [...stage.querySelectorAll('.node, .branch-label')].forEach(n => n.remove());
      svg.innerHTML = '';

      // figure out stage size
      const nodes = allNodes(state.tree);
      let maxX = 0, maxY = 0;
      nodes.forEach(n => {
        const p = posOf(n);
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
      });
      const stageWidth  = Math.max(720, gridToPx(maxX + 3));
      const stageHeight = Math.max(440, gridToPx(maxY + 3));
      stage.style.width = stageWidth + 'px';
      stage.style.height = stageHeight + 'px';
      svg.setAttribute('width', stageWidth);
      svg.setAttribute('height', stageHeight);

      const parents = withParents(state.tree);

      function build(node) {
        const isRoot = node === state.tree;
        const isLeaf = !node.children || node.children.length === 0;
        const p = posOf(node);
        const px = gridToPx(p.x), py = gridToPx(p.y);

        if (!isRoot) {
          const parent = parents.get(node);
          const pp = posOf(parent);
          const ppx = gridToPx(pp.x), ppy = gridToPx(pp.y);

          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('stroke', '#94a3b8');
          line.setAttribute('stroke-width', '2.5');
          line.setAttribute('stroke-linecap', 'round');
          svg.appendChild(line);
          updateLineEndpoints(line, ppx, ppy, px, py);
          node.__line = line;

          const lab = document.createElement('div');
          lab.className = 'branch-label';
          lab.__nodeRef = node;

          const labelInput = document.createElement('input');
          labelInput.className = 'label-input';
          labelInput.value = node.branchLabel || '';
          labelInput.placeholder = 'event';
          labelInput.addEventListener('input', e => {
            node.branchLabel = e.target.value;
            updateOutcomes();
          });

          const sep = document.createElement('span');
          sep.className = 'sep';
          sep.textContent = 'P=';

          const probInput = document.createElement('input');
          probInput.className = 'prob-input';
          probInput.value = node.branchProb || '';
          probInput.placeholder = '?';
          probInput.addEventListener('input', e => {
            node.branchProb = e.target.value;
            updateValidation();
            updateOutcomes();
          });

          lab.appendChild(labelInput);
          lab.appendChild(sep);
          lab.appendChild(probInput);
          stage.appendChild(lab);
          updateLabelPosition(lab, ppx, ppy, px, py);
          node.__label = lab;
        }

        const div = document.createElement('div');
        div.className = 'node' + (isRoot ? ' root' : '') + (isLeaf ? ' leaf' : '');
        div.style.left = px + 'px';
        div.style.top = py + 'px';

        if (isRoot && state.tree.rootLabel) {
          const rl = document.createElement('span');
          rl.className = 'root-label';
          rl.textContent = state.tree.rootLabel;
          div.appendChild(rl);
        }

        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.title = 'Drag to move';
        div.appendChild(dot);
        installDrag(node, div, dot);

        const actions = document.createElement('span');
        actions.className = 'actions';
        const addBtn = document.createElement('button');
        addBtn.className = 'add';
        addBtn.textContent = '+';
        addBtn.title = 'Add a child branch';
        addBtn.addEventListener('click', () => addChild(node));
        actions.appendChild(addBtn);
        if (!isRoot) {
          const delBtn = document.createElement('button');
          delBtn.className = 'del';
          delBtn.textContent = '×';
          delBtn.title = 'Delete this branch';
          delBtn.addEventListener('click', () => {
            const parent = parents.get(node);
            const idx = parent.children.indexOf(node);
            if (idx >= 0) removeNode(parent, idx);
          });
          actions.appendChild(delBtn);
        }
        div.appendChild(actions);

        if (isLeaf && !isRoot) {
          const pp = pathProbability(node);
          if (isFinite(pp)) {
            const lp = document.createElement('span');
            lp.className = 'leaf-prob';
            lp.textContent = fmt(pp);
            div.appendChild(lp);
          }
        }

        stage.appendChild(div);
        node.__div = div;

        (node.children || []).forEach(build);
      }
      build(state.tree);

      updateValidation();
      updateOutcomes();
    }

    function updateLineEndpoints(line, ppx, ppy, px, py) {
      // Connect line endpoints to the centers of parent and child;
      // the node DOM elements are stacked above the SVG so the dots
      // visually cover the line tips.
      line.setAttribute('x1', ppx);
      line.setAttribute('y1', ppy);
      line.setAttribute('x2', px);
      line.setAttribute('y2', py);
    }
    function updateLabelPosition(lab, ppx, ppy, px, py) {
      lab.style.left = ((ppx + px) / 2) + 'px';
      lab.style.top  = ((ppy + py) / 2) + 'px';
    }

    // ---------- Drag ----------
    function installDrag(node, div, dot) {
      dot.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        dot.setPointerCapture(e.pointerId);
        div.classList.add('dragging');

        const startX = e.clientX, startY = e.clientY;
        const startGrid = { ...posOf(node) };
        let currentPx = { x: gridToPx(startGrid.x), y: gridToPx(startGrid.y) };

        const parents = withParents(state.tree);
        const parent = parents.get(node);
        const childList = node.children || [];

        function onMove(ev) {
          const dx = ev.clientX - startX;
          const dy = ev.clientY - startY;
          const candidate = {
            x: gridToPx(startGrid.x) + dx,
            y: gridToPx(startGrid.y) + dy,
          };
          currentPx = applyMagnetPx(candidate);

          div.style.left = currentPx.x + 'px';
          div.style.top  = currentPx.y + 'px';

          if (parent && node.__line) {
            const pp = posOf(parent);
            const ppx = gridToPx(pp.x), ppy = gridToPx(pp.y);
            updateLineEndpoints(node.__line, ppx, ppy, currentPx.x, currentPx.y);
            updateLabelPosition(node.__label, ppx, ppy, currentPx.x, currentPx.y);
          }
          for (const c of childList) {
            if (!c.__line) continue;
            const cp = posOf(c);
            const cpx = gridToPx(cp.x), cpy = gridToPx(cp.y);
            updateLineEndpoints(c.__line, currentPx.x, currentPx.y, cpx, cpy);
            updateLabelPosition(c.__label, currentPx.x, currentPx.y, cpx, cpy);
          }

          // grow the stage if needed
          const stage = document.getElementById('treeStage');
          const svg = document.getElementById('branchLayer');
          const minW = currentPx.x + 100;
          const minH = currentPx.y + 100;
          const curW = parseFloat(stage.style.width) || 0;
          const curH = parseFloat(stage.style.height) || 0;
          if (minW > curW) {
            stage.style.width = minW + 'px';
            svg.setAttribute('width', minW);
          }
          if (minH > curH) {
            stage.style.height = minH + 'px';
            svg.setAttribute('height', minH);
          }
        }
        function onUp(ev) {
          try { dot.releasePointerCapture(ev.pointerId); } catch {}
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          window.removeEventListener('pointercancel', onUp);
          div.classList.remove('dragging');

          let gx = pxToGridFloat(currentPx.x);
          let gy = pxToGridFloat(currentPx.y);
          if (gx < 0) gx = 0;
          if (gy < 0) gy = 0;
          setPos(node, { x: gx, y: gy });
          render();
        }
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
      });
    }

    // ---------- Validation panel ----------
    function updateValidation() {
      const list = document.getElementById('validationList');
      list.innerHTML = '';
      document.querySelectorAll('.branch-label').forEach(el => el.classList.remove('bad-sum'));

      const issues = [];
      function check(node, pathName) {
        if (!node.children || node.children.length === 0) return;
        let sum = 0, allFilled = true;
        for (const c of node.children) {
          const v = parseProb(c.branchProb);
          if (!isFinite(v)) { allFilled = false; break; }
          sum += v;
        }
        if (allFilled) {
          if (!approxEq(sum, 1)) {
            issues.push({ kind: 'bad', text: `Children of "${pathName || 'root'}" sum to ${fmt(sum)}, not 1` });
          } else {
            issues.push({ kind: 'ok', text: `Children of "${pathName || 'root'}" sum to 1 ✓` });
          }
        } else {
          issues.push({ kind: 'info', text: `Children of "${pathName || 'root'}": some probabilities missing` });
        }
        node.children.forEach(c => {
          const next = pathName ? `${pathName} → ${c.branchLabel || '·'}` : (c.branchLabel || '·');
          check(c, next);
        });
      }
      check(state.tree, '');

      if (issues.length === 0) {
        const d = document.createElement('div');
        d.className = 'check-item info';
        d.textContent = 'Add some branches to begin.';
        list.appendChild(d);
      }
      issues.forEach(i => {
        const d = document.createElement('div');
        d.className = 'check-item ' + i.kind;
        d.textContent = i.text;
        list.appendChild(d);
      });

      const labelByNode = new Map();
      document.querySelectorAll('.branch-label').forEach(el => {
        if (el.__nodeRef) labelByNode.set(el.__nodeRef, el);
      });
      function markBad(node) {
        if (!node.children || node.children.length === 0) return;
        let sum = 0, allFilled = true;
        for (const c of node.children) {
          const v = parseProb(c.branchProb);
          if (!isFinite(v)) { allFilled = false; break; }
          sum += v;
        }
        if (allFilled && !approxEq(sum, 1)) {
          for (const c of node.children) {
            const el = labelByNode.get(c);
            if (el) el.classList.add('bad-sum');
          }
        }
        node.children.forEach(markBad);
      }
      markBad(state.tree);
    }

    // ---------- Outcomes ----------
    function updateOutcomes() {
      allNodes(state.tree).forEach(n => {
        if (!n.__div) return;
        const old = n.__div.querySelector('.leaf-prob');
        if (old) old.remove();
        const isLeaf = !n.children || n.children.length === 0;
        if (isLeaf && n !== state.tree) {
          const p = pathProbability(n);
          if (isFinite(p)) {
            const lp = document.createElement('span');
            lp.className = 'leaf-prob';
            lp.textContent = fmt(p);
            n.__div.appendChild(lp);
          }
        }
      });

      const list = document.getElementById('leafList');
      list.innerHTML = '';
      const ls = leaves(state.tree);
      if (ls.length === 0) {
        const li = document.createElement('li');
        li.innerHTML = '<span class="path">(no outcomes yet)</span>';
        list.appendChild(li);
        return;
      }
      let total = 0, allFilled = true;
      ls.forEach(leaf => {
        const li = document.createElement('li');
        const p = pathProbability(leaf);
        if (!isFinite(p)) allFilled = false; else total += p;
        const lab = pathLabel(leaf) || '·';
        li.innerHTML = `<span class="path">${escapeHtml(lab)}</span><span class="prob">${isFinite(p) ? fmt(p) : '?'}</span>`;
        list.appendChild(li);
      });
      const li = document.createElement('li');
      const ok = allFilled && approxEq(total, 1);
      li.innerHTML = `<span class="path"><b>Total</b></span><span class="prob" style="color:${ok ? 'var(--green)' : (allFilled ? 'var(--red)' : 'var(--gray)')}">${allFilled ? fmt(total) : '—'}</span>`;
      list.appendChild(li);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    // ---------- Problem panel ----------
    function renderProblem() {
      const panel = document.getElementById('problemPanel');
      const title = document.getElementById('problemTitle');
      const text = document.getElementById('problemText');
      const tag = document.getElementById('scaffoldTag');
      const qSection = document.getElementById('questionsSection');
      const qList = document.getElementById('questionList');

      qList.innerHTML = '';
      if (!state.problem) {
        panel.classList.add('empty');
        qSection.hidden = true;
        return;
      }
      panel.classList.remove('empty');
      title.textContent = state.problem.title || 'Untitled problem';
      text.textContent = state.problem.problem || '';
      if (state.problem.scaffold) {
        tag.textContent = state.problem.scaffold;
        tag.style.display = '';
      } else {
        tag.style.display = 'none';
      }

      const qs = state.problem.questions || [];
      if (qs.length === 0) { qSection.hidden = true; return; }
      qSection.hidden = false;
      qs.forEach((q, i) => {
        const div = document.createElement('div');
        div.className = 'question';
        const prompt = document.createElement('div');
        prompt.textContent = `${i + 1}. ${q.prompt}`;
        div.appendChild(prompt);
        if (q.answer != null && q.answer !== '') {
          const btn = document.createElement('button');
          btn.className = 'toggle-answer';
          btn.textContent = 'Show answer';
          btn.addEventListener('click', () => {
            div.classList.toggle('show-answer');
            btn.textContent = div.classList.contains('show-answer') ? 'Hide answer' : 'Show answer';
          });
          div.appendChild(btn);
          const ans = document.createElement('div');
          ans.className = 'answer';
          ans.textContent = `Answer: ${q.answer}`;
          div.appendChild(ans);
        }
        qList.appendChild(div);
      });
    }

    // ---------- Examples ----------
    async function loadManifest() {
      try {
        const res = await fetch('examples/manifest.json');
        if (!res.ok) return;
        const manifest = await res.json();
        const sel = document.getElementById('exampleSelect');
        (manifest.examples || []).forEach(ex => {
          const opt = document.createElement('option');
          opt.value = ex.file;
          const tier = ex.scaffold ? ` [${ex.scaffold}]` : '';
          opt.textContent = `${ex.title}${tier}`;
          sel.appendChild(opt);
        });
      } catch (e) {
        console.warn('Could not load examples manifest:', e);
      }
    }
    async function loadExampleByFile(file) {
      try {
        const res = await fetch('examples/' + file);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        applyExample(data);
      } catch (e) {
        alert('Could not load example: ' + e.message + '\n\nIf you opened this file directly (file://), browsers block fetch. Use Load file… instead, or serve via a local web server.');
      }
    }
    function applyExample(data) {
      if (data && data.tree) {
        state.tree = sanitizeTree(data.tree);
        state.problem = {
          title: data.title || '',
          problem: data.problem || '',
          scaffold: data.scaffold || '',
          questions: data.questions || [],
        };
      } else if (data && (data.children || data.rootLabel)) {
        state.tree = sanitizeTree(data);
        state.problem = null;
      } else {
        alert('Not a recognized tree-diagram JSON file.');
        return;
      }
      if (!hasAllPositions(state.tree)) tidyLayout(state.tree);
      renderProblem();
      render();
    }
    function hasAllPositions(tree) {
      if (!tree.rootPos) return false;
      let ok = true;
      function walk(node) {
        (node.children || []).forEach(c => {
          if (!c.pos) ok = false;
          walk(c);
        });
      }
      walk(tree);
      return ok;
    }
    function sanitizeTree(t) {
      return {
        rootLabel: t.rootLabel || 'Start',
        rootPos: t.rootPos ? { x: Number(t.rootPos.x) || 0, y: Number(t.rootPos.y) || 0 } : undefined,
        children: (t.children || []).map(sanitizeChild),
      };
    }
    function sanitizeChild(c) {
      return {
        branchLabel: c.branchLabel || '',
        branchProb: c.branchProb == null ? '' : String(c.branchProb),
        pos: c.pos ? { x: Number(c.pos.x) || 0, y: Number(c.pos.y) || 0 } : undefined,
        children: (c.children || []).map(sanitizeChild),
      };
    }
    function exportTree() {
      const data = {
        title: state.problem?.title || 'Untitled',
        problem: state.problem?.problem || '',
        scaffold: state.problem?.scaffold || '',
        tree: stripDomRefs(state.tree),
        questions: state.problem?.questions || [],
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const safe = (data.title || 'tree').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      a.download = (safe || 'tree') + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }
    function stripDomRefs(node) {
      const cp = {};
      for (const k of Object.keys(node)) {
        if (k.startsWith('__')) continue;
        if (k === 'children') {
          cp.children = (node.children || []).map(stripDomRefs);
        } else {
          cp[k] = node[k];
        }
      }
      return cp;
    }

    // ---------- Wire up UI ----------
    document.getElementById('newTree').addEventListener('click', () => {
      state.tree = blankTree();
      state.problem = null;
      addChild(state.tree);
      addChild(state.tree);
      renderProblem();
    });
    document.getElementById('tidyTree').addEventListener('click', tidyAndRender);
    document.getElementById('magnetBtn').addEventListener('click', cycleMagnet);
    document.getElementById('exampleSelect').addEventListener('change', e => {
      const f = e.target.value;
      if (f) loadExampleByFile(f);
      e.target.value = '';
    });
    document.getElementById('fileInput').addEventListener('change', e => {
      const f = e.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        try { applyExample(JSON.parse(reader.result)); }
        catch (err) { alert('Could not parse JSON: ' + err.message); }
      };
      reader.readAsText(f);
      e.target.value = '';
    });
    document.getElementById('exportFile').addEventListener('click', exportTree);

    // Drag-and-drop a .json file anywhere on the page
    window.addEventListener('dragover', e => { e.preventDefault(); });
    window.addEventListener('drop', e => {
      e.preventDefault();
      const f = e.dataTransfer.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        try { applyExample(JSON.parse(reader.result)); }
        catch (err) { alert('Could not parse JSON: ' + err.message); }
      };
      reader.readAsText(f);
    });

    // ---------- Initial state ----------
    state.tree = blankTree();
    addChild(state.tree);
    addChild(state.tree);
    loadManifest();
    renderProblem();
  </script>
</body>
</html>
