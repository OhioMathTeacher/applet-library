<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tree Diagram Builder</title>
  <style>
    :root {
      --blue: #2563eb;
      --blue-soft: #dbeafe;
      --green: #16a34a;
      --green-soft: #dcfce7;
      --red: #dc2626;
      --red-soft: #fee2e2;
      --gray: #6b7280;
      --gray-soft: #f3f4f6;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      background: #fff;
      color: #222;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 1.4em; }
    header h1 a { color: inherit; text-decoration: none; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .toolbar button, .toolbar select, .toolbar label.file-btn {
      font: inherit;
      padding: 6px 12px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
    }
    .toolbar button:hover, .toolbar label.file-btn:hover { background: var(--gray-soft); }
    .toolbar button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .toolbar button.primary:hover { background: #1e40af; }

    #problemPanel {
      padding: 12px 24px;
      background: var(--blue-soft);
      border-bottom: 1px solid var(--border);
    }
    #problemPanel.empty { display: none; }
    #problemTitle { margin: 0 0 4px 0; font-size: 1.1em; }
    #problemText { margin: 0; white-space: pre-wrap; }
    #scaffoldTag {
      display: inline-block;
      font-size: 0.8em;
      padding: 2px 8px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--border);
      margin-left: 8px;
      vertical-align: middle;
    }

    main {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 0;
      min-height: 60vh;
    }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
    }

    #treeContainer {
      position: relative;
      overflow: auto;
      padding: 24px;
      background:
        linear-gradient(#fafafa 1px, transparent 1px) 0 0 / 100% 40px,
        #fff;
    }
    #treeStage {
      position: relative;
    }
    #branchLayer {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
    }
    .node {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .node .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--blue);
      flex-shrink: 0;
    }
    .node.leaf .dot { background: var(--gray); }
    .node.root .dot { background: #111; width: 18px; height: 18px; }
    .node .actions {
      display: flex;
      gap: 2px;
      margin-left: 4px;
    }
    .node .actions button {
      font: inherit;
      width: 22px;
      height: 22px;
      padding: 0;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 50%;
      cursor: pointer;
      line-height: 1;
      font-size: 14px;
      color: var(--gray);
    }
    .node .actions button:hover { background: var(--gray-soft); color: #111; }
    .node .actions button.add { color: var(--green); border-color: var(--green); }
    .node .actions button.del { color: var(--red); border-color: var(--red); }
    .node .leaf-prob {
      margin-left: 6px;
      padding: 2px 8px;
      background: var(--gray-soft);
      border-radius: 4px;
      font-variant-numeric: tabular-nums;
      font-size: 0.9em;
      white-space: nowrap;
    }
    .node .root-label {
      font-weight: 600;
      margin-right: 4px;
    }

    .branch-label {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 4px;
      align-items: center;
      background: #fff;
      padding: 2px 4px;
      border-radius: 4px;
      box-shadow: 0 0 0 1px var(--border);
    }
    .branch-label input {
      font: inherit;
      border: 1px solid transparent;
      border-radius: 3px;
      padding: 2px 4px;
      background: transparent;
      width: 60px;
    }
    .branch-label input.label-input { width: 90px; }
    .branch-label input.prob-input { width: 50px; text-align: center; font-variant-numeric: tabular-nums; }
    .branch-label input:focus { outline: none; border-color: var(--blue); background: #fff; }
    .branch-label input::placeholder { color: #bbb; }
    .branch-label.bad-sum {
      background: var(--red-soft);
      box-shadow: 0 0 0 1px var(--red);
    }
    .branch-label .sep { color: var(--gray); font-size: 0.85em; }

    aside {
      border-left: 1px solid var(--border);
      padding: 16px 20px;
      background: #fafafa;
      overflow-y: auto;
    }
    aside h3 {
      margin: 0 0 8px 0;
      font-size: 0.95em;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--gray);
    }
    aside section { margin-bottom: 24px; }
    .check-item {
      padding: 6px 8px;
      border-radius: 4px;
      margin-bottom: 4px;
      font-size: 0.9em;
    }
    .check-item.ok { background: var(--green-soft); color: #166534; }
    .check-item.bad { background: var(--red-soft); color: #991b1b; }
    .check-item.info { background: var(--gray-soft); color: #374151; }
    .leaf-list { list-style: none; padding: 0; margin: 0; font-size: 0.9em; }
    .leaf-list li {
      padding: 4px 0;
      border-bottom: 1px dashed var(--border);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .leaf-list li:last-child { border-bottom: none; }
    .leaf-list .path { color: #374151; }
    .leaf-list .prob { font-variant-numeric: tabular-nums; color: var(--blue); font-weight: 600; }
    .question {
      padding: 8px 10px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 0.9em;
    }
    .question .answer {
      display: none;
      margin-top: 4px;
      color: var(--green);
      font-weight: 600;
    }
    .question.show-answer .answer { display: block; }
    .question button.toggle-answer {
      font: inherit;
      font-size: 0.85em;
      margin-top: 4px;
      padding: 2px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
    }
    .empty-state {
      padding: 40px;
      text-align: center;
      color: var(--gray);
    }
    .empty-state code {
      background: var(--gray-soft);
      padding: 2px 6px;
      border-radius: 3px;
    }
    footer {
      padding: 12px 24px;
      border-top: 1px solid var(--border);
      font-size: 0.85em;
      color: var(--gray);
      background: #fafafa;
    }
    footer a { color: var(--blue); }
  </style>
</head>
<body>
  <header>
    <h1><a href="../index.html">🧩 Applet Library</a> &rsaquo; Tree Diagram Builder</h1>
    <div class="toolbar">
      <button id="newTree" class="primary">New blank tree</button>
      <select id="exampleSelect">
        <option value="">Load example…</option>
      </select>
      <label class="file-btn">
        Load file…
        <input type="file" id="fileInput" accept="application/json,.json" hidden>
      </label>
      <button id="exportFile">Export JSON</button>
    </div>
  </header>

  <section id="problemPanel" class="empty">
    <h2 id="problemTitle"></h2>
    <span id="scaffoldTag"></span>
    <p id="problemText"></p>
  </section>

  <main>
    <div id="treeContainer">
      <div id="treeStage">
        <svg id="branchLayer"></svg>
      </div>
    </div>
    <aside>
      <section>
        <h3>Validation</h3>
        <div id="validationList"></div>
      </section>
      <section>
        <h3>Outcomes</h3>
        <ul id="leafList" class="leaf-list"></ul>
      </section>
      <section id="questionsSection" hidden>
        <h3>Questions</h3>
        <div id="questionList"></div>
      </section>
    </aside>
  </main>

  <footer>
    Build a probability tree by clicking <b>+</b> on a node to add child branches. Type fractions like <code>1/2</code> or decimals like <code>0.5</code>. Sibling probabilities should sum to 1.
  </footer>

  <script>
    // ---------- State ----------
    const state = {
      tree: blankTree(),
      problem: null,
    };

    function blankTree() {
      return { rootLabel: 'Start', children: [] };
    }
    function emptyChild() {
      return { branchLabel: '', branchProb: '', children: [] };
    }

    // ---------- Probability helpers ----------
    function parseProb(s) {
      if (s == null) return NaN;
      const t = String(s).trim();
      if (!t) return NaN;
      if (t.includes('/')) {
        const parts = t.split('/');
        if (parts.length !== 2) return NaN;
        const a = Number(parts[0]);
        const b = Number(parts[1]);
        if (!isFinite(a) || !isFinite(b) || b === 0) return NaN;
        return a / b;
      }
      const n = Number(t);
      return isFinite(n) ? n : NaN;
    }
    function fmt(n) {
      if (!isFinite(n)) return '—';
      // try a small denominator fraction
      for (let d = 2; d <= 64; d++) {
        const num = n * d;
        if (Math.abs(num - Math.round(num)) < 1e-9) {
          const top = Math.round(num);
          if (top === 0) return '0';
          if (top === d) return '1';
          // simplify
          const g = gcd(Math.abs(top), d);
          return `${top / g}/${d / g}`;
        }
      }
      return n.toFixed(4).replace(/0+$/, '').replace(/\.$/, '');
    }
    function gcd(a, b) { return b ? gcd(b, a % b) : a; }
    function approxEq(a, b, eps = 1e-6) { return Math.abs(a - b) < eps; }

    // ---------- Tree operations ----------
    function addChild(node) {
      node.children = node.children || [];
      node.children.push(emptyChild());
      // a sensible default: if there's exactly one other child with probability set,
      // we don't auto-fill (let students think about it)
      render();
    }
    function removeNode(parent, idx) {
      parent.children.splice(idx, 1);
      render();
    }

    // Walk and lay out
    function leafCount(node) {
      if (!node.children || node.children.length === 0) return 1;
      return node.children.reduce((s, c) => s + leafCount(c), 0);
    }
    function maxDepth(node, d = 0) {
      if (!node.children || node.children.length === 0) return d;
      return Math.max(...node.children.map(c => maxDepth(c, d + 1)));
    }

    // ---------- Rendering ----------
    const COL_WIDTH = 220;
    const ROW_HEIGHT = 60;
    const PAD_X = 40;
    const PAD_Y = 40;

    function render() {
      const stage = document.getElementById('treeStage');
      const svg = document.getElementById('branchLayer');
      // clear previous nodes (but keep svg)
      [...stage.querySelectorAll('.node, .branch-label')].forEach(n => n.remove());
      svg.innerHTML = '';

      const totalLeaves = leafCount(state.tree);
      const depth = maxDepth(state.tree);
      const stageWidth = PAD_X * 2 + (depth + 1) * COL_WIDTH;
      const stageHeight = PAD_Y * 2 + Math.max(1, totalLeaves) * ROW_HEIGHT;
      stage.style.width = stageWidth + 'px';
      stage.style.height = stageHeight + 'px';
      svg.setAttribute('width', stageWidth);
      svg.setAttribute('height', stageHeight);

      // compute positions
      const positions = [];
      function place(node, parent, parentIdx, depthLevel, yStart) {
        const span = leafCount(node);
        const cx = PAD_X + depthLevel * COL_WIDTH;
        const cy = yStart + (span * ROW_HEIGHT) / 2;
        const entry = { node, parent, parentIdx, x: cx, y: cy, depth: depthLevel };
        positions.push(entry);
        let yy = yStart;
        (node.children || []).forEach((c, i) => {
          place(c, node, i, depthLevel + 1, yy);
          yy += leafCount(c) * ROW_HEIGHT;
        });
        return entry;
      }
      place(state.tree, null, -1, 0, PAD_Y);

      // index by node for parent lookup
      const byNode = new Map();
      positions.forEach(p => byNode.set(p.node, p));

      // draw branches and nodes
      positions.forEach(entry => {
        const { node, parent, x, y, depth: d } = entry;

        if (parent) {
          const p = byNode.get(parent);
          // draw line
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', p.x + 10);
          line.setAttribute('y1', p.y);
          line.setAttribute('x2', x - 10);
          line.setAttribute('y2', y);
          line.setAttribute('stroke', '#94a3b8');
          line.setAttribute('stroke-width', '2');
          svg.appendChild(line);

          // branch label at midpoint
          const mx = (p.x + x) / 2;
          const my = (p.y + y) / 2 - 14;
          const lab = document.createElement('div');
          lab.className = 'branch-label';
          lab.style.left = mx + 'px';
          lab.style.top = my + 'px';

          const labelInput = document.createElement('input');
          labelInput.className = 'label-input';
          labelInput.value = node.branchLabel || '';
          labelInput.placeholder = 'event';
          labelInput.addEventListener('input', e => {
            node.branchLabel = e.target.value;
            updateOutcomes();
          });

          const sep = document.createElement('span');
          sep.className = 'sep';
          sep.textContent = 'P=';

          const probInput = document.createElement('input');
          probInput.className = 'prob-input';
          probInput.value = node.branchProb || '';
          probInput.placeholder = '?';
          probInput.addEventListener('input', e => {
            node.branchProb = e.target.value;
            updateValidation();
            updateOutcomes();
          });

          lab.appendChild(labelInput);
          lab.appendChild(sep);
          lab.appendChild(probInput);
          lab.__nodeRef = node;
          stage.appendChild(lab);
        }

        // node element
        const div = document.createElement('div');
        const isRoot = !parent;
        const isLeaf = !node.children || node.children.length === 0;
        div.className = 'node' + (isRoot ? ' root' : '') + (isLeaf ? ' leaf' : '');
        div.style.left = x + 'px';
        div.style.top = y + 'px';

        if (isRoot && state.tree.rootLabel) {
          const rl = document.createElement('span');
          rl.className = 'root-label';
          rl.textContent = state.tree.rootLabel;
          div.appendChild(rl);
        }

        const dot = document.createElement('span');
        dot.className = 'dot';
        div.appendChild(dot);

        const actions = document.createElement('span');
        actions.className = 'actions';

        const addBtn = document.createElement('button');
        addBtn.className = 'add';
        addBtn.textContent = '+';
        addBtn.title = 'Add a child branch';
        addBtn.addEventListener('click', () => addChild(node));
        actions.appendChild(addBtn);

        if (!isRoot) {
          const delBtn = document.createElement('button');
          delBtn.className = 'del';
          delBtn.textContent = '×';
          delBtn.title = 'Delete this branch';
          delBtn.addEventListener('click', () => removeNode(parent, entry.parentIdx));
          actions.appendChild(delBtn);
        }
        div.appendChild(actions);

        if (isLeaf && !isRoot) {
          const lp = document.createElement('span');
          lp.className = 'leaf-prob';
          const p = pathProbability(node);
          lp.textContent = isFinite(p) ? fmt(p) : '?';
          div.appendChild(lp);
        }

        stage.appendChild(div);
      });

      updateValidation();
      updateOutcomes();
    }

    // ---------- Path probability + outcomes ----------
    // Build parent map
    function withParents(root) {
      const parents = new Map();
      function walk(node, parent) {
        parents.set(node, parent);
        (node.children || []).forEach(c => walk(c, node));
      }
      walk(root, null);
      return parents;
    }
    function pathFromRoot(node) {
      const parents = withParents(state.tree);
      const path = [];
      let cur = node;
      while (cur && parents.get(cur) !== null && parents.get(cur) !== undefined) {
        path.unshift(cur);
        cur = parents.get(cur);
        if (cur === state.tree) break;
      }
      return path;
    }
    function pathProbability(node) {
      const path = pathFromRoot(node);
      if (path.length === 0) return NaN;
      let prod = 1;
      for (const n of path) {
        const v = parseProb(n.branchProb);
        if (!isFinite(v)) return NaN;
        prod *= v;
      }
      return prod;
    }
    function pathLabel(node) {
      const path = pathFromRoot(node);
      return path.map(n => n.branchLabel || '·').join(' & ');
    }

    function leaves(node, acc = []) {
      if (!node.children || node.children.length === 0) {
        if (node !== state.tree) acc.push(node);
        return acc;
      }
      node.children.forEach(c => leaves(c, acc));
      return acc;
    }

    // ---------- Validation + outcomes panels ----------
    function updateValidation() {
      const list = document.getElementById('validationList');
      list.innerHTML = '';

      // mark bad-sum branch labels
      document.querySelectorAll('.branch-label').forEach(el => el.classList.remove('bad-sum'));

      const issues = [];
      function checkSiblings(node, pathName) {
        if (!node.children || node.children.length === 0) return;
        let sum = 0;
        let allFilled = true;
        for (const c of node.children) {
          const v = parseProb(c.branchProb);
          if (!isFinite(v)) { allFilled = false; break; }
          sum += v;
        }
        if (allFilled) {
          if (!approxEq(sum, 1)) {
            issues.push({
              kind: 'bad',
              text: `Children of "${pathName || 'root'}" sum to ${fmt(sum)}, not 1`,
              node,
            });
          } else {
            issues.push({
              kind: 'ok',
              text: `Children of "${pathName || 'root'}" sum to 1 ✓`,
            });
          }
        } else {
          issues.push({
            kind: 'info',
            text: `Children of "${pathName || 'root'}": some probabilities missing`,
          });
        }
        node.children.forEach(c => {
          const next = pathName ? `${pathName} → ${c.branchLabel || '·'}` : (c.branchLabel || '·');
          checkSiblings(c, next);
        });
      }
      checkSiblings(state.tree, '');

      if (issues.length === 0) {
        const d = document.createElement('div');
        d.className = 'check-item info';
        d.textContent = 'Add some branches to begin.';
        list.appendChild(d);
      }
      issues.forEach(i => {
        const d = document.createElement('div');
        d.className = 'check-item ' + i.kind;
        d.textContent = i.text;
        list.appendChild(d);
      });

      // mark each bad-sum visually on the children's branch labels
      const labelByNode = new Map();
      document.querySelectorAll('.branch-label').forEach(el => {
        if (el.__nodeRef) labelByNode.set(el.__nodeRef, el);
      });
      function markBad(node) {
        if (!node.children || node.children.length === 0) return;
        let sum = 0, allFilled = true;
        for (const c of node.children) {
          const v = parseProb(c.branchProb);
          if (!isFinite(v)) { allFilled = false; break; }
          sum += v;
        }
        if (allFilled && !approxEq(sum, 1)) {
          for (const c of node.children) {
            const el = labelByNode.get(c);
            if (el) el.classList.add('bad-sum');
          }
        }
        node.children.forEach(markBad);
      }
      markBad(state.tree);
    }

    function updateOutcomes() {
      // Refresh leaf path probability badges already shown in nodes
      document.querySelectorAll('.node.leaf .leaf-prob').forEach(el => el.remove());
      const positions = collectPositions();
      const byNode = new Map(positions.map(p => [p.node, p]));
      positions.forEach(entry => {
        const { node, parent, x, y } = entry;
        const isLeaf = !node.children || node.children.length === 0;
        if (isLeaf && parent) {
          // find the matching node div
          const nodeDiv = [...document.querySelectorAll('.node.leaf')]
            .find(d => Math.abs(parseFloat(d.style.left) - x) < 0.5 &&
                       Math.abs(parseFloat(d.style.top) - y) < 0.5);
          if (nodeDiv) {
            const lp = document.createElement('span');
            lp.className = 'leaf-prob';
            const p = pathProbability(node);
            lp.textContent = isFinite(p) ? fmt(p) : '?';
            nodeDiv.appendChild(lp);
          }
        }
      });

      // outcomes side panel
      const list = document.getElementById('leafList');
      list.innerHTML = '';
      const ls = leaves(state.tree);
      if (ls.length === 0) {
        const li = document.createElement('li');
        li.innerHTML = '<span class="path">(no outcomes yet)</span>';
        list.appendChild(li);
        return;
      }
      let total = 0, allFilled = true;
      ls.forEach(leaf => {
        const li = document.createElement('li');
        const p = pathProbability(leaf);
        if (!isFinite(p)) allFilled = false; else total += p;
        const lab = pathLabel(leaf) || '·';
        li.innerHTML = `<span class="path">${escapeHtml(lab)}</span><span class="prob">${isFinite(p) ? fmt(p) : '?'}</span>`;
        list.appendChild(li);
      });
      const li = document.createElement('li');
      const ok = allFilled && approxEq(total, 1);
      li.innerHTML = `<span class="path"><b>Total</b></span><span class="prob" style="color:${ok ? 'var(--green)' : (allFilled ? 'var(--red)' : 'var(--gray)')}">${allFilled ? fmt(total) : '—'}</span>`;
      list.appendChild(li);
    }

    function collectPositions() {
      const positions = [];
      function place(node, parent, parentIdx, depthLevel, yStart) {
        const span = leafCount(node);
        const cx = PAD_X + depthLevel * COL_WIDTH;
        const cy = yStart + (span * ROW_HEIGHT) / 2;
        positions.push({ node, parent, parentIdx, x: cx, y: cy, depth: depthLevel });
        let yy = yStart;
        (node.children || []).forEach((c, i) => {
          place(c, node, i, depthLevel + 1, yy);
          yy += leafCount(c) * ROW_HEIGHT;
        });
      }
      place(state.tree, null, -1, 0, PAD_Y);
      return positions;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    // ---------- Problem panel ----------
    function renderProblem() {
      const panel = document.getElementById('problemPanel');
      const title = document.getElementById('problemTitle');
      const text = document.getElementById('problemText');
      const tag = document.getElementById('scaffoldTag');
      const qSection = document.getElementById('questionsSection');
      const qList = document.getElementById('questionList');

      qList.innerHTML = '';
      if (!state.problem) {
        panel.classList.add('empty');
        qSection.hidden = true;
        return;
      }
      panel.classList.remove('empty');
      title.textContent = state.problem.title || 'Untitled problem';
      text.textContent = state.problem.problem || '';
      if (state.problem.scaffold) {
        tag.textContent = state.problem.scaffold;
        tag.style.display = '';
      } else {
        tag.style.display = 'none';
      }

      const qs = state.problem.questions || [];
      if (qs.length === 0) { qSection.hidden = true; return; }
      qSection.hidden = false;
      qs.forEach((q, i) => {
        const div = document.createElement('div');
        div.className = 'question';
        const prompt = document.createElement('div');
        prompt.textContent = `${i + 1}. ${q.prompt}`;
        div.appendChild(prompt);
        if (q.answer != null && q.answer !== '') {
          const btn = document.createElement('button');
          btn.className = 'toggle-answer';
          btn.textContent = 'Show answer';
          btn.addEventListener('click', () => {
            div.classList.toggle('show-answer');
            btn.textContent = div.classList.contains('show-answer') ? 'Hide answer' : 'Show answer';
          });
          div.appendChild(btn);
          const ans = document.createElement('div');
          ans.className = 'answer';
          ans.textContent = `Answer: ${q.answer}`;
          div.appendChild(ans);
        }
        qList.appendChild(div);
      });
    }

    // ---------- Examples ----------
    async function loadManifest() {
      try {
        const res = await fetch('examples/manifest.json');
        if (!res.ok) return;
        const manifest = await res.json();
        const sel = document.getElementById('exampleSelect');
        (manifest.examples || []).forEach(ex => {
          const opt = document.createElement('option');
          opt.value = ex.file;
          const tier = ex.scaffold ? ` [${ex.scaffold}]` : '';
          opt.textContent = `${ex.title}${tier}`;
          sel.appendChild(opt);
        });
      } catch (e) {
        // fetch can fail when opened via file:// — that's fine
        console.warn('Could not load examples manifest:', e);
      }
    }
    async function loadExampleByFile(file) {
      try {
        const res = await fetch('examples/' + file);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        applyExample(data);
      } catch (e) {
        alert('Could not load example: ' + e.message + '\n\nIf you opened this file directly (file://), browsers block fetch. Use Load file… instead, or serve via a local web server.');
      }
    }
    function applyExample(data) {
      // Be permissive: accept either a bare tree (with children) or full doc
      if (data && data.tree) {
        state.tree = sanitizeTree(data.tree);
        state.problem = {
          title: data.title || '',
          problem: data.problem || '',
          scaffold: data.scaffold || '',
          questions: data.questions || [],
        };
      } else if (data && (data.children || data.rootLabel)) {
        state.tree = sanitizeTree(data);
        state.problem = null;
      } else {
        alert('Not a recognized tree-diagram JSON file.');
        return;
      }
      renderProblem();
      render();
    }
    function sanitizeTree(t) {
      const root = {
        rootLabel: t.rootLabel || 'Start',
        children: (t.children || []).map(sanitizeChild),
      };
      return root;
    }
    function sanitizeChild(c) {
      return {
        branchLabel: c.branchLabel || '',
        branchProb: c.branchProb == null ? '' : String(c.branchProb),
        children: (c.children || []).map(sanitizeChild),
      };
    }
    function exportTree() {
      const data = {
        title: state.problem?.title || 'Untitled',
        problem: state.problem?.problem || '',
        scaffold: state.problem?.scaffold || '',
        tree: state.tree,
        questions: state.problem?.questions || [],
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const safe = (data.title || 'tree').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      a.download = (safe || 'tree') + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    // ---------- Wire up UI ----------
    document.getElementById('newTree').addEventListener('click', () => {
      state.tree = blankTree();
      state.problem = null;
      renderProblem();
      render();
    });
    document.getElementById('exampleSelect').addEventListener('change', e => {
      const f = e.target.value;
      if (f) loadExampleByFile(f);
      e.target.value = '';
    });
    document.getElementById('fileInput').addEventListener('change', e => {
      const f = e.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          applyExample(JSON.parse(reader.result));
        } catch (err) {
          alert('Could not parse JSON: ' + err.message);
        }
      };
      reader.readAsText(f);
      e.target.value = '';
    });
    document.getElementById('exportFile').addEventListener('click', exportTree);

    // Drag-and-drop a .json file anywhere on the page
    window.addEventListener('dragover', e => { e.preventDefault(); });
    window.addEventListener('drop', e => {
      e.preventDefault();
      const f = e.dataTransfer.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        try { applyExample(JSON.parse(reader.result)); }
        catch (err) { alert('Could not parse JSON: ' + err.message); }
      };
      reader.readAsText(f);
    });

    // Initial state: blank with one branch hint
    state.tree = blankTree();
    addChild(state.tree); // start with one empty branch so the UI isn't empty
    addChild(state.tree);
    loadManifest();
    renderProblem();
    render();
  </script>
</body>
</html>
