/* A small seeded generator, so each building is the same every time. */
function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0)/4294967296;
  };
}

    const s = storyOf(r), hard = s + loop*4;
    let boards = 0;
    if (r > 1 && R() < 0.12 + hard*0.035) boards = (hard > 6 && R() < 0.35) ? 2 : 1;
    const bc = new Set();
    while (bc.size < boards) bc.add(Math.floor(R()*COLS));
    for (let c = 0; c < COLS; c++) {

      const per = Math.max(6.5, 10 - hard*0.2) + R()*3;

function scheduleMusic() {
  const now = actx.currentTime;

/* ---------------- input ---------------- */
/* Everything collapses onto the eight NES buttons. Keyboard and every
   connected pad are OR-ed together, so either works at any moment. */
const BTN = ['up','down','left','right','a','b','select','start'];
const KEYMAP = {
  ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down', ArrowLeft:'left', KeyA:'left',
  ArrowRight:'right', KeyD:'right', KeyZ:'a', KeyK:'a', Space:'a', KeyX:'b', KeyJ:'b',
  ShiftLeft:'select', ShiftRight:'select', Enter:'start', NumpadEnter:'start', KeyP:'start'
};
const key = {}, keyTap = {}, held = {}, prevHeld = {}, pressed = {};
let footMsg = '', footT = 0;
const footNote = m => { footMsg = m; footT = 3; };
addEventListener('keydown', e => {
  ensureAudio();
  const b = KEYMAP[e.code]; if (!b) return;
  e.preventDefault();

});
addEventListener('keyup', e => { const b = KEYMAP[e.code]; if (b) key[b] = false; });
addEventListener('blur', () => { for (const b of BTN) key[b] = false; });
for (const ev of ['mousedown', 'pointerdown', 'touchend']) addEventListener(ev, ensureAudio);
addEventListener('gamepadconnected', () => footNote('CONTROLLER CONNECTED'));
function pollInput() {
  const pad = {};
  for (const p of (navigator.getGamepads ? navigator.getGamepads() : [])) {
    if (!p) continue;
    const b = i => !!(p.buttons[i] && p.buttons[i].pressed);
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
    /* Cheap NES-style pads often report the D-pad as axes 0/1. */
    pad.up = pad.up || b(12) || ay < -0.5; pad.down = pad.down || b(13) || ay > 0.5;
    pad.left = pad.left || b(14) || ax < -0.5; pad.right = pad.right || b(15) || ax > 0.5;
    pad.a = pad.a || b(0); pad.b = pad.b || b(1);
    pad.select = pad.select || b(8); pad.start = pad.start || b(9);
  }
  for (const b of BTN) {
    held[b] = !!(key[b] || pad[b]);
    pressed[b] = (held[b] && !prevHeld[b]) || !!keyTap[b];
    if (pressed[b] && pad[b]) ensureAudio();
    keyTap[b] = false; prevHeld[b] = held[b];

/* The demo climber: up when it can, hop a shut window, shuffle toward a
   way up, flatten when something is coming. Never steps onto a sill whose
   shutters are already swinging. */
function demoInput() {
  for (const b of BTN) if (b !== 'start' && b !== 'select') { held[b] = false; pressed[b] = false; }
  if (state !== 'play' || P.mode !== 'idle') return;
  const pp = ppos();
  const danger = objs.some(o => o.kind !== 'gear' && o.y > pp.y - 4 && o.y - pp.y < 75 && Math.abs(o.x - pp.x) < 16 + o.hw)
    || bats.some(b => Math.abs(b.y - (pp.y + 9)) < 16 && Math.abs(b.x - pp.x) < 70);
  if (danger && (P.flat || P.breath > 0.3)) { held.b = true; return; }
  const ok = (r, c) => isOpen(r, c) && !(r > 0 && r <= ROWS && shut(r, c).warn);
  if (ok(P.r + 1, P.c)) { held.up = true; return; }
  if (P.r + 2 <= ROOF_ROW && ok(P.r + 2, P.c)) { pressed.a = true; return; }
  const here = P.r > 0 && P.r <= ROWS && shut(P.r, P.c).warn;
  for (const d of (P.c < 2 ? [1, -1] : [-1, 1])) {
    const c2 = P.c + d, dir = d < 0 ? 'left' : 'right';
    if (c2 < 0 || c2 >= COLS || !ok(P.r, c2)) continue;
    if (ok(P.r + 1, c2) || ok(P.r + 2, c2) || here) {
      held[dir] = true;
      if (gapBetween(P.r, P.c, c2)) pressed.a = true;
      return;
    }
  }
  if (here && ok(P.r - 1, P.c)) held.down = true;
}

/* ---------------- game state ---------------- */
let state = 'title', time = 0, score = 0, lives = 3, clock = 150, best = 0;
let hi = 0;
try { hi = +localStorage.getItem('twelve-stories-hi') || 0; } catch (e) {}
function saveHi() { if (score > hi) { hi = score; try { localStorage.setItem('twelve-stories-hi', String(hi)); } catch (e) {} } }
/* when: who is out. light: 0 = full night, 1 = full day. */
let when = 'day', light = 1, turning = 0;
let toast = '', toastT = 0, camB = -30, roofT = 0, bonus = 0, lastSec = 99;
let objs = [], throwers = [], bats = [], throwT = 2.5, batT = 3, stars = [];
const P = {r: 0, c: 2, fr: 0, fc: 2, t: 0, dur: 0, arc: 0, mode: 'idle', flat: false, breath: 1,
           inv: 0, deadT: 0, cause: '', bumpT: 0, anim: 0};
const isDay = () => light >= 0.5;
const clockFor = () => Math.max(120, 150 - loop*8);
function say(m, t = 2.5) { toast = m; toastT = t; }
for (let i = 0; i < 40; i++) stars.push({x: (i*97 + 13) % W, y: (i*53 + 7) % 220, tw: i % 7});

/* Dusk or dawn: a second and a half of the light sliding; halfway, the
   building changes who is at the windows. */
function turnTime() {
  if (turning) return;
  turning = when === 'night' ? 1 : -1;
  if (turning > 0) SFX.dawn(); else SFX.dusk();
  say(turning > 0 ? 'DAWN. THE SHUTTERS COME ALIVE' : 'DUSK. ONLY LIT WINDOWS THROW', 2);
}

/* ---------------- the player ---------------- */
const PACE = 0.65;
const CLIMB = 0.4;        // seconds to climb one window
function startMove(r, c, dur, arc, mode = 'move') {
  P.fr = P.r; P.fc = P.c; P.r = r; P.c = c; P.t = 0; P.dur = dur; P.arc = arc; P.mode = mode; P.flat = false;
}
function ppos() {
  if (P.mode === 'move' || P.mode === 'fall') {
    let k = Math.min(1, P.t/P.dur);
    if (P.mode === 'fall') k = k*k;
    return {x: colX(P.fc) + (colX(P.c) - colX(P.fc))*k,
            y: (P.fr + (P.r - P.fr)*k)*ROWH + Math.sin(k*Math.PI)*P.arc};
  }
  return {x: colX(P.c), y: P.r*ROWH};
}
function bump(msg) {
  if (P.bumpT > 0) return;
  P.bumpT = 0.3; SFX.bump();
  if (msg) footNote(msg);
}
/* A shutter closes on you: you fall to the first open sill below. */
function knock() {
  let d = P.r - 1;
  while (d > 0 && !isOpen(d, P.c)) d--;
  startMove(d, P.c, 0.14 + 0.07*(P.r - d), 0, 'fall');
  SFX.slam(); SFX.fall();
  say('SLAM! KNOCKED DOWN', 1.4);
}
function hurt(cause, force) {
  if (state !== 'play') return;
  if (!force && (DEMO || P.inv > 0)) return;
  state = 'dying'; P.deadT = 1.5; P.cause = cause; P.flat = false; SFX.hit();
}
function respawn() {
  let r = Math.min(P.r, ROWS);

  Object.assign(P, {r, fr: r, fc: P.c, mode: 'idle', flat: false, inv: 2, t: 0});
  const pp = ppos();
  objs = objs.filter(o => Math.abs(o.y - pp.y) > 120);

}
function arrive() {
  P.mode = 'idle';
  if (P.r === ROOF_ROW) { reachRoof(); return; }
  if (!isOpen(P.r, P.c)) { knock(); return; }
  const gw = P.r <= ROWS && WIN[P.r][P.c];
  if (gw && gw.gag && !gw.seen) {
    gw.seen = true; score += 50*(loop + 1);
    if (gw.gag === 'kiss') gw.curtain = time;
    say(GAG_SAY[gw.gag] + '  +' + 50*(loop + 1), 2); SFX.gag(gw.gag);
  }
  if (P.r > best) {
    for (let r = best + 1; r <= P.r && r <= ROWS; r++) {
      score += 10*storyOf(r)*(loop + 1);
      if ((r - 1) % PER === 0) {
        const s = storyOf(r), T = TENANTS[s];
        score += 100*s*(loop + 1);
        say(`FLOOR ${s}: ${T.name}. ${T.what}!`, 2.6); SFX.story(s);
      }

}
function updatePlayer(dt) {
  P.inv = Math.max(0, P.inv - dt); P.bumpT = Math.max(0, P.bumpT - dt);
  if (P.mode === 'move' || P.mode === 'fall') {
    P.t += dt; P.anim += dt;

      if (P.mode === 'fall') { SFX.land(); P.inv = Math.max(P.inv, 0.6); }
      arrive();
    }
    return;
  }
  /* B: flatten against the wall. Holding your breath only lasts so long. */
  if (held.b && P.breath > (P.flat ? 0 : 0.3)) {
    if (!P.flat) SFX.flat();
    P.flat = true;
    P.breath = Math.max(0, P.breath - dt/1.4);
    if (P.breath <= 0) { P.flat = false; SFX.gasp(); footNote('OUT OF BREATH'); }
  } else {
    if (held.b && !P.flat && pressed.b) bump('CATCH YOUR BREATH FIRST');
    P.flat = false;
    P.breath = Math.min(1, P.breath + dt/3.5);
  }
  /* Standing on a sill when its shutters slam. */
  if (P.r > 0 && P.r <= ROWS && !isOpen(P.r, P.c)) { knock(); return; }
  if (P.flat) return;
  const dx = (held.right ? 1 : 0) - (held.left ? 1 : 0);
  if (pressed.a) {
    if (dx) {                                    // leap sideways, gap or not
      const c2 = P.c + dx;
      if (inRange(P.r, c2) && isOpen(P.r, c2)) { startMove(P.r, c2, 0.36, 14); SFX.jump(); return; }
    } else {                                     // hop over the window above
      if (P.r + 2 <= ROOF_ROW && isOpen(P.r + 2, P.c)) { startMove(P.r + 2, P.c, 0.42, 10); SFX.jump(); return; }
      if (isOpen(P.r + 1, P.c)) { startMove(P.r + 1, P.c, CLIMB, 0); SFX.climb(P.r + 1); return; }
    }
    bump(); return;
  }
  if (held.up) {
    if (isOpen(P.r + 1, P.c)) { startMove(P.r + 1, P.c, CLIMB, 0); SFX.climb(P.r + 1); }
    else bump(WIN[P.r + 1] && WIN[P.r + 1][P.c].kind === 'board' ? 'BOARDED UP: A HOPS OVER IT' : '');
    return;
  }
  if (held.down) {
    if (P.r > 0 && isOpen(P.r - 1, P.c)) { startMove(P.r - 1, P.c, 0.22, 0); SFX.down(); } else bump();
    return;
  }
  if (dx) {
    const c2 = P.c + dx;
    if (!inRange(P.r, c2)) { bump(); return; }
    if (gapBetween(P.r, P.c, c2)) { bump('BROKEN LEDGE: A + LEFT/RIGHT LEAPS IT'); return; }
    if (!isOpen(P.r, c2)) { bump(); return; }
    startMove(P.r, c2, 0.2, 0); SFX.shuffle();
  }
}

/* ---------------- the tenants throw things ---------------- */
function spawnObj(kind, x, y, r) {
  const pp = ppos(), d = pp.x > x ? 1 : pp.x < x ? -1 : (Math.random() < 0.5 ? -1 : 1);
  const o = {kind, x, y, x0: x, y0: y, vx: 0, vy: -50, g: 300, hw: 4, hh: 4, t: Math.random()*3, d, wh: false};
  switch (kind) {
    case 'pin':    Object.assign(o, {vy: -60, g: 330, hw: 6, hh: 3}); break;
    case 'pot':    Object.assign(o, {vy: -80, g: 440, hw: 4, hh: 4}); break;
    case 'sheet':  Object.assign(o, {vy: -38, g: 0, hw: 12, hh: 5}); break;
    case 'book':   Object.assign(o, {vy: -55, g: 70, hw: 4, hh: 3}); break;
    case 'pigeon': Object.assign(o, {vx: d*95, vy: -50, g: 0, hw: 5, hh: 3}); break;
    case 'metro':  Object.assign(o, {vy: -55, g: 220, hw: 4, hh: 5}); break;
    case 'paint':  Object.assign(o, {vy: -50, g: 300, hw: 3, hh: 4}); break;
    case 'drop':   Object.assign(o, {g: 300, hw: 2, hh: 2}); break;
    case 'ball':   Object.assign(o, {vx: d*45, vy: -40, g: 520, hw: 3, hh: 3, bounces: 3}); break;
    case 'gear':   Object.assign(o, {vy: -40, g: 520, hw: 5, hh: 5, rolling: false, vx: d*75}); break;
    case 'bell':   Object.assign(o, {vy: -150, g: 640, hw: 6, hh: 3}); break;
    case 'dough':  Object.assign(o, {vx: d*85, vy: -70, g: 60, hw: 6, hh: 2}); break;
    case 'bee':    Object.assign(o, {g: 0, hw: 2, hh: 2, life: 4.5 + Math.random()}); break;
  }
  objs.push(o);
  return o;
}
function updateObjs(dt) {
  const pp = ppos();
  for (const o of objs) {
    o.t += dt;
    const prevY = o.y;
    switch (o.kind) {
      case 'metro': o.x = o.x0 + Math.sin(o.t*5)*14; if (Math.floor(o.t*5/Math.PI) !== Math.floor((o.t - dt)*5/Math.PI) && Math.abs(o.y - pp.y) < 120) SFX.tick(Math.floor(o.t*5/Math.PI) % 2); break;
      case 'sheet': o.x = o.x0 + Math.sin(o.t*1.6)*18; break;
      case 'book':  o.x += Math.sin(o.t*7)*30*dt; break;
      case 'bee': {
        o.life -= dt;
        if (o.life > 0) {
          const dx = pp.x - o.x, dy = pp.y + 10 - o.y, d = Math.hypot(dx, dy) || 1;
          o.vx += (dx/d*44 - o.vx)*dt*2; o.vy += (dy/d*44 - o.vy)*dt*2;
        } else o.vy += 200*dt;
        o.x += (o.vx + Math.sin(o.t*17)*30)*dt; o.y += (o.vy + Math.cos(o.t*13)*30)*dt;
        if (o.life < -2) o.dead = true;
        continue;
      }
      case 'gear':
        if (o.rolling) {
          o.x += o.vx*dt;
          if (o.r === 0 && (o.x < -10 || o.x > W + 10)) { o.dead = true; continue; }
          if (o.r > 0 && (o.x < BX0 + 6 || o.x > BX1 - 6)) { o.vx = -o.vx; o.x = Math.max(BX0 + 6, Math.min(BX1 - 6, o.x)); o.rolling = false; o.y = o.r*ROWH - 1; o.vy = -30; }
          else if (!solidAt(o.r, o.x)) { o.rolling = false; o.y = o.r*ROWH - 1; o.vy = -30; }
          continue;
        }
        break;
    }
    o.vy = Math.max(-330, o.vy - o.g*dt);
    o.x += o.vx*dt; o.y += o.vy*dt;
    /* things that meet a ledge on the way down */
    const lr = Math.floor(prevY/ROWH), ly = lr*ROWH;
    if (o.vy < 0 && o.y <= ly && prevY > ly && solidAt(lr, o.x)) {

      else if (o.kind === 'ball' && o.bounces > 0) { o.bounces--; o.vy = 190; o.y = ly; if (Math.random() < 0.4) o.vx = -o.vx; if (Math.abs(o.y - pp.y) < 120) SFX.boing(); }

    if (!o.wh && o.y > pp.y && o.y - pp.y < 130 && Math.abs(o.x - pp.x) < 20 && o.vy < 0) { o.wh = true; SFX.whistle(); }

/* A tenant leans out of an open window -- or by night, a lit one -- above
   you, holds it up for a moment (that's your warning), and lets go. */
function updateThrowers(dt) {
  const night = when === 'night';
  throwT -= dt;
  if (throwT <= 0) {
    const hard = Math.max(1, storyOf(Math.max(1, P.r))) + loop*3;
    throwT = 1.7*(night ? 1.8 : 1)*Math.max(0.6, 1.85 - hard*0.085)*(0.7 + Math.random()*0.6);
    const cand = []; let tot = 0;
    /* only windows you can see: nothing is thrown from off the top of the screen */
    const top = Math.floor((Math.round(camB) + PH - 34)/ROWH);
    for (let r = Math.max(1, P.r + 1); r <= Math.min(ROWS, P.r + 5, top); r++) for (let c = 0; c < COLS; c++) {
      const w = WIN[r][c];
      if (w.kind === 'board' || w.gag || (night && !w.lit) || !isOpen(r, c)) continue;
      if (throwers.some(t => t.r === r && t.c === c)) continue;
      const dc = Math.abs(c - P.c), wt = (dc === 0 ? 4 : dc === 1 ? 2 : 0.6)*(r - P.r <= 3 ? 1.3 : 1);
      cand.push([r, c, wt]); tot += wt;
    }
    if (cand.length) {
      let pick = Math.random()*tot, ch = cand[0];
      for (const x of cand) { pick -= x[2]; if (pick <= 0) { ch = x; break; } }
      const kind = TENANTS[storyOf(ch[0])].obj;
      const tele = 0.3 + Math.max(0.42, (night ? 0.62 : 0.8) - hard*0.02) + (kind === 'bell' ? 0.25 : 0);
      throwers.push({r: ch[0], c: ch[1], t: 0, tele, kind, thrown: false, after: 0});
      if (kind === 'bell') SFX.grunt();
      if (kind === 'pigeon') SFX.coo();
      if (kind === 'bee') SFX.buzz();
    }

  for (const th of throwers) {
    if (!th.thrown) {
      th.t += dt;
      if (!isOpen(th.r, th.c) || (night && !WIN[th.r][th.c].lit)) { th.dead = true; continue; }
      if (th.t >= th.tele) {
        th.thrown = true; th.after = 0.35;
        const x = colX(th.c), y = th.r*ROWH + 14;
        if (th.kind === 'bee') for (let i = 0; i < 3; i++) { const b = spawnObj('bee', x + (i - 1)*6, y + i*3); b.life -= i*0.5; }
        else if (th.kind === 'pigeon') { spawnObj('pigeon', x, y); if (Math.random() < 0.5) { const p = spawnObj('pigeon', x, y + 8); p.vx = -p.vx; } }
        else if (th.kind === 'gear') { const g = spawnObj('gear', x, th.r*ROWH + 2); g.vy = -60; }
        else spawnObj(th.kind, x, y);

      }

  }

}

/* By night the bats come out: they cross the building near you. */
function updateBats(dt) {
  const pp = ppos();
  if (when === 'night' && state === 'play') {
    batT -= dt;
    if (batT <= 0) {
      const hard = storyOf(Math.max(1, P.r)) + loop*3;
      batT = Math.max(2.2, 6.5 - hard*0.25) + Math.random()*3;
      const left = Math.random() < 0.5;
      bats.push({x: left ? -12 : W + 12, by: pp.y + 9 + Math.floor(Math.random()*3)*ROWH, vx: (left ? 1 : -1)*(72 + loop*12), t: 0, fl: 0});
    }
  }
  for (const b of bats) {
    b.t += dt; b.x += b.vx*dt; b.y = b.by + Math.sin(b.t*5)*9;
    if (light > 0.5) b.by += 140*dt;          // daylight: off they go
    if ((b.fl -= dt) <= 0 && Math.abs(b.x - pp.x) < 120 && Math.abs(b.y - pp.y) < 80) { b.fl = 0.35; SFX.flutter(); }
  }

function collide() {
  if (state !== 'play' || P.inv > 0) return;
  const pp = ppos(), pb = {x0: pp.x - 5, x1: pp.x + 5, y0: pp.y + 1, y1: pp.y + 17};
  const over = (x, y, hw, hh) => x + hw > pb.x0 && x - hw < pb.x1 && y + hh > pb.y0 && y - hh < pb.y1;
  for (const o of objs) {
    if (!over(o.x, o.y, o.hw, o.hh)) continue;
    if (P.flat && o.kind !== 'gear') continue;   // flat to the wall: it misses you. A gear rolls the ledge.
    const s = {pin: 1, pot: 2, sheet: 3, book: 4, pigeon: 5, metro: 6, paint: 7, drop: 7, ball: 8, gear: 9, bell: 10, dough: 11, bee: 12}[o.kind];
    hurt(TENANTS[s].hit); return;
  }
  if (!P.flat) for (const b of bats) if (over(b.x, b.y, 6, 3)) { hurt('A BAT IN YOUR HAIR'); return; }
}

/* ---------------- the roof ---------------- */
const CAT_C = 3;
function reachRoof() {
  state = 'roof'; roofT = 0;
  bonus = 2500*(loop + 1) + Math.floor(clock)*10;
  score += bonus; lives = Math.min(5, lives + 1);
  objs = []; throwers = []; bats = [];
  saveHi(); SFX.roof();
}
function nextBuilding() {
  loop++; buildBuilding();
  Object.assign(P, {r: 0, c: 2, fr: 0, fc: 2, mode: 'idle', flat: false, inv: 1.5, breath: 1});
  best = 0; clock = clockFor(); camB = -30; bt = 0; throwT = 2.5;
  state = 'play';
  say(`BUILDING ${loop + 1}. FASTER SHUTTERS, BUSIER TENANTS`, 3);
}

/* ---------------- update ---------------- */
function update(dt) {
  time += dt;
  if (toastT > 0) toastT -= dt; if (footT > 0) footT -= dt;
  if (state === 'title' || state === 'over') {
    if (pressed.start) { ensureAudio(); newGame(); }
    return;
  }
  if (state === 'pause') {
    if (pressed.start) { state = 'play'; SFX.pause(false); }
    if (pressed.a) { setSound(!soundOn); footNote(soundOn ? 'SOUND ON' : 'SOUND OFF'); }
    return;
  }
  if (pressed.start && state === 'play') { state = 'pause'; SFX.pause(true); return; }
  if (pressed.select && (state === 'play' || state === 'dying')) turnTime();

  /* dusk and dawn */
  if (turning) {
    const before = light;
    light = Math.max(0, Math.min(1, light + turning*dt/1.5));
    if ((before < 0.5) !== (light < 0.5)) { when = light >= 0.5 ? 'day' : 'night'; batT = 1.5; }
    if (light === 0 || light === 1) turning = 0;
  }
  bt += dt;

  if (state === 'roof') {
    roofT += dt;
    if (roofT > 0.9 && roofT - dt <= 0.9) SFX.meow();
    if (roofT > 5) nextBuilding();
    camera(dt); return;
  }
  /* PACE slows everything that falls or flies (Todd, v0.1: "Too fast!") */
  updateObjs(dt*PACE); updateBats(dt*PACE);
  if (state === 'dying') {
    P.deadT -= dt;
    if (P.deadT <= 0) {
      lives--;
      if (lives <= 0) { state = 'over'; saveHi(); SFX.gameover(); }
      else respawn();
    }
    camera(dt); return;
  }
  clock -= dt;
  if (DEMO && clock < 30) clock = clockFor();
  const sec = Math.ceil(clock);
  if (sec !== lastSec && sec <= 10 && sec > 0) SFX.second();
  lastSec = sec;
  if (clock <= 0) { clock = 0; hurt('OUT OF TIME. THE CAT CAN\'T WAIT', true); camera(dt); return; }

  /* a creak when the shutters you're on, or the ones above you, start to swing */
  if (P.mode === 'idle') for (const r of [P.r, P.r + 1]) {
    if (r < 1 || r > ROWS) continue;
    const s = shut(r, P.c), k = r + ',' + P.c;
    if (s.warn && P.creak !== k + Math.floor((bt + WIN[r][P.c].ph)/WIN[r][P.c].per)) { P.creak = k + Math.floor((bt + WIN[r][P.c].ph)/WIN[r][P.c].per); SFX.creak(); }
  }
  updatePlayer(dt);
  updateThrowers(dt);
  collide();
  camera(dt);
}
const CAM_LOW = 58;      // world px of building shown below your feet
function camera(dt) {
  /* keep the climber low on the screen: what matters is above you */
  const target = Math.max(-30, Math.min(ROOF_Y + 70 - PH, ppos().y - CAM_LOW));
  camB += (target - camB)*Math.min(1, dt*7);
}

function newGame() {
  score = 0; lives = 3; loop = 0; time = 0; bt = 0; best = 0;
  buildBuilding(); clock = clockFor();
  when = DEMO && Q.has('night') ? 'night' : 'day'; light = when === 'day' ? 1 : 0; turning = 0;
  Object.assign(P, {r: 0, c: 2, fr: 0, fc: 2, mode: 'idle', flat: false, breath: 1, inv: 1, t: 0});
  objs = []; throwers = []; bats = []; throwT = 2.5; batT = 3; camB = -30;
  state = 'play';
  say('CLIMB TO THE ROOF. THE CAT IS STRANDED', 3);
}

/* ---------------- drawing ---------------- */
const sy = wy => HUD + PH - (wy - Math.round(camB));

function drawSky() {
  const k = light;
  const g = ctx.createLinearGradient(0, HUD, 0, HUD + PH);
  g.addColorStop(0, mix('#05071a', '#3c8cf0', k)); g.addColorStop(1, mix('#141a3a', '#a8d8f8', k));
  ctx.fillStyle = g; ctx.fillRect(0, HUD, W, PH);
  if (k < 0.5) for (const s of stars) {
    const y = HUD + ((s.y - camB*0.05) % 230 + 230) % 230;
    if ((time*1.5 + s.tw) % 6 > 0.3) rect(s.x, y, 1, 1, '#c8d0f0');
  }
  /* sun by day, moon by night, sinking slowly as you climb past them */
  const by = HUD + 30 + Math.max(0, 200 - camB*0.1);
  if (by < HUD + PH) {
    if (k >= 0.5) { ctx.fillStyle = C.yellow; ctx.beginPath(); ctx.arc(340, by, 11, 0, 7); ctx.fill(); }
    else { ctx.fillStyle = '#e8ecff'; ctx.beginPath(); ctx.arc(60, by, 9, 0, 7); ctx.fill(); ctx.fillStyle = mix('#05071a', '#3c8cf0', k); ctx.beginPath(); ctx.arc(64, by - 2, 8, 0, 7); ctx.fill(); }
  }
  if (k > 0.5) for (let i = 0; i < 4; i++) {         // chunky clouds
    const x = ((i*131 + time*6) % (W + 80)) - 40, y = HUD + 20 + i*47 - camB*0.08 % 60;
    rect(x, y, 34, 7, '#f0f8ff'); rect(x + 7, y - 4, 18, 4, '#f0f8ff');
  }
  /* the city behind, in two layers that slide down as you climb */
  for (const [f, col, seed, hmax] of [[0.25, mix('#0c1028', '#7aa0c8', k), 3, 420], [0.5, mix('#10142c', '#5a7aa0', k), 7, 300]]) {
    let x = -10, i = seed;
    while (x < W) {
      const w = 26 + (i*37 % 30), h = 60 + (i*71 % hmax);
      const top = HUD + PH - (h - camB*f) + 0, base = HUD + PH - (0 - camB*f);
      if (top < HUD + PH) {
        rect(x, Math.max(HUD, top), w, Math.min(base, HUD + PH) - Math.max(HUD, top), col);
        if (k < 0.5) for (let yy = top + 6; yy < Math.min(base, HUD + PH) - 4; yy += 9)
          for (let xx = x + 4; xx < x + w - 3; xx += 7) if (((xx*7 + yy*3 + i) % 11) < 2) rect(xx, yy, 2, 2, '#c8a848');
      }
      x += w + 6; i++;
    }
  }
}

function brickRow(y0, y1, base) {
  /* a band of brick from screen y0 down to y1 */
  const top = Math.max(HUD, y0), bot = Math.min(HUD + PH, y1);
  if (bot <= top) return;
  rect(BX0, top, BX1 - BX0, bot - top, base);
  const mortar = mix('#000000', base, 0.72);
  for (let y = Math.ceil((y0)/8)*8 + (Math.round(camB) % 8); y < bot; y += 8) {
    if (y < top) continue;
    rect(BX0, y, BX1 - BX0, 1, mortar);
    const off = (Math.floor((y + Math.round(camB))/8) % 2) ? 8 : 0;
    for (let x = BX0 + off; x < BX1; x += 16) rect(x, y, 1, Math.min(8, bot - y), mortar);
  }
}

function drawStreet() {
  const k = light, s0 = sy(0);
  if (s0 > HUD + PH + 40) return;
  /* the road and the pavement */
  rect(0, s0, W, HUD + PH - s0 + 60, mix('#16161c', '#4a4a52', k));
  rect(0, s0, W, 6, mix('#2a2a30', '#8a8890', k));
  for (let x = 6; x < W; x += 40) rect(x, s0 + 22, 18, 2, mix('#5a5020', C.yellow, k));
  /* the shopfront on the ground floor, and a door */
  const top = sy(36);
  rect(BX0 + 6, top, BX1 - BX0 - 12, s0 - top, mix('#101018', '#304050', k));
  for (let x = BX0 + 6; x < BX1 - 6; x += 12) rect(x, top - 6, 12, 6, (x/12) % 2 < 1 ? mix('#300c0c', C.red, k) : mix('#303030', C.white, k));
  rect(colX(2) - 9, top + 6, 18, s0 - top - 6, mix('#200f05', C.brown, k));
  rect(colX(2) + 5, top + 18, 2, 2, C.yellow);
  text('12', colX(2), top - 15, mix('#806020', C.yellow, k), 'center');
  /* street lamps */
  for (const lx of [16, 384]) {
    rect(lx - 1, sy(60), 2, s0 - sy(60), mix('#20202a', '#303040', k));
    rect(lx - 4, sy(64), 8, 5, k < 0.5 ? '#ffe8a0' : '#606070');
  }
}

function drawRoof() {
  const k = light, y = sy(ROOF_Y);
  if (y < HUD - 60 || y > HUD + PH + 40) return;
  /* water tower, chimney, antenna */
  const wt = mix('#2a1a10', '#8a5a30', k);
  rect(BX0 + 18, y - 48, 34, 26, wt);
  for (let i = 0; i < 4; i++) rect(BX0 + 20 + i*9, y - 48, 2, 26, mix('#1a1008', '#6a4020', k));
  rect(BX0 + 14, y - 52, 42, 5, mix('#1a1008', '#5a3418', k));
  rect(BX0 + 22, y - 22, 3, 22, wt); rect(BX0 + 46, y - 22, 3, 22, wt);
  rect(BX0 + 62, y - 26, 14, 26, mix('#2a1210', '#9a4a34', k));
  rect(BX1 - 22, y - 60, 2, 60, C.gray); rect(BX1 - 28, y - 50, 14, 1, C.gray); rect(BX1 - 26, y - 42, 10, 1, C.gray);
  if (Math.floor(time*2) % 2) rect(BX1 - 22, y - 62, 2, 2, C.red);
  /* the parapet */
  rect(BX0 - 4, y - 2, BX1 - BX0 + 8, 8, mix('#3a3430', C.tan, k));
  rect(BX0 - 4, y + 6, BX1 - BX0 + 8, 2, mix('#1a1410', '#8a7a5a', k));
  drawCat(y);
}
function drawCat(y) {
  let x = colX(CAT_C), cy = y - 2;
  if (state === 'roof') {
    /* it trots over to you, and hops */
    const px = colX(P.c), k = Math.min(1, roofT/0.9);
    x = x + (px + (px < colX(CAT_C) ? 12 : -12) - x)*k;
    if (roofT > 0.9) cy -= Math.abs(Math.sin(roofT*6))*6;
  }
  const o = C.orange, d = C.brown;
  rect(x - 6, cy - 7, 12, 6, o); rect(x - 6, cy - 2, 2, 2, o); rect(x + 4, cy - 2, 2, 2, o);
  rect(x + 3, cy - 12, 7, 6, o); rect(x + 3, cy - 14, 2, 2, o); rect(x + 8, cy - 14, 2, 2, o);
  rect(x + 5, cy - 10, 1, 1, '#000'); rect(x + 8, cy - 10, 1, 1, '#000');
  rect(x - 4, cy - 6, 1, 4, d); rect(x - 1, cy - 6, 1, 4, d);
  const sw = Math.round(Math.sin(time*3)*2);
  rect(x - 8, cy - 9 + sw, 2, 6, o); rect(x - 10, cy - 11 + sw, 2, 3, o);
  if (state === 'roof' && roofT > 1) for (let i = 0; i < 3; i++) {
    const hy = cy - 20 - ((roofT*20 + i*12) % 36), hx = x + Math.sin(roofT*3 + i)*6 - 6 + i*6;
    rect(hx, hy, 2, 2, C.pink); rect(hx + 3, hy, 2, 2, C.pink); rect(hx, hy + 2, 5, 1, C.pink); rect(hx + 1, hy + 3, 3, 1, C.pink);
  }
}

/* What each tenant has in the window. */
function drawDeco(s, wx, top, r, c, k) {
  const L = col => mix('#000000', col, 0.25 + 0.75*k);
  switch (s) {
    case 1:   // bakery: striped awning, loaves on the shelf
      for (let i = 0; i < 6; i++) rect(wx - 2 + i*4.33, top - 4, 5, 4, L(i % 2 ? C.white : C.red));
      rect(wx + 2, top + 15, 18, 1, L(C.brown)); rect(wx + 3, top + 12, 6, 3, L('#c88a40')); rect(wx + 12, top + 12, 6, 3, L('#c88a40'));
      break;
    case 2:   // florist: a window box in bloom
      rect(wx - 1, top + 20, 24, 4, L(C.brown));
      for (let i = 0; i < 6; i++) { rect(wx + 1 + i*4, top + 16, 2, 4, L(C.green)); rect(wx + i*4, top + 15, 3, 2, L([C.red, C.yellow, C.pink][(i + r) % 3])); }
      break;
    case 3:   // laundry: a line of washing
      rect(wx, top + 4, 22, 1, L(C.gray));
      for (let i = 0; i < 4; i++) rect(wx + 1 + i*5, top + 5, 4, 7 + (i % 2)*2, L([C.white, C.pink, C.cyan, C.yellow][(i + c) % 4]));
      break;
    case 4:   // library: shelves of spines
      for (let sh = 0; sh < 3; sh++) for (let i = 0; i < 10; i++) rect(wx + 1 + i*2, top + 3 + sh*7, 2, 5, L([C.red, C.blue, C.green, C.yellow, C.violet][(i*3 + sh + r) % 5]));
      break;
    case 5:   // pigeon roost: birds on the sill
      for (const bx of [3, 13]) { rect(wx + bx, top + 19, 6, 4, L('#8a8a9a')); rect(wx + bx + 4, top + 17, 3, 3, L('#8a8a9a')); rect(wx + bx + 5, top + 18, 1, 1, L(C.green)); }
      break;
    case 6:   // music teacher: a piano and a note
      rect(wx + 1, top + 16, 20, 7, L(C.white)); for (let i = 0; i < 6; i++) rect(wx + 3 + i*3, top + 16, 1, 4, L('#000000'));
      rect(wx + 13, top + 6, 3, 2, L('#000000')); rect(wx + 15, top + 2, 1, 5, L('#000000'));
      break;
    case 7:   // painter: splashes of colour
      for (let i = 0; i < 6; i++) rect(wx + 2 + ((i*7 + r*3) % 17), top + 3 + ((i*5 + c*7) % 17), 3, 3, L([C.red, C.blue, C.yellow, C.green, C.purple, C.orange][i]));
      break;
    case 8:   // toy shop: balls on the shelf
      rect(wx + 1, top + 17, 20, 1, L(C.brown));
      for (let i = 0; i < 4; i++) { ctx.fillStyle = L([C.red, C.blue, C.yellow, C.green][(i + c) % 4]); ctx.beginPath(); ctx.arc(wx + 4 + i*5, top + 14, 2.5, 0, 7); ctx.fill(); }
      break;
    case 9: { // clockmaker: a clock, really ticking
      ctx.fillStyle = L(C.white); ctx.beginPath(); ctx.arc(wx + 11, top + 11, 7, 0, 7); ctx.fill();
      const a = time*Math.PI/2 + r + c;
      ctx.strokeStyle = L('#000000'); ctx.lineWidth = 1; ctx.beginPath();
      ctx.moveTo(wx + 11, top + 11); ctx.lineTo(wx + 11 + Math.cos(a)*5, top + 11 + Math.sin(a)*5);
      ctx.moveTo(wx + 11, top + 11); ctx.lineTo(wx + 11 + Math.cos(a/12)*3, top + 11 + Math.sin(a/12)*3); ctx.stroke();
      break;
    }
    case 10:  // gym: a rack of dumbbells
      for (let i = 0; i < 3; i++) { rect(wx + 4, top + 6 + i*6, 14, 2, L('#303030')); rect(wx + 3, top + 5 + i*6, 3, 4, L('#101010')); rect(wx + 16, top + 5 + i*6, 3, 4, L('#101010')); }
      break;
    case 11:  // pizzeria: a checked curtain
      for (let i = 0; i < 6; i++) for (let j = 0; j < 2; j++) rect(wx + i*3.67, top + j*4, 4, 4, L((i + j) % 2 ? C.white : C.red));
      break;
    case 12:  // beekeeper: honeycomb
      for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) rect(wx + 2 + i*5 + (j % 2)*2, top + 3 + j*5, 3, 3, L('#c88a10'));
      break;
  }
}

/* A shutter is a panel hinged at the window's edge. k: 0 folded back flat
   against the wall, 0.5 sticking straight out (a thin line, seen from the
   front), 1 shut across the window. */
function drawShutters(wx, top, k, col, slat) {
  for (const side of [-1, 1]) {
    const hinge = side < 0 ? wx : wx + 22;
    const w = Math.max(1, Math.round(11*Math.abs(1 - 2*k)));
    const x = k < 0.5 ? (side < 0 ? hinge - w : hinge) : (side < 0 ? hinge : hinge - w);
    rect(x, top, w, 24, col);
    if (w > 3) for (let y = top + 3; y < top + 23; y += 4) rect(x + 1, y, w - 2, 1, slat);
  }
}

/* A cheeky window, 22x24. By night the blind is down and lit from inside:
   you get the same scene as a shadow play. */
function drawGag(w, wx, top, r, c, k, night) {
  const SIL = '#3a2a10';
  const L = col => night ? SIL : mix('#000000', col, 0.25 + 0.75*k);
  const R_ = (x, y, ww, hh, col) => rect(wx + x, top + y, ww, hh, L(col));
  const SK = '#f0b090', ph = time + r*1.7 + c*0.9;
  if (!night) R_(0, 0, 22, 24, {towel: '#a8d8e8', kiss: '#e8a0b8', shower: '#c8e8f0', dance: '#2a1a40', sleep: '#3a4a7a', bath: '#d8f0f0'}[w.gag]);
  else R_(0, 0, 22, 24, '#e8c050'), rect(wx, top, 22, 24, '#e8c050');
  switch (w.gag) {
    case 'towel': {           // a man in a towel, dashing back and forth
      const p = (ph*9) % 24, x = 3 + Math.round(p < 12 ? p : 24 - p);
      R_(x, 4, 5, 5, SK); R_(x, 3, 5, 2, C.brown);                  // wet head
      R_(x - 1, 9, 7, 6, SK);                                        // bare chest
      R_(x - 2, 10, 2, 4, SK); R_(x + 6, 10, 2, 4, SK);              // arms
      R_(x - 1, 15, 7, 5, C.white); R_(x - 1, 17, 7, 1, C.cyan);     // the towel
      R_(x, 20, 2, 4, SK); R_(x + 3, 20, 2, 4, SK);
      if (!night) { R_(x + 1, 6, 1, 1, '#000'); R_(x + 3, 6, 1, 1, '#000'); }
      break;
    }
    case 'kiss': {            // two heads close together; they draw the curtain on you
      const lean = Math.round(Math.sin(ph*2)*1);
      R_(4 + lean, 6, 5, 5, SK); R_(3 + lean, 5, 6, 3, C.yellow); R_(3 + lean, 8, 2, 6, C.yellow);
      R_(13 - lean, 6, 5, 5, SK); R_(13 - lean, 5, 5, 2, C.brown);
      R_(3 + lean, 11, 6, 10, C.red); R_(13 - lean, 11, 6, 10, C.blue);
      if (!night && Math.floor(ph*2) % 2) { R_(9, 1, 2, 2, C.red); R_(12, 1, 2, 2, C.red); R_(9, 3, 5, 1, C.red); R_(10, 4, 3, 1, C.red); }
      if (w.curtain) {         // pink curtains swish shut, and stay shut
        const q = Math.min(1, (time - w.curtain)/0.4), cw = Math.round(11*q);
        rect(wx, top, cw, 24, night ? SIL : L(C.pink)); rect(wx + 22 - cw, top, cw, 24, night ? SIL : L(C.pink));
      }
      break;
    }
    case 'shower': {          // steamy glass, a pink shape, soap bubbles, a song
      R_(6, 0, 2, 3, C.gray); R_(5, 3, 4, 1, C.gray);
      R_(8, 7, 6, 5, SK); R_(7, 12, 8, 9, SK); R_(5, 9, 2, 5, SK); R_(15, 9, 2, 5, SK);
      if (!night) { rect(wx, top + 6, 22, 18, 'rgba(230,245,255,0.55)');
        for (let i = 0; i < 4; i++) R_(3 + ((i*7 + Math.floor(ph*3)) % 16), 22 - ((ph*8 + i*6) % 18), 2, 2, C.white); }
      if (Math.floor(ph*1.5) % 2) { R_(17, 3, 2, 2, night ? SIL : '#000'); R_(18, 0, 1, 4, night ? SIL : '#000'); }
      break;
    }
    case 'dance': {           // heart-print boxers, arms in the air
      const b = Math.floor(ph*4) % 2;
      if (!night) for (let i = 0; i < 4; i++) R_(1 + i*5, 21, 5, 3, [C.red, C.yellow, C.green, C.blue][(i + Math.floor(ph*4)) % 4]);
      R_(8, 3 + b, 5, 5, SK); R_(8, 2 + b, 5, 2, C.brown);
      R_(7, 8 + b, 7, 6, SK);
      R_(5, b ? 1 : 8, 2, 7, SK); R_(14, b ? 8 : 1, 2, 7, SK);
      R_(7, 14 + b, 7, 4, C.white); if (!night) { R_(8, 15 + b, 1, 1, C.red); R_(11, 16 + b, 1, 1, C.red); R_(12, 14 + b, 1, 1, C.red); }
      R_(7 + b, 18 + b, 2, 5 - b, SK); R_(12 - b, 18 + b, 2, 5 - b, SK);
      break;
    }
    case 'sleep': {           // nightcap, striped pyjamas, arms out, drifting
      const x = 5 + Math.round(Math.sin(ph*0.6)*4);
      R_(x + 2, 4, 5, 5, SK); R_(x + 1, 2, 7, 2, C.red); R_(x + 7, 3, 2, 2, C.white);
      R_(x + 1, 9, 7, 13, C.cyan); if (!night) for (let y = 10; y < 22; y += 3) R_(x + 1, y, 7, 1, C.white);
      R_(x + 8, 10, 6, 2, C.cyan); R_(x + 14, 10, 2, 2, SK);
      if (!night) { R_(x + 3, 6, 2, 1, '#000'); R_(x + 6, 6, 1, 1, '#000'); }
      const z = (ph*1.2) % 3;
      if (z < 2.4) text('z', wx + 16 - Math.round(z*2), top + 1 + Math.round(3 - z*1.5), night ? SIL : C.white, 'left', 7);
      break;
    }
    case 'bath': {            // a tub full of bubbles, a shower cap, a duck
      R_(1, 15, 20, 7, C.white); R_(3, 22, 2, 2, C.gray); R_(17, 22, 2, 2, C.gray);
      R_(5, 8, 5, 5, SK); R_(4, 6, 7, 3, C.pink); R_(2, 12, 2, 4, SK);   // waving arm
      if (!night) for (let i = 0; i < 6; i++) R_(2 + i*3, 12 + (i % 2), 3, 3, '#ffffff');
      const d = Math.round(Math.sin(ph*2)*1);
      R_(14, 11 + d, 5, 3, C.yellow); R_(17, 9 + d, 3, 3, C.yellow); R_(20, 10 + d, 2, 1, C.orange);
      break;
    }
  }
}

function drawFigure(x, y, s, lean, k) {
  /* a tenant leaning out: apron in their colour */
  const T = TENANTS[s], L = col => mix('#000000', col, 0.25 + 0.75*k);
  if (s === 5) {          // pigeons come out by themselves
    const fl = Math.floor(time*16) % 2;
    rect(x - 4, y + 2 + lean*4, 8, 5, L('#8a8a9a')); rect(x - 8, y + 1 + lean*4 - fl*2, 4, 2, L('#8a8a9a')); rect(x + 4, y + 1 + lean*4 - fl*2, 4, 2, L('#8a8a9a'));
    return;
  }
  if (s === 12) {         // the hive stirs
    for (let i = 0; i < 6; i++) rect(x - 6 + ((i*5 + Math.floor(time*20)) % 13), y + 4 + ((i*3 + Math.floor(time*17)) % 9), 2, 2, i % 2 ? C.yellow : '#000');
    return;
  }
  const yy = y + Math.round(lean*6);
  rect(x - 4, yy + 8, 8, 9, L(T.cloth));
  rect(x - 3, yy + 2, 6, 6, L(C.pink));
  rect(x - 3, yy + 1, 6, 2, L(C.brown));
  rect(x - 1, yy + 4, 1, 1, '#000'); rect(x + 1, yy + 4, 1, 1, '#000');
  rect(x - 6, yy - 1, 2, 9, L(C.pink)); rect(x + 4, yy - 1, 2, 9, L(C.pink));
  drawObj({kind: T.obj, x: x, y: 0, t: time, d: 1}, x, yy - 3, k);
}

function drawBuilding() {
  const k = light;
  const rLo = Math.max(0, Math.floor((camB - 10)/ROWH)), rHi = Math.min(ROWS, Math.ceil((camB + PH)/ROWH) + 1);
  /* brick, a slightly different shade for each story */
  for (let r = rLo; r <= rHi; r++) {
    const s = storyOf(r), base = mix('#1c1018', TENANTS[s].wall, k);
    brickRow(sy((r + 1)*ROWH), sy(r*ROWH), base);
  }
  /* the edges of the building */
  const yT = Math.max(HUD, sy(ROOF_Y)), yB = Math.min(HUD + PH, sy(0));
  if (yB > yT) { rect(BX0 - 4, yT, 4, yB - yT, mix('#140a10', '#5a3020', k)); rect(BX1, yT, 4, yB - yT, mix('#140a10', '#5a3020', k)); }
  drawStreet();
  for (let r = Math.max(1, rLo); r <= rHi; r++) {
    const s = storyOf(r), T = TENANTS[s], ly = sy(r*ROWH);
    if (ly < HUD - 40 || ly > HUD + PH + 30) continue;
    /* the sign under each floor: number and tenant */
    if ((r - 1) % PER === 0) {
      /* it hangs in the strip of wall just under this floor's first ledge */
      rect(BX0, ly + 2, BX1 - BX0, 9, mix('#100a0c', '#3a2418', k));
      text(`${s}  ${T.name}`, W/2, ly + 3, mix('#5a5040', C.tan, k), 'center', 7);
    }
    for (let c = 0; c < COLS; c++) {
      const x = colX(c), wx = x - 11, top = ly - 27, st = shut(r, c), w = WIN[r][c];
      /* inside: the tenant's room by day; by night lit or dark */
      const lit = w.lit && when === 'night';
      const night = lit ? '#e8c050' : '#07060c';
      rect(wx, top, 22, 24, mix(night, T.inside, k));
      if (st.k < 1 && !st.board) {
        if (w.gag) drawGag(w, wx, top, r, c, k, when === 'night');
        else drawDeco(s, wx, top, r, c, lit ? Math.max(k, 0.7) : k);
        const th = throwers.find(t => t.r === r && t.c === c);
        if (th && !th.thrown) drawFigure(x, top + 2, s, Math.min(1, th.t/th.tele), lit ? Math.max(k, 0.8) : k);
        else if (th) drawFigure(x, top + 2, s, Math.max(0, th.after/0.35), lit ? Math.max(k, 0.8) : k);
        else if (lit && !w.gag && (r*7 + c*3) % 4 === 0) { rect(x - 3, top + 8, 6, 14, '#3a2a10'); rect(x - 2, top + 4, 4, 4, '#3a2a10'); }  // a tenant at home
      }
      rect(wx - 2, top - 2, 26, 2, mix('#1a1410', '#c8b890', k));      // lintel
      if (st.board) {
        rect(wx, top, 22, 24, mix('#140c06', '#6a4426', k));
        for (let i = 0; i < 4; i++) rect(wx, top + 2 + i*6, 22, 4, mix('#1c1008', '#8a5a30', k));
        ctx.strokeStyle = mix('#0c0804', '#4a2c14', k); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(wx, top); ctx.lineTo(wx + 22, top + 24); ctx.moveTo(wx + 22, top); ctx.lineTo(wx, top + 24); ctx.stroke();
      } else {
        const sc = st.warn ? mix('#3a1a10', '#d86a2a', k) : mix('#0c1a10', '#2f8a4a', k);
        drawShutters(wx, top, st.k, sc, mix('#000000', '#1a4a28', k));
      }
    }
    /* the ledge you walk on, broken where it's broken */
    const lc = mix('#2a2420', '#d0c4a0', k), sh = mix('#0a0806', '#6a5a40', k);
    const seg = (x0, x1) => { rect(x0, ly - 3, x1 - x0, 3, lc); rect(x0, ly, x1 - x0, 2, sh); };
    seg(BX0 - 4, colX(0) - 15);
    for (let c = 0; c < COLS; c++) seg(colX(c) - 15, colX(c) + 15);
    for (let i = 0; i < 4; i++) {
      if (!GAP[r][i]) seg(colX(i) + 15, colX(i + 1) - 15);
      else { seg(colX(i) + 15, colX(i) + 19); seg(colX(i + 1) - 19, colX(i + 1) - 15); rect(colX(i) + 18, ly - 1, 2, 3, sh); }
    }
    seg(colX(4) + 15, BX1 + 4);
  }
  drawRoof();
}

function drawObj(o, x, y, k = 1, shadow = false) {
  x = Math.round(x); y = Math.round(y);
  /* shadow: the same shape in black, one pixel down-right, so it reads on brick */
  const L = col => shadow ? '#000000' : k >= 1 ? col : mix('#000000', col, 0.3 + 0.7*k), t = o.t;
  switch (o.kind) {
    case 'pin': {
      const v = Math.floor(t*8) % 2;
      if (v) { rect(x - 5, y - 2, 10, 4, L('#d8a868')); rect(x - 7, y - 1, 2, 2, L(C.brown)); rect(x + 5, y - 1, 2, 2, L(C.brown)); }
      else { rect(x - 2, y - 5, 4, 10, L('#d8a868')); rect(x - 1, y - 7, 2, 2, L(C.brown)); rect(x - 1, y + 5, 2, 2, L(C.brown)); }
      break;
    }
    case 'pot':
      rect(x - 4, y - 2, 8, 6, L('#c86030')); rect(x - 5, y - 3, 10, 2, L('#a84820'));
      rect(x - 1, y - 7, 2, 4, L(C.green)); rect(x - 2, y - 9, 4, 3, L(C.red));
      break;
    case 'sheet': {
      const wv = Math.round(Math.sin(t*6)*2);
      rect(x - 12, y - 4 + wv, 24, 8, L('#e8f0f8')); rect(x - 12, y + 3 - wv, 24, 2, L(C.cyan));
      break;
    }
    case 'book': {
      const f = Math.floor(t*10) % 2;
      if (f) { rect(x - 5, y - 1, 4, 3, L(C.red)); rect(x + 1, y - 1, 4, 3, L(C.red)); rect(x - 1, y, 2, 2, L(C.white)); }
      else { rect(x - 4, y - 3, 8, 6, L(C.blue)); rect(x - 4, y - 3, 1, 6, L(C.yellow)); }
      break;
    }
    case 'pigeon': {
      const fl = Math.floor(t*14) % 2, d = o.vx < 0 ? -1 : 1;
      rect(x - 4, y - 2, 8, 4, L('#8a8a9a')); rect(x + d*4 - (d < 0 ? 3 : 0), y - 4, 3, 3, L('#8a8a9a'));
      rect(x - 3, y - 2 - fl*3, 5, 2, L('#b0b0c0'));
      break;
    }
    case 'metro':
      ctx.fillStyle = L('#8a5a30'); ctx.beginPath(); ctx.moveTo(x - 5, y + 5); ctx.lineTo(x + 5, y + 5); ctx.lineTo(x, y - 6); ctx.fill();
      rect(x - 1 + Math.round(Math.sin(t*10)*3), y - 4, 1, 6, L(C.white));
      break;
    case 'paint':
      rect(x - 3, y - 4, 7, 8, L(C.gray)); rect(x - 3, y - 4, 7, 2, L(C.blue)); rect(x - 3, y - 6, 7, 1, L('#606060'));
      break;
    case 'drop':
      rect(x - 2, y - 2, 4, 4, L(C.blue));
      break;
    case 'ball':
      ctx.fillStyle = L(C.red); ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 7); ctx.fill(); rect(x - 3, y - 1, 6, 1, L(C.white));
      break;
    case 'gear': {
      ctx.fillStyle = L(C.gray); ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill();
      const a = (o.x || 0)/5;
      for (let i = 0; i < 6; i++) rect(x + Math.cos(a + i*1.047)*5 - 1, y + Math.sin(a + i*1.047)*5 - 1, 2, 2, L(C.gray));
      rect(x - 1, y - 1, 2, 2, L('#303030'));
      break;
    }
    case 'bell':
      rect(x - 5, y - 1, 10, 2, L('#404040')); rect(x - 7, y - 3, 3, 6, L('#101010')); rect(x + 4, y - 3, 3, 6, L('#101010'));
      break;
    case 'dough': {
      const w = Math.max(2, Math.round(Math.abs(Math.cos(t*8))*7));
      rect(x - w, y - 2, w*2, 4, L('#f0dca0')); if (w > 3) rect(x - w + 2, y - 1, 2, 1, L(C.red));
      break;
    }
    case 'bee':
      rect(x - 2, y - 1, 4, 3, L(C.yellow)); rect(x, y - 1, 1, 3, L('#000')); rect(x - 1, y - 3 + (Math.floor(t*30) % 2), 2, 2, L(C.white));
      break;
  }
}

function drawPlayer() {
  if (state === 'dying' && Math.floor(P.deadT*10) % 2) return;
  if (P.inv > 0 && state === 'play' && Math.floor(P.inv*12) % 2) return;
  const pp = ppos(), x = Math.round(pp.x), y = Math.round(sy(pp.y)), k = light;
  const shirt = mix('#5a1810', C.red, Math.max(k, 0.5)), jeans = mix('#101848', C.blue, Math.max(k, 0.5));
  const skin = mix('#5a3a30', C.pink, Math.max(k, 0.5)), hair = mix('#201008', '#4a2810', Math.max(k, 0.5));
  if (P.flat) {
    /* spread-eagle, flat against the wall, arms up the brick */
    const dk = col => mix('#000000', col, 0.8);
    rect(x - 6, y - 7, 3, 7, dk(jeans)); rect(x + 3, y - 7, 3, 7, dk(jeans));
    rect(x - 4, y - 14, 8, 8, dk(shirt));
    rect(x - 3, y - 19, 6, 5, dk(hair));
    rect(x - 10, y - 21, 2, 7, dk(skin)); rect(x - 8, y - 15, 4, 2, dk(skin));
    rect(x + 8, y - 21, 2, 7, dk(skin)); rect(x + 4, y - 15, 4, 2, dk(skin));
    return;
  }
  const moving = P.mode === 'move' || P.mode === 'fall', alt = moving ? Math.floor(P.anim*14) % 2 : 0;
  rect(x - 4, y - 7 + (alt ? 2 : 0), 3, 7 - (alt ? 2 : 0), jeans); rect(x + 1, y - 7 + (alt ? 0 : 0), 3, 7 - (alt ? 0 : 2), jeans);
  rect(x - 4, y - 14, 8, 7, shirt);
  rect(x - 3, y - 19, 6, 5, hair);                           // the back of your head: you face the wall
  if (P.mode === 'fall') { rect(x - 7, y - 22, 2, 8, skin); rect(x + 5, y - 22, 2, 8, skin); }
  else { rect(x - 6, y - 19 + (alt ? 3 : 0), 2, 7, skin); rect(x + 4, y - 19 + (alt ? 0 : 3), 2, 7, skin); }
}

function drawDarkness() {
  const night = 1 - light;
  if (night <= 0.001) return;
  const pp = ppos(), lx = pp.x, ly = sy(pp.y + 12) - HUD;
  dctx.globalCompositeOperation = 'source-over';
  dctx.clearRect(0, 0, W, PH);
  dctx.fillStyle = `rgba(0,0,8,${(0.93*night).toFixed(3)})`;
  dctx.fillRect(0, 0, W, PH);
  dctx.globalCompositeOperation = 'destination-out';
  const hole = (x, y, rad, a = 1) => {
    const g = dctx.createRadialGradient(x, y, 0, x, y, rad);
    g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(0.5, `rgba(0,0,0,${a*0.85})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = g; dctx.beginPath(); dctx.arc(x, y, rad, 0, 7); dctx.fill();
  };
  if (state !== 'dying' || P.deadT > 0.8) hole(lx, ly, 54 + Math.sin(time*3)*1.5);
  /* lit windows glow */
  const rLo = Math.max(1, Math.floor((camB - 10)/ROWH)), rHi = Math.min(ROWS, Math.ceil((camB + PH)/ROWH) + 1);
  for (let r = rLo; r <= rHi; r++) for (let c = 0; c < COLS; c++) {
    if (!WIN[r][c].lit) continue;
    const st = shut(r, c), th = throwers.some(t => t.r === r && t.c === c && !t.thrown);
    hole(colX(c), sy(r*ROWH + 14) - HUD, 24 + (th ? 4 : 0), (1 - st.k*0.75)*(th ? 1 : 0.9));
  }
  /* street lamps, and the moon on the roof */
  for (const x of [16, 384]) hole(x, sy(50) - HUD, 46, 0.9);
  hole(colX(CAT_C), sy(ROOF_Y + 6) - HUD, 30, 0.6);
  dctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(dark, 0, HUD);
}
/* What still shows in the dark: the glint of something falling, bats' eyes. */
function drawGlints() {
  if (light >= 0.5) return;
  for (const o of objs) if (Math.floor(time*12 + o.x) % 3) rect(o.x, sy(o.y) - 1, 2, 1, '#f0e8c0');
  for (const b of bats) { rect(b.x - 2, sy(b.y) - 1, 1, 1, '#ff3020'); rect(b.x + 1, sy(b.y) - 1, 1, 1, '#ff3020'); }
}
function drawBat(b) {
  const x = Math.round(b.x), y = Math.round(sy(b.y)), fl = Math.floor(b.t*14) % 2;
  rect(x - 2, y - 2, 4, 4, '#2a1a2a');
  rect(x - 8, y - (fl ? 3 : 0), 6, 2, '#2a1a2a'); rect(x + 2, y - (fl ? 3 : 0), 6, 2, '#2a1a2a');
}

function drawHud() {
  rect(0, 0, W, HUD, '#000');
  text('SCORE ' + String(score).padStart(6, '0'), 4, 6, C.white);
  text('HI ' + String(Math.max(hi, score)).padStart(6, '0'), 104, 6, C.gray);
  if (light >= 0.5) { ctx.fillStyle = C.yellow; ctx.beginPath(); ctx.arc(196, 10, 4, 0, 7); ctx.fill(); }
  else { ctx.fillStyle = '#dfe6ff'; ctx.beginPath(); ctx.arc(196, 10, 4, 0, 7); ctx.fill(); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(198, 9, 3.5, 0, 7); ctx.fill(); }
  const cs = Math.max(0, Math.ceil(clock));
  text(Math.floor(cs/60) + ':' + String(cs % 60).padStart(2, '0'), 205, 6, clock < 20 ? C.red : C.yellow);
  /* breath: how long you can stay flat */
  text('B', 244, 6, C.gray);
  rect(253, 8, 32, 5, '#303030'); rect(253, 8, Math.round(32*P.breath), 5, P.breath > 0.3 ? C.cyan : C.red);
  for (let i = 0; i < lives; i++) { const lx = W - 10 - i*11; rect(lx - 3, 5, 6, 4, '#4a2810'); rect(lx - 3, 9, 6, 5, C.red); rect(lx - 3, 14, 2, 3, C.blue); rect(lx + 1, 14, 2, 3, C.blue); }
  rect(0, HUD + PH, W, FOOT, '#000');
  const s = storyOf(P.r), T = TENANTS[s];
  const where = P.r === 0 ? `THE STREET` : P.r >= ROOF_ROW ? 'THE ROOF' : `FLOOR ${String(s).padStart(2, '0')} ${T.name}: ${T.what}`;
  /* the footer: a hint if there is one, else the news, else where you are */
  text(footT > 0 ? footMsg : toastT > 0 ? toast : `B${loop + 1}  ${where}`, 4, HUD + PH + 2, footT > 0 ? C.yellow : toastT > 0 ? C.white : C.tan);
  if (soundOn && !audioLive()) text('PRESS ANY KEY FOR SOUND', W - 4, HUD + PH + 2, C.yellow, 'right');
  else text(soundOn ? 'SND' : 'MUTE', W - 4, HUD + PH + 2, C.gray, 'right');
}

function panel(title, y0 = 40, h = 160) {
  ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(30, HUD + y0, W - 60, h);
  ctx.strokeStyle = C.tan; ctx.lineWidth = 1; ctx.strokeRect(30.5, HUD + y0 + 0.5, W - 61, h - 1);
  text(title, W/2, HUD + y0 + 8, C.yellow, 'center', 12);
}

function drawTitle() {
  /* the building at dusk, slowly panning up */
  camB = (time*40) % (ROOF_Y + 70 - PH);
  light = 0.5 + 0.5*Math.sin(time*0.3);
  drawSky(); drawBuilding(); drawDarkness();
  rect(0, 0, W, HUD, '#000'); rect(0, HUD + PH, W, FOOT, '#000');
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(20, 26, W - 40, 222);
  text('TWELVE STORIES', W/2, 34, C.yellow, 'center', 22);
  text('A CLIMB TO THE ROOF, ONE TENANT AT A TIME', W/2, 62, C.tan, 'center');
  const rows = [
    'A cat is stranded on the roof. Climb up to it,',
    'window by window, past twelve floors of tenants',
    'who throw things. OPEN windows are footholds;',
    'a closing shutter knocks you down. Mind',
    'the neighbours: they\'re busy.',
    '',
    'D-PAD  climb, shuffle along the ledge',
    'A      hop over a window / leap a gap',
    'B      flatten against the wall (hold)',
    'SELECT day / night     START  start, pause',
  ];
  rows.forEach((r, i) => text(r, W/2, 74 + i*10, C.white, 'center'));
  text('HI ' + String(hi).padStart(6, '0'), W/2, 182, C.gray, 'center');
  if (Math.floor(time*2) % 2) text('PRESS START', W/2, 200, C.ylgreen, 'center', 12);
  if (!audioLive()) text('PRESS ANY KEY FOR SOUND', W/2, 228, C.yellow, 'center');
  text(VERSION, W - 4, H - 12, C.gray, 'right');
}

function draw() {
  if (state === 'title') { drawTitle(); return; }
  drawSky();
  drawBuilding();
  for (const o of objs) { drawObj(o, o.x + 1, sy(o.y) + 1, 1, true); drawObj(o, o.x, sy(o.y)); }
  for (const b of bats) drawBat(b);
  drawPlayer();
  drawDarkness();
  drawGlints();
  drawHud();
  if (state === 'pause') {
    panel('PAUSED');
    ['START  GO ON', 'A      SOUND ' + (soundOn ? 'OFF' : 'ON'), '', 'D-PAD  climb, shuffle', 'A      hop / leap a gap', 'B      flatten (hold)', 'SELECT day / night']
      .forEach((r, i) => text(r, W/2 - 70, HUD + 70 + i*12, C.white));
  }
  if (state === 'dying') text(P.cause, W/2, HUD + 100, C.red, 'center', 10);
  if (state === 'roof') {
    text('YOU REACHED THE ROOF!', W/2, HUD + 40, C.yellow, 'center', 14);
    text('THE CAT IS SAFE.', W/2, HUD + 62, C.white, 'center');
    if (roofT > 1.2) text('ROOF BONUS ' + bonus + '   EXTRA LIFE', W/2, HUD + 78, C.ylgreen, 'center');
  }
  if (state === 'over') {
    panel('GAME OVER');
    text(P.cause, W/2, HUD + 72, C.white, 'center');
    text('HIGHEST: ' + (best > ROWS ? 'THE ROOF' : 'FLOOR ' + storyOf(best)) + (loop ? '  OF BUILDING ' + (loop + 1) : ''), W/2, HUD + 96, C.tan, 'center');
    text('SCORE ' + score, W/2, HUD + 116, C.yellow, 'center', 10);
    text('HI ' + hi, W/2, HUD + 134, C.gray, 'center');
    text('PRESS START', W/2, HUD + 170, C.white, 'center');
  }
}

/* ---------------- loop ---------------- */
let last = performance.now(), acc = 0;
let fitW = 0, fitH = 0;
function frame(now) {
  if (innerWidth !== fitW || innerHeight !== fitH) { fitW = innerWidth; fitH = innerHeight; fit(); }
  acc += Math.min(0.1, (now - last)/1000); last = now;
  while (acc >= STEP) { pollInput(); update(STEP); acc -= STEP; for (const b of BTN) pressed[b] = false; }
  draw(); audioFrame();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });
buildBuilding();
if (DEMO) {
  newGame();
  /* &floor=N: start on that floor, at the first open window. */
  const fl = parseInt(Q.get('floor'));
  if (fl > 1 && fl <= STORIES) {
    const r = (fl - 1)*PER + 1; let c = 0;
    while (c < COLS - 1 && !isOpen(r, c)) c++;
    Object.assign(P, {r, c, fr: r, fc: c}); best = r - 1; camB = r*ROWH - CAM_LOW;
  }
  /* ?demo&warp=N runs N simulation steps up front -- headless browsers barely
     tick requestAnimationFrame, and this lets a screenshot show real play. */
  const warp = Math.min(60*600, parseInt(Q.get('warp')) || 0);
  /* &turn=N: dusk or dawn falls at step N. */
  const turnAt = Q.has('turn') ? parseInt(Q.get('turn')) || 0 : -1;
  for (let i = 0; i < warp; i++) { if (i === turnAt) turnTime(); pollInput(); update(STEP); for (const b of BTN) pressed[b] = false; }
}
requestAnimationFrame(frame);
/* ?mod=name loads name.js from beside this page: a local add-on. */
if (Q.get('mod')) { const m = document.createElement('script'); m.src = Q.get('mod').replace(/[^\w-]/g, '') + '.js'; document.body.appendChild(m); }
</script>
