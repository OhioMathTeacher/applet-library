  for (const ly of layers) {
    ax.setTransform(S, 0, 0, S, 0, 0);
    if (ly.clear) {        // an inset panel: wipe its patch of phosphor first
      ax.globalCompositeOperation = 'source-over'; ax.globalAlpha = 0.9; ax.fillStyle = '#000';
      ax.fillRect(ly.clear.x, ly.clear.y, ly.clear.w, ly.clear.h);
    }
    ax.globalCompositeOperation = 'lighter'; ax.lineCap = 'round'; ax.lineJoin = 'round';
    const groups = new Map();
    for (const s of ly.segs) {
      const key = s[4] + '|' + Math.round(s[5]*20);
      let g = groups.get(key);
      if (!g) groups.set(key, g = {c: s[4], i: Math.round(s[5]*20)/20, p: new Path2D()});
      g.p.moveTo(s[0], s[1]); g.p.lineTo(s[2], s[3]);
    }
    for (const g of groups.values()) {
      const k = g.i*flick;
      if (glow > 0) {
        ax.strokeStyle = g.c;
        ax.globalAlpha = Math.min(1, 0.07*glow*k); ax.lineWidth = 10; ax.stroke(g.p);
        ax.globalAlpha = Math.min(1, 0.22*Math.min(1, glow)*k); ax.lineWidth = 3.4; ax.stroke(g.p);
      }
      ax.strokeStyle = hotter(g.c); ax.globalAlpha = Math.min(1, 0.92*k); ax.lineWidth = 1.5; ax.stroke(g.p);
    }
    for (const [x, y, c, i] of ly.dots) {
      ax.fillStyle = hotter(c); ax.globalAlpha = Math.min(1, 0.55*i*flick);
      ax.beginPath(); ax.arc(x, y, 2.3, 0, Math.PI*2); ax.fill();
    }
  }
  ax.globalAlpha = 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(acc, 0, 0);
  /* The bloom is blurred at half resolution, a quarter of the pixels, then
     stretched back up: it is a soft glow, so nothing is lost, and the frame
     costs much less. */
  if (hasFilter && glow > 0) {
    if (bloom.width !== acc.width >> 1 || bloom.height !== acc.height >> 1) { bloom.width = acc.width >> 1; bloom.height = acc.height >> 1; }
    bx.setTransform(1, 0, 0, 1, 0, 0); bx.filter = 'none'; bx.globalCompositeOperation = 'copy';
    bx.filter = `blur(${3.5*S}px)`; bx.drawImage(acc, 0, 0, bloom.width, bloom.height); bx.filter = 'none';
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(1, 0.6*glow);
    ctx.drawImage(bloom, 0, 0, cv.width, cv.height);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
}

  U:'0,0 0,6 4,6 4,0',V:'0,0 2,6 4,0',W:'0,0 1,6 2,3 3,6 4,0',X:'0,0 4,6|4,0 0,6',Y:'0,0 2,3 4,0|2,3 2,6',Z:'0,0 4,0 0,6 4,6',

const GLYPH = {};
for (const k in FONT) GLYPH[k] = FONT[k].split('|').map(s => s.split(' ').map(p => p.split(',').map(Number)));

function text(s, x, y, sc = 2, col = '#fff', align = 'left', i = 1) {
  s = String(s).toUpperCase();
  if (align === 'center') x -= textW(s, sc)/2; else if (align === 'right') x -= textW(s, sc);
  for (const ch of s) {
    const g = GLYPH[ch];
    if (g) for (const pl of g) poly(pl.map(([u, v]) => [x + u*sc, y + v*sc]), col, false, i, false);
    x += 6*sc;

/* ---------------- sound ---------------- */
/* Everything you hear is synthesized right here -- pulse, triangle, saw and
   noise, the way an early-80s sound chip did it. No files, no network.
   Browsers only allow audio after a user gesture, so the context is made (or
   resumed) on the first key, click or pad press. A pad press may not count as
   a gesture in every browser; any key or click always does.

   Signal flow:
     effects ------------------------------> sfx --\
     music (a fresh bus per piece) --------> mus ---+--> master -> limiter -> out
     jingles (a fresh bus per jingle) -----> mus --/
     blocker hum (always running, level 0 unless a blocker is near) -> sfx

   Each piece of music and each jingle gets its own gain node. Changing state
   fades that node out and disconnects it, so whatever was already scheduled
   is cut off: loops can't outlive the state that started them. Every note is
   a one-shot that stops itself; the hum is the only long-lived oscillator. */
const MASTER_VOL = 0.5;
let actx = null, soundOn = true, noiseBuf = null, A = null;
try { soundOn = localStorage.getItem('vanishingPoint360.muted') !== '1'; } catch (e) {}
function ensureAudio() {
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      buildAudio();
    }
    if (actx.state === 'suspended' && !document.hidden) {
      const pr = actx.resume(); if (pr && pr.catch) pr.catch(() => {});
    }
  } catch (e) { console.warn('audio', e); actx = null; A = null; }
}
const audioLive = () => !!(A && actx && actx.state === 'running');
function buildAudio() {
  const c = actx;
  noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random()*2 - 1;
  const gain = v => { const g = c.createGain(); g.gain.value = v; return g; };
  A = {last: {}};
  // a gentle limiter so an explosion on top of the music never clips
  const lim = c.createDynamicsCompressor();
  lim.threshold.value = -14; lim.knee.value = 8; lim.ratio.value = 6; lim.attack.value = 0.003; lim.release.value = 0.2;
  lim.connect(c.destination);
  A.master = gain(soundOn ? MASTER_VOL : 0); A.master.connect(lim);
  A.sfx = gain(1); A.sfx.connect(A.master);
  A.mus = gain(0.9); A.mus.connect(A.master);
  /* A 25% pulse wave -- the thin, nasal lead of the old chips. Built from its
     Fourier series: a_n = sin(2 pi n d)/(n pi), b_n = (1 - cos(2 pi n d))/(n pi). */
  const N = 32, re = new Float32Array(N), im = new Float32Array(N), d = 0.25;
  for (let n = 1; n < N; n++) {
    re[n] = Math.sin(2*Math.PI*n*d)/(n*Math.PI);
    im[n] = (1 - Math.cos(2*Math.PI*n*d))/(n*Math.PI);
  }
  A.pulse = c.createPeriodicWave(re, im);
  // blocker hum: two detuned low tones beating, through a lowpass, wobbling
  A.hum = gain(0); A.hum.connect(A.sfx);
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = 4; lp.connect(A.hum);
  const h1 = c.createOscillator(); h1.type = 'sawtooth'; h1.frequency.value = 62;
  const h2 = c.createOscillator(); h2.type = 'square'; h2.frequency.value = 65.5;
  const h2g = gain(0.4); h1.connect(lp); h2.connect(h2g).connect(lp);
  const wob = c.createOscillator(); wob.frequency.value = 7; const wg = gain(160);
  wob.connect(wg).connect(lp.frequency);
  for (const o of [h1, h2, wob]) o.start();
}
/* Move a level smoothly; skips the call when nothing changed, so a value set
   every frame doesn't pile events onto the parameter's timeline. */
function lvl(k, param, v, tc = 0.05) {
  const old = A.last[k];
  if (old !== undefined && Math.abs(old - v) <= 1e-4*Math.max(1, Math.abs(v))) return;
  A.last[k] = v; param.setTargetAtTime(v, actx.currentTime, tc);
}
const mtof = m => 440*Math.pow(2, (m - 69)/12);
/* One note, at an absolute AudioContext time. */
function tone(t, f, dur, o = {}) {
  const os = actx.createOscillator(), g = actx.createGain();
  const v = o.vol === undefined ? 0.05 : o.vol, a = Math.min(o.attack || 0.003, dur*0.5);
  if (o.type === 'pulse') os.setPeriodicWave(A.pulse); else os.type = o.type || 'square';
  os.frequency.setValueAtTime(f, t);
  if (o.slide) os.frequency.exponentialRampToValueAtTime(o.slide, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  os.connect(g).connect(o.dest || A.sfx);
  os.onended = () => g.disconnect();
  os.start(t); os.stop(t + dur + 0.02);
}
/* A burst of filtered noise. */
function hiss(t, dur, o = {}) {
  const s = actx.createBufferSource(), g = actx.createGain();
  s.buffer = noiseBuf; s.loop = true;
  let out = s;
  if (o.filt) {
    const b = actx.createBiquadFilter(); b.type = o.filt; b.Q.value = o.q || 0.8;
    b.frequency.setValueAtTime(o.f || 1000, t);
    if (o.fTo) b.frequency.exponentialRampToValueAtTime(o.fTo, t + dur);
    s.connect(b); out = b;
  }
  const v = o.vol === undefined ? 0.05 : o.vol;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  out.connect(g).connect(o.dest || A.sfx);
  s.onended = () => g.disconnect();
  s.start(t, Math.random()*0.8); s.stop(t + dur + 0.02);
}
/* Wrap an effect: silent when muted or locked, and a sound bug can never
   take the game down with it. */
const fx = fn => (...args) => {
  if (!soundOn || !audioLive()) return;
  try { fn(actx.currentTime + 0.005, ...args); } catch (e) { console.warn('audio', e); }
};
const SFX = {
  hop:    fx(t => tone(t, 520, 0.035, {type: 'pulse', vol: 0.04, slide: 780})),
  laser:  fx(t => {
    tone(t, 1800, 0.12, {vol: 0.04, slide: 240});
    tone(t, 3600, 0.05, {type: 'triangle', vol: 0.02, slide: 900});
  }),
  torp:   fx(t => {         // a whoosh with a falling motor under it
    hiss(t, 0.45, {filt: 'bandpass', f: 600, fTo: 3800, q: 2, vol: 0.12});

  }),
  empty:  fx(t => {

  }),
  hit:    fx(t => {         // saucer struck: bright crunch and a falling chirp

    tone(t, 70, big ? 1.1 : 0.55, {type: 'triangle', vol: 0.1, slide: 22});
  }),
  tink:   fx(t => { tone(t, 2400, 0.08, {type: 'triangle', vol: 0.05}); tone(t, 3300, 0.06, {type: 'triangle', vol: 0.03}); }),
  chirp:  fx((t, v) => {
    tone(t, 2000, 0.05, {type: 'pulse', vol: v, slide: 3400});
    tone(t + 0.07, 2300, 0.05, {type: 'pulse', vol: v*0.8, slide: 3800});
  }),
  bonus:  fx(t => [76, 81, 88].forEach((m, i) => tone(t + i*0.05, mtof(m), 0.08, {type: 'pulse', vol: 0.04}))),

  spoil:  fx(t => {         // a rejuvenator shot to junk: sour falling pair

  }),
  pickup: fx(t => {

    tone(t + 0.24, mtof(91), 0.3, {type: 'pulse', vol: 0.025});
  }),
  life:   fx(t => {
    [72, 76, 79, 84, 88].forEach((m, i) => {
      tone(t + i*0.07, mtof(m), 0.09, {type: 'pulse', vol: 0.04});

    });

  die:    fx(t => {
    hiss(t, 1.0, {filt: 'lowpass', f: 4000, fTo: 100, vol: 0.25});

function setSound(on) {
  soundOn = on;
  try { localStorage.setItem('vanishingPoint360.muted', on ? '0' : '1'); } catch (e) {}
  if (A) try { lvl('master', A.master.gain, on ? MASTER_VOL : 0, 0.03); } catch (e) {}
}
/* A fresh gain node for one piece of music or one jingle; returns the node.
   The previous one in the same slot is faded and dropped. */
function freshBus(slot) {
  const old = A[slot];
  if (old) {
    try { old.gain.setTargetAtTime(0, actx.currentTime, 0.015); } catch (e) {}
    setTimeout(() => { try { old.disconnect(); } catch (e) {} }, 300);
  }
  const g = actx.createGain(); g.gain.value = 1; g.connect(A.mus);
  A[slot] = g;
  return g;
}
function dropBus(slot) {
  if (!A || !A[slot]) return;
  const old = A[slot]; A[slot] = null;
  try { old.gain.setTargetAtTime(0, actx.currentTime, 0.015); } catch (e) {}
  setTimeout(() => { try { old.disconnect(); } catch (e) {} }, 300);
}

/* ---------------- jingles ---------------- */
/* Short fixed pieces for the moments between sectors. They go on their own
   bus, so starting a new game in the middle of the game-over theme cuts it. */
const JINGLES = {
  intro(t, b) {            // a rising E-minor run that lands on a held chord
    [52, 55, 59, 64, 67, 71, 76, 79].forEach((m, i) => tone(t + i*0.08, mtof(m), 0.1, {type: 'pulse', vol: 0.04, dest: b}));
    tone(t, mtof(40), 0.62, {type: 'triangle', vol: 0.1, dest: b});
    for (const m of [64, 67, 71]) tone(t + 0.68, mtof(m), 0.9, {type: 'pulse', vol: 0.025, attack: 0.02, dest: b});
    tone(t + 0.68, mtof(40), 0.9, {type: 'triangle', vol: 0.11, dest: b});
    hiss(t + 0.68, 0.2, {filt: 'highpass', f: 5000, vol: 0.05, dest: b});
  },
  fanfare(t, b) {          // E major, bright, twice up and a long top note
    const run = [[64, 0], [68, 0.1], [71, 0.2], [76, 0.3], [74, 0.6], [78, 0.7], [81, 0.8], [86, 0.9]];
    for (const [m, at] of run) tone(t + at, mtof(m), 0.11, {type: 'pulse', vol: 0.045, dest: b});
    tone(t + 1.1, mtof(88), 0.9, {type: 'pulse', vol: 0.045, attack: 0.01, dest: b});
    tone(t + 1.1, mtof(80), 0.9, {type: 'pulse', vol: 0.025, dest: b});
    [40, 40, 45, 47, 52].forEach((m, i) => tone(t + i*0.25, mtof(m), 0.22, {type: 'triangle', vol: 0.11, dest: b}));
    tone(t + 1.25, mtof(40), 0.9, {type: 'triangle', vol: 0.12, dest: b});
  },
  gameover(t, b) {         // slow descending minor line, then one low note and silence
    [71, 70, 69, 67, 66].forEach((m, i) => {
      tone(t + i*0.32, mtof(m), 0.28, {type: 'pulse', vol: 0.045, dest: b});
      tone(t + i*0.32, mtof(m - 24), 0.28, {type: 'triangle', vol: 0.08, dest: b});
    });
    tone(t + 1.6, mtof(64), 1.5, {type: 'pulse', vol: 0.04, dest: b});
    tone(t + 1.6, mtof(40), 1.7, {type: 'triangle', vol: 0.11, dest: b});
    tone(t + 1.6, mtof(28), 1.7, {type: 'triangle', vol: 0.08, dest: b});
  },
};
function jingle(name) {
  if (!soundOn || !audioLive()) return;
  try { JINGLES[name](actx.currentTime + 0.02, freshBus('jbus')); } catch (e) { console.warn('audio', e); }
}

/* ---------------- music ---------------- */
/* A lookahead sequencer: each frame, every sixteenth-note step that falls in
   the next 0.12 s is scheduled on the AudioContext clock, so timing never
   depends on when the frame happened to run.

   In play the tempo comes from the enemies: sixteenths per second =
   4 + 1.8 x the approach speed (depth units per second). Sector 1 runs about
   110 bpm, and every sector and every saucer you destroy pushes it up. A new
   tempo is taken only on a beat, and only half-way at a time, so it surges
   rather than jumps. */
const MUS = {mode: null, next: 0, step: 0, bar: 0, sps: 6, target: 6};
const tempoFor = speed => 4 + 1.8*speed;
const GAME_PROG = [40, 36, 38, 35];               // E  C  D  B  (bass octave)
const GAME_QUAL = {40: [0, 3, 7], 36: [0, 4, 7], 38: [0, 4, 7], 35: [0, 4, 7]};
const GAME_BASS = [0, 0, 12, 0, 7, 0, 12, 7];      // per eighth note, over the root
const GAME_LEAD = [                                // per eighth note; 0 = rest
  [64, 0, 67, 71, 0, 69, 67, 64],
  [64, 0, 67, 72, 0, 71, 67, 0],
  [66, 0, 69, 74, 0, 72, 71, 69],
  [71, 0, 66, 63, 0, 66, 71, 0]];
const TITLE_PROG = [45, 41, 43, 40];               // A  F  G  E
const TITLE_QUAL = {45: [0, 3, 7], 41: [0, 4, 7], 43: [0, 4, 7], 40: [0, 4, 7]};
const TITLE_LEAD = [
  [69, 0, 72, 0, 76, 0, 74, 72],
  [69, 0, 0, 0, 65, 0, 67, 69],
  [71, 0, 74, 0, 79, 0, 77, 74],
  [71, 0, 0, 0, 68, 0, 71, 0]];
function playStep(t, s, bar) {
  const d = 1/MUS.sps, b = A.mbus;
  if (MUS.mode === 'title') {
    const root = TITLE_PROG[bar % 4], ch = TITLE_QUAL[root];
    if (s % 4 === 0) tone(t, mtof(root - 12 + (s === 8 ? 7 : 0)), d*3.5, {type: 'triangle', vol: 0.09, dest: b});
    if (s % 2 === 0) tone(t, mtof(root + 12 + ch[(s >> 1) % 3]), d*1.6, {type: 'triangle', vol: 0.035, dest: b});
    if (bar % 8 >= 4 && s % 2 === 0) {
      const m = TITLE_LEAD[bar % 4][s >> 1];
      if (m) tone(t, mtof(m), d*1.8, {type: 'pulse', vol: 0.03, dest: b});
    }
    if (s === 4 || s === 12) hiss(t, 0.03, {filt: 'highpass', f: 6000, vol: 0.02, dest: b});
    return;
  }
  // 'game'
  const root = GAME_PROG[bar % 4], ch = GAME_QUAL[root], sector = G.sector || 1;
  if (s % 8 === 0) tone(t, 150, 0.12, {type: 'triangle', vol: 0.13, slide: 40, dest: b});   // kick
  if (s % 8 === 4 && sector >= 2) hiss(t, 0.09, {filt: 'bandpass', f: 1800, vol: 0.05, dest: b});  // snare
  if (s % 4 === 2) hiss(t, 0.025, {filt: 'highpass', f: 7000, vol: 0.025, dest: b});        // hat
  if (s % 2 === 0) {        // the driving bass, triangle like the old chips
    const m = root + GAME_BASS[s >> 1];
    tone(t, mtof(m), d*1.7, {type: 'triangle', vol: 0.1, dest: b});

/* ---------------- input ---------------- */
/* Everything collapses onto the eight NES buttons. Keyboard and every

const KEYMAP = {
  ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down', ArrowLeft:'left', KeyA:'left',
  ArrowRight:'right', KeyD:'right', KeyZ:'a', KeyK:'a', KeyX:'b', KeyJ:'b',
  ShiftLeft:'select', ShiftRight:'select', Enter:'start', NumpadEnter:'start'

addEventListener('keydown', e => {
  ensureAudio();                       // any key unlocks sound
  if (e.target && e.target.closest && e.target.closest('#fxp') && e.code !== 'Escape') return;   // the settings sliders keep their arrows
  if (e.code === 'KeyM' && !e.repeat) { setSound(!soundOn); return; }
  if (e.code === 'KeyP' && !e.repeat) { pauseKey = true; return; }
  if (!e.repeat && extraKey(e.code)) { e.preventDefault(); return; }

function pollInput() {
  const pad = {};
  let n = 0;
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const p of pads) {
    if (!p) continue; n++;
    const b = i => !!(p.buttons[i] && p.buttons[i].pressed);
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
    /* Cheap NES-style USB pads often report the D-pad as axes 0/1 instead of
       buttons 12-15, so both count. */
    pad.up    = pad.up    || b(12) || ay < -0.5;
    pad.down  = pad.down  || b(13) || ay >  0.5;
    pad.left  = pad.left  || b(14) || ax < -0.5;
    pad.right = pad.right || b(15) || ax >  0.5;
    pad.a = pad.a || b(0); pad.b = pad.b || b(1);
    pad.select = pad.select || b(8); pad.start = pad.start || b(9);
  }
  if (n > padCount) footNote('CONTROLLER CONNECTED');
  padCount = n;
  for (const b of BTN) {
    held[b] = !!(key[b] || pad[b]);
    if ((held[b] && !prevHeld[b]) || keyTap[b]) {

/* ---------------- game state ---------------- */
let state = 'title', paused = false, stateT = 0, showSide = DEMO && Q.has('side'), t0 = 0;
const HI = {classic: 0, '360': 0, curl: 0};
try { for (const m of MODES) HI[m] = +localStorage.getItem('vanishingPoint360.hi.' + m) || 0; } catch (e) {}
const G = {speed: 1.9, scroll: 0, ents: [], sector: 1};

let parts = [], pops = [];
const rnd = (a, b) => a + Math.random()*(b - a);

const baseSpeed = s => Math.min(4.2, 1.9 + 0.3*(s - 1));

const sideRate = () => geo.kind === 'tube' ? NB/5*0.7 : 1;

/* Which geometry and colours a sector is played on. */
function tubeIndex(s) { return MODE === '360' ? s - 1 : MODE === 'curl' && s % 3 === 0 ? s/3 - 1 : -1; }
function geoFor(s) { const i = tubeIndex(s); return i < 0 ? FLATG : TUBES[i % TUBES.length]; }

/* Start on the beam, or the lane, nearest the bottom middle of the screen. */

/* The title screen's background: the chosen game's geometry, cycling. */
let attractI = 0, attractT = 0;
function attract(reset) {
  if (reset) attractI = 0;

  if (MODE === '360') { g = TUBES[attractI % TUBES.length]; p = PAL[attractI % PAL.length]; }
  else if (MODE === 'curl' && attractI % 2) { const i = (attractI >> 1) % TUBES.length; g = TUBES[i]; p = PAL[i % PAL.length]; }
  attractI++;

}
function startSector() {

    spawnT: 0.8, chirpT: rnd(4, 8), rejT: rnd(10, 18), blockT: rnd(5, 8), bounceT: rnd(7, 11)});

}

/* ---------------- spawning ---------------- */
function count(type) { let n = 0; for (const e of G.ents) if (e.type === type && !e.flee) n++; return n; }
function mk(type, lane, z, extra) {
  const e = Object.assign({type, lane, tgt: lane, beam: lane, z, t: 0}, extra);
  G.ents.push(e); return e;
}
function pickTurn(e) {
  /* Most passes stop short and pull back; some dive all the way down the
     beam through your row. More of them dive in later sectors. */
  const dive = Math.random() < Math.min(0.55, 0.15 + 0.06*G.sector);
  e.turnZ = dive ? 0 : rnd(1.7, 5);
  e.mode = 'in';
}
function spawn(dt) {
  const s = G.sector;
  G.spawnT -= dt;
  const maxS = Math.min(6, 2 + Math.ceil(s/2), G.left);
  if (G.spawnT <= 0 && count('saucer') < maxS) {
    const e = mk('saucer', (Math.random()*NB) | 0, Z_FAR, {hopT: rnd(0.5, 1.5), fireT: rnd(1.5, 4)});
    pickTurn(e);
    G.spawnT = rnd(0.5, 1.3)/(1 + 0.1*s);
  }
  if (s >= 2 && (G.chirpT -= dt) <= 0) {
    const dir = Math.random() < 0.5 ? 1 : -1;
    const lane = WRAP ? rnd(0, NB) : dir > 0 ? -0.9 : NB - 0.1;
    mk('chirper', lane, rnd(2.5, 7), {dir, chirpT: 0, trav: 0});
    G.chirpT = rnd(6, 11);
  }
  if (s >= 2 && (G.rejT -= dt) <= 0) {
    if (!count('rejuv')) mk('rejuv', (Math.random()*NB) | 0, Z_FAR);
    G.rejT = rnd(18, 30);
  }
  if (s >= 3 && (G.blockT -= dt) <= 0) {
    if (count('blocker') < (s >= 6 ? 2 : 1)) {
      let b; do b = (Math.random()*NB) | 0; while (b === P.beam);
      mk('blocker', b, Z_FAR, {mode: 'down', slideT: 0});
    }
    G.blockT = rnd(7, 11);
  }
  if (s >= 4 && (G.bounceT -= dt) <= 0) {
    if (count('bouncer') < (s >= 7 ? 2 : 1)) mk('bouncer', (Math.random()*NB) | 0, Z_FAR, {mode: 'in', hopT: 0.4, bounces: 0});
    G.bounceT = rnd(9, 13);
  }
}

/* ---------------- enemy behaviour ---------------- */
/* Every enemy has a lane (a float, for drawing a hop in progress) and a beam
   (the whole-number lane it counts as being on). All hit tests use beam +
   depth only -- never pixels -- so they behave the same at any size and on
   any geometry. Inside a closed tube lanes wrap: lane and target may run past
   the end while a hop is under way, and are folded back once it lands. */
function hopToward(e, dt, rate) {
  if (e.lane < e.tgt) e.lane = Math.min(e.tgt, e.lane + rate*dt);
  else if (e.lane > e.tgt) e.lane = Math.max(e.tgt, e.lane - rate*dt);
  if (WRAP && e.lane === e.tgt) e.lane = e.tgt = mod(e.tgt, NB);

    e.z += sp*2.2*dt; hopToward(e, dt, 6);
    return e.z < Z_FAR + 1;
  }
  switch (e.type) {
    case 'saucer':
      if (e.mode === 'in') {
        e.z -= sp*(e.z > 8 ? 2.2 : 1)*dt;     // rush the far stretch, where they're specks
        if (e.z <= e.turnZ) { e.mode = 'out'; e.backZ = rnd(6, 10); }
      } else {
        e.z += sp*0.8*dt;

      if (e.z > 2 && (e.hopT -= dt) <= 0) {
        e.tgt = clampB(e.tgt + (Math.random() < 0.5 ? -1 : 1));
        e.hopT = rnd(0.6, 1.7)/(1 + 0.08*G.sector);
      }
      hopToward(e, dt, 6);
      // from sector 2, saucers drop sparks straight down their beam

        mk('spark', e.beam, e.z);

    case 'spark':   e.z -= sp*2.2*dt; return e.z > Z_GONE;
    case 'debris':  e.z -= sp*1.4*dt; return e.z > Z_GONE;
    case 'rejuv':   e.z -= sp*0.5*dt; return e.z > Z_GONE;

      e.lane += e.dir*v*dt; e.trav += v*dt;
      e.beam = crossBeam(e.lane);
      if ((e.chirpT -= dt) <= 0) { SFX.chirp(0.015 + 0.02*(1 - e.z/8)); e.chirpT = 0.5; }

         you. Lasers bounce off; only a torpedo or getting out of the way works. */
      if (e.mode === 'down') {
        e.z -= sp*1.3*dt;
        if (e.z <= Z_SHIP) { e.z = Z_SHIP; e.mode = 'bottom'; e.t = 0; }
      } else if (e.mode === 'bottom') {
        if ((e.slideT -= dt) <= 0 && e.lane === e.tgt) {
          if (P.beam !== e.beam) e.tgt = e.beam + Math.sign(wrapDelta(P.beam, e.beam));
          e.slideT = 0.75/(1 + 0.07*G.sector);
        }
        if (e.t > 6) e.mode = 'up';
      } else { e.z += sp*dt; if (e.z > Z_FAR) return false; }
      hopToward(e, dt, 4);
      return true;
    case 'bouncer':
      /* Zig-zags down, bounces off your row, and goes back up for another
         try. Lasers glance off it. */
      if (e.mode === 'in') {
        e.z -= sp*1.25*dt;
        if (e.z <= Z_SHIP + 0.12) { e.mode = 'out'; e.bounces++; e.backZ = rnd(4, 7); SFX.boing(); }
      } else {
        e.z += sp*1.6*dt;
        if (e.z >= e.backZ) { if (e.bounces >= 3) e.flee = true; else e.mode = 'in'; }
      }
      if ((e.hopT -= dt) <= 0) {
        const toward = Math.sign(wrapDelta(P.beam, e.tgt)) || (Math.random() < 0.5 ? -1 : 1);
        e.tgt = clampB(e.tgt + (Math.random() < 0.6 ? toward : -toward));
        e.hopT = 0.45/(1 + 0.05*G.sector);
      }
      hopToward(e, dt, 7);
      return true;
  }
  return false;
}

/* What each weapon does to each thing it meets. 'kill' destroys it,
   'deflect' stops the shot, 'spoil' turns a rejuvenator into debris,
   'pass' lets the shot fly on. Torpedoes destroy anything. */
const LASER_ON = {saucer: 'kill', chirper: 'kill', rejuv: 'spoil', blocker: 'deflect', bouncer: 'deflect', spark: 'pass', debris: 'pass'};
const POINTS = {saucer: 40, chirper: 200, blocker: 300, bouncer: 400, spark: 20, debris: 50};
const BOOM_COL = {saucer: '#c8d0ff', chirper: '#ffe23a', blocker: '#7dff6a', bouncer: '#ff6af0', spark: '#ff9a2a', debris: '#ff5040', rejuv: '#29e6ff'};

function strike(e, weapon) {
  const what = weapon === 'torp' ? (e.type === 'rejuv' ? 'spoil' : 'kill') : LASER_ON[e.type];
  if (what === 'pass') return false;
  if (what === 'deflect') { SFX.tink(); return true; }
  if (what === 'spoil') {
    e.type = 'debris'; SFX.spoil(); boomAt(e.lane, e.z, '#29e6ff', 8);
    return true;
  }
  e.dead = true;
  const pts = POINTS[e.type]*(e.type === 'saucer' ? G.sector : 1);
  addScore(pts);
  boomAt(e.lane, e.z, BOOM_COL[e.type]);
  if (e.type === 'saucer') { G.left = Math.max(0, G.left - 1); SFX.hit(); }
  else if (e.type === 'chirper') { SFX.hit(); SFX.bonus(); pop(e.lane, e.z, pts, '#ffe23a'); }
  else { SFX.boom(false); pop(e.lane, e.z, pts, '#ffffff'); }
  return true;
}
/* Move a shot up its beam and test what it swept past this step: anything on
   the same beam whose depth lies between where the shot was and where it is
   now (padded a little for things coming the other way). */
function moveShot(s, v, weapon, dt) {
  const z0 = s.z; s.z += v*dt;
  for (const e of G.ents) {
    if (e.dead || e.flee || e.beam !== s.beam) continue;
    if (e.z >= z0 - 0.3 && e.z <= s.z + 0.1 && strike(e, weapon)) return false;
  }
  const b = G.boss;
  if (b && b.beam === s.beam && b.z >= z0 - 0.3 && b.z <= s.z + 0.1) {
    if (weapon === 'laser') { SFX.tink(); return false; }
    // the sector ship goes down: a big bonus
    const pts = 1000 + 500*G.sector;
    addScore(pts); G.bossKilled = pts;
    boomAt(b.lane, b.z, '#ff6a3a', 60, 0.25); boomAt(b.lane, b.z, '#ffe23a', 30, 0.25);
    SFX.boom(true); pop(b.lane, b.z, pts, '#ffe23a');
    G.boss = null;
    return false;
  }
  return s.z < Z_FAR;
}

const DANGER = {saucer: 1, spark: 1, blocker: 1, bouncer: 1, debris: 1};
function hitsShip(e) { return e.beam === P.beam && Math.abs(e.z - Z_SHIP) < 0.16; }
function checkShip() {
  for (const e of G.ents) {
    if (e.dead || !hitsShip(e)) continue;
    if (e.type === 'rejuv') {
      e.dead = true; G.lives = Math.min(9, G.lives + 1); SFX.pickup();
      pop(e.lane, e.z, '1UP', '#29e6ff');
    } else if (DANGER[e.type] && (!DEMO || MORTAL) && P.inv <= 0) { die(); return; }
  }
}
function die() {
  boomAt(P.lane, Z_SHIP, pal.claw, 40); boomAt(P.lane, Z_SHIP, '#29c6ff', 20);
  SFX.die();
  G.lives--; G.laser = G.torp = null;
  setState('dead');
}
/* The sector ship crosses the far end of the field. In a closed tube it
   circles once instead, all the way round. */
function startBoss() {
  setState('boss');
  const dir = Math.random() < 0.5 ? 1 : -1;
  G.boss = {lane: WRAP ? rnd(0, NB) : dir > 0 ? -1.6 : NB + 0.6, dir, z: 8, beam: -9, trav: 0, rate: 1.25*sideRate()};
  for (const e of G.ents) if (e.type !== 'spark' && e.type !== 'debris') e.flee = true;
}
function startClear() {
  setState('clear');
  G.boss = null;
  for (const e of G.ents) if (e.type !== 'spark' && e.type !== 'debris') e.flee = true;
  jingle('fanfare');
}
function gameOver() {
  setState('over');
  if (G.score > HI[MODE]) { HI[MODE] = G.score; try { localStorage.setItem('vanishingPoint360.hi.' + MODE, G.score); } catch (e) {} }
  jingle('gameover');
}

/* ---------------- the ship ---------------- */
function hop(d) {
  if (WRAP) { P.beamU += d; P.beam = mod(P.beamU, NB); SFX.hop(); return; }
  const b = clampB(P.beam + d);
  if (b !== P.beam) { P.beam = P.beamU = b; SFX.hop(); }
}
function control(dt, armed, pr) {
  /* One press = one hop. Holding the direction repeats after a short delay,
     like a keyboard does, so you can cross the field without hammering. The
     tube has a few more lanes, so it repeats a little faster there. */
  const tubeR = geo.kind === 'tube';
  for (const [k, d] of [['left', -1], ['right', 1]]) {
    if (pr[k]) { hop(d); P.rep = tubeR ? 0.22 : 0.26; }
    else if (held[k] && (P.rep -= dt) <= 0) { hop(d); P.rep = tubeR ? 0.09 : 0.11; }
  }
  const v = tubeR ? 16 : 14;
  if (P.lane < P.beamU) P.lane = Math.min(P.beamU, P.lane + v*dt);
  if (P.lane > P.beamU) P.lane = Math.max(P.beamU, P.lane - v*dt);
  if (WRAP && P.lane === P.beamU) P.lane = P.beamU = P.beam;
  if (!armed) return;
  if (pr.a && !G.laser) { G.laser = {beam: P.beam, z: Z_SHIP + 0.05}; SFX.laser(); }
  if (pr.b && !G.torp) {
    if (G.torps > 0) { G.torps--; G.torp = {beam: P.beam, z: Z_SHIP + 0.05}; SFX.torp(); }
    else SFX.empty();
  }
}

/* ?demo's auto-pilot: line up under the nearest target and shoot; save
   torpedoes for blockers, bouncers and the sector ship. It is invincible,
   so it only has to look busy, not be good. */
const BOT = {t: 0};
function bot(dt) {
  const out = {};
  if ((BOT.t -= dt) > 0) return out;
  let want = -1, weapon = 'a';
  const b = G.boss;
  if (b && G.torps > 0) {
    const lead = b.lane + b.dir*b.rate*((b.z - Z_SHIP)/TORP_V);
    want = WRAP ? mod(Math.round(lead), NB) : Math.round(lead); weapon = 'b';
    if (want < 0 || want > NB - 1) want = -1;
  }
  if (want < 0) {
    let best = null;
    for (const e of G.ents) {
      if (e.flee || e.dead || e.z > 8) continue;
      if (e.type === 'saucer' || e.type === 'chirper' ||
          (G.torps > 0 && (e.type === 'blocker' || e.type === 'bouncer') && e.z < 4)) {
        if (!best || e.z < best.z) best = e;
      }
    }
    if (best && best.beam >= 0) { want = best.beam; weapon = LASER_ON[best.type] === 'kill' ? 'a' : 'b'; }
  }
  if (want < 0 || want === P.beam) {
    if (want === P.beam) out[weapon] = true;
    BOT.t = 0.1;
  } else { out[wrapDelta(want, P.beam) < 0 ? 'left' : 'right'] = true; BOT.t = geo.kind === 'tube' ? 0.1 : 0.13; }
  return out;
}

/* ---------------- update ---------------- */
function update(dt) {
  if (pressed.select) showSide = !showSide;
  const inPlay = state === 'play' || state === 'boss';
  if (pressed.start || pressed.pause) {
    if (state === 'title' && pressed.start) newGame();
    else if (state === 'over' && pressed.start && stateT > 1.2) { setState('title'); attract(true); }
    else if (inPlay || state === 'intro' || state === 'dead' || state === 'clear') {
      paused = !paused; SFX.pause(paused);
    }
  }
  if (paused) return;
  stateT += dt; t0 += dt;
  stepMorph(dt);
  if (noteT > 0) noteT -= dt;
  if (G.lives !== undefined) G.speed = baseSpeed(G.sector) + 0.02*(15 - (G.left || 15));
  G.scroll += (state === 'title' || state === 'over' ? 1.6 : G.speed*1.1)*dt;
  for (const p of parts) { p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 100*dt; p.t -= dt; }
  parts = parts.filter(p => p.t > 0);
  for (const p of pops) { p.t -= dt*0.8; p.y -= 30*dt; }
  pops = pops.filter(p => p.t > 0);

  const pr = DEMO && state !== 'title' ? Object.assign({}, pressed, bot(dt)) : pressed;
  switch (state) {
    case 'title':
      if (pressed.up || pressed.down || pickMode) {
        MODE = pickMode || MODES[mod(MODES.indexOf(MODE) + (pressed.down ? 1 : -1), MODES.length)];
        pickMode = null;
        try { localStorage.setItem('vanishingPoint360.mode', MODE); } catch (e) {}
        SFX.hop(); attract(true);
      }
      attractT += dt;
      if (MODE !== 'classic' && attractT > 3.6 && !morphing()) attract(false);
      break;
    case 'intro':
      control(dt, false, pr);
      if (stateT > 2.0 && !morphing()) setState('play');
      break;
    case 'play': case 'boss':
      if (P.inv > 0) P.inv -= dt;
      control(dt, true, pr);
      if (state === 'play') spawn(dt);
      G.ents = G.ents.filter(e => !e.dead && updateEnt(e, dt));
      if (G.laser && !moveShot(G.laser, LASER_V, 'laser', dt)) G.laser = null;
      if (G.torp && !moveShot(G.torp, TORP_V, 'torp', dt)) G.torp = null;
      G.ents = G.ents.filter(e => !e.dead);
      checkShip();
      if (state === 'play' && G.left <= 0) startBoss();
      if (state === 'boss') {
        const b = G.boss;
        if (b) {
          b.lane += b.dir*b.rate*dt; b.trav += b.rate*dt;
          b.beam = crossBeam(b.lane);
          if (WRAP ? b.trav > NB : b.lane < -1.8 || b.lane > NB + 0.8) G.boss = null;
        }
        if (!G.boss && stateT > 0.5) startClear();
      }
      break;
    case 'clear':
      G.ents = G.ents.filter(e => updateEnt(e, dt));
      control(dt, false, pr);
      if (stateT > 2.8) { G.sector++; startSector(); }
      break;
    case 'dead':
      G.ents = G.ents.filter(e => updateEnt(e, dt));
      if (stateT > 2.2) {
        if (G.lives <= 0) { gameOver(); break; }
        // the field is wiped and you come back blinking, safe for a moment
        G.ents = []; G.boss = null; P.inv = 1.5;
        if (G.left <= 0) startClear(); else setState('play');
      }
      break;
  }
}

/* ---------------- drawing ---------------- */
const STARS = [];
for (let i = 0; i < 60; i++) STARS.push({fx: Math.random(), y: 20 + Math.random()*(HOR - 30), p: Math.random()*6});
function outline(z, col, i, hot) {
  const pts = CUR.B.map(([X, Y]) => { const q = proj(X, Y, z); return [q.x, q.y]; });
  poly(pts, col, false, i, false);
  if (hot) for (let k = 0; k < NP; k += 2) dot(pts[k][0], pts[k][1], col, i);   // corners only, not lane midpoints
  if (CUR.closeA > 0.02) line(pts[NP-1][0], pts[NP-1][1], pts[0][0], pts[0][1], col, i*CUR.closeA);
  return pts;
}
function drawField() {
  const off = G.scroll % 1, bA = CUR.beamsA, mA = CUR.meshA;
  const live = state !== 'title' && state !== 'over' && !morphing();
  if (bA > 0.01) {
    for (const s of STARS) dot(s.fx*W, s.y, '#a0b4ff', bA*(0.2 + 0.45*Math.abs(Math.sin(t0*0.8 + s.p))));
    line(0, CUR.vpy, W, CUR.vpy, '#2040b0', 0.7*bA);         // the horizon, where everything is born
    /* Grid lines evenly spaced in depth, scrolling toward you. Even in z
       means NOT even on screen: they bunch up toward the horizon, and that
       bunching is what reads as distance. */
    const zNear = CUR.F*EYE_H/(H - CUR.vpy) - CUR.c;
    for (let k = 0; k <= Z_FAR + 1; k++) {
      const z = k + 1 - off;
      if (z < zNear || z > Z_FAR) continue;
      const a = proj(laneX(-0.5), EYE_H, z), b = proj(laneX(4.5), EYE_H, z), br = Math.max(0.15, 1 - z/Z_FAR);
      line(a.x, a.y, b.x, b.y, '#28dc6e', bA*(0.18 + 0.5*br));
    }
    // the beams, brightest near you, all meeting at the vanishing point
    const ZS = [zNear, 1.6, 3, 6, 12, 40], IS = [1, 0.85, 0.65, 0.45, 0.28];
    for (let i = 0; i < 5; i++) {
      const mine = live && geo.kind === 'beams' && i === P.beam;
      const col = mine ? '#8ac4ff' : '#3a6bff';
      for (let s = 0; s < 5; s++) {
        const a = proj(laneX(i), EYE_H, ZS[s]), b = proj(laneX(i), EYE_H, ZS[s + 1]);
        line(a.x, a.y, b.x, b.y, col, bA*IS[s]*(mine ? 1.2 : 0.9));
      }
      const f = proj(laneX(i), EYE_H, 40);
      line(f.x, f.y, CX, CUR.vpy, col, bA*0.2);
    }
    line(CX - 5, CUR.vpy, CX + 5, CUR.vpy, '#9fc0ff', bA); line(CX, CUR.vpy - 5, CX, CUR.vpy + 5, '#9fc0ff', bA);
  }
  if (mA > 0.01) {
    const col = pal.line;
    /* Kept quiet on purpose: the rim bright, the spokes and far end dim, and
       no scrolling rings (v0.1 had them, and they buried the enemies). */
    const near = outline(Z_SHIP, col, 0.85*mA, true), far = outline(Z_FAR, col, 0.4*mA, true);
    for (let k = 0; k < NP; k += 2) line(near[k][0], near[k][1], far[k][0], far[k][1], col, 0.45*mA);
    if (live && geo.kind === 'tube') {      // your lane lights up
      for (const u of [P.lane, P.lane + 1]) {
        const e = edgeAt(2*u), a = proj(e.X, e.Y, Z_SHIP), b = proj(e.X, e.Y, Z_FAR);
        line(a.x, a.y, b.x, b.y, pal.claw, 0.4);
      }
    }
  }
}
/* A shot drawn as a short streak along its lane, from depth z to z + len. */
function streak(beam, z, len, col, i = 1.2) {
  const a = tpt(beam, z, 0.08), b = tpt(beam, z + len, 0.08);
  line(a.x, a.y, b.x, b.y, col, i);
}
function drawThings() {
  const list = G.ents.slice().sort((a, b) => b.z - a.z);
  const b = G.boss;
  if (b) drawSprite(VSPR.boss, b.lane, b.z, 0.25 + 0.03*Math.sin(t0*6));
  for (const e of list) {
    if (e.z > Z_FAR + 0.5) continue;
    let flash = null;
    if (e.type === 'debris' && (t0*12 | 0) % 2) flash = '#ff9a2a';
    if (e.type === 'rejuv' && (t0*8 | 0) % 2) flash = '#ffffff';
    if (e.type === 'spark' && (t0*20 | 0) % 2) flash = '#ffe23a';
    const sp = VSPR[e.type];
    const alt = e.type === 'chirper' ? sp.alt + 0.04*Math.sin(e.t*9) : undefined;
    drawSprite(sp, e.lane, e.z, alt, flash);
  }
  if (G.laser) streak(G.laser.beam, G.laser.z, 0.25 + G.laser.z*0.08, (t0*30 | 0) % 2 ? '#ffffff' : '#ffe23a');
  if (G.torp) {
    const p = tpt(G.torp.beam, G.torp.z, 0.08), r = Math.max(3, p.k*0.025);
    streak(G.torp.beam, Math.max(Z_SHIP, G.torp.z - 0.5), 0.5, '#c02010', 0.8);
    poly([[p.x, p.y - r], [p.x + r, p.y], [p.x, p.y + r], [p.x - r, p.y]], (t0*24 | 0) % 2 ? '#ff5a20' : '#ffe23a', true, 1.2);
  }
  const alive = state !== 'dead' && state !== 'over' && state !== 'title' && !morphing();
  if (alive && !(P.inv > 0 && (t0*12 | 0) % 2)) {
    if (geo.kind === 'tube') drawClaw(P.lane, 1.15);
    else drawShipFlat(P.lane, 1.1);
  }
  for (const p of parts) line(p.x, p.y, p.x - p.vx*0.03, p.y - p.vy*0.03, p.col, Math.min(1.2, p.t*2));
  for (const p of pops) text(p.s, p.x, p.y, 1.6, p.col, 'center', Math.min(1, p.t*1.5));
}
function drawHUD() {
  // enemies left in this sector, counting down
  text(G.left, 12, 10, 3.4, '#f4f4ff');
  text('LEFT', 12 + textW(G.left, 3.4) + 10, 20, 1.6, '#7d8cc8');
  text(String(G.score).padStart(6, '0'), CX, 10, 3.4, '#ffffff', 'center');
  text('SECTOR ' + G.sector, W - 12, 10, 2, '#9fc0ff', 'right');
  if (geo.kind === 'tube') text(geo.name, W - 12, 26, 1.5, pal.line, 'right');
  // torpedoes left
  for (let i = 0; i < 3; i++) {
    const x = W - 20 - i*18, y = 52, on = i < G.torps;
    poly([[x, y - 7], [x + 4, y], [x, y + 7], [x - 4, y]], on ? '#ff5a20' : '#502010', true, on ? 1 : 0.4, false);
  }
  for (let i = 0; i < Math.min(8, G.lives - (state === 'dead' ? 0 : 1)); i++) icon(VSPR.ship, 22 + i*24, H - 10, 18);
  text(MODE_NAME[MODE], 12, 44, 1.4, '#4a5a90');
}
/* SIDE VIEW: the same scene seen from the side, to show where the picture
   comes from. The eye is at the left, the field runs off to the right, and
   the picture plane (the screen) stands at the ship's depth. A sight line
   runs from the eye to the top and bottom of each object; where those lines
   cross the plane is where the object is drawn. Farther objects make
   flatter sight lines, which cross the plane closer to eye level (nearer the
   middle of the screen) and closer together (smaller) -- similar triangles,
   the same ratio proj() uses. Inside the tube the side view is a slice down
   its length: the floor becomes the tube's bottom wall, and its ceiling
   shows too. Depth is squeezed much more than height so the whole field
   fits in the inset. Stretching one axis keeps straight lines straight and
   keeps every crossing on the plane in the same order, so the picture stays
   honest. */
function drawSideView() {
  const pw = 460, ph = 300, x0 = W - pw - 8, y0 = 70;
  newLayer({x: x0, y: y0, w: pw, h: ph});
  poly([[x0, y0], [x0 + pw, y0], [x0 + pw, y0 + ph], [x0, y0 + ph]], '#3050c0', true, 0.8, false);
  text('SIDE VIEW', x0 + 10, y0 + 10, 1.6, '#9fc0ff');
  text('SELECT', x0 + pw - 10, y0 + 10, 1.4, '#3a4a80', 'right');
  const inTube = geo.kind === 'tube', c = CUR.c;
  let yMin = 0, yMax = EYE_H;
  if (inTube) { yMin = Math.min(...CUR.B.map(p => p[1])); yMax = Math.max(...CUR.B.map(p => p[1])); }
  const ex = x0 + 40, zs = (pw - 80)/(Z_FAR + c);
  const X = z => ex + (z + c)*zs;
  const gy0 = y0 + 52, gh = ph - 116, ys = gh/(yMax - yMin);
  const Y = v => gy0 + (v - yMin)*ys;
  const eyeY = Y(0);
  if (inTube) {
    line(X(Z_SHIP), Y(yMax), X(Z_FAR), Y(yMax), pal.line, 0.9);
    line(X(Z_SHIP), Y(yMin), X(Z_FAR), Y(yMin), pal.line, 0.9);
    text('TUBE WALL', X(Z_FAR), Y(yMax) + 8, 1.3, pal.line, 'right', 0.7);
    text('AXIS', X(Z_FAR), eyeY - 14, 1.3, '#3a5aa8', 'right');
  } else {
    line(ex - 15, Y(EYE_H), X(Z_FAR), Y(EYE_H), '#1fa84a', 0.9);
    text('FLOOR', X(Z_FAR), Y(EYE_H) + 8, 1.3, '#1a7a3a', 'right');
    text('EYE LEVEL', X(Z_FAR), eyeY - 14, 1.3, '#3a5aa8', 'right');
  }
  for (let x = ex; x < X(Z_FAR); x += 14) line(x, eyeY, x + 6, eyeY, '#28408a', 0.6);
  // sight lines and the objects they reach
  const objs = [];
  const add = (lane, z, alt, oh, col) => { const t = track(lane); objs.push([z, t.Y + alt*t.ny, t.Y + (alt + oh)*t.ny, col]); };
  for (const e of G.ents) if (e.z <= Z_FAR && !e.dead && e.beam >= 0) add(e.lane, e.z, VSPR[e.type].alt || 0, 0.18, BOOM_COL[e.type]);
  if (G.boss) add(G.boss.lane, G.boss.z, 0.25, 0.3, '#ff6a3a');
  for (const [z, yb, yt] of objs) {
    if (z <= Z_SHIP) continue;
    line(ex, eyeY, X(z), Y(yb), '#8c96c8', 0.25);
    line(ex, eyeY, X(z), Y(yt), '#8c96c8', 0.25);
  }
  // the picture plane: the screen, standing at the ship's depth
  const px = X(Z_SHIP);
  line(px, Y(yMin) - 14, px, Y(yMax) + 6, '#e0e8ff', 0.9);
  for (const [z, yb, yt, col] of objs) {
    if (z <= Z_SHIP) continue;
    line(X(z), Y(yt), X(z), Y(yb), col, 1.1);
    // where the sight lines cross the plane: y on plane = y*(Z_SHIP + c)/(z + c)
    const f = (Z_SHIP + c)/(z + c);
    line(px - 4, Y(yt*f), px + 4, Y(yt*f), col, 1); line(px - 4, Y(yb*f), px + 4, Y(yb*f), col, 1);
    line(px, Y(yt*f), px, Y(yb*f), col, 1);
  }
  // your ship stands right at the plane, so it is drawn full size
  const me = track(P.lane);
  line(px - 5, Y(me.Y), px + 5, Y(me.Y), pal.claw, 1.2);
  line(px, Y(me.Y), px, Y(me.Y + 0.15*me.ny), pal.claw, 1.2);
  line(ex - 5, eyeY, ex + 5, eyeY, '#ffffff', 1); line(ex, eyeY - 5, ex, eyeY + 5, '#ffffff', 1);
  text('EYE', ex - 22, eyeY - 18, 1.3, '#ffffff');
  text('SCREEN', px + 6, Y(yMin) - 22, 1.3, '#e0e8ff');
  if (inTube) {
    text('Y ON SCREEN = F*Y/(Z+C)', x0 + 10, y0 + ph - 46, 1.5, '#ffe23a');
    text('FARTHER: NEARER THE CENTER + SMALLER', x0 + 10, y0 + ph - 24, 1.4, '#9fc0ff');
  } else {
    text('Y - HORIZON = F*H/Z', x0 + 10, y0 + ph - 46, 1.5, '#ffe23a');
    text('FARTHER: HIGHER + SMALLER', x0 + 10, y0 + ph - 24, 1.4, '#9fc0ff');
  }
  newLayer(null);
}
function drawTitle() {
  text('VANISHING', CX, 34, 6.4, '#ffe23a', 'center', 1.1);
  const w = textW('POINT 360', 6.4), xs = CX - w/2;
  text('POINT', xs, 88, 6.4, '#29c6ff', 'left', 1.1);
  text('360', xs + 6*6*6.4, 88, 6.4, '#ff3a3a', 'left', 1.1);
  MODES.forEach((m, i) => {
    const y = 186 + i*66, on = m === MODE;
    if (on) text('>', CX - 266, y, 3.2, '#ffe23a', 'left', 1 - 0.4*((t0*3 | 0) % 2));
    text(MODE_NAME[m], CX - 228, y, 3.2, on ? '#ffe23a' : '#6070a8', 'left', on ? 1.1 : 0.8);
    text(MODE_DESC[m], CX - 228, y + 28, 1.5, on ? '#9fc0ff' : '#4a5a90', 'left', on ? 1 : 0.7);
  });
  text('UP / DOWN CHOOSES A GAME', CX, 392, 1.5, '#7d8cc8', 'center');
  text('D-PAD HOP   A LASER   B TORPEDO   SELECT SIDE VIEW   START PLAY', CX, 428, 1.5, '#ffffff', 'center', 0.85);
  if (!TOUCH) text('KEYS: ARROWS  Z=A  X=B  SHIFT=SELECT  ENTER=START  M=MUTE', CX, 452, 1.3, '#4a5a90', 'center');
  if ((t0*2 | 0) % 2) text('PRESS START', CX, 498, 3.4, '#ffffff', 'center');
  if (HI[MODE]) text('HI ' + HI[MODE], CX, 548, 1.8, '#ffd23a', 'center');
}
function render(dt) {
  layers = []; newLayer(null);
  jx = OPT.flicker ? (Math.random() - 0.5)*0.5 : 0; jy = OPT.flicker ? (Math.random() - 0.5)*0.5 : 0;
  INT = state === 'title' ? 0.4 : 1;
  drawField();
  INT = 1;
  if (state !== 'title') { drawThings(); drawHUD(); }
  const mid = 236;
  if (state === 'title') drawTitle();
  else if (state === 'intro') {
    text('SECTOR ' + G.sector, CX, mid, 5, '#ffe23a', 'center', 1.1);
    let tip = {1: 'SHOOT 15 WHITE SAUCERS', 2: 'YELLOW CHIRPERS: BONUS. DODGE SPARKS', 3: 'GREEN BLOCKERS: TORPEDO OR DODGE',
      4: 'BOUNCERS SHRUG OFF LASERS'}[G.sector];
    if (geo.kind === 'tube') {
      text(geo.name, CX, mid + 44, 2.4, pal.line, 'center');
      if (MODE === 'curl') tip = 'THE BEAMS CURL INTO A TUBE';
      else if (G.sector === 1) tip = 'THE BEAMS WRAP AROUND: RIDE THE RIM';
    }
    if (tip) text(tip, CX, mid + 80, 1.7, '#9fc0ff', 'center');
  } else if (state === 'boss' && stateT < 1.6) text('SECTOR SHIP! USE A TORPEDO', CX, mid, 2, '#ff6a3a', 'center');
  else if (state === 'clear') {
    text('SECTOR ' + G.sector + ' CLEAR', CX, mid, 3.6, '#7dff6a', 'center');
    if (G.bossKilled) text('SECTOR SHIP BONUS ' + G.bossKilled, CX, mid + 40, 1.8, '#ffe23a', 'center');
  } else if (state === 'dead' && G.lives <= 0 && stateT > 0.8) text('LAST SHIP LOST', CX, mid, 3.6, '#ff5040', 'center');
  else if (state === 'over') {
    text('GAME OVER', CX, mid - 30, 5, '#ff5040', 'center', 1.1);
    text('SCORE ' + G.score + '   SECTOR ' + G.sector + '   ' + MODE_NAME[MODE], CX, mid + 30, 1.8, '#e0f4ff', 'center');
    if (G.score >= HI[MODE] && G.score > 0) text('NEW HIGH SCORE', CX, mid + 56, 1.8, '#ffd23a', 'center');
    if (stateT > 1.2 && (t0*2 | 0) % 2) text('PRESS START', CX, mid + 96, 3.4, '#ffffff', 'center');
  }
  if (showSide && state !== 'title') drawSideView();
  if (paused) {
    newLayer({x: 0, y: mid - 24, w: W, h: 76});
    text('PAUSED', CX, mid, 5, '#ffffff', 'center');
    newLayer(null);
  }
  // footer
  text(VERSION, W - 12, H - 44, 1.3, '#2a3460', 'right');
  if (!soundOn) text('MUTED (M)', CX, H - 16, 1.4, '#7d8cc8', 'center');
  else if (!audioLive()) text(TOUCH ? 'TAP A BUTTON FOR SOUND' : 'PRESS ANY KEY FOR SOUND', CX, H - 16, 1.4, '#7d8cc8', 'center');
  if (noteT > 0) text(note, CX, H - 38, 1.6, '#7dff6a', 'center');
  if (DEMO) {
    text('DEMO', 12, H - 40, 1.4, '#3a4a80');
    document.title = `VP360 ${MODE} ${state} s${G.sector} left${G.left} lives${G.lives} score${G.score} torps${G.torps} ents${(G.ents || []).map(e => e.type[0]).join('')}`;
  }
  paint(dt);
}

/* ---------------- the touch controller ---------------- */
/* Each pad button holds its NES button down for as long as a finger is on
   it, through the same key/keyTap tables the keyboard uses, so the game
   cannot tell a thumb from a key. The D-pad is one surface: whichever arm the
   finger is over is pressed, so a thumb can rock left and right without
   lifting. */
const pad = document.getElementById('pad'), dpad = document.getElementById('dpad');
const cornerEl = document.getElementById('corner');
function place(el, x, y) { el.style.left = x + 'px'; el.style.top = y + 'px'; }
function layoutPad(L, screenBottom, vw, vh, ins) {
  if (!L) { pad.hidden = true; return; }
  pad.hidden = false;
  const A = document.getElementById('pbA'), B = document.getElementById('pbB');
  const sel = document.getElementById('pbSel'), st = document.getElementById('pbStart');
  cornerEl.style.right = 'auto'; cornerEl.style.bottom = 'auto';
  if (L.portrait) {
    const top = screenBottom, ph = L.padH;
    const d = Math.min(150, vw*0.38, ph*0.6), ab = Math.min(74, vw*0.18);
    pad.style.setProperty('--d', d + 'px'); pad.style.setProperty('--ab', ab + 'px');
    place(dpad, Math.max(ins.l + d/2 + 14, vw*0.24), top + ph*0.44);
    const ax_ = vw - ins.r - ab/2 - 16;
    place(A, ax_, top + ph*0.34); place(B, ax_ - ab*1.2, top + ph*0.5);
    place(sel, vw*0.36, top + ph*0.86); place(st, vw*0.62, top + ph*0.86);
    cornerEl.style.flexDirection = 'row';
    cornerEl.style.left = Math.max(8, vw - ins.r - cornerEl.offsetWidth - 10) + 'px';
    cornerEl.style.top = (top + 6) + 'px';
  } else {
    const sd = L.side, d = Math.min(150, sd - 16), ab = Math.min(66, sd*0.45);
    pad.style.setProperty('--d', d + 'px'); pad.style.setProperty('--ab', ab + 'px');
    place(dpad, ins.l + sd/2, vh*0.5);
    place(A, vw - ins.r - sd*0.3, vh*0.4); place(B, vw - ins.r - sd*0.72, vh*0.6);
    place(sel, ins.l + sd/2, vh - ins.b - 24); place(st, vw - ins.r - sd/2, vh - ins.b - 24);
    cornerEl.style.flexDirection = 'column';           // stacked in the right margin, clear of the score
    cornerEl.style.left = (vw - ins.r - sd/2 - cornerEl.offsetWidth/2) + 'px';
    cornerEl.style.top = (ins.t + 8) + 'px';
  }
}
function holdButton(el, b) {
  const down = e => { e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (x) {} key[b] = true; keyTap[b] = true; el.classList.add('on'); ensureAudio(); };
  const up = () => { key[b] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', down);
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) el.addEventListener(ev, up);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
for (const el of pad.querySelectorAll('button[data-b]')) holdButton(el, el.dataset.b);
function dpadSet(dir) {
  for (const d of ['up', 'down', 'left', 'right']) {
    const on = d === dir;
    if (on && !key[d]) keyTap[d] = true;
    key[d] = on;
  }
  dpad.dataset.dir = dir || '';
}
function dpadAt(e) {
  const r = dpad.getBoundingClientRect(), dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
  if (Math.hypot(dx, dy) < r.width*0.1) return null;
  return Math.abs(dx) >= Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');
}
let dpadPtr = null;
dpad.addEventListener('pointerdown', e => { e.preventDefault(); dpadPtr = e.pointerId; try { dpad.setPointerCapture(e.pointerId); } catch (x) {} dpadSet(dpadAt(e)); ensureAudio(); });
dpad.addEventListener('pointermove', e => { if (e.pointerId === dpadPtr) dpadSet(dpadAt(e)); });
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) dpad.addEventListener(ev, e => { if (e.pointerId === dpadPtr) { dpadPtr = null; dpadSet(null); } });
cv.style.touchAction = 'none';

/* ---------------- the size button ---------------- */
const sizeBtn = document.getElementById('size');
function paintSize() { sizeBtn.innerHTML = '&#9974; ' + sizeMode.toUpperCase(); }
function applySize(next) {
  sizeMode = next;
  try { localStorage.setItem('vanishingPoint360.size', next); } catch (e) {}
  if (next === 'full' && !document.fullscreenElement) {
    const pr = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    if (pr && pr.catch) pr.catch(() => { sizeMode = 'fill'; fit(); paintSize(); });   // refused: say so honestly
  } else if (next !== 'full' && document.fullscreenElement) document.exitFullscreen().catch(() => {});
  fit(); paintSize();
}
sizeBtn.addEventListener('click', () => applySize(SIZE_MODES[(SIZE_MODES.indexOf(sizeMode) + 1) % SIZE_MODES.length]));
// Esc leaves fullscreen without touching the button, so follow the browser.
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && sizeMode === 'full') sizeMode = 'fill';
  fit(); paintSize();
});
addEventListener('resize', fit);
fit(); paintSize();

/* ---------------- phosphor settings ---------------- */
const fxBtn = document.getElementById('fx'), fxPanel = document.getElementById('fxp');
const PERSIST_STEPS = [[0.3, 'SHORT'], [0.62, 'MEDIUM'], [0.85, 'LONG']], GLOW_STEPS = [[0.5, 'LOW'], [1, 'MEDIUM'], [1.5, 'HIGH']];
function saveFx() {
  try { localStorage.setItem('vanishingPoint360.fx', JSON.stringify(OPT)); } catch (e) {}
  document.getElementById('persist').value = OPT.persist;
  document.getElementById('glow').value = OPT.glow;
  document.getElementById('flicker').checked = OPT.flicker;
  document.getElementById('pv').textContent = Math.round(OPT.persist*100) + '%';
  document.getElementById('gv').textContent = Math.round(OPT.glow*100) + '%';
}
function nextStep(v, steps) { const i = steps.findIndex(([s]) => s > v + 0.01); return steps[i < 0 ? 0 : i]; }
document.getElementById('persist').addEventListener('input', e => { OPT.persist = +e.target.value; saveFx(); });
document.getElementById('glow').addEventListener('input', e => { OPT.glow = +e.target.value; saveFx(); });
document.getElementById('flicker').addEventListener('change', e => { OPT.flicker = e.target.checked; saveFx(); });
function showFx(on) {
  fxPanel.hidden = !on; fxBtn.setAttribute('aria-expanded', String(on));
  if (on) {                 // open beside the button: above it if there is room, else below
    const r = cornerEl.getBoundingClientRect(), pw = fxPanel.offsetWidth, ph = fxPanel.offsetHeight;
    fxPanel.style.right = 'auto'; fxPanel.style.bottom = 'auto';
    fxPanel.style.left = Math.max(8, Math.min(innerWidth - pw - 8, r.right - pw)) + 'px';
    fxPanel.style.top = (r.top - ph - 8 >= 8 ? r.top - ph - 8 : Math.min(innerHeight - ph - 8, r.bottom + 8)) + 'px';
  }
  if (!on && fxPanel.contains(document.activeElement)) fxBtn.focus();
}
fxBtn.addEventListener('click', () => showFx(fxPanel.hidden));
addEventListener('pointerdown', e => { if (!fxPanel.hidden && !fxPanel.contains(e.target) && !fxBtn.contains(e.target)) showFx(false); });
saveFx();
/* Extra keys beyond the eight NES buttons. Returns true when it used the key. */
let pickMode = null;
function extraKey(code) {
  if (code === 'KeyV') { const [v, n] = nextStep(OPT.persist, PERSIST_STEPS); OPT.persist = v; saveFx(); footNote('PHOSPHOR ' + n); return true; }
  if (code === 'KeyG') { const [v, n] = nextStep(OPT.glow, GLOW_STEPS); OPT.glow = v; saveFx(); footNote('GLOW ' + n); return true; }
  if (code === 'KeyF') { if (SIZE_MODES.includes('full')) applySize(document.fullscreenElement ? 'fill' : 'full'); return true; }
  if (code === 'Escape' && !fxPanel.hidden) { showFx(false); return true; }
  if (state === 'title' && /^Digit[123]$/.test(code)) { pickMode = MODES[+code.slice(5) - 1]; return true; }
  return false;
}

/* ---------------- loop ---------------- */
/* Fixed 60 Hz simulation, decoupled from the display's refresh rate, so a
   144 Hz monitor doesn't make the enemies faster. Button presses are latched
   until a simulation step has seen them. */
let last = performance.now(), accT = 0;
function frame(now) {
  const dt = Math.min(0.25, Math.max(0, (now - last)/1000)); last = now;
  pollInput();
  accT += dt;
  let n = 0;
  while (accT >= STEP && n < 8) {
    update(STEP); accT -= STEP; n++;
    for (const k in pressed) pressed[k] = false;
  }
  if (n >= 8) accT = 0;
  render(Math.min(dt, 0.1));
  audioFrame();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && (state === 'play' || state === 'boss')) paused = true;
  audioVisibility();
});
attract(true);
if (DEMO) {
  ensureAudio();   // only actually plays if the browser allows autoplay
  newGame();
  /* ?demo&warp=N runs N simulation steps up front -- headless browsers barely
     tick requestAnimationFrame, and this lets a screenshot show real play. */
  const warp = Math.min(60*600, parseInt(Q.get('warp')) || 0);
  for (let i = 0; i < warp; i++) update(STEP);
}
requestAnimationFrame(frame);
</script>
