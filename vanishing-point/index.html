    const m = root + 24 + (i >= 3 ? 12 : ch[i]);
    tone(t, mtof(m), d*0.9, {type: 'pulse', vol: lead ? 0.012 : 0.02, dest: b});
  }
  if (lead && s % 2 === 0) {
    const m = GAME_LEAD[bar % 4][s >> 1];
    if (m) tone(t, mtof(m), d*1.8, {type: 'pulse', vol: 0.035, dest: b});
  }
  if (G.boss && s % 8 === 0)          // the sector ship's siren, over the top
    tone(t, s ? 1050 : 520, d*8, {type: 'sawtooth', vol: 0.03, slide: s ? 520 : 1050, dest: b});
}
function scheduleMusic() {
  const now = actx.currentTime;
  if (MUS.next < now) MUS.next = now + 0.04;    // first run, or the page stalled
  while (MUS.next < now + 0.12) {
    if (MUS.step % 4 === 0) MUS.sps += (MUS.target - MUS.sps)*0.5;
    playStep(MUS.next, MUS.step, MUS.bar);
    MUS.next += 1/MUS.sps;
    if (++MUS.step === 16) { MUS.step = 0; MUS.bar++; }
  }
}
/* Which piece should be playing right now. null = silence (apart from
   jingles and effects). */
function musicMode() {
  if (paused || document.hidden) return null;
  if (state === 'title') return 'title';
  if (state === 'play' || state === 'boss' || state === 'dead') return 'game';
  return null;
}
function audioFrame() {
  if (!A || !actx) return;
  try {
    const want = soundOn ? musicMode() : null;
    MUS.target = want === 'game' ? tempoFor(G.speed) : 6;
    if (want !== MUS.mode) {
      MUS.mode = want;
      if (want) { freshBus('mbus'); MUS.step = 0; MUS.bar = 0; MUS.next = 0; MUS.sps = MUS.target; }
      else dropBus('mbus');
    }
    if (MUS.mode && audioLive()) scheduleMusic();
    // blocker hum: louder the closer a blocker is to your beam
    let near = 0;
    if (!paused && (state === 'play' || state === 'boss') && G.ents) for (const e of G.ents) if (e.type === 'blocker') {
      const v = e.mode === 'bottom' ? 1 - Math.abs(e.lane - P.lane)/4 : 0.45*(1 - e.z/Z_FAR);
      near = Math.max(near, v);
    }
    lvl('hum', A.hum.gain, soundOn ? 0.07*near*near : 0, 0.08);
  } catch (e) { console.warn('audio', e); }
}
function audioVisibility() {
  if (!actx) return;
  try {
    if (document.hidden) actx.suspend().catch(() => {});
    else ensureAudio();
  } catch (e) {}
}

/* ---------------- input ---------------- */
/* Everything collapses onto the eight NES buttons. Keyboard and every
   connected pad are OR-ed together, so either works at any moment. */
const BTN = ['up','down','left','right','a','b','select','start'];
const KEYMAP = {
  ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down', ArrowLeft:'left', KeyA:'left',
  ArrowRight:'right', KeyD:'right', KeyZ:'a', KeyK:'a', KeyX:'b', KeyJ:'b',
  ShiftLeft:'select', ShiftRight:'select', Enter:'start', NumpadEnter:'start'
};
const key = {}, keyTap = {}, held = {}, prevHeld = {}, pressed = {};
let padCount = 0, pauseKey = false, note = '', noteT = 0;
function footNote(s) { note = s; noteT = 3; }
addEventListener('keydown', e => {
  ensureAudio();                       // any key unlocks sound
  if (e.code === 'KeyM' && !e.repeat) { setSound(!soundOn); return; }
  if (e.code === 'KeyP' && !e.repeat) { pauseKey = true; return; }
  const b = KEYMAP[e.code]; if (!b) return;
  e.preventDefault();
  if (!e.repeat) keyTap[b] = true;     // catches taps shorter than one frame
  key[b] = true;
});
addEventListener('keyup', e => { const b = KEYMAP[e.code]; if (b) key[b] = false; });
addEventListener('blur', () => { for (const b of BTN) key[b] = false; });
for (const ev of ['mousedown', 'pointerdown', 'touchend']) addEventListener(ev, ensureAudio);
addEventListener('gamepadconnected', () => footNote('CONTROLLER CONNECTED'));
addEventListener('gamepaddisconnected', () => footNote('CONTROLLER DISCONNECTED'));

function pollInput() {
  const pad = {};
  let n = 0;
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const p of pads) {
    if (!p) continue; n++;
    const b = i => !!(p.buttons[i] && p.buttons[i].pressed);
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
    /* Cheap NES-style USB pads often report the D-pad as axes 0/1 instead of
       buttons 12-15, so both count. */
    pad.up    = pad.up    || b(12) || ay < -0.5;
    pad.down  = pad.down  || b(13) || ay >  0.5;
    pad.left  = pad.left  || b(14) || ax < -0.5;
    pad.right = pad.right || b(15) || ax >  0.5;
    pad.a = pad.a || b(0); pad.b = pad.b || b(1);
    pad.select = pad.select || b(8); pad.start = pad.start || b(9);
  }
  if (n > padCount) footNote('CONTROLLER CONNECTED');
  padCount = n;
  for (const b of BTN) {
    held[b] = !!(key[b] || pad[b]);
    if ((held[b] && !prevHeld[b]) || keyTap[b]) {
      pressed[b] = true;
      if (pad[b]) ensureAudio();      // may not count as a gesture in every browser
    }
    keyTap[b] = false;
    prevHeld[b] = held[b];
  }
  if (pauseKey) { pressed.pause = true; pauseKey = false; }
}

  chirper: {w: 0.2, alt: 0.12, map: [

    '.yyyoyyy.',
    '..yyyyy..',
    '...y.y...'], col: {y: '#ffe23a', o: '#ff7a1a'}},
  blocker: {w: 0.27, map: [
    '..ggggg..',
    '.gGGGGGg.',
    'ggGkGkGgg',
    'ggGGGGGgg',
    '.ggggggg.',
    'g.g...g.g'], col: {g: '#1fbf3a', G: '#7dff6a', k: '#000'}},
  bouncer: {w: 0.2, map: [
    '..mmm..',
    '.mMMMm.',

    '..mmm..'], col: {m: '#c02ad0', M: '#ff6af0', w: '#fff'}},

    '...c...',
    '..cwc..',
    '.ccwcc.',
    'cwwwwwc',
    '.ccwcc.',
    '..cwc..',
    '...c...'], col: {c: '#29e6ff', w: '#ffffff'}},
  debris: {w: 0.2, map: [
    'r..r..r',
    '.rRr.r.',
    'rRRRRr.',
    '.rRrRrr',
    'r.r..r.'], col: {r: '#c01818', R: '#ff5040'}},
  spark: {w: 0.09, alt: 0.05, map: ['.o.', 'ooo', '.o.'], col: {o: '#ff9a2a'}},
  boss: {w: 0.95, alt: 0.25, map: [
    '.......rrrrr.......',
    '....rrrRRRRRrrr....',

    'rrRRRRRRRRRRRRRRRrr',
    'oooooooooooooooooo.',
    '..o..o..o..o..o..o.',
    '.o..o..o..o..o..o..'], col: {r: '#d02020', R: '#ff6a3a', y: '#ffe23a', o: '#ff9a2a'}},
};
function drawSprite(sp, x, z, alt, flash) {
  const pr = project(x, z, alt === undefined ? (sp.alt || 0) : alt);
  const bw = sp.map[0].length, bh = sp.map.length;
  const p = pr.k*sp.w/bw;
  if (p < 0.55) {                 // too far to have a shape: one pixel blob
    ctx.fillStyle = flash || Object.values(sp.col)[0];
    ctx.fillRect(Math.round(pr.x) - 1, Math.round(pr.y) - 1, 2, 1);
    return;
  }
  const q = Math.max(1, Math.round(p));
  const x0 = Math.round(pr.x - bw*q/2), y0 = Math.round(pr.y - bh*q);
  for (let r = 0; r < bh; r++) for (let c = 0; c < bw; c++) {
    const ch = sp.map[r][c]; if (ch === '.') continue;
    ctx.fillStyle = flash || sp.col[ch];
    ctx.fillRect(x0 + c*q, y0 + r*q, q, q);
  }
}

/* ---------------- game state ---------------- */
let state = 'title', paused = false, stateT = 0, showSide = DEMO && Q.has('side'), hi = 0, t0 = 0;
try { hi = +localStorage.getItem('vanishingPoint.hi') || 0; } catch (e) {}
const G = {speed: 1.9, scroll: 0, ents: [], sector: 1};
const P = {lane: 2, beam: 2, rep: 0, inv: 0};
let parts = [], pops = [];
const rnd = (a, b) => a + Math.random()*(b - a);
const clampB = b => Math.max(0, Math.min(NB - 1, b));
/* Enemies close in faster each sector, and a little faster with every saucer
   you destroy in this one. The music's tempo is read from this same number. */
const baseSpeed = s => Math.min(4.2, 1.9 + 0.3*(s - 1));
const LASER_V = 22, TORP_V = 14;

function setState(s) { state = s; stateT = 0; }
function newGame() {
  Object.assign(G, {score: 0, lives: 3, sector: START_SECTOR, nextLife: 10000});
  P.lane = P.beam = 2; P.inv = 0;
  parts = []; pops = [];
  startSector();
}
function startSector() {
  Object.assign(G, {left: 15, torps: 3, ents: [], laser: null, torp: null, boss: null, bossKilled: false,
    spawnT: 0.8, chirpT: rnd(4, 8), rejT: rnd(10, 18), blockT: rnd(5, 8), bounceT: rnd(7, 11)});
  setState('intro');
  jingle('intro');
}
function addScore(n) {
  G.score += n;
  if (G.score >= G.nextLife) { G.nextLife += 10000; G.lives = Math.min(9, G.lives + 1); SFX.life(); }
}
function pop(x, z, s, col) { const p = project(laneX(x), z, 0.3); pops.push({x: p.x, y: p.y, s, col, t: 1}); }
function boomAt(lane, z, col, n = 18, alt = 0.05) {
  const p = project(laneX(lane), z, alt);
  const sc = Math.min(3, p.k/90);
  for (let i = 0; i < n; i++) {
    const a = Math.random()*Math.PI*2, v = rnd(20, 90)*sc;
    parts.push({x: p.x, y: p.y - 3*sc, vx: Math.cos(a)*v, vy: Math.sin(a)*v*0.6, t: rnd(0.4, 0.9), col: Math.random() < 0.5 ? col : '#fff'});
  }
}

/* ---------------- spawning ---------------- */
function count(type) { let n = 0; for (const e of G.ents) if (e.type === type && !e.flee) n++; return n; }
function mk(type, lane, z, extra) {
  const e = Object.assign({type, lane, tgt: lane, beam: lane, z, t: 0}, extra);
  G.ents.push(e); return e;
}
function pickTurn(e) {
  /* Most passes stop short and pull back; some dive all the way down the
     beam through your row. More of them dive in later sectors. */
  const dive = Math.random() < Math.min(0.55, 0.15 + 0.06*G.sector);
  e.turnZ = dive ? 0 : rnd(1.7, 5);
  e.mode = 'in';
}
function spawn(dt) {
  const s = G.sector;
  G.spawnT -= dt;
  const maxS = Math.min(6, 2 + Math.ceil(s/2), G.left);
  if (G.spawnT <= 0 && count('saucer') < maxS) {
    const e = mk('saucer', (Math.random()*NB) | 0, Z_FAR, {hopT: rnd(0.5, 1.5), fireT: rnd(1.5, 4)});
    pickTurn(e);
    G.spawnT = rnd(0.5, 1.3)/(1 + 0.1*s);
  }
  if (s >= 2 && (G.chirpT -= dt) <= 0) {
    const dir = Math.random() < 0.5 ? 1 : -1;
    mk('chirper', dir > 0 ? -0.9 : 4.9, rnd(2.5, 7), {dir, chirpT: 0});
    G.chirpT = rnd(6, 11);
  }
  if (s >= 2 && (G.rejT -= dt) <= 0) {
    if (!count('rejuv')) mk('rejuv', (Math.random()*NB) | 0, Z_FAR);
    G.rejT = rnd(18, 30);
  }
  if (s >= 3 && (G.blockT -= dt) <= 0) {
    if (count('blocker') < (s >= 6 ? 2 : 1)) {
      let b; do b = (Math.random()*NB) | 0; while (b === P.beam);
      mk('blocker', b, Z_FAR, {mode: 'down', slideT: 0});
    }
    G.blockT = rnd(7, 11);
  }
  if (s >= 4 && (G.bounceT -= dt) <= 0) {
    if (count('bouncer') < (s >= 7 ? 2 : 1)) mk('bouncer', (Math.random()*NB) | 0, Z_FAR, {mode: 'in', hopT: 0.4, bounces: 0});
    G.bounceT = rnd(9, 13);
  }
}

/* ---------------- enemy behaviour ---------------- */
/* Every enemy has a lane (a float, 0..4, for drawing a hop in progress) and
   a beam (the whole-number beam it counts as being on). All hit tests use
   beam + depth only -- never pixels -- so they behave the same at any size. */
function hopToward(e, dt, rate) {
  if (e.lane < e.tgt) e.lane = Math.min(e.tgt, e.lane + rate*dt);
  else if (e.lane > e.tgt) e.lane = Math.max(e.tgt, e.lane - rate*dt);
  e.beam = Math.round(e.lane);
}
function updateEnt(e, dt) {
  const sp = G.speed;
  e.t += dt;
  if (e.flee) {                       // the sector is over: everything pulls back
    e.z += sp*2.2*dt; hopToward(e, dt, 6);
    return e.z < Z_FAR + 1;
  }
  switch (e.type) {
    case 'saucer':
      if (e.mode === 'in') {
        e.z -= sp*(e.z > 8 ? 2.2 : 1)*dt;     // rush the far stretch, where they're specks
        if (e.z <= e.turnZ) { e.mode = 'out'; e.backZ = rnd(6, 10); }
      } else {
        e.z += sp*0.8*dt;
        if (e.z >= e.backZ) pickTurn(e);
      }
      if (e.z > 2 && (e.hopT -= dt) <= 0) {
        e.tgt = clampB(e.tgt + (Math.random() < 0.5 ? -1 : 1));
        e.hopT = rnd(0.6, 1.7)/(1 + 0.08*G.sector);
      }
      hopToward(e, dt, 6);
      // from sector 2, saucers drop sparks straight down their beam
      if (G.sector >= 2 && e.mode === 'in' && e.z > 3 && e.z < 11 && (e.fireT -= dt) <= 0) {
        mk('spark', e.beam, e.z);
        e.fireT = rnd(2.5, 5)/(1 + 0.1*G.sector);
      }
      return e.z > Z_GONE;
    case 'spark':   e.z -= sp*2.2*dt; return e.z > Z_GONE;
    case 'debris':  e.z -= sp*1.4*dt; return e.z > Z_GONE;
    case 'rejuv':   e.z -= sp*0.5*dt; return e.z > Z_GONE;
    case 'chirper':
      e.lane += e.dir*1.7*(1 + 0.05*G.sector)*dt;
      e.beam = (e.lane > -0.5 && e.lane < 4.5) ? Math.round(e.lane) : -9;
      if ((e.chirpT -= dt) <= 0) { SFX.chirp(0.015 + 0.02*(1 - e.z/8)); e.chirpT = 0.5; }
      return e.lane > -1.2 && e.lane < 5.2;
    case 'blocker':
      /* Comes down a beam to your row, then slides one beam at a time toward
         you. Lasers bounce off; only a torpedo or getting out of the way works. */
      if (e.mode === 'down') {
        e.z -= sp*1.3*dt;
        if (e.z <= Z_SHIP) { e.z = Z_SHIP; e.mode = 'bottom'; e.t = 0; }
      } else if (e.mode === 'bottom') {
        if ((e.slideT -= dt) <= 0 && e.lane === e.tgt) {
          if (P.beam !== e.beam) e.tgt = e.beam + Math.sign(P.beam - e.beam);
          e.slideT = 0.75/(1 + 0.07*G.sector);
        }
        if (e.t > 6) e.mode = 'up';
      } else { e.z += sp*dt; if (e.z > Z_FAR) return false; }
      hopToward(e, dt, 4);
      return true;
    case 'bouncer':
      /* Zig-zags down, bounces off your row, and goes back up for another
         try. Lasers glance off it. */
      if (e.mode === 'in') {
        e.z -= sp*1.25*dt;
        if (e.z <= Z_SHIP + 0.12) { e.mode = 'out'; e.bounces++; e.backZ = rnd(4, 7); SFX.boing(); }
      } else {
        e.z += sp*1.6*dt;
        if (e.z >= e.backZ) { if (e.bounces >= 3) e.flee = true; else e.mode = 'in'; }
      }
      if ((e.hopT -= dt) <= 0) {
        const toward = Math.sign(P.beam - e.tgt) || (Math.random() < 0.5 ? -1 : 1);
        e.tgt = clampB(e.tgt + (Math.random() < 0.6 ? toward : -toward));
        e.hopT = 0.45/(1 + 0.05*G.sector);
      }
      hopToward(e, dt, 7);
      return true;
  }
  return false;
}

/* What each weapon does to each thing it meets. 'kill' destroys it,
   'deflect' stops the shot, 'spoil' turns a rejuvenator into debris,
   'pass' lets the shot fly on. Torpedoes destroy anything. */
const LASER_ON = {saucer: 'kill', chirper: 'kill', rejuv: 'spoil', blocker: 'deflect', bouncer: 'deflect', spark: 'pass', debris: 'pass'};
const POINTS = {saucer: 40, chirper: 200, blocker: 300, bouncer: 400, spark: 20, debris: 50};
const BOOM_COL = {saucer: '#c8d0ff', chirper: '#ffe23a', blocker: '#7dff6a', bouncer: '#ff6af0', spark: '#ff9a2a', debris: '#ff5040', rejuv: '#29e6ff'};

function strike(e, weapon) {
  const what = weapon === 'torp' ? (e.type === 'rejuv' ? 'spoil' : 'kill') : LASER_ON[e.type];
  if (what === 'pass') return false;
  if (what === 'deflect') { SFX.tink(); return true; }
  if (what === 'spoil') {
    e.type = 'debris'; SFX.spoil(); boomAt(e.lane, e.z, '#29e6ff', 8);
    return true;
  }
  e.dead = true;
  const pts = POINTS[e.type]*(e.type === 'saucer' ? G.sector : 1);
  addScore(pts);
  boomAt(e.lane, e.z, BOOM_COL[e.type]);
  if (e.type === 'saucer') { G.left = Math.max(0, G.left - 1); SFX.hit(); }
  else if (e.type === 'chirper') { SFX.hit(); SFX.bonus(); pop(e.lane, e.z, pts, '#ffe23a'); }
  else { SFX.boom(false); pop(e.lane, e.z, pts, '#fff'); }
  return true;
}
/* Move a shot up its beam and test what it swept past this step: anything on
   the same beam whose depth lies between where the shot was and where it is
   now (padded a little for things coming the other way). */
function moveShot(s, v, weapon, dt) {
  const z0 = s.z; s.z += v*dt;
  for (const e of G.ents) {
    if (e.dead || e.flee || e.beam !== s.beam) continue;
    if (e.z >= z0 - 0.3 && e.z <= s.z + 0.1 && strike(e, weapon)) return false;
  }
  const b = G.boss;
  if (b && b.beam === s.beam && b.z >= z0 - 0.3 && b.z <= s.z + 0.1) {
    if (weapon === 'laser') { SFX.tink(); return false; }
    // the sector ship goes down: a big bonus
    const pts = 1000 + 500*G.sector;
    addScore(pts); G.bossKilled = pts;
    boomAt(b.lane, b.z, '#ff6a3a', 60, 0.25); boomAt(b.lane, b.z, '#ffe23a', 30, 0.25);
    SFX.boom(true); pop(b.lane, b.z, pts, '#ffe23a');
    G.boss = null;
    return false;
  }
  return s.z < Z_FAR;
}

const DANGER = {saucer: 1, spark: 1, blocker: 1, bouncer: 1, debris: 1};
function hitsShip(e) { return e.beam === P.beam && Math.abs(e.z - Z_SHIP) < 0.16; }
function checkShip() {
  for (const e of G.ents) {
    if (e.dead || !hitsShip(e)) continue;
    if (e.type === 'rejuv') {
      e.dead = true; G.lives = Math.min(9, G.lives + 1); SFX.pickup();
      pop(e.lane, e.z, '1UP', '#29e6ff');
    } else if (DANGER[e.type] && (!DEMO || MORTAL) && P.inv <= 0) { die(); return; }
  }
}
function die() {
  boomAt(P.lane, Z_SHIP, '#ffd23a', 40); boomAt(P.lane, Z_SHIP, '#29c6ff', 20);
  SFX.die();
  G.lives--; G.laser = G.torp = null;
  setState('dead');
}
function startBoss() {
  setState('boss');
  const dir = Math.random() < 0.5 ? 1 : -1;
  G.boss = {lane: dir > 0 ? -1.6 : 5.6, dir, z: 8, beam: -9};
  for (const e of G.ents) if (e.type !== 'spark' && e.type !== 'debris') e.flee = true;
}
function startClear() {
  setState('clear');
  G.boss = null;
  for (const e of G.ents) if (e.type !== 'spark' && e.type !== 'debris') e.flee = true;
  jingle('fanfare');
}
function gameOver() {
  setState('over');
  if (G.score > hi) { hi = G.score; try { localStorage.setItem('vanishingPoint.hi', hi); } catch (e) {} }
  jingle('gameover');
}

/* ---------------- the ship ---------------- */
function hop(d) {
  const b = clampB(P.beam + d);
  if (b !== P.beam) { P.beam = b; SFX.hop(); }
}
function control(dt, armed, pr) {
  /* One press = one hop. Holding the direction repeats after a short delay,
     like a keyboard does, so you can cross the field without hammering. */
  for (const [k, d] of [['left', -1], ['right', 1]]) {
    if (pr[k]) { hop(d); P.rep = 0.26; }
    else if (held[k] && (P.rep -= dt) <= 0) { hop(d); P.rep = 0.11; }
  }
  if (P.lane < P.beam) P.lane = Math.min(P.beam, P.lane + 14*dt);
  if (P.lane > P.beam) P.lane = Math.max(P.beam, P.lane - 14*dt);
  if (!armed) return;
  if (pr.a && !G.laser) { G.laser = {beam: P.beam, z: Z_SHIP + 0.05}; SFX.laser(); }
  if (pr.b && !G.torp) {
    if (G.torps > 0) { G.torps--; G.torp = {beam: P.beam, z: Z_SHIP + 0.05}; SFX.torp(); }
    else SFX.empty();
  }
}

/* ?demo's auto-pilot: line up under the nearest target and shoot; save
   torpedoes for blockers, bouncers and the sector ship. It is invincible,
   so it only has to look busy, not be good. */
const BOT = {t: 0};
function bot(dt) {
  const out = {};
  if ((BOT.t -= dt) > 0) return out;
  let want = -1, weapon = 'a';
  const b = G.boss;
  if (b && G.torps > 0) {
    const lead = b.lane + b.dir*1.25*((b.z - Z_SHIP)/TORP_V);
    want = Math.round(lead); weapon = 'b';
    if (want < 0 || want > 4) want = -1;
  }
  if (want < 0) {
    let best = null;
    for (const e of G.ents) {
      if (e.flee || e.dead || e.z > 8) continue;
      if (e.type === 'saucer' || e.type === 'chirper' ||
          (G.torps > 0 && (e.type === 'blocker' || e.type === 'bouncer') && e.z < 4)) {
        if (!best || e.z < best.z) best = e;
      }
    }
    if (best) { want = best.beam; weapon = LASER_ON[best.type] === 'kill' ? 'a' : 'b'; }
  }
  if (want < 0 || want === P.beam) {
    if (want === P.beam) out[weapon] = true;
    BOT.t = 0.1;
  } else { out[want < P.beam ? 'left' : 'right'] = true; BOT.t = 0.13; }
  return out;
}

/* ---------------- update ---------------- */
function update(dt) {
  if (pressed.select) showSide = !showSide;
  const inPlay = state === 'play' || state === 'boss';
  if (pressed.start || pressed.pause) {
    if (state === 'title' && pressed.start) newGame();
    else if (state === 'over' && pressed.start && stateT > 1.2) setState('title');
    else if (inPlay || state === 'intro' || state === 'dead' || state === 'clear') {
      paused = !paused; SFX.pause(paused);
    }
  }
  if (paused) return;
  stateT += dt; t0 += dt;
  if (noteT > 0) noteT -= dt;
  if (G.lives !== undefined) G.speed = baseSpeed(G.sector) + 0.02*(15 - (G.left || 15));
  G.scroll += (state === 'title' || state === 'over' ? 1.6 : G.speed*1.1)*dt;
  for (const p of parts) { p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 40*dt; p.t -= dt; }
  parts = parts.filter(p => p.t > 0);
  for (const p of pops) { p.t -= dt*0.8; p.y -= 12*dt; }
  pops = pops.filter(p => p.t > 0);

  const pr = DEMO && state !== 'title' ? Object.assign({}, pressed, bot(dt)) : pressed;
  switch (state) {
    case 'intro':
      control(dt, false, pr);
      if (stateT > 2.0) setState('play');
      break;
    case 'play': case 'boss':
      if (P.inv > 0) P.inv -= dt;
      control(dt, true, pr);
      if (state === 'play') spawn(dt);
      G.ents = G.ents.filter(e => !e.dead && updateEnt(e, dt));
      if (G.laser && !moveShot(G.laser, LASER_V, 'laser', dt)) G.laser = null;
      if (G.torp && !moveShot(G.torp, TORP_V, 'torp', dt)) G.torp = null;
      G.ents = G.ents.filter(e => !e.dead);
      checkShip();
      if (state === 'play' && G.left <= 0) startBoss();
      if (state === 'boss') {
        const b = G.boss;
        if (b) {
          b.lane += b.dir*1.25*dt;
          b.beam = (b.lane > -0.5 && b.lane < 4.5) ? Math.round(b.lane) : -9;
          if (b.lane < -1.8 || b.lane > 5.8) G.boss = null;
        }
        if (!G.boss && stateT > 0.5) startClear();
      }
      break;
    case 'clear':
      G.ents = G.ents.filter(e => updateEnt(e, dt));
      control(dt, false, pr);
      if (stateT > 2.8) { G.sector++; startSector(); }
      break;
    case 'dead':
      G.ents = G.ents.filter(e => updateEnt(e, dt));
      if (stateT > 2.2) {
        if (G.lives <= 0) { gameOver(); break; }
        // the field is wiped and you come back blinking, safe for a moment
        G.ents = []; G.boss = null; P.inv = 1.5;
        if (G.left <= 0) startClear(); else setState('play');
      }
      break;
  }
}

/* ---------------- drawing ---------------- */
const STARS = [];
for (let i = 0; i < 40; i++) STARS.push({x: (Math.random()*W) | 0, y: (Math.random()*(HOR - 22) + 20) | 0, p: Math.random()*6});
function drawField() {
  ctx.fillStyle = '#000006'; ctx.fillRect(0, 0, W, H);
  for (const s of STARS) {
    const b = 0.4 + 0.6*Math.abs(Math.sin(t0*0.8 + s.p));
    ctx.fillStyle = `rgba(160,180,255,${b.toFixed(2)})`; ctx.fillRect(s.x, s.y, 1, 1);
  }
  // a faint glow band at the horizon, where everything is born
  ctx.fillStyle = '#0a1240'; ctx.fillRect(0, HOR - 1, W, 1);
  ctx.fillStyle = '#060a28'; ctx.fillRect(0, HOR - 3, W, 2);
  /* Grid lines: evenly spaced in depth (z = 1, 2, 3...), scrolling toward
     you. Evenly spaced in z means NOT evenly spaced on screen: y - HOR is
     F/z, so they bunch up toward the horizon -- that bunching is what reads
     as distance. */
  const off = G.scroll % 1;
  for (let k = 0; k <= Z_FAR + 1; k++) {
    const z = k + 1 - off;
    if (z < zAtRow(H) || z > Z_FAR) continue;
    const y = Math.round(HOR + F*EYE_H/z);
    const xl = project(laneX(-0.5), z).x, xr = project(laneX(4.5), z).x;
    const b = Math.max(0.15, 1 - z/Z_FAR);
    ctx.fillStyle = `rgba(40,220,110,${(0.25 + 0.6*b).toFixed(2)})`;
    ctx.fillRect(Math.round(xl), y, Math.round(xr - xl), 1);
  }
  // the beams, one pixel per screen row, all meeting at the vanishing point
  for (let y = HOR + 1; y < H; y++) {
    const z = zAtRow(y), b = Math.max(0.12, Math.min(1, 1.15 - z/Z_FAR));
    for (let i = 0; i < NB; i++) {
      const x = Math.round(CX + F*laneX(i)/z);
      ctx.fillStyle = i === P.beam && state !== 'title' && state !== 'over'
        ? `rgba(120,190,255,${b.toFixed(2)})` : `rgba(50,100,255,${(b*0.85).toFixed(2)})`;
      ctx.fillRect(x, y, 1, 1);
    }
  }
  // the vanishing point itself
  ctx.fillStyle = '#9fc0ff'; ctx.fillRect(CX - 1, HOR, 3, 1); ctx.fillRect(CX, HOR - 1, 1, 3);
}
/* A shot drawn as a short streak along its beam, from depth z to z + len. */
function streak(beam, z, len, col, w) {
  const a = project(laneX(beam), z, 0.08), b = project(laneX(beam), z + len, 0.08);
  ctx.fillStyle = col;
  for (let y = Math.round(b.y); y <= Math.round(a.y); y++) {
    const f = (y - b.y)/Math.max(1, a.y - b.y), x = b.x + (a.x - b.x)*f;
    ctx.fillRect(Math.round(x) - (w >> 1), y, w, 1);
  }
}
function drawThings() {
  const list = G.ents.slice().sort((a, b) => b.z - a.z);
  const b = G.boss;
  if (b) drawSprite(SPR.boss, laneX(b.lane), b.z, 0.25 + 0.03*Math.sin(t0*6));
  for (const e of list) {
    if (e.z > Z_FAR + 0.5) continue;
    let flash = null;
    if (e.type === 'debris' && (t0*12 | 0) % 2) flash = '#ff9a2a';
    if (e.type === 'rejuv' && (t0*8 | 0) % 2) flash = '#ffffff';
    if (e.type === 'spark' && (t0*20 | 0) % 2) flash = '#ffe23a';
    const sp = SPR[e.type];
    const alt = e.type === 'chirper' ? sp.alt + 0.04*Math.sin(e.t*9) : undefined;
    drawSprite(sp, laneX(e.lane), e.z, alt, flash);
  }
  if (G.laser) streak(G.laser.beam, G.laser.z, 0.25 + G.laser.z*0.08, (t0*30 | 0) % 2 ? '#fff' : '#ffe23a', G.laser.z < 2.5 ? 2 : 1);
  if (G.torp) {
    const p = project(laneX(G.torp.beam), G.torp.z, 0.08), r = Math.max(1, Math.round(p.k/60));
    streak(G.torp.beam, Math.max(Z_SHIP, G.torp.z - 0.5), 0.5, '#a02010', 1);
    ctx.fillStyle = (t0*24 | 0) % 2 ? '#ff5a20' : '#ffe23a';
    ctx.fillRect(Math.round(p.x) - r, Math.round(p.y) - 2*r, 2*r + 1, 2*r + 1);
  }
  const alive = state !== 'dead' && state !== 'over' && state !== 'title';
  if (alive && !(P.inv > 0 && (t0*12 | 0) % 2)) drawSprite(SPR.ship, laneX(P.lane), Z_SHIP, 0);
  for (const p of parts) { ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1); }
  for (const p of pops) text(p.s, p.x, p.y, 1, p.col, 'center');
}
function miniShip(x, y) {
  ctx.fillStyle = '#ffd23a'; ctx.fillRect(x + 2, y, 1, 1); ctx.fillRect(x + 1, y + 1, 3, 1); ctx.fillRect(x, y + 2, 5, 1);
  ctx.fillStyle = '#29c6ff'; ctx.fillRect(x + 2, y + 1, 1, 1);
}
function drawHUD() {
  // enemies left in this sector, counting down
  text(G.left, 4, 3, 2, '#f4f4ff');
  text('LEFT', 4 + String(G.left).length*8 + 2, 7, 1, '#7d8cc8');
  text(String(G.score).padStart(6, '0'), CX, 3, 2, '#fff', 'center');
  text('SECTOR ' + G.sector, W - 4, 3, 1, '#9fc0ff', 'right');
  // torpedo icons, top right
  for (let i = 0; i < 3; i++) {
    const x = W - 8 - i*8, y = 11;
    ctx.fillStyle = i < G.torps ? '#ff5a20' : '#301010';
    ctx.fillRect(x, y + 1, 5, 2); ctx.fillRect(x + 1, y, 3, 4);
    if (i < G.torps) { ctx.fillStyle = '#ffe23a'; ctx.fillRect(x + 2, y + 1, 1, 2); }
  }
  for (let i = 0; i < Math.min(8, G.lives - (state === 'dead' ? 0 : 1)); i++) miniShip(4 + i*8, H - 7);
}
/* SIDE VIEW: the same scene seen from the side, to show where the picture
   comes from. The eye is at the left, the floor runs off to the right, and
   the picture plane (the screen) stands at the ship's depth. A sight line
   runs from the eye to the top and bottom of each object; where those lines
   cross the plane is where the object is drawn. Farther objects make
   flatter sight lines, which cross the plane closer to eye level (higher on
   the screen) and closer together (smaller) -- similar triangles, the same
   ratio project() uses.
   Depth is squeezed much more than height so the whole field fits in the
   inset. Stretching one axis keeps straight lines straight and keeps every
   crossing on the plane in the same order, so the picture stays honest. */
function pline(x0, y0, x1, y1, col) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  ctx.fillStyle = col;
  for (let n = 0; n < 600; n++) {
    ctx.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2*err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
function drawSideView() {
  const pw = 184, ph = 122, x0 = W - pw - 3, y0 = 22;
  ctx.fillStyle = 'rgba(0,0,22,0.9)'; ctx.fillRect(x0, y0, pw, ph);
  ctx.fillStyle = '#3050c0';
  ctx.fillRect(x0, y0, pw, 1); ctx.fillRect(x0, y0 + ph - 1, pw, 1);
  ctx.fillRect(x0, y0, 1, ph); ctx.fillRect(x0 + pw - 1, y0, 1, ph);
  text('SIDE VIEW', x0 + 4, y0 + 4, 1, '#9fc0ff');
  text('SELECT', x0 + pw - 4, y0 + 4, 1, '#3a4a80', 'right');
  const ex = x0 + 16, gy = y0 + 92, hp = 58;            // eye x, floor y, eye height in px
  const zs = (pw - 22)/Z_FAR;                            // px per unit of depth
  const ey = gy - hp*EYE_H;
  const X = z => ex + z*zs, Y = alt => gy - alt*hp;
  const px = X(Z_SHIP);
  // floor and eye level (the horizon is the eye's own height)
  ctx.fillStyle = '#1fa84a'; ctx.fillRect(ex - 6, gy, X(Z_FAR) - ex + 8, 1);
  for (let x = ex; x < X(Z_FAR) + 2; x += 3) { ctx.fillStyle = '#28408a'; ctx.fillRect(x, ey, 1, 1); }
  text('EYE LEVEL', X(Z_FAR), ey - 7, 1, '#3a5aa8', 'right');
  text('FLOOR', X(Z_FAR), gy + 3, 1, '#1a7a3a', 'right');
  // sight lines and the objects they reach
  const objs = [];
  for (const e of G.ents) if (e.z <= Z_FAR && !e.dead) objs.push([e.z, (SPR[e.type].alt || 0), 0.18, BOOM_COL[e.type]]);
  if (G.boss) objs.push([G.boss.z, 0.25, 0.3, '#ff6a3a']);
  for (const [z, alt, oh, col] of objs) {
    if (z <= Z_SHIP) continue;
    pline(ex, ey, X(z), Y(alt), 'rgba(140,150,200,0.35)');
    pline(ex, ey, X(z), Y(alt + oh), 'rgba(140,150,200,0.35)');
  }
  // the picture plane: the screen, standing at the ship's depth
  ctx.fillStyle = '#e0e8ff'; ctx.fillRect(px, ey - 6, 1, gy - ey + 8);
  for (const [z, alt, oh, col] of objs) {
    if (z <= Z_SHIP) continue;
    ctx.fillStyle = col;
    ctx.fillRect(Math.round(X(z)) - 1, Math.round(Y(alt + oh)), 2, Math.max(1, Math.round(oh*hp)));
    // where the sight lines cross the plane: Y on plane = H + (alt - H)*Z_SHIP/z
    const yb = Y(EYE_H + (alt - EYE_H)*Z_SHIP/z), yt = Y(EYE_H + (alt + oh - EYE_H)*Z_SHIP/z);
    ctx.fillRect(px - 2, Math.round(yt), 5, Math.max(1, Math.round(yb - yt)));
  }
  // your ship stands right at the plane, so it is drawn at full size, lowest of all
  ctx.fillStyle = '#ffd23a'; ctx.fillRect(px - 2, Math.round(Y(0.15)), 5, Math.round(0.15*hp));
  ctx.fillStyle = '#fff'; ctx.fillRect(ex - 1, ey - 1, 3, 3);
  text('EYE', ex - 10, ey - 8, 1, '#fff');
  text('SCREEN', px + 3, ey - 13, 1, '#e0e8ff');
  text('Y-HORIZON = F*H/Z', x0 + 4, gy + 10, 1, '#ffe23a');
  text('FARTHER: HIGHER + SMALLER', x0 + 4, gy + 18, 1, '#9fc0ff');
}
function drawTitle() {
  text('VANISHING', CX, 62, 4, '#ffe23a', 'center');
  text('POINT', CX, 86, 4, '#29c6ff', 'center');
  text('FIVE BEAMS. ONE HORIZON.', CX, 112, 1, '#9fc0ff', 'center');
  const rows = [['D-PAD', 'HOP BEAMS'], ['A', 'LASER'], ['B', 'TORPEDO (3 PER SECTOR)'],
    ['SELECT', 'SIDE VIEW'], ['START', 'PLAY / PAUSE']];
  rows.forEach(([k, v], i) => { text(k, CX - 10, 128 + i*9, 1, '#fff', 'right'); text(v, CX - 2, 128 + i*9, 1, '#7d8cc8'); });
  text('KEYS: ARROWS  Z=A  X=B  SHIFT=SELECT  ENTER=START  M=MUTE', CX, 180, 1, '#4a5a90', 'center');
  if ((t0*2 | 0) % 2) text('PRESS START', CX, 196, 2, '#fff', 'center');
  if (hi) text('HI ' + hi, CX, 216, 1, '#ffd23a', 'center');
}
function render() {
  drawField();
  if (state !== 'title') { drawThings(); drawHUD(); }
  const mid = 100;
  if (state === 'title') drawTitle();
  else if (state === 'intro') {
    text('SECTOR ' + G.sector, CX, mid, 3, '#ffe23a', 'center');
    const tips = {1: 'SHOOT 15 WHITE SAUCERS', 2: 'YELLOW CHIRPERS: BONUS. DODGE SPARKS', 3: 'GREEN BLOCKERS: TORPEDO OR DODGE',
      4: 'BOUNCERS SHRUG OFF LASERS'};
    if (tips[G.sector]) text(tips[G.sector], CX, mid + 20, 1, '#9fc0ff', 'center');
  } else if (state === 'boss' && stateT < 1.6) text('SECTOR SHIP! USE A TORPEDO', CX, mid, 1, '#ff6a3a', 'center');
  else if (state === 'clear') {
    text('SECTOR ' + G.sector + ' CLEAR', CX, mid, 2, '#7dff6a', 'center');
    if (G.bossKilled) text('SECTOR SHIP BONUS ' + G.bossKilled, CX, mid + 16, 1, '#ffe23a', 'center');
  } else if (state === 'dead' && G.lives <= 0 && stateT > 0.8) text('LAST SHIP LOST', CX, mid, 2, '#ff5040', 'center');
  else if (state === 'over') {
    text('GAME OVER', CX, mid - 10, 3, '#ff5040', 'center');
    text('SCORE ' + G.score + '   SECTOR ' + G.sector, CX, mid + 14, 1, '#e0f4ff', 'center');
    if (G.score >= hi && G.score > 0) text('NEW HIGH SCORE', CX, mid + 24, 1, '#ffd23a', 'center');
    if (stateT > 1.2 && (t0*2 | 0) % 2) text('PRESS START', CX, mid + 40, 2, '#fff', 'center');
  }
  if (showSide) drawSideView();
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, mid - 8, W, 28);
    text('PAUSED', CX, mid, 3, '#fff', 'center');
  }
  // footer
  text(VERSION, W - 3, H - 7, 1, '#2a3460', 'right');
  if (!soundOn) text('MUTED (M)', W - 24, H - 7, 1, '#7d8cc8', 'right');
  else if (!audioLive()) text('PRESS ANY KEY FOR SOUND', CX, H - 7, 1, '#7d8cc8', 'center');
  if (noteT > 0) text(note, CX, H - 15, 1, '#7dff6a', 'center');
  if (DEMO) {
    text('DEMO', 4, H - 15, 1, '#3a4a80');
    document.title = `VP ${state} s${G.sector} left${G.left} lives${G.lives} score${G.score} torps${G.torps} ents${(G.ents || []).map(e => e.type[0]).join('')}`;
  }
}

/* ---------------- loop ---------------- */
/* Fixed 60 Hz simulation, decoupled from the display's refresh rate, so a
   144 Hz monitor doesn't make the enemies faster. Button presses are latched
   until a simulation step has seen them. */
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.25, Math.max(0, (now - last) / 1000)); last = now;
  pollInput();
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 8) {
    update(STEP); acc -= STEP; n++;
    for (const k in pressed) pressed[k] = false;
  }
  if (n >= 8) acc = 0;
  render();
  audioFrame();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && (state === 'play' || state === 'boss')) paused = true;
  audioVisibility();
});
if (DEMO) {
  ensureAudio();   // only actually plays if the browser allows autoplay
  newGame();
  /* ?demo&warp=N runs N simulation steps up front -- headless browsers barely
     tick requestAnimationFrame, and this lets a screenshot show real play. */
  const warp = Math.min(60*600, parseInt(Q.get('warp')) || 0);
  for (let i = 0; i < warp; i++) update(STEP);
}
requestAnimationFrame(frame);
</script>
